r of physical location), OBJECT = Kenrick (himself), DIRECTION = source: (unspecified) → destination: New York.\n\n**Worked example — \"Mary fell\":** ACTOR = (none, involuntary), ACTION = PTRANS (change of physical location, downward, involuntary), OBJECT = Mary.\n\n**Worked example — \"John amazed Mary\":** ACTION = an emotional-state-change primitive (MBUILD/state-change type), ACTOR = John (causer), OBJECT = Mary (experiencer), resulting state = Mary's emotional state changes to \"amazed\".\n\n**Worked example — \"Amit sent Priya an email\":** ACTOR = Amit, ACTION = MTRANS (transfer of mental/information content, since an email carries information), OBJECT = email (information), DIRECTION = source: Amit → destination: Priya.", "understandGuMd": "Conceptual Dependency (CD), Roger Schank એ develop કરેલી, sentence નું meaning ભાષા-independent રીતે નાના fixed primitive actions ના set (દા.ત. PTRANS = physical location નું transfer, ATRANS = ownership નું abstract transfer, MTRANS = information નું mental transfer, PROPEL, INGEST, SPEAK વગેરે) વાપરીને represent કરે, surface શબ્દોને બદલે. Idea એ છે કે અલગ શબ્દોવાળા પણ સરખા meaning ધરાવતા બે sentences (દા.ત. \"Riya gave Rahul a laptop\" અને \"Rahul received a laptop from Riya\") એ જ CD structure પર map થવા જોઈએ.\n\n**CD structure ના મુખ્ય slots:** **ACTOR** (કોણ action કરે છે), **ACTION** (primitive action, Schank ના fixed list માંથી), **OBJECT** (શેના પર action થાય), **DIRECTION** (source → destination, transfer actions માટે).\n\n**Schank & Abelson ના મુખ્ય primitive actions:** ATRANS (ownership transfer, દા.ત. give), PTRANS (physical location transfer, દા.ત. go), PROPEL (physical force લગાવવું, દા.ત. push), MOVE (body part move કરવું), INGEST (અંદર લેવું, દા.ત. eat), EXPEL (body માંથી બહાર કાઢવું), MTRANS (mental information transfer, દા.ત. tell), MBUILD (જૂની information માંથી નવી બનાવવી, દા.ત. decide), SPEAK (અવાજ ઉત્પન્ન કરવો), ATTEND (ધ્યાન/sense organ directing), GRASP (physically grasp કરવું).\n\n**Worked example — \"Riya gave Rahul a laptop\":** ACTOR = Riya, ACTION = ATRANS, OBJECT = laptop, DIRECTION = source: Riya → destination: Rahul.\n\n**Worked example — \"Kenrick went to New York\":** ACTOR = Kenrick, ACTION = PTRANS, OBJECT = Kenrick (પોતે), DIRECTION = destination: New York.\n\n**Worked example — \"Mary fell\":** ACTOR = (નથી, involuntary), ACTION = PTRANS (નીચેની તરફ, involuntary), OBJECT = Mary.\n\n**Worked example — \"John amazed Mary\":** ACTION = emotional-state-change primitive, ACTOR = John (causer), OBJECT = Mary (experiencer), result = Mary ની emotional state \"amazed\" માં બદલાય.\n\n**Worked example — \"Amit sent Priya an email\":** ACTOR = Amit, ACTION = MTRANS (કારણ કે email information carry કરે), OBJECT = email, DIRECTION = source: Amit → destination: Priya.", "oneLine": "CD = ACTOR + ACTION(primitive, e.g. ATRANS/PTRANS/MTRANS) + OBJECT + DIRECTION — represents meaning independent of exact wording.", "memoryTrick": "\"A-P-M go Trans\": ATRANS=possession, PTRANS=place, MTRANS=mind/information — all end in \"TRANS\" (transfer).", "quick10": "CD represents sentence meaning as ACTOR+ACTION(primitive: ATRANS/PTRANS/MTRANS...)+OBJECT+DIRECTION, independent of surface wording.", "quick30": "Conceptual Dependency (Schank) represents meaning using primitive actions instead of words: ATRANS=transfer of possession, PTRANS=transfer of physical location, MTRANS=transfer of mental information, plus PROPEL/INGEST/SPEAK etc. A CD structure has ACTOR, ACTION, OBJECT, DIRECTION(source→destination). Example: \"Riya gave Rahul a laptop\" → ACTOR=Riya, ACTION=ATRANS, OBJECT=laptop, DIRECTION=Riya→Rahul. Two differently-worded sentences with the same meaning map to the same CD structure.", "answerEnMd": "Conceptual Dependency (CD), developed by Roger Schank, is a theory for representing sentence meaning in a language-independent form using a small fixed set of **primitive actions** rather than the surface words themselves, so that sentences with different wording but identical meaning share the same underlying representation.\n\n**CD Structure Slots:** ACTOR (who performs the action), ACTION (the primitive act, from Schank's list), OBJECT (what is acted upon), DIRECTION (source → destination, for transfer-type actions).\n\n**Key Primitive Actions:** ATRANS (transfer of possession/ownership), PTRANS (transfer of physical location), MTRANS (transfer of mental/information content), PROPEL (application of physical force), INGEST (taking something in), MBUILD (building new information/thoughts), SPEAK (producing an utterance).\n\n**Worked Example — \"Riya gave Rahul a laptop\":** ACTOR: Riya; ACTION: ATRANS; OBJECT: laptop; DIRECTION: source=Riya, destination=Rahul.\n\n**Worked Example — \"Amit sent Priya an email\":** ACTOR: Amit; ACTION: MTRANS (an email transfers information/mental content); OBJECT: email; DIRECTION: source=Amit, destination=Priya.\n\n**Worked Example — \"Kenrick went to New York\":** ACTOR: Kenrick; ACTION: PTRANS; OBJECT: Kenrick; DIRECTION: destination=New York.", "answerGuMd": "Conceptual Dependency (CD), Roger Schank દ્વારા develop, sentence ના meaning ને ભાષા-independent form માં નાના fixed primitive actions ના set વાપરીને represent કરવાની theory છે, surface શબ્દોને બદલે — જેથી અલગ શબ્દોવાળા પણ સરખા meaning ધરાવતા sentences એ જ underlying representation share કરે.\n\n**CD Structure Slots:** ACTOR (કોણ action કરે), ACTION (primitive act, Schank ના list માંથી), OBJECT (શેના પર action), DIRECTION (source → destination, transfer-type actions માટે).\n\n**Key Primitive Actions:** ATRANS (ownership transfer), PTRANS (physical location transfer), MTRANS (mental/information transfer), PROPEL (physical force), INGEST (અંદર લેવું), MBUILD (નવી information બનાવવી), SPEAK (utterance ઉત્પન્ન કરવો).\n\n**Worked Example — \"Riya gave Rahul a laptop\":** ACTOR: Riya; ACTION: ATRANS; OBJECT: laptop; DIRECTION: source=Riya, destination=Rahul.\n\n**Worked Example — \"Amit sent Priya an email\":** ACTOR: Amit; ACTION: MTRANS (email information carry કરે); OBJECT: email; DIRECTION: source=Amit, destination=Priya.", "mustWrite": ["Name the specific correct primitive action (ATRANS/PTRANS/MTRANS etc.) with a one-line reason why it fits", "Fill all 4 slots: ACTOR, ACTION, OBJECT, DIRECTION", "State that CD is language-independent (same meaning → same structure regardless of wording)"], "keywords": ["Conceptual Dependency", "Primitive Action", "ATRANS", "PTRANS", "MTRANS", "ACTOR", "DIRECTION"], "diagramMd": "A box: ACTOR(Riya) --ACTION[ATRANS]--> OBJECT(laptop), with an arrow labeled DIRECTION from Riya to Rahul underneath.", "howToDrawMd": "1. Write the ACTOR name on the left. 2. Draw an arrow to the right labeled with the ACTION in capitals (e.g. ATRANS). 3. Write the OBJECT above the arrow. 4. Below, draw a small source→destination arrow labeled DIRECTION.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "CD asks \"what REALLY happened, in the fewest possible action-types?\" — no matter how a sentence is worded, if something moved location it's PTRANS, if ownership changed it's ATRANS, if information moved it's MTRANS.", "examTip": "Whatever new sentence the exam gives, first ask \"did an object physically move (PTRANS)? did ownership change (ATRANS)? did information/knowledge move (MTRANS)?\" — picking the right primitive is worth more marks than any other part of the answer.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q19", "sr": 19, "question": "Explain Semantic Networks with structure and a worked example, including inheritance.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply semantic knowledge-representation techniques)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "The exact example \"A dog is an animal\" is asked as a semantic-net question in TWO different real exam papers (the Jul-2026 mid-sem for 01CE0718 and the Sep-2025 final for 01CE0718), and Assignment-1 Q11 asks for a Bird/Sparrow/Penguin inheritance semantic network — confirming this is a repeated, high-value topic across independent papers.", "easyMeaning": "Explain how a Semantic Network represents knowledge as a graph of connected concepts (nodes) and relationships (labeled arrows), and how \"is-a\" links let specific concepts inherit properties from general ones.", "understandEnMd": "A Semantic Network represents knowledge as a **graph**: **nodes** represent concepts/objects, and **labeled edges (arcs)** represent relationships between them (e.g. \"is-a\", \"has-a\", \"can\", \"part-of\"). It is one of the oldest and most intuitive knowledge-representation schemes in AI/NLP.\n\nThe most important relationship is **\"is-a\"** (also called ISA), which creates a **hierarchy** and enables **inheritance**: if \"Sparrow is-a Bird\" and \"Bird can Fly\", then Sparrow automatically inherits the property \"can Fly\" without it needing to be stated again directly on Sparrow. Exceptions can override inherited properties — e.g. \"Penguin is-a Bird\" but \"Penguin cannot Fly\" is stated explicitly to override the inherited default.\n\n**Worked example — \"A dog is an animal\":** Node \"Dog\" —is-a→ Node \"Animal\". Animal has properties like \"can Breathe\", \"can Move\" — Dog inherits both automatically. Dog can also have its own specific properties directly attached, like \"has-a Tail\" and \"can Bark\".\n\n**Worked example — Bird/Sparrow/Penguin inheritance:** Node \"Bird\" has properties: can Fly, has Feathers, can Lay Eggs. Node \"Sparrow\" —is-a→ \"Bird\": inherits can Fly, has Feathers, can Lay Eggs (no exceptions). Node \"Penguin\" —is-a→ \"Bird\": inherits has Feathers, can Lay Eggs, BUT has an explicit override \"cannot Fly\" and an explicit addition \"can Swim\" — showing that semantic networks support both inheritance AND exceptions.", "understandGuMd": "Semantic Network knowledge ને **graph** તરીકે represent કરે: **nodes** concepts/objects represent કરે, અને **labeled edges (arcs)** તેમની વચ્ચેના relationships represent કરે (દા.ત. \"is-a\", \"has-a\", \"can\", \"part-of\"). AI/NLP માં આ સૌથી જૂની અને સૌથી intuitive knowledge-representation scheme માંની એક છે.\n\nસૌથી મહત્વનું relationship છે **\"is-a\"** (ISA), જે **hierarchy** બનાવે અને **inheritance** શક્ય બનાવે: જો \"Sparrow is-a Bird\" અને \"Bird can Fly\", તો Sparrow ને ફરીથી કહ્યા વગર automatically \"can Fly\" property મળે. Exceptions inherited properties ને override કરી શકે — દા.ત. \"Penguin is-a Bird\" પણ \"Penguin cannot Fly\" સ્પષ્ટ રીતે override કરવા લખાય.\n\n**Worked example — \"A dog is an animal\":** Node \"Dog\" —is-a→ Node \"Animal\". Animal ના properties જેમ કે \"can Breathe\", \"can Move\" — Dog બંને automatically inherit કરે. Dog ના પોતાના specific properties પણ સીધા હોઈ શકે, જેમ \"has-a Tail\" અને \"can Bark\".\n\n**Worked example — Bird/Sparrow/Penguin inheritance:** Node \"Bird\" ના properties: can Fly, has Feathers, can Lay Eggs. Node \"Sparrow\" —is-a→ \"Bird\": can Fly, has Feathers, can Lay Eggs બધું inherit કરે. Node \"Penguin\" —is-a→ \"Bird\": has Feathers, can Lay Eggs inherit કરે, પણ explicit override \"cannot Fly\" અને explicit addition \"can Swim\" ધરાવે છે — બતાવે છે કે semantic networks inheritance અને exceptions બંને support કરે.", "oneLine": "Semantic Network = graph of nodes(concepts) + labeled edges(relations); \"is-a\" links create inheritance, with exceptions allowed (e.g. Penguin cannot fly).", "memoryTrick": "Think \"family tree of facts\" — children (Sparrow, Penguin) inherit parent (Bird) traits unless they explicitly say otherwise.", "quick10": "Semantic Network = nodes (concepts) + labeled edges (relations like is-a/has-a); is-a enables inheritance; exceptions can override it (Penguin).", "quick30": "A Semantic Network is a graph-based knowledge representation with nodes for concepts and labeled arcs for relationships (is-a, has-a, can, part-of). The \"is-a\" link builds a hierarchy that supports inheritance — a subtype automatically gets its supertype's properties (Sparrow is-a Bird → inherits can-Fly). Exceptions can explicitly override inherited defaults (Penguin is-a Bird but cannot-Fly, explicitly stated). Example: Dog is-a Animal inherits can-Breathe/can-Move, plus its own has-a-Tail.", "answerEnMd": "A Semantic Network is a graph-based knowledge-representation technique where **nodes** represent concepts/objects and **labeled edges (arcs)** represent the relationships between them, such as \"is-a\" (class membership/hierarchy), \"has-a\" (possession), \"can\" (capability), and \"part-of\" (composition).\n\n**Inheritance:** the \"is-a\" link organizes concepts into a hierarchy so that specific nodes automatically inherit the properties of their general (parent) nodes, avoiding repetition of shared facts.\n\n**Example — \"A dog is an animal\":** Dog —is-a→ Animal. Animal's general properties (can Breathe, can Move) are inherited by Dog automatically; Dog additionally has its own specific properties (has-a Tail, can Bark).\n\n**Example — Bird/Sparrow/Penguin:** Bird has properties {can Fly, has Feathers, can Lay Eggs}. Sparrow —is-a→ Bird inherits all three properties unchanged. Penguin —is-a→ Bird inherits {has Feathers, can Lay Eggs} but has an explicit exception overriding \"can Fly\" to \"cannot Fly\", and an explicit addition \"can Swim\" — demonstrating that semantic networks support both default inheritance and stated exceptions.", "answerGuMd": "Semantic Network એ graph-based knowledge-representation technique છે જ્યાં **nodes** concepts/objects represent કરે અને **labeled edges (arcs)** તેમની વચ્ચેના relationships represent કરે, જેમ કે \"is-a\" (class membership/hierarchy), \"has-a\" (possession), \"can\" (capability), અને \"part-of\" (composition).\n\n**Inheritance:** \"is-a\" link concepts ને hierarchy માં organize કરે જેથી specific nodes પોતાના general (parent) nodes ના properties automatically inherit કરે, shared facts repeat કરવાની જરૂર ના રહે.\n\n**Example — \"A dog is an animal\":** Dog —is-a→ Animal. Animal ના general properties (can Breathe, can Move) Dog automatically inherit કરે; Dog પોતાના specific properties (has-a Tail, can Bark) પણ ધરાવે.\n\n**Example — Bird/Sparrow/Penguin:** Bird ના properties {can Fly, has Feathers, can Lay Eggs}. Sparrow —is-a→ Bird ત્રણેય properties inherit કરે. Penguin —is-a→ Bird {has Feathers, can Lay Eggs} inherit કરે પણ \"can Fly\" ને explicit exception થી \"cannot Fly\" override કરે, અને explicit addition \"can Swim\" ધરાવે — બતાવે કે semantic networks inheritance અને exceptions બંને support કરે.", "mustWrite": ["Draw the node-and-arc graph, not just describe it in words", "Explicitly use the word \"inheritance\" and explain the is-a mechanism", "Show at least one exception case (Penguin cannot fly) to prove deeper understanding"], "keywords": ["Semantic Network", "Node", "Arc", "is-a Relation", "Inheritance", "Exception"], "diagramMd": "Animal (top node) —is-a← Dog (bottom node, with its own \"has-a Tail\" branch). Second diagram: Bird (top) —is-a← Sparrow (inherits can-Fly) and Bird —is-a← Penguin (cannot-Fly override, can-Swim addition).", "howToDrawMd": "1. Draw an oval for the general concept (Animal/Bird) at the top. 2. Draw ovals below for specific concepts (Dog / Sparrow, Penguin). 3. Draw arrows from specific to general labeled \"is-a\". 4. Attach small property boxes to each node; for Penguin, draw a crossed-out \"can Fly\" and an added \"can Swim\" to show the exception.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A semantic network is a mind-map of facts: circles are things, arrows are how they relate. Follow the \"is-a\" arrows upward to borrow properties automatically — just cross out any inherited property the exam explicitly says is an exception (like a Penguin not flying).", "examTip": "Whichever pair the exam gives (Dog/Animal, Sparrow/Penguin/Bird, or a new one), always explicitly write the sentence \"X inherits property Y from Z because of the is-a link\" — this exact phrase signals to the examiner that you understand inheritance, not just drawing.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q20", "sr": 20, "question": "Explain Rule-Based Systems and Forward Chaining with a fully worked numerical example.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply rule-based reasoning techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is a full dedicated PPT topic with a fully worked example (Fever/Cough→Flu→Pneumonia→Hospitalize), is Assignment-1 Q14 (identical rules), and — critically — the \"Student Eligibility System\" practice variant on the PPT (Attendance≥75%→Eligible→HallTicketIssued→CanAppear) is asked with the EXACT SAME numbers (Attendance=82%, FeesPaid) in the separate PAC Average-Student-Task Q3, proving genuine real repetition across two independent sources.", "easyMeaning": "Explain how a rule-based (production) system uses IF-THEN rules plus known facts to derive new facts step by step (forward chaining) until a goal is reached.", "understandEnMd": "A rule-based system stores knowledge as a set of **IF-THEN rules** (production rules) and a **working memory** of currently known **facts**. **Forward Chaining** is a reasoning strategy that starts from the known facts and repeatedly fires any rule whose IF-condition is fully satisfied by the current facts, adding the rule's THEN-conclusion as a new fact — continuing until no more rules can fire or the goal fact is derived. It is \"data-driven\" (facts → conclusions), as opposed to backward chaining which is \"goal-driven\".\n\n**Worked Example 1 (medical diagnosis, from the PPT):**\nRules: Rule 1: IF Fever AND Cough THEN Flu. Rule 2: IF Flu AND Breathing Problem THEN Pneumonia. Rule 3: IF Pneumonia THEN Hospitalize.\nFacts given: Fever, Cough, Breathing Problem.\nTrace: Step 1 — Fever ✓ and Cough ✓ are both in working memory → Rule 1 fires → add fact \"Flu\". Step 2 — Flu ✓ (just added) and Breathing Problem ✓ are both present → Rule 2 fires → add fact \"Pneumonia\". Step 3 — Pneumonia ✓ is present → Rule 3 fires → add fact \"Hospitalize\". No more rules can fire → **final conclusion: Hospitalize**.\n\n**Worked Example 2 (Student Eligibility System, confirmed repeated in two independent sources):**\nRules: Rule 1: IF Attendance ≥ 75% THEN Eligible. Rule 2: IF Eligible AND FeesPaid THEN HallTicketIssued. Rule 3: IF HallTicketIssued THEN CanAppear.\nFacts given: Attendance = 82%, FeesPaid.\nTrace: Step 1 — Attendance = 82% satisfies \"≥75%\" → Rule 1 fires → add fact \"Eligible\". Step 2 — Eligible ✓ (just added) and FeesPaid ✓ are both present → Rule 2 fires → add fact \"HallTicketIssued\". Step 3 — HallTicketIssued ✓ is present → Rule 3 fires → add fact \"CanAppear\". No more rules can fire → **final conclusion: the student CanAppear for the exam**.\n\n**Worked Example 3 (Smart Home Automation, PPT practice variant — method shown, exact facts not separately re-solved since the source leaves it as a practice exercise):** Rules: Motion + Night → Lights; Lights + PersonID → Unlock; Unlock → Notification. Apply the identical method: check which rule's IF-side is fully satisfied by current facts, fire it, add its THEN-side as a new fact, repeat until no rule fires.", "understandGuMd": "Rule-based (production) system knowledge ને **IF-THEN rules** (production rules) અને હાલમાં ખબર હોય એવા **facts** ની **working memory** તરીકે store કરે. **Forward Chaining** એક reasoning strategy છે જે known facts થી શરૂ કરે અને જે rule નું IF-condition હાલના facts થી પૂરેપૂરું સંતોષાય તેને fire કરે, તેનું THEN-conclusion નવા fact તરીકે ઉમેરે — જ્યાં સુધી કોઈ વધુ rule fire ના થાય અથવા goal fact ના મળે ત્યાં સુધી ચાલુ રહે. આ \"data-driven\" છે (facts → conclusions), backward chaining (\"goal-driven\") થી ઉલટું.\n\n**Worked Example 1 (medical diagnosis, PPT):**\nRules: Rule 1: IF Fever AND Cough THEN Flu. Rule 2: IF Flu AND Breathing Problem THEN Pneumonia. Rule 3: IF Pneumonia THEN Hospitalize.\nFacts: Fever, Cough, Breathing Problem.\nTrace: Step 1 — Fever ✓ અને Cough ✓ બંને હાજર → Rule 1 fire → fact \"Flu\" ઉમેરાય. Step 2 — Flu ✓ અને Breathing Problem ✓ બંને હાજર → Rule 2 fire → fact \"Pneumonia\" ઉમેરાય. Step 3 — Pneumonia ✓ હાજર → Rule 3 fire → fact \"Hospitalize\" ઉમેરાય. હવે કોઈ rule fire નથી થતું → **final conclusion: Hospitalize**.\n\n**Worked Example 2 (Student Eligibility System, બે અલગ sources માં repeat થયેલું confirmed):**\nRules: Rule 1: IF Attendance ≥ 75% THEN Eligible. Rule 2: IF Eligible AND FeesPaid THEN HallTicketIssued. Rule 3: IF HallTicketIssued THEN CanAppear.\nFacts: Attendance = 82%, FeesPaid.\nTrace: Step 1 — Attendance=82% \"≥75%\" સંતોષે → Rule 1 fire → fact \"Eligible\" ઉમેરાય. Step 2 — Eligible ✓ અને FeesPaid ✓ બંને હાજર → Rule 2 fire → fact \"HallTicketIssued\" ઉમેરાય. Step 3 — HallTicketIssued ✓ હાજર → Rule 3 fire → fact \"CanAppear\" ઉમેરાય. હવે કોઈ rule fire નથી થતું → **final conclusion: student CanAppear**.\n\n**Worked Example 3 (Smart Home Automation, practice variant):** Rules: Motion + Night → Lights; Lights + PersonID → Unlock; Unlock → Notification. એ જ method લગાવો: જે rule નું IF-side હાલના facts થી પૂરું સંતોષાય તેને fire કરો, THEN-side ઉમેરો, ફરી repeat કરો.", "oneLine": "Forward Chaining = start from facts, fire any rule whose IF-side is fully true, add its THEN as a new fact, repeat till nothing new fires.", "memoryTrick": "\"Facts push Forward\" — Forward chaining is data (facts) pushing you forward to conclusions.", "quick10": "Forward chaining: facts → check rules → fire matching rule → add new fact → repeat until goal/no rule fires. Example: Fever+Cough→Flu→(+Breathing Problem)→Pneumonia→Hospitalize.", "quick30": "A rule-based system has IF-THEN production rules and a working-memory of facts. Forward chaining is data-driven: repeatedly find a rule whose IF-conditions are all satisfied by current facts, fire it, add its THEN-conclusion as a new fact, and repeat until no more rules fire. Example: Facts={Fever,Cough,Breathing Problem}; Rule1(Fever&Cough→Flu) fires; Rule2(Flu&Breathing Problem→Pneumonia) fires; Rule3(Pneumonia→Hospitalize) fires → final conclusion Hospitalize. A second confirmed-repeated example: Attendance=82%,FeesPaid → Eligible → HallTicketIssued → CanAppear.", "answerEnMd": "A rule-based (production) system represents knowledge as **IF-THEN rules** operating over a **working memory of facts**. **Forward Chaining** is a data-driven inference strategy: starting from the known facts, it repeatedly scans the rule base for any rule whose IF-part is completely satisfied by the current facts, \"fires\" that rule by adding its THEN-part to working memory as a new fact, and repeats this cycle until either the target goal fact appears or no further rule can fire.\n\n**Worked Example — Medical Diagnosis:**\nRules: R1: Fever ∧ Cough → Flu. R2: Flu ∧ Breathing Problem → Pneumonia. R3: Pneumonia → Hospitalize.\nGiven Facts: Fever, Cough, Breathing Problem.\n| Step | Facts Available | Rule Fired | New Fact Added |\n|---|---|---|---|\n| 1 | Fever, Cough, Breathing Problem | R1 (Fever∧Cough→Flu) | Flu |\n| 2 | + Flu | R2 (Flu∧Breathing Problem→Pneumonia) | Pneumonia |\n| 3 | + Pneumonia | R3 (Pneumonia→Hospitalize) | Hospitalize |\n\n**Final Conclusion: Hospitalize** (no further rule can fire).\n\n**Worked Example — Student Eligibility System:**\nRules: R1: Attendance≥75% → Eligible. R2: Eligible ∧ FeesPaid → HallTicketIssued. R3: HallTicketIssued → CanAppear.\nGiven Facts: Attendance = 82%, FeesPaid.\n| Step | Facts Available | Rule Fired | New Fact Added |\n|---|---|---|---|\n| 1 | Attendance=82%, FeesPaid | R1 (Attendance≥75%→Eligible) | Eligible |\n| 2 | + Eligible | R2 (Eligible∧FeesPaid→HallTicketIssued) | HallTicketIssued |\n| 3 | + HallTicketIssued | R3 (HallTicketIssued→CanAppear) | CanAppear |\n\n**Final Conclusion: the student CanAppear for the exam.**", "answerGuMd": "Rule-based (production) system knowledge ને **IF-THEN rules** તરીકે represent કરે, જે **facts ની working memory** પર કામ કરે. **Forward Chaining** data-driven inference strategy છે: known facts થી શરૂ કરીને, જે rule નું IF-part હાલના facts થી પૂરેપૂરું સંતોષાય તેને શોધીને \"fire\" કરે, તેનું THEN-part નવા fact તરીકે working memory માં ઉમેરે, અને goal fact ના મળે અથવા કોઈ rule fire ના થાય ત્યાં સુધી આ repeat કરે.\n\n**Worked Example — Medical Diagnosis:**\nRules: R1: Fever ∧ Cough → Flu. R2: Flu ∧ Breathing Problem → Pneumonia. R3: Pneumonia → Hospitalize.\nFacts: Fever, Cough, Breathing Problem.\n| Step | હાજર Facts | Fire થયેલો Rule | નવો Fact |\n|---|---|---|---|\n| 1 | Fever, Cough, Breathing Problem | R1 | Flu |\n| 2 | + Flu | R2 | Pneumonia |\n| 3 | + Pneumonia | R3 | Hospitalize |\n\n**Final Conclusion: Hospitalize.**\n\n**Worked Example — Student Eligibility System:**\nRules: R1: Attendance≥75% → Eligible. R2: Eligible ∧ FeesPaid → HallTicketIssued. R3: HallTicketIssued → CanAppear.\nFacts: Attendance = 82%, FeesPaid.\n| Step | હાજર Facts | Fire થયેલો Rule | નવો Fact |\n|---|---|---|---|\n| 1 | Attendance=82%, FeesPaid | R1 | Eligible |\n| 2 | + Eligible | R2 | HallTicketIssued |\n| 3 | + HallTicketIssued | R3 | CanAppear |\n\n**Final Conclusion: student CanAppear.**", "mustWrite": ["Write all the rules first, clearly numbered", "Show a step-by-step trace table (Step | Facts | Rule Fired | New Fact) — do not jump straight to the answer", "State the final conclusion explicitly on its own line"], "keywords": ["Forward Chaining", "Production Rule", "Working Memory", "Rule-Based System", "Inference"], "diagramMd": "Facts box → arrow to Rule1 → new fact → arrow to Rule2 → new fact → arrow to Rule3 → Final Conclusion, drawn as a left-to-right chain.", "howToDrawMd": "1. List all given rules in a box at the top, numbered. 2. Draw the initial facts as small labeled circles. 3. Draw an arrow from the satisfying facts into \"Rule 1\" and from Rule 1 to its new fact circle. 4. Repeat chaining rule by rule until the final conclusion circle is reached and boxed/highlighted.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Forward chaining is like a line of dominoes: you only have the starting facts, but each rule is a domino that falls (fires) the moment its required facts are all standing — each fallen domino becomes a new fact that can knock down the next rule, until nothing more falls.", "examTip": "Whatever new rule-set and facts the exam gives (attendance, smart home, or anything else), ALWAYS build the same 3-column trace table (Facts Available | Rule Fired | New Fact) — examiners give marks per correctly-traced step, not just for the final answer.\n\n## HIGH PRIORITY QUESTIONS", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q21", "sr": 21, "question": "Explain Case Grammar (Fillmore) with case roles and a worked example.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply semantic role/case analysis techniques)", "bloomLevel": "Understand", "priority": "high", "priorityLabel": "High", "priorityReason": "Case Grammar is a dedicated PPT topic with two worked examples (knife/instrumental case, Delhi-Jaipur travel), and is directly asked as Assignment-1 Q15 with a fresh sentence (\"The doctor examined the patient with a stethoscope in the hospital\") — the same skill tested twice with different sentences.", "easyMeaning": "Explain how Case Grammar identifies the semantic ROLE each noun-phrase plays in a sentence (who does it, to whom, with what, where) rather than just its grammatical position.", "understandEnMd": "Case Grammar, proposed by Charles Fillmore, argues that the deep structure of a sentence is best understood not by grammatical roles (subject/object) but by **semantic case roles** — the underlying relationship each noun phrase has to the verb, regardless of its surface grammatical position.\n\n**Common case roles:** **Agentive/Agent** (the doer of the action), **Objective/Patient** (the entity affected by the action), **Instrumental** (the tool/means used), **Dative/Experiencer** (the entity receiving/experiencing something), **Locative** (the place of the action), **Source** (starting point), **Goal** (ending point).\n\n**Worked example — \"Ram cuts the apple by a knife\":** Ram = Agentive (doer), apple = Objective (thing acted upon), knife = Instrumental (tool used to perform the cutting).\n\n**Worked example — \"Mohan travelled from Delhi to Jaipur by train\":** Mohan = Agentive, Delhi = Source (starting location), Jaipur = Goal (destination), train = Instrumental (means of travel).\n\n**Worked example — \"The doctor examined the patient with a stethoscope in the hospital\":** doctor = Agentive, patient = Objective/Patient, stethoscope = Instrumental, hospital = Locative.", "understandGuMd": "Case Grammar, Charles Fillmore એ આપેલી, કહે છે કે sentence ની deep structure ને grammatical roles (subject/object) થી નહીં પણ **semantic case roles** થી સમજવી જોઈએ — દરેક noun phrase નો verb સાથેનો underlying સંબંધ, ભલે તેની surface grammatical position ગમે તે હોય.\n\n**સામાન્ય case roles:** **Agentive/Agent** (action કરનાર), **Objective/Patient** (action થી અસર પામતું entity), **Instrumental** (વપરાયેલું સાધન), **Dative/Experiencer** (કંઈક receive/experience કરતું entity), **Locative** (action ની જગ્યા), **Source** (શરૂઆતનું સ્થળ), **Goal** (અંતિમ સ્થળ).\n\n**Worked example — \"Ram cuts the apple by a knife\":** Ram = Agentive, apple = Objective, knife = Instrumental.\n\n**Worked example — \"Mohan travelled from Delhi to Jaipur by train\":** Mohan = Agentive, Delhi = Source, Jaipur = Goal, train = Instrumental.\n\n**Worked example — \"The doctor examined the patient with a stethoscope in the hospital\":** doctor = Agentive, patient = Objective/Patient, stethoscope = Instrumental, hospital = Locative.", "oneLine": "Case Grammar (Fillmore) labels each noun phrase's semantic role: Agentive(doer), Objective(affected), Instrumental(tool), Locative(place), Source/Goal.", "memoryTrick": "\"AOIL-SG\" — Agent, Objective, Instrumental, Locative, Source, Goal — identify these 6 roles in any sentence.", "quick10": "Case Grammar assigns semantic roles (Agentive/Objective/Instrumental/Locative/Source/Goal) to each noun phrase, independent of grammatical subject/object position.", "quick30": "Fillmore's Case Grammar says a sentence's deep meaning is captured by semantic case roles rather than surface grammatical roles. Key roles: Agentive (doer), Objective/Patient (affected entity), Instrumental (tool used), Locative (place), Source (start point), Goal (end point). Example: \"Ram cuts the apple by a knife\" → Ram=Agentive, apple=Objective, knife=Instrumental. \"Mohan travelled from Delhi to Jaipur by train\" → Mohan=Agentive, Delhi=Source, Jaipur=Goal, train=Instrumental.", "answerEnMd": "Case Grammar (Charles Fillmore) represents sentence meaning by assigning each noun phrase a **semantic case role** describing its underlying relationship to the verb, rather than relying on surface grammatical roles like subject/object.\n\n**Key Case Roles:** Agentive (the doer of the action), Objective/Patient (the entity the action is done to), Instrumental (the means/tool used), Dative/Experiencer (the receiver/experiencer), Locative (the place), Source (starting point), Goal (destination/end point).\n\n| Sentence | Agentive | Objective | Instrumental | Locative/Source/Goal |\n|---|---|---|---|---|\n| Ram cuts the apple by a knife | Ram | apple | knife | — |\n| Mohan travelled from Delhi to Jaipur by train | Mohan | — | train | Source: Delhi, Goal: Jaipur |\n| The doctor examined the patient with a stethoscope in the hospital | doctor | patient | stethoscope | Locative: hospital |\n\nThis role-based analysis reveals the deep semantic structure of the sentence, which stays the same even if the sentence were reworded (e.g. passive voice).", "answerGuMd": "Case Grammar (Charles Fillmore) sentence ના meaning ને દરેક noun phrase ને **semantic case role** આપીને represent કરે, જે verb સાથેનો underlying સંબંધ બતાવે, surface grammatical roles (subject/object) ને બદલે.\n\n**મુખ્ય Case Roles:** Agentive (action કરનાર), Objective/Patient (action જેના પર થાય), Instrumental (વપરાયેલું સાધન), Dative/Experiencer (receive/experience કરનાર), Locative (જગ્યા), Source (શરૂઆતનું સ્થળ), Goal (અંતિમ સ્થળ).\n\n| Sentence | Agentive | Objective | Instrumental | Locative/Source/Goal |\n|---|---|---|---|---|\n| Ram cuts the apple by a knife | Ram | apple | knife | — |\n| Mohan travelled from Delhi to Jaipur by train | Mohan | — | train | Source: Delhi, Goal: Jaipur |\n| The doctor examined the patient with a stethoscope in the hospital | doctor | patient | stethoscope | Locative: hospital |\n\nઆ role-based analysis sentence નું deep semantic structure બતાવે, જે sentence ફરીથી (દા.ત. passive voice માં) લખાય તો પણ એ જ રહે.", "mustWrite": ["List the case roles definitions before applying them", "Present the answer as a table mapping each noun phrase to its case role", "Cover all noun phrases in the given sentence, not just the subject/object"], "keywords": ["Case Grammar", "Fillmore", "Agentive", "Objective", "Instrumental", "Locative", "Source", "Goal"], "diagramMd": "A central verb node with labeled spokes radiating out to each noun phrase: Agentive→Ram, Objective→apple, Instrumental→knife.", "howToDrawMd": "1. Write the main verb in a circle at the center. 2. Draw spokes outward, one per noun phrase in the sentence. 3. Label each spoke with its case role (Agentive/Objective/Instrumental/etc). 4. Write the actual word from the sentence at the end of each spoke.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Case Grammar asks 5 simple questions about a sentence: WHO did it (Agentive)? WHAT did it happen to (Objective)? WITH WHAT tool (Instrumental)? WHERE (Locative)? FROM WHERE/TO WHERE (Source/Goal)? Answer these and you've done the case-role analysis.", "examTip": "For any new sentence, scan for prepositions — \"by X\" and \"with X\" almost always signal Instrumental, \"in X\"/\"at X\" signal Locative, \"from X\"/\"to X\" signal Source/Goal — this shortcut quickly identifies most roles.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q22", "sr": 22, "question": "Explain Conceptual Graphs (Sowa) with structure and a worked example.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply semantic knowledge-representation techniques)", "bloomLevel": "Understand", "priority": "high", "priorityLabel": "High", "priorityReason": "Conceptual Graphs are a dedicated PPT topic with a full worked example, and the same skill is directly tested with a fresh sentence in Assignment-1 Q16 (\"The professor teaches NLP to final-year students using smart boards\").", "easyMeaning": "Explain how a Conceptual Graph represents a sentence's meaning as concept nodes and relation nodes connected in a bipartite graph.", "understandEnMd": "A Conceptual Graph (proposed by John Sowa, 1976) is a bipartite graph used to represent meaning, consisting of two kinds of nodes: **Concept nodes** (drawn as boxes/rectangles, representing entities, events or ideas — e.g. [John], [Boston], [Go]) and **Relation nodes** (drawn as ovals/circles, representing the relationship connecting concepts — e.g. (Agent), (Destination), (Instrument)). Concept nodes are never directly connected to each other — they only connect through a relation node in between, making it a strict bipartite (alternating) structure.\n\n**Worked example — \"John is going to Boston by Bus\":** [Go] —(Agent)→ [John]; [Go] —(Destination)→ [Boston]; [Go] —(Instrument)→ [Bus]. Reading it: the event \"Go\" has an Agent \"John\", a Destination \"Boston\", and an Instrument \"Bus\".\n\n**Worked example — \"The professor teaches NLP to final-year students using smart boards\":** [Teach] —(Agent)→ [Professor]; [Teach] —(Object)→ [NLP]; [Teach] —(Recipient)→ [Final-year Students]; [Teach] —(Instrument)→ [Smart Board].", "understandGuMd": "Conceptual Graph (John Sowa, 1976 એ આપેલી) એ bipartite graph છે meaning represent કરવા, જેમાં બે પ્રકારના nodes હોય: **Concept nodes** (boxes/rectangles તરીકે દોરાય, entities/events/ideas represent કરે — દા.ત. [John], [Boston], [Go]) અને **Relation nodes** (ovals/circles તરીકે દોરાય, concepts વચ્ચેનો સંબંધ represent કરે — દા.ત. (Agent), (Destination), (Instrument)). Concept nodes ક્યારેય સીધા એકબીજા સાથે જોડાતા નથી — તેઓ વચ્ચે relation node દ્વારા જ જોડાય, જે તેને strict bipartite structure બનાવે.\n\n**Worked example — \"John is going to Boston by Bus\":** [Go] —(Agent)→ [John]; [Go] —(Destination)→ [Boston]; [Go] —(Instrument)→ [Bus].\n\n**Worked example — \"The professor teaches NLP to final-year students using smart boards\":** [Teach] —(Agent)→ [Professor]; [Teach] —(Object)→ [NLP]; [Teach] —(Recipient)→ [Final-year Students]; [Teach] —(Instrument)→ [Smart Board].", "oneLine": "Conceptual Graph (Sowa) = bipartite graph of Concept nodes (boxes) linked only via Relation nodes (ovals like Agent/Object/Instrument).", "memoryTrick": "\"Boxes never touch boxes\" — concepts (boxes) always need a relation (oval) go-between.", "quick10": "Conceptual Graph = Concept nodes (boxes: entities/events) + Relation nodes (ovals: Agent/Object/Instrument/Destination), strictly alternating/bipartite.", "quick30": "John Sowa's Conceptual Graph represents meaning as a bipartite graph: Concept nodes (boxes, for entities/events like [Go],[John],[Boston]) connect only through Relation nodes (ovals, like (Agent),(Destination),(Instrument)) — concepts never link directly to each other. Example: \"John is going to Boston by Bus\" → [Go]-(Agent)->[John], [Go]-(Destination)->[Boston], [Go]-(Instrument)->[Bus].", "answerEnMd": "A Conceptual Graph (Sowa, 1976) is a bipartite graph notation for representing sentence meaning using two alternating node types: **Concept nodes** (rectangular boxes representing entities, events, or ideas) and **Relation nodes** (ovals representing the semantic relationship between concepts, such as Agent, Object, Instrument, Destination, Recipient). Concept nodes connect only through relation nodes, never directly to each other.\n\n**Worked Example — \"John is going to Boston by Bus\":**\n[Go] → (Agent) → [John]\n[Go] → (Destination) → [Boston]\n[Go] → (Instrument) → [Bus]\n\n**Worked Example — \"The professor teaches NLP to final-year students using smart boards\":**\n[Teach] → (Agent) → [Professor]\n[Teach] → (Object) → [NLP]\n[Teach] → (Recipient) → [Final-year Students]\n[Teach] → (Instrument) → [Smart Board]", "answerGuMd": "Conceptual Graph (Sowa, 1976) એ sentence નું meaning represent કરવાનું bipartite graph notation છે, બે alternating node types વાપરીને: **Concept nodes** (rectangular boxes, entities/events/ideas) અને **Relation nodes** (ovals, concepts વચ્ચેનો semantic સંબંધ — Agent, Object, Instrument, Destination, Recipient). Concept nodes ફક્ત relation nodes દ્વારા જ જોડાય, સીધા નહીં.\n\n**Worked Example — \"John is going to Boston by Bus\":**\n[Go] → (Agent) → [John]\n[Go] → (Destination) → [Boston]\n[Go] → (Instrument) → [Bus]\n\n**Worked Example — \"The professor teaches NLP to final-year students using smart boards\":**\n[Teach] → (Agent) → [Professor]\n[Teach] → (Object) → [NLP]\n[Teach] → (Recipient) → [Final-year Students]\n[Teach] → (Instrument) → [Smart Board]", "mustWrite": ["Explicitly identify the main event/action as the central Concept node", "Draw box-oval-box chains for every relation, not just one", "Use standard relation names (Agent, Object, Instrument, Destination, Recipient)"], "keywords": ["Conceptual Graph", "Sowa", "Concept Node", "Relation Node", "Bipartite Graph"], "diagramMd": "[Teach] box in the center with 4 spokes, each going through an oval (Agent/Object/Recipient/Instrument) to a box (Professor/NLP/Students/Smart Board).", "howToDrawMd": "1. Draw a rectangle for the main event/action in the center. 2. For each role, draw a line out to a small oval labeled with the relation name. 3. From each oval, draw a line to a rectangle containing the related concept. 4. Make sure no two rectangles are ever connected without an oval between them.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Think of the event as a hub with spokes; each spoke has a little labeled \"relation\" sign in the middle before reaching the actual thing involved — you can never jump straight from one \"thing\" box to another thing box.", "examTip": "Whatever new sentence is given, first identify the main VERB/event — that becomes your one central concept box — then find every noun phrase and connect it through the right relation oval (Agent for the doer, Object for what's acted on, Instrument for \"using X\"/\"by X\", Recipient for \"to X\").", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q23", "sr": 23, "question": "Explain Relationship Extraction in NLP with its pipeline and a worked example.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply information extraction techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "Relationship Extraction is a dedicated PPT topic with a full worked pipeline example (Steve Jobs), is Assignment-1 Q17 (\"Google acquired DeepMind in 2014\"), appears in the Sep-2025 final for 01CE0718 (\"John works in a company located in New York\"), AND the exact sentence \"In India, Siemens acquired L&T Electric in 2023\" appears verbatim in TWO different real exam papers — the Sep-2025 final for 01AI0702 and the very recent 23-Sep-2026 paper — confirming this specific example is genuinely, repeatedly examined.", "easyMeaning": "Explain how NLP systems automatically extract structured relationships (like \"who acquired whom, when\") from unstructured sentences.", "understandEnMd": "Relationship Extraction (RE) is the NLP task of identifying and extracting structured relationships between named entities mentioned in unstructured text — converting free text into a structured (Entity1, Relation, Entity2) triple, along with any relevant attributes (like a date).\n\n**Typical Pipeline:** 1. **Tokenization** — split the sentence into words/tokens. 2. **Named Entity Recognition (NER)** — identify entities and their types (Organization, Person, Location, Date). 3. **Dependency/Syntactic Parsing** — understand the grammatical relationship connecting the entities. 4. **Relation Classification** — determine what kind of relationship connects the identified entities (e.g. \"acquired\", \"born in\", \"works at\"). 5. **Triple Formation** — output the final structured fact as (Entity1, Relation, Entity2 [+ attributes]).\n\n**Worked example — \"Steve Jobs...Born in...San Francisco\", \"Born on...24 Feb 1955\":** NER identifies \"Steve Jobs\" = Person, \"San Francisco\" = Location, \"24 Feb 1955\" = Date. Relation classification finds \"Born in\" connecting Steve Jobs and San Francisco, and \"Born on\" connecting Steve Jobs and the date. Final triples: (Steve Jobs, Born in, San Francisco); (Steve Jobs, Born on, 24 Feb 1955).\n\n**Worked example — \"In India, Siemens acquired L&T Electric in 2023\" (repeated verbatim in two real exam papers):** NER identifies \"Siemens\" = Organization, \"L&T Electric\" = Organization, \"2023\" = Date, \"India\" = Location. Relation classification finds \"acquired\" connecting Siemens and L&T Electric. Final triple: (Siemens, acquired, L&T Electric) with attributes {Year: 2023, Location: India}.\n\n**Worked example — \"Google acquired DeepMind in 2014\":** (Google, acquired, DeepMind) with attribute {Year: 2014}.", "understandGuMd": "Relationship Extraction (RE) એ unstructured text માં mention થયેલા named entities વચ્ચેના structured relationships ને ઓળખવા અને extract કરવાનું NLP task છે — free text ને structured (Entity1, Relation, Entity2) triple માં convert કરવું, જરૂરી attributes (જેમ કે date) સાથે.\n\n**સામાન્ય Pipeline:** 1. **Tokenization** — sentence ને words/tokens માં તોડવું. 2. **Named Entity Recognition (NER)** — entities અને તેમના types ઓળખવા (Organization, Person, Location, Date). 3. **Dependency/Syntactic Parsing** — entities ને જોડતો grammatical સંબંધ સમજવો. 4. **Relation Classification** — ઓળખાયેલા entities વચ્ચે કયા પ્રકારનો સંબંધ છે તે નક્કી કરવું (દા.ત. \"acquired\", \"born in\", \"works at\"). 5. **Triple Formation** — final structured fact (Entity1, Relation, Entity2 [+ attributes]) તરીકે output કરવું.\n\n**Worked example — \"Steve Jobs...Born in...San Francisco\":** NER \"Steve Jobs\" = Person, \"San Francisco\" = Location ઓળખે. Relation classification \"Born in\" સંબંધ શોધે. Final triple: (Steve Jobs, Born in, San Francisco); (Steve Jobs, Born on, 24 Feb 1955).\n\n**Worked example — \"In India, Siemens acquired L&T Electric in 2023\" (બે real exam papers માં verbatim repeat):** NER \"Siemens\"=Organization, \"L&T Electric\"=Organization, \"2023\"=Date, \"India\"=Location ઓળખે. Relation classification \"acquired\" સંબંધ શોધે. Final triple: (Siemens, acquired, L&T Electric) attributes {Year: 2023, Location: India} સાથે.\n\n**Worked example — \"Google acquired DeepMind in 2014\":** (Google, acquired, DeepMind) attribute {Year: 2014} સાથે.", "oneLine": "RE pipeline: Tokenize → NER (find entities) → Parse → Classify Relation → output (Entity1, Relation, Entity2) triple.", "memoryTrick": "\"Find WHO, find WHO, find HOW connected\" — two named entities + the verb/relation connecting them = the triple.", "quick10": "Relationship Extraction: NER finds entities → relation classification finds the connecting relation → output triple (Entity1, Relation, Entity2). E.g. (Siemens, acquired, L&T Electric, 2023).", "quick30": "Relationship Extraction converts unstructured text into structured (Entity1, Relation, Entity2) facts. Pipeline: Tokenization → Named Entity Recognition (identify entities like Person/Organization/Location/Date) → Syntactic/Dependency Parsing (find the grammatical link) → Relation Classification (name the relation type, e.g. \"acquired\", \"born in\") → Triple Formation. Example: \"Siemens acquired L&T Electric in 2023\" → (Siemens, acquired, L&T Electric) with attribute Year=2023 — this exact example has appeared in two different real exam papers.", "answerEnMd": "Relationship Extraction (RE) is the NLP task of automatically identifying structured relationships between named entities in unstructured text, producing (Entity1, Relation, Entity2) triples with supporting attributes.\n\n**Pipeline:** 1. Tokenization (split into words). 2. Named Entity Recognition (tag entities: Person/Organization/Location/Date). 3. Syntactic/Dependency Parsing (determine the grammatical connection between entities). 4. Relation Classification (identify the relation type connecting the entities, e.g. \"acquired\", \"born in\", \"works at\"). 5. Triple Formation (final structured output).\n\n**Worked Example — \"In India, Siemens acquired L&T Electric in 2023\":**\n- Entities (NER): Siemens=Organization, L&T Electric=Organization, 2023=Date, India=Location.\n- Relation identified: \"acquired\" connects Siemens (acquirer) and L&T Electric (acquired).\n- **Final Triple: (Siemens, acquired, L&T Electric)**, Attributes: {Year: 2023, Country: India}.\n\n**Worked Example — \"Steve Jobs...Born in San Francisco...Born on 24 Feb 1955\":** Entities: Steve Jobs=Person, San Francisco=Location, 24 Feb 1955=Date. **Triples: (Steve Jobs, Born in, San Francisco); (Steve Jobs, Born on, 24 Feb 1955).**\n\n**Worked Example — \"Google acquired DeepMind in 2014\":** **(Google, acquired, DeepMind)**, Attribute: {Year: 2014}.\n\nApplications: building knowledge graphs, automated fact databases, question answering.", "answerGuMd": "Relationship Extraction (RE) એ unstructured text માં named entities વચ્ચેના structured relationships ને automatically ઓળખવાનું NLP task છે, (Entity1, Relation, Entity2) triples supporting attributes સાથે બનાવવું.\n\n**Pipeline:** 1. Tokenization. 2. Named Entity Recognition (entities tag કરવા: Person/Organization/Location/Date). 3. Syntactic/Dependency Parsing (entities વચ્ચેનો grammatical સંબંધ નક્કી કરવો). 4. Relation Classification (relation type ઓળખવો, દા.ત. \"acquired\", \"born in\"). 5. Triple Formation.\n\n**Worked Example — \"In India, Siemens acquired L&T Electric in 2023\":**\n- Entities (NER): Siemens=Organization, L&T Electric=Organization, 2023=Date, India=Location.\n- Relation: \"acquired\" Siemens (acquirer) અને L&T Electric (acquired) ને જોડે.\n- **Final Triple: (Siemens, acquired, L&T Electric)**, Attributes: {Year: 2023, Country: India}.\n\n**Worked Example — \"Steve Jobs...Born in San Francisco...Born on 24 Feb 1955\":** **Triples: (Steve Jobs, Born in, San Francisco); (Steve Jobs, Born on, 24 Feb 1955).**\n\n**Worked Example — \"Google acquired DeepMind in 2014\":** **(Google, acquired, DeepMind)**, Attribute: {Year: 2014}.\n\nApplications: knowledge graphs બનાવવા, automated fact databases, question answering.", "mustWrite": ["Write out the full 5-step pipeline (Tokenize→NER→Parse→Relation Classification→Triple)", "Show the final answer as an explicit (Entity1, Relation, Entity2) triple", "Include any date/attribute mentioned in the sentence"], "keywords": ["Relationship Extraction", "Named Entity Recognition", "Triple", "Relation Classification", "Knowledge Graph"], "diagramMd": "Two entity boxes (Siemens) and (L&T Electric) connected by a labeled arrow \"acquired\", with a small attached note \"Year: 2023\".", "howToDrawMd": "1. Draw two boxes for the two main entities. 2. Draw an arrow from the acquirer/subject entity to the other entity. 3. Label the arrow with the relation verb. 4. Write any extra attribute (date, location) below the arrow.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Relationship extraction is like filling in a simple sentence template: \"___ (did what relation) ___ (in what year)\" — find the two names and the connecting action word, and you have the triple.", "examTip": "Whatever new sentence is given, always name the pipeline stage explicitly in your answer (say \"First I apply NER to find...\", \"Then relation classification identifies...\") — examiners award marks for naming each pipeline step, not just producing the final triple.\n\n## MEDIUM PRIORITY QUESTIONS", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q24", "sr": 24, "question": "Convert given natural language statements into First Order Predicate Logic (FOPL).", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply formal semantic representation techniques)", "bloomLevel": "Apply", "priority": "med", "priorityLabel": "Medium", "priorityReason": "FOPL conversion is Assignment-1 Q10 (5 statements about students/researchers), reappears in the Jul-2026 mid-sem paper (doctor/patient FOPL) and again in the PAC task Q5 (programmer/Python/project) — a recurring but comparatively narrower-scope question type than Frames/CD/Forward-Chaining.", "easyMeaning": "Convert plain English sentences into formal logic notation using predicates, quantifiers (∀ for \"all\", ∃ for \"some/there exists\"), and logical connectives.", "understandEnMd": "First Order Predicate Logic (FOPL) represents a statement's meaning precisely using: **Predicates** (a property or relation, written like a function, e.g. Student(x) means \"x is a student\"), **Quantifiers** (∀x = \"for all x\", ∃x = \"there exists an x such that\"), **Logical connectives** (∧ = AND, ∨ = OR, ¬ = NOT, → = IMPLIES), and **Variables/Constants** (x, y for variables; John, Delhi for specific named constants).\n\n**General conversion method:** 1. Identify the main entities/objects. 2. Identify the properties/relations connecting them (these become predicates). 3. Decide if the statement talks about ALL members of a group (∀) or SOME/AT LEAST ONE member (∃). 4. Combine using ∧/∨/¬/→ as the sentence structure requires.\n\n**Worked example — \"Every student attends some course\":** ∀x (Student(x) → ∃y (Course(y) ∧ Attends(x, y))). Reading: for all x, if x is a student, then there exists a y such that y is a course and x attends y.\n\n**Worked example — \"The doctor treats the patient\" (specific individuals):** Treats(Doctor, Patient) — a simple predicate with no quantifier needed since both are specific named entities.\n\n**Worked example — \"Every programmer works on a project\" (PAC task style):** ∀x (Programmer(x) → ∃y (Project(y) ∧ WorksOn(x, y))).\n\n**Worked example — \"Some researchers publish papers\":** ∃x (Researcher(x) ∧ Publishes(x, Papers)).", "understandGuMd": "First Order Predicate Logic (FOPL) statement ના meaning ને ચોક્કસ રીતે represent કરે: **Predicates** (property/relation, function જેવું લખાય, દા.ત. Student(x) એટલે \"x student છે\"), **Quantifiers** (∀x = \"બધા x માટે\", ∃x = \"એવો x છે કે\"), **Logical connectives** (∧=AND, ∨=OR, ¬=NOT, →=IMPLIES), અને **Variables/Constants** (x,y variables; John, Delhi ચોક્કસ named constants).\n\n**સામાન્ય Conversion Method:** 1. મુખ્ય entities/objects ઓળખો. 2. તેમને જોડતા properties/relations ઓળખો (predicates બને). 3. Statement group ના બધા members વિશે (∀) છે કે કોઈ એક/અમુક member વિશે (∃) છે તે નક્કી કરો. 4. Sentence ની structure પ્રમાણે ∧/∨/¬/→ વાપરીને જોડો.\n\n**Worked example — \"Every student attends some course\":** ∀x (Student(x) → ∃y (Course(y) ∧ Attends(x, y))).\n\n**Worked example — \"The doctor treats the patient\":** Treats(Doctor, Patient) — બંને specific named entities હોવાથી quantifier ની જરૂર નથી.\n\n**Worked example — \"Every programmer works on a project\":** ∀x (Programmer(x) → ∃y (Project(y) ∧ WorksOn(x, y))).\n\n**Worked example — \"Some researchers publish papers\":** ∃x (Researcher(x) ∧ Publishes(x, Papers)).", "oneLine": "FOPL = Predicates + Quantifiers(∀=all, ∃=some) + Connectives(∧∨¬→); \"Every X does Y\" → ∀x(X(x)→...), \"Some X does Y\" → ∃x(X(x)∧...).", "memoryTrick": "\"Every → For-All-then-Implies\"; \"Some → Exists-and-And\" — the connective always matches the quantifier (∀ pairs with →, ∃ pairs with ∧).", "quick10": "FOPL: ∀=all (use with →), ∃=some (use with ∧); wrap relations as Predicate(x,y); combine with ∧/∨/¬.", "quick30": "FOPL formalizes statements using predicates (relations, e.g. Student(x)), quantifiers (∀=for all, ∃=there exists), and connectives (∧,∨,¬,→). The standard pattern: \"Every X is/does Y\" becomes ∀x(X(x)→Y(x)); \"Some X is/does Y\" becomes ∃x(X(x)∧Y(x)). Example: \"Every student attends some course\" → ∀x(Student(x)→∃y(Course(y)∧Attends(x,y))).", "answerEnMd": "First Order Predicate Logic (FOPL) formalizes natural-language statements using **predicates** (relations/properties, e.g. Student(x)), **quantifiers** (∀ = for all, ∃ = there exists), **variables/constants**, and **logical connectives** (∧, ∨, ¬, →).\n\n**Conversion Rule of Thumb:** \"Every/All X ... Y\" → ∀x (X(x) → Y(x)); \"Some/There exists an X ... Y\" → ∃x (X(x) ∧ Y(x)); a statement about two specific named individuals uses a plain predicate with no quantifier, e.g. Relation(Constant1, Constant2).\n\n**Worked Conversions:**\n- \"Every student attends some course\" → ∀x (Student(x) → ∃y (Course(y) ∧ Attends(x, y)))\n- \"Every programmer works on a project\" → ∀x (Programmer(x) → ∃y (Project(y) ∧ WorksOn(x, y)))\n- \"Some researchers publish papers\" → ∃x (Researcher(x) ∧ Publishes(x, Papers))\n- \"The doctor treats the patient\" (specific individuals) → Treats(Doctor, Patient)", "answerGuMd": "First Order Predicate Logic (FOPL) natural-language statements ને **predicates** (relations, દા.ત. Student(x)), **quantifiers** (∀=બધા, ∃=અસ્તિત્વ ધરાવે છે), **variables/constants**, અને **logical connectives** (∧,∨,¬,→) વાપરીને formalize કરે.\n\n**Conversion નિયમ:** \"Every/All X ... Y\" → ∀x (X(x) → Y(x)); \"Some X ... Y\" → ∃x (X(x) ∧ Y(x)); બે specific named individuals વિશે statement plain predicate વાપરે, quantifier વગર.\n\n**Worked Conversions:**\n- \"Every student attends some course\" → ∀x (Student(x) → ∃y (Course(y) ∧ Attends(x, y)))\n- \"Every programmer works on a project\" → ∀x (Programmer(x) → ∃y (Project(y) ∧ WorksOn(x, y)))\n- \"Some researchers publish papers\" → ∃x (Researcher(x) ∧ Publishes(x, Papers))\n- \"The doctor treats the patient\" → Treats(Doctor, Patient)", "mustWrite": ["State the rule of thumb (Every→∀ with →, Some→∃ with ∧) before applying it", "Define every predicate name used (e.g. \"Student(x): x is a student\")", "Convert every statement given, not just one example"], "keywords": ["FOPL", "Predicate", "Quantifier", "Universal (∀)", "Existential (∃)", "Logical Connective"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Reading FOPL out loud always works the same way: ∀x means \"take any x you like\", ∃x means \"there's at least one x\", then the predicates read like a sentence in code, e.g. Student(x)→Attends(x,y) reads \"if x is a student, x attends y\".", "examTip": "Whatever new statement the exam gives, first underline the quantity word (\"every\"/\"all\"/\"some\"/\"a certain\") — that single word tells you whether to use ∀ (paired with →) or ∃ (paired with ∧), which is the single most common mistake students make.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q25", "sr": 25, "question": "Explain Discourse Integration, Anaphora Resolution, and the Hobbs Algorithm with examples.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply discourse-level analysis techniques)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "Discourse Integration/anaphora is a dedicated PPT phase-of-NLP topic, is directly evaluated in the Sep-2025 final (Shyam/bicycle passage), the Hobbs Algorithm is separately named in two different final papers (Nov-2023 and Dec-2024), and the very recent 23-Sep-2026 paper asks TWO separate coreference-resolution questions (\"OpenAI...The AI firm\" and \"students...they\") — making this one of the most consistently-tested Unit-3 topics across time.", "easyMeaning": "Explain how NLP understands meaning ACROSS multiple sentences (not just within one), and specifically how it figures out what a pronoun like \"he\"/\"it\"/\"they\" refers to.", "understandEnMd": "**Discourse Integration** is the phase of NLP that studies how the meaning of one sentence depends on and connects with the sentences before and after it — a text is not just a list of independent sentences, it has a connected structure (topic continuity, cause-effect, elaboration).\n\n**Anaphora Resolution / Coreference Resolution** is the specific sub-task of figuring out what a pronoun or referring expression (he, she, it, they, \"the AI firm\", \"the students\") refers back to (its \"antecedent\") earlier in the discourse.\n\n**Worked example — \"Ram went to the store. He bought milk.\" (PPT):** \"He\" refers back to \"Ram\" (the only prior male person mentioned) — resolved by matching gender/number and by \"Ram\" being the most recent/salient candidate.\n\n**Worked example — \"OpenAI released its latest model yesterday. The AI firm announced...\" (23-Sep-2026 paper):** \"The AI firm\" is a coreferring expression (not a pronoun but a descriptive re-mention) that refers back to \"OpenAI\" — resolved using world knowledge (OpenAI IS an AI firm) plus discourse recency.\n\n**Worked example — \"The students studied diligently for their exams and they aced them.\" (23-Sep-2026 paper):** \"they\" refers back to \"The students\" (matches plural number and is the most salient preceding noun phrase); \"them\" refers back to \"their exams\".\n\n**The Hobbs Algorithm** is a classic syntax-based, rule-driven algorithm for pronoun resolution: it walks UP the parse tree from the pronoun to the root, then does a **breadth-first, left-to-right search** through each preceding sentence's parse tree (starting with the current sentence, then the immediately preceding one, and so on), proposing the first noun phrase encountered that agrees in gender and number with the pronoun as the antecedent.", "understandGuMd": "**Discourse Integration** એ NLP નો phase છે જે એક sentence નું meaning તેની આગળ-પાછળ ના sentences પર કેવી રીતે આધાર રાખે અને જોડાય તે study કરે — text એ independent sentences ની list નથી, તેમાં connected structure (topic continuity, cause-effect, elaboration) હોય છે.\n\n**Anaphora Resolution / Coreference Resolution** એ specific sub-task છે — pronoun કે referring expression (he, she, it, they, \"the AI firm\", \"the students\") discourse માં પહેલા આવેલા કયા શબ્દ (antecedent) ને refer કરે છે તે શોધવાનું.\n\n**Worked example — \"Ram went to the store. He bought milk.\" (PPT):** \"He\" પાછળ \"Ram\" ને refer કરે (gender/number match અને most recent/salient candidate હોવાથી).\n\n**Worked example — \"OpenAI released its latest model yesterday. The AI firm announced...\" (23-Sep-2026 paper):** \"The AI firm\" (pronoun નહીં પણ descriptive re-mention) \"OpenAI\" ને refer કરે — world knowledge (OpenAI એક AI firm જ છે) અને discourse recency વાપરીને resolve થાય.\n\n**Worked example — \"The students studied diligently for their exams and they aced them.\" (23-Sep-2026 paper):** \"they\" → \"The students\" (plural number match, most salient preceding noun phrase); \"them\" → \"their exams\".\n\n**Hobbs Algorithm** એ classic syntax-based, rule-driven pronoun-resolution algorithm છે: pronoun થી parse tree માં ઉપર root સુધી ચાલે, પછી દરેક પહેલાના sentence ના parse tree માં **breadth-first, left-to-right search** કરે (પહેલા current sentence, પછી તરત પહેલાનું sentence, એમ), pronoun સાથે gender/number match થતો પહેલો noun phrase antecedent તરીકે propose કરે.", "oneLine": "Discourse Integration = meaning across sentences; Anaphora Resolution = finding what a pronoun refers to; Hobbs Algorithm = syntax-tree-based search for the antecedent.", "memoryTrick": "\"Hobbs Hops Up then Hunts Left-to-Right\" — up the tree, then breadth-first left-to-right through earlier sentences.", "quick10": "Discourse Integration links sentence meanings together; anaphora resolution finds a pronoun's antecedent; Hobbs Algorithm does this via a syntax-tree walk-up + breadth-first left-to-right search.", "quick30": "Discourse Integration studies how sentence meanings connect across a text. Anaphora/Coreference Resolution finds what a pronoun or referring phrase refers back to, using gender/number agreement, recency, and world knowledge (e.g. \"he\"→Ram, \"The AI firm\"→OpenAI, \"they\"→the students). The Hobbs Algorithm formalizes this: walk up the parse tree from the pronoun to the sentence root, then search each preceding sentence's tree breadth-first, left-to-right, proposing the first agreeing noun phrase as antecedent.", "answerEnMd": "**Discourse Integration** is the NLP phase concerned with how the meaning of individual sentences combines into the overall meaning of a connected text, capturing relationships like topic continuity and cause-effect across sentence boundaries.\n\n**Anaphora/Coreference Resolution** is the task of identifying the antecedent (the earlier-mentioned entity) that a pronoun or referring expression points to.\n\n**Worked Examples:**\n- \"Ram went to the store. He bought milk.\" → \"He\" = Ram (gender/number match, most recent candidate).\n- \"OpenAI released its latest model yesterday. The AI firm announced...\" → \"The AI firm\" = OpenAI (resolved via world knowledge + recency, not a pronoun but a descriptive coreference).\n- \"The students studied diligently for their exams and they aced them.\" → \"they\" = the students; \"them\" = their exams.\n\n**The Hobbs Algorithm** is a syntax-based rule algorithm for pronoun resolution: starting at the pronoun's node in the parse tree, it walks upward to the root; at each node passed, it performs a breadth-first, left-to-right search of the subtree to its left for a candidate noun phrase agreeing in gender/number; if none is found in the current sentence's tree, it repeats this walk-and-search process on the immediately preceding sentence, and so on, proposing the first matching noun phrase found as the antecedent.", "answerGuMd": "**Discourse Integration** એ NLP phase છે જે individual sentences ના meaning એકંદર connected text ના meaning માં કેવી રીતે ભળે તે જુએ છે, sentence boundaries ને પાર topic continuity, cause-effect જેવા સંબંધો પકડે છે.\n\n**Anaphora/Coreference Resolution** pronoun કે referring expression જે antecedent (પહેલા mention થયેલ entity) ને point કરે તેને ઓળખવાનું task છે.\n\n**Worked Examples:**\n- \"Ram went to the store. He bought milk.\" → \"He\" = Ram.\n- \"OpenAI released its latest model yesterday. The AI firm announced...\" → \"The AI firm\" = OpenAI.\n- \"The students studied diligently for their exams and they aced them.\" → \"they\" = the students; \"them\" = their exams.\n\n**Hobbs Algorithm** pronoun-resolution માટે syntax-based rule algorithm છે: pronoun ના node થી parse tree માં root સુધી ઉપર જાય; દરેક node પર, gender/number match થતો candidate noun phrase શોધવા ડાબી બાજુ ના subtree માં breadth-first, left-to-right search કરે; current sentence માં ના મળે તો તરત પહેલાના sentence પર આ જ process repeat કરે, જ્યાં સુધી પહેલો match મળે ત્યાં સુધી.", "mustWrite": ["Define Discourse Integration AND Anaphora Resolution separately (they are related but distinct)", "Give at least one worked pronoun-resolution example with a clear reason (gender/number/recency)", "If asked, name and briefly describe the Hobbs Algorithm's tree-walk method"], "keywords": ["Discourse Integration", "Anaphora Resolution", "Coreference", "Antecedent", "Hobbs Algorithm"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Anaphora resolution is detective work: a pronoun like \"he\" or \"they\" is a clue, and you look backward through the text for the most recent matching suspect (person/thing) that fits the gender and number of the clue.", "examTip": "Whenever a passage gives a pronoun or a descriptive re-mention (\"the AI firm\", \"the company\"), explicitly state your resolution AND your reason (e.g. \"'they' refers to 'the students' because it is plural and the most recently mentioned plural noun phrase\") — examiners specifically look for the justification, not just the answer.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q26", "sr": 26, "question": "Explain Word Sense Disambiguation (WSD) using the Naive Bayes and Lesk's Algorithm approaches with numerical examples.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply semantic disambiguation techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "WSD is a defined PPT key-terminology topic, is directly tested with a \"bank\" example in the Sep-2025 final for 01CE0718, and the very recent 23-Sep-2026 paper contains TWO full, fully-specified WSD numericals (Naive Bayes and Lesk's Algorithm, both using \"bank\") — the freshest and most numerically rich evidence in the entire course.", "easyMeaning": "Explain how NLP automatically picks the correct MEANING of an ambiguous word (like \"bank\") based on its surrounding context, using two specific methods: Naive Bayes and Lesk's Algorithm.", "understandEnMd": "Word Sense Disambiguation (WSD) is the task of determining which sense (meaning) of an ambiguous word is intended in a given context, when that word has multiple possible meanings (e.g. \"bank\" = financial institution OR river bank).\n\n**Naive Bayes approach:** treats WSD as a classification problem. For each candidate sense S, compute P(S) × P(context words | S) using the (naive) assumption that context words are conditionally independent given the sense; pick the sense with the highest resulting score.\n\n**Worked Numerical — \"The farmer walked along the river bank.\" target word = \"bank\", context words F = {farmer, river}:**\nGiven: Sense1 (Financial): P(S1)=0.7, P(farmer|S1)=0.1, P(river|S1)=0.05. Sense2 (River): P(S2)=0.3, P(farmer|S2)=0.4, P(river|S2)=0.8.\nScore(S1) = P(S1) × P(farmer|S1) × P(river|S1) = 0.7 × 0.1 × 0.05 = **0.0035**.\nScore(S2) = P(S2) × P(farmer|S2) × P(river|S2) = 0.3 × 0.4 × 0.8 = **0.096**.\nSince 0.096 > 0.0035, **Sense2 (River bank) wins**.\n\n**Lesk's Algorithm (Simplified) approach:** compares the dictionary gloss (definition) of each candidate sense against the words in the context sentence, and picks the sense whose gloss has the highest word-overlap count with the context.\n\n**Worked Numerical — \"The company deposited funds in the bank to avoid bankruptcy.\" target word = \"bank\":**\nGiven: Sense1 gloss = \"A financial institution where money is deposited and kept.\" Sense2 gloss = \"Sloping land along the edge of a body of water.\"\nOverlap with context {company, deposited, funds, avoid, bankruptcy}: Sense1 gloss shares the word \"deposited\" → overlap count = 1. Sense2 gloss shares no words with the context → overlap count = 0.\nSince 1 > 0, **Sense1 (Financial institution) wins**. (Limitation: this simplified overlap can miss matches due to word-form mismatches, e.g. \"deposits\" vs \"deposited\" — stemming/lemmatization is usually applied first to reduce this problem.)", "understandGuMd": "Word Sense Disambiguation (WSD) એ task છે જ્યાં ambiguous શબ્દ (દા.ત. \"bank\" = financial institution અથવા river bank) નો કયો sense (meaning) આપેલા context માં intended છે તે નક્કી કરવાનું.\n\n**Naive Bayes approach:** WSD ને classification problem તરીકે treat કરે. દરેક candidate sense S માટે P(S) × P(context words | S) compute કરે (context words sense આપતાં conditionally independent છે એવી naive assumption સાથે); સૌથી વધુ score ધરાવતો sense પસંદ કરે.\n\n**Worked Numerical — \"The farmer walked along the river bank.\" target = \"bank\", context F = {farmer, river}:**\nGiven: Sense1 (Financial): P(S1)=0.7, P(farmer|S1)=0.1, P(river|S1)=0.05. Sense2 (River): P(S2)=0.3, P(farmer|S2)=0.4, P(river|S2)=0.8.\nScore(S1) = 0.7 × 0.1 × 0.05 = **0.0035**.\nScore(S2) = 0.3 × 0.4 × 0.8 = **0.096**.\n0.096 > 0.0035 હોવાથી, **Sense2 (River bank) જીતે**.\n\n**Lesk's Algorithm (Simplified) approach:** દરેક candidate sense ના dictionary gloss (definition) ને context sentence ના શબ્દો સાથે compare કરે, જે gloss નો context સાથે સૌથી વધુ word-overlap હોય તે sense પસંદ કરે.\n\n**Worked Numerical — \"The company deposited funds in the bank to avoid bankruptcy.\" target = \"bank\":**\nGiven: Sense1 gloss = \"A financial institution where money is deposited and kept.\" Sense2 gloss = \"Sloping land along the edge of a body of water.\"\nContext {company, deposited, funds, avoid, bankruptcy} સાથે overlap: Sense1 gloss \"deposited\" share કરે → overlap = 1. Sense2 gloss કંઈ share નથી કરતું → overlap = 0.\n1 > 0 હોવાથી, **Sense1 (Financial institution) જીતે**. (Limitation: word-form mismatch જેમ કે \"deposits\" vs \"deposited\" ને લીધે overlap ચૂકી શકાય — સામાન્ય રીતે પહેલા stemming/lemmatization લગાવાય.)", "oneLine": "Naive Bayes WSD: pick sense with highest P(sense)×P(context|sense); Lesk's: pick sense whose dictionary gloss shares the most words with context.", "memoryTrick": "\"Bayes multiplies, Lesk overlaps\" — Naive Bayes = multiply probabilities; Lesk = count overlapping words with the gloss.", "quick10": "Naive Bayes WSD: Score(sense)=P(sense)×∏P(context word|sense), pick max. Lesk's: pick sense whose gloss shares most words with context.", "quick30": "WSD picks the correct meaning of an ambiguous word from context. Naive Bayes WSD computes Score(S)=P(S)×P(context words|S) for each sense and picks the max — e.g. for \"river bank\" context, Score(Financial)=0.7×0.1×0.05=0.0035 vs Score(River)=0.3×0.4×0.8=0.096, so River sense wins. Lesk's Algorithm instead compares each sense's dictionary gloss to the context words and picks the sense with the most word overlap — e.g. \"bank...deposited...bankruptcy\" overlaps 1 word (\"deposited\") with the Financial gloss and 0 with the River gloss, so Financial sense wins.", "answerEnMd": "Word Sense Disambiguation (WSD) selects the correct sense of an ambiguous word (e.g. \"bank\") based on its surrounding context, using statistical or knowledge-based methods.\n\n**Naive Bayes Method:** Score(Sense) = P(Sense) × ∏ P(context word | Sense) (assuming context words are conditionally independent given the sense); choose the sense with the highest score.\n\n**Worked Numerical — target \"bank\" in \"The farmer walked along the river bank.\", context = {farmer, river}:**\nGiven: P(S1=Financial)=0.7, P(farmer|S1)=0.1, P(river|S1)=0.05; P(S2=River)=0.3, P(farmer|S2)=0.4, P(river|S2)=0.8.\nScore(S1) = 0.7 × 0.1 × 0.05 = 0.0035.\nScore(S2) = 0.3 × 0.4 × 0.8 = 0.096.\n**Since Score(S2)=0.096 > Score(S1)=0.0035, the correct sense is S2 (River bank).**\n\n**Lesk's Algorithm (Simplified):** compares each sense's dictionary gloss with the context sentence's words and picks the sense with maximum word overlap.\n\n**Worked Numerical — target \"bank\" in \"The company deposited funds in the bank to avoid bankruptcy.\":**\nSense1 gloss: \"A financial institution where money is deposited and kept.\" → overlaps with context word \"deposited\" → overlap = 1.\nSense2 gloss: \"Sloping land along the edge of a body of water.\" → overlap = 0.\n**Since overlap(S1)=1 > overlap(S2)=0, the correct sense is S1 (Financial institution).**\nLimitation: exact word-form matching can miss valid overlaps (e.g. \"deposits\" vs \"deposited\"); stemming/lemmatization is typically applied beforehand to reduce this issue.", "answerGuMd": "Word Sense Disambiguation (WSD) context ના આધારે ambiguous શબ્દ (દા.ત. \"bank\") નો સાચો sense પસંદ કરે, statistical કે knowledge-based methods વાપરીને.\n\n**Naive Bayes Method:** Score(Sense) = P(Sense) × ∏ P(context word | Sense); સૌથી વધુ score ધરાવતો sense પસંદ કરાય.\n\n**Worked Numerical — \"bank\" in \"The farmer walked along the river bank.\", context={farmer, river}:**\nGiven: P(S1=Financial)=0.7, P(farmer|S1)=0.1, P(river|S1)=0.05; P(S2=River)=0.3, P(farmer|S2)=0.4, P(river|S2)=0.8.\nScore(S1) = 0.7×0.1×0.05 = 0.0035. Score(S2) = 0.3×0.4×0.8 = 0.096.\n**Score(S2)=0.096 > Score(S1)=0.0035 હોવાથી, સાચો sense S2 (River bank) છે.**\n\n**Lesk's Algorithm (Simplified):** દરેક sense ના dictionary gloss ને context sentence ના શબ્દો સાથે compare કરી, સૌથી વધુ word-overlap ધરાવતો sense પસંદ કરાય.\n\n**Worked Numerical — \"bank\" in \"The company deposited funds in the bank to avoid bankruptcy.\":**\nSense1 gloss: \"A financial institution where money is deposited and kept.\" → \"deposited\" સાથે overlap = 1.\nSense2 gloss: \"Sloping land along the edge of a body of water.\" → overlap = 0.\n**overlap(S1)=1 > overlap(S2)=0 હોવાથી, સાચો sense S1 (Financial institution) છે.**\nLimitation: exact word-form matching valid overlap ચૂકી શકે (દા.ત. \"deposits\" vs \"deposited\"); સામાન્ય રીતે પહેલા stemming/lemmatization લગાવાય.", "mustWrite": ["Write the formula (Naive Bayes score / Lesk overlap count) explicitly before substituting numbers", "Show the full multiplication/overlap-counting arithmetic, not just the final numbers", "State the winning sense clearly with a comparison (X > Y therefore...)"], "keywords": ["Word Sense Disambiguation", "Naive Bayes", "Lesk's Algorithm", "Gloss", "Context Window"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "**Given:** Naive Bayes — Sense1(Financial): P=0.7, P(farmer|S1)=0.1, P(river|S1)=0.05; Sense2(River): P=0.3, P(farmer|S2)=0.4, P(river|S2)=0.8. Lesk — Sense1 gloss=\"financial institution...deposited...\"; Sense2 gloss=\"sloping land...water\"; context contains \"deposited\".\n**Formula:** Naive Bayes: Score(S)=P(S)×∏P(word|S). Lesk: pick sense with max gloss-context word overlap count.\n**Step 1:** Naive Bayes Score(S1) = 0.7 × 0.1 × 0.05 = 0.0035.\n**Step 2:** Naive Bayes Score(S2) = 0.3 × 0.4 × 0.8 = 0.096.\n**Step 3:** Compare: 0.096 > 0.0035 → River sense wins for Naive Bayes example.\n**Step 4:** Lesk overlap(S1) = 1 (shares \"deposited\"), overlap(S2) = 0.\n**Final Answer:** Naive Bayes example → Sense2 (River) wins with score 0.096. Lesk example → Sense1 (Financial) wins with overlap 1.\n**Exam Writing Format:** Present each method separately with its own formula line, substituted numbers, and a clearly boxed winning sense.", "algorithmMd": "", "explainAgainMd": "Naive Bayes WSD asks \"which meaning makes these surrounding words most likely, multiplied together?\" Lesk's asks \"which meaning's dictionary definition shares the most actual words with the sentence?\" Both are just different ways of using context as evidence.", "examTip": "Whatever new sentence/probabilities the exam gives, always show BOTH the raw multiplication (Naive Bayes) or overlap counting (Lesk) AND the final comparison line — many students lose marks by only writing the final answer without the arithmetic.", "isNumerical": true, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "Naive Bayes — Sense1(Financial): P=0.7, P(farmer|S1)=0.1, P(river|S1)=0.05; Sense2(River): P=0.3, P(farmer|S2)=0.4, P(river|S2)=0.8. Lesk — Sense1 gloss=\"financial institution...deposited...\"; Sense2 gloss=\"sloping land...water\"; context contains \"deposited\".", "formulaMd": "Naive Bayes: Score(S)=P(S)×∏P(word|S). Lesk: pick sense with max gloss-context word overlap count.", "finalAnswerMd": "Naive Bayes example → Sense2 (River) wins with score 0.096. Lesk example → Sense1 (Financial) wins with overlap 1.", "hasFormula": true}, {"id": "q27", "sr": 27, "question": "Explain Textual Coherence and the TextTiling algorithm with worked examples.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Evaluate discourse coherence)", "bloomLevel": "Evaluate", "priority": "high", "priorityLabel": "High", "priorityReason": "The very recent 23-Sep-2026 paper contains a full coherence-contrast question (Passage A vs Passage B) AND a separate, fully-specified TextTiling vocabulary-overlap numerical (Block A vs Block B) — this is fresh, real, and detailed evidence, though it currently appears only in this one (most recent) paper.", "easyMeaning": "Explain what makes a passage \"coherent\" (logically connected) versus incoherent, and how the TextTiling algorithm automatically detects where one topic ends and another begins.", "understandEnMd": "**Textual Coherence** refers to whether the sentences of a passage are logically and meaningfully connected to each other (through shared topics, cause-effect, pronoun reference, etc.
