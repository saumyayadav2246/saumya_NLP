and emission probabilities straight from the tables, exactly like the two path-probability calculations shown above.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": true, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q36", "sr": 36, "question": "Apply the Viterbi Algorithm to find the most likely POS-tag sequence for \"The dog barks\" (fully specified 2-state HMM).", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply HMM Viterbi decoding)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is Assignment-2 Q5, and unlike the \"Book the flight\" question (Q4 in the same assignment), ALL initial, transition, and emission probabilities needed are fully and completely specified in the source, making it a rich, completely solvable, high-value numerical.", "easyMeaning": "Given complete initial/transition/emission probability tables for a 2-tag (Noun/Verb) HMM, use the Viterbi algorithm to tag \"The dog barks\" word by word.", "understandEnMd": "With only 2 possible tags (N, V), the Viterbi table has 2 rows (one per tag) and 3 columns (one per word). At each word, for each tag, compute the best score = (best incoming score from the previous word's tags × transition probability) × emission probability of the current word given the current tag, keeping track of which previous tag gave the best score (the backpointer).\n\n**Given:** Initial: P(N)=0.6, P(V)=0.4. Transition: P(N|N)=0.4, P(V|N)=0.6, P(N|V)=0.7, P(V|V)=0.3. Emission: P(The|N)=0.1, P(The|V)=0.05; P(dog|N)=0.7, P(dog|V)=0.1; P(barks|N)=0.1, P(barks|V)=0.6.\n\n**Step 1 (\"The\"):** v1(N) = P(N) × P(The|N) = 0.6 × 0.1 = 0.06. v1(V) = P(V) × P(The|V) = 0.4 × 0.05 = 0.02.\n\n**Step 2 (\"dog\"):** v2(N) = max(v1(N)×P(N|N), v1(V)×P(N|V)) × P(dog|N) = max(0.06×0.4=0.024, 0.02×0.7=0.014) × 0.7 = 0.024 × 0.7 = **0.0168** (best path came from N). v2(V) = max(v1(N)×P(V|N), v1(V)×P(V|V)) × P(dog|V) = max(0.06×0.6=0.036, 0.02×0.3=0.006) × 0.1 = 0.036 × 0.1 = **0.0036** (best path came from N).\n\n**Step 3 (\"barks\"):** v3(N) = max(v2(N)×P(N|N), v2(V)×P(N|V)) × P(barks|N) = max(0.0168×0.4=0.00672, 0.0036×0.7=0.00252) × 0.1 = 0.00672 × 0.1 = **0.000672** (from N). v3(V) = max(v2(N)×P(V|N), v2(V)×P(V|V)) × P(barks|V) = max(0.0168×0.6=0.01008, 0.0036×0.3=0.00108) × 0.6 = 0.01008 × 0.6 = **0.006048** (from N).\n\n**Final step:** compare v3(N)=0.000672 vs v3(V)=0.006048 — V is larger, so the sequence ends in V. **Backtrack:** barks=V (from N) → dog=N (from N) → The=N. **Most likely tag sequence: The/N, dog/N, barks/V, with final probability 0.006048.**", "understandGuMd": "ફક્ત 2 tags (N, V) હોવાથી, Viterbi table માં 2 rows (દરેક tag માટે) અને 3 columns (દરેક શબ્દ માટે) હોય. દરેક શબ્દ પર, દરેક tag માટે, best score = (પાછલા શબ્દ ના tags માંથી best incoming score × transition probability) × current tag આપેલ current word ની emission probability, અને કયા પાછલા tag એ best score આપ્યો તે (backpointer) યાદ રાખો.\n\n**Given:** Initial: P(N)=0.6, P(V)=0.4. Transition: P(N|N)=0.4, P(V|N)=0.6, P(N|V)=0.7, P(V|V)=0.3. Emission: P(The|N)=0.1, P(The|V)=0.05; P(dog|N)=0.7, P(dog|V)=0.1; P(barks|N)=0.1, P(barks|V)=0.6.\n\n**Step 1 (\"The\"):** v1(N) = 0.6×0.1 = 0.06. v1(V) = 0.4×0.05 = 0.02.\n\n**Step 2 (\"dog\"):** v2(N) = max(0.06×0.4, 0.02×0.7)×0.7 = max(0.024,0.014)×0.7 = 0.024×0.7 = **0.0168** (N થી). v2(V) = max(0.06×0.6, 0.02×0.3)×0.1 = max(0.036,0.006)×0.1 = 0.036×0.1 = **0.0036** (N થી).\n\n**Step 3 (\"barks\"):** v3(N) = max(0.0168×0.4, 0.0036×0.7)×0.1 = max(0.00672,0.00252)×0.1 = 0.00672×0.1 = **0.000672** (N થી). v3(V) = max(0.0168×0.6, 0.0036×0.3)×0.6 = max(0.01008,0.00108)×0.6 = 0.01008×0.6 = **0.006048** (N થી).\n\n**Final:** v3(V)=0.006048 > v3(N)=0.000672 — V મોટું. **Backtrack:** barks=V(N થી) → dog=N(N થી) → The=N. **સૌથી likely tag sequence: The/N, dog/N, barks/V, final probability 0.006048.**", "oneLine": "Viterbi table for \"The dog barks\": v1(N)=0.06,v1(V)=0.02 → v2(N)=0.0168,v2(V)=0.0036 → v3(N)=0.000672,v3(V)=0.006048 → best path N-N-V, prob=0.006048.", "memoryTrick": "At every step, only 2 numbers per tag to compare — always keep the bigger one and remember where it came from.", "quick10": "\"The dog barks\" Viterbi (N/V tags): best path = N,N,V with final probability 0.006048 (all intermediate best-paths trace back through N).", "quick30": "For \"The dog barks\" with 2-tag HMM (Initial P(N)=0.6/P(V)=0.4; Transitions P(N|N)=0.4,P(V|N)=0.6,P(N|V)=0.7,P(V|V)=0.3; Emissions given for all 3 words×2 tags), the Viterbi table gives: v1(N)=0.06, v1(V)=0.02; v2(N)=0.0168 (via N), v2(V)=0.0036 (via N); v3(N)=0.000672 (via N), v3(V)=0.006048 (via N). Since v3(V) is largest, backtrack gives tag sequence N-N-V (The=Noun, dog=Noun, barks=Verb) with final probability 0.006048.", "answerEnMd": "Applying the Viterbi Algorithm to \"The dog barks\" with tags {N, V}:\n\n| Word | v(N) | v(V) |\n|---|---|---|\n| The | 0.6×0.1 = 0.06 | 0.4×0.05 = 0.02 |\n| dog | max(0.06×0.4, 0.02×0.7)×0.7 = 0.0168 (←N) | max(0.06×0.6, 0.02×0.3)×0.1 = 0.0036 (←N) |\n| barks | max(0.0168×0.4, 0.0036×0.7)×0.1 = 0.000672 (←N) | max(0.0168×0.6, 0.0036×0.3)×0.6 = 0.006048 (←N) |\n\nSince v3(V) = 0.006048 > v3(N) = 0.000672, the final tag is V. Backtracking through the stored backpointers (all of which point to N): **The best tag sequence is The/Noun, dog/Noun, barks/Verb, with overall probability 0.006048.**", "answerGuMd": "\"The dog barks\" પર Viterbi Algorithm લગાવતા, tags {N, V} સાથે:\n\n| શબ્દ | v(N) | v(V) |\n|---|---|---|\n| The | 0.06 | 0.02 |\n| dog | 0.0168 (←N) | 0.0036 (←N) |\n| barks | 0.000672 (←N) | 0.006048 (←N) |\n\nv3(V)=0.006048 > v3(N)=0.000672 હોવાથી, final tag V છે. Backpointers (બધા N તરફ) થી backtrack કરતાં: **Best tag sequence: The/Noun, dog/Noun, barks/Verb, overall probability 0.006048.**", "mustWrite": ["Draw the complete Viterbi table with all 6 computed values (2 tags × 3 words)", "Show the max() comparison explicitly at each cell, not just the final chosen value", "Backtrack and state the final tag sequence AND its final probability"], "keywords": ["Viterbi Algorithm", "HMM", "POS Tagging", "Backpointer", "Dynamic Programming"], "diagramMd": "A 2-row (N,V) × 3-column (The,dog,barks) trellis grid, with each cell showing its probability value and an arrow pointing back to the previous cell that produced it.", "howToDrawMd": "1. Draw a grid with 2 rows labeled N and V, and 3 columns labeled The/dog/barks. 2. Fill in each cell's computed value. 3. Draw a small backpointer arrow from each cell to the previous-column cell that gave it its max. 4. Circle the largest value in the last column and trace the arrows back to read off the final answer.\n**Exam Writing Format:** Present the full table, all arithmetic shown, backtracked path stated as a sentence (\"The=Noun, dog=Noun, barks=Verb\") with the final probability value boxed.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Just like a GPS recalculating the best route at every intersection, Viterbi recalculates the \"best route so far\" at every word, only keeping the winning path into each tag — by the last word, tracing backward from the biggest final number gives the answer.", "examTip": "Always compute BOTH v(N) and v(V) at every single word, even though only one will \"win\" at the end — partial marks are given for correct intermediate table values even if the final backtrack has an error.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q37", "sr": 37, "question": "Attempt the Viterbi Algorithm for \"Book the flight\" (N/V/D tags) and identify what data is missing to complete it.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply HMM Viterbi decoding; evaluate data completeness)", "bloomLevel": "Apply", "priority": "med", "priorityLabel": "Medium", "priorityReason": "This is Assignment-2 Q4, a real assigned question, but the source data itself is genuinely incomplete (no transition probabilities are given for what follows a Verb, and no emission probability for \"the\" as anything other than Determiner) — it is included at MEDIUM priority specifically to teach the honest, correct way to handle an underspecified numerical rather than to present a fabricated final number.", "easyMeaning": "Try to solve a Viterbi POS-tagging problem with the given probabilities, and clearly identify exactly which values are missing from the question that would be needed to fully complete it.", "understandEnMd": "**Given (from Assignment-2 Q4):** Sentence: \"Book the flight\", tags {N, V, D}. Initial: P(N)=0.4, P(V)=0.3, P(D)=0.3. Transition: P(N|D)=0.6, P(V|D)=0.3 (transitions OUT of D); P(N|N)=0.3, P(V|N)=0.5 (transitions OUT of N). Emission: P(book|N)=0.2, P(book|V)=0.5; P(the|D)=0.8; P(flight|N)=0.6, P(flight|V)=0.2.\n\n**What CAN be computed:** Step 1 (\"Book\"): v1(N) = P(N)×P(book|N) = 0.4×0.2 = 0.08. v1(V) = P(V)×P(book|V) = 0.3×0.5 = 0.15. (v1(D) is not meaningfully computable since P(book|D) is not given, which is linguistically expected since \"book\" is very unlikely to be tagged Determiner.)\n\n**Where the calculation breaks down:** For Step 2 (\"the\"), only P(the|D)=0.8 is given — P(the|N) and P(the|V) are not provided (though linguistically negligible, since \"the\" is essentially always a Determiner). This means tag2 is effectively forced to be D. However, computing v2(D) requires a transition INTO D — specifically **P(D|N) and P(D|V) — and NEITHER is given anywhere in the source.** Only the transitions OUT of D (P(N|D), P(V|D)) and OUT of N (P(N|N), P(V|N)) are provided; the transitions **into D, and all transitions OUT of V (P(N|V), P(V|V), P(D|V)), are simply absent from the assignment's given data.**\n\n**Honest conclusion:** A mathematically complete Viterbi solution cannot be produced from the values given, because the specific transition weights needed to move into the Determiner state are missing. **This is Not available in uploaded material.** However, based on the grammatically obvious tagging (Book=Verb in this imperative context, the=Determiner, flight=Noun) and the fact that the given emissions strongly favor exactly this pattern (P(the|D)=0.8 is the only \"the\" emission given at all, and P(flight|N)=0.6 > P(flight|V)=0.2), the intended/expected answer is almost certainly the tag sequence **V → D → N**, even though its exact numeric path probability cannot be honestly computed without inventing the missing P(D|V) transition value.", "understandGuMd": "**Given (Assignment-2 Q4):** Sentence: \"Book the flight\", tags {N, V, D}. Initial: P(N)=0.4, P(V)=0.3, P(D)=0.3. Transition: P(N|D)=0.6, P(V|D)=0.3; P(N|N)=0.3, P(V|N)=0.5. Emission: P(book|N)=0.2, P(book|V)=0.5; P(the|D)=0.8; P(flight|N)=0.6, P(flight|V)=0.2.\n\n**શું compute કરી શકાય:** Step 1 (\"Book\"): v1(N) = 0.4×0.2 = 0.08. v1(V) = 0.3×0.5 = 0.15.\n\n**ક્યાં calculation અટકે:** Step 2 (\"the\") માટે, ફક્ત P(the|D)=0.8 આપેલ છે — P(the|N) અને P(the|V) આપેલા નથી. એટલે tag2 લગભગ ફરજિયાત D જ હોવો જોઈએ. પણ v2(D) compute કરવા D માં transition INTO જોઈએ — ખાસ કરીને **P(D|N) અને P(D|V) — બંને source માં ક્યાંય આપેલા નથી.** ફક્ત D માંથી OUT (P(N|D), P(V|D)) અને N માંથી OUT (P(N|N), P(V|N)) આપેલા છે; D માં INTO transitions, અને V માંથી બધા OUT transitions (P(N|V), P(V|V), P(D|V)), source ના given data માં ગેરહાજર છે.\n\n**પ્રામાણિક conclusion:** આપેલા values થી mathematically complete Viterbi solution બની ના શકે, કારણ કે Determiner state માં જવા જોઈતા transition weights ગેરહાજર છે. **આ uploaded material માં ઉપલબ્ધ નથી.** પણ, grammatically સ્પષ્ટ tagging (Book=Verb, the=Determiner, flight=Noun) અને આપેલા emissions આ pattern ને જ support કરે છે (P(the|D)=0.8 જ એકમાત્ર \"the\" emission છે, P(flight|N)=0.6 > P(flight|V)=0.2) એ જોતાં, intended answer લગભગ ચોક્કસ **V → D → N** tag sequence જ છે, ભલે તેની ચોક્કસ numeric path probability missing P(D|V) value વગર પ્રામાણિકપણે compute ના થઈ શકે.", "oneLine": "\"Book the flight\" Viterbi: v1(N)=0.08,v1(V)=0.15 computable; but P(D|N)/P(D|V) transitions into D are missing from the source, so the full table can't be honestly completed — expected answer V→D→N by grammar/emission logic.", "memoryTrick": "\"No door INTO D\" — the assignment gives doors OUT of D but never a door IN.", "quick10": "\"Book the flight\" Viterbi: v1(N)=0.08, v1(V)=0.15; P(D|N) and P(D|V) transitions are Not available in uploaded material, so the table can't be fully completed — grammatically expected answer is V-D-N.", "quick30": "For Assignment-2 Q4 (\"Book the flight\", tags N/V/D), v1(N)=0.4×0.2=0.08 and v1(V)=0.3×0.5=0.15 are computable. But \"the\" is only given an emission probability under D (0.8), forcing tag2=D; computing v2(D) needs P(D|N) or P(D|V), neither of which is given anywhere in the source (only P(N|D),P(V|D),P(N|N),P(V|N) are provided). This is Not available in uploaded material, so a fully rigorous Viterbi table cannot be built without inventing a number. The grammatically and emission-wise expected tag sequence is V(Book)→D(the)→N(flight), using P(N|D)=0.6 for the final step, but its exact joint probability cannot be honestly stated.", "answerEnMd": "Using the given data for \"Book the flight\" (tags N/V/D): Step 1 is fully computable: v1(N) = P(N)×P(book|N) = 0.4×0.2 = 0.08; v1(V) = P(V)×P(book|V) = 0.3×0.5 = 0.15.\n\nFor Step 2 (\"the\"), since only P(the|D)=0.8 is given (no P(the|N) or P(the|V)), the second tag must be D. However, the transition probabilities INTO D — P(D|N) and P(D|V) — are **not provided anywhere in the assignment's given data**, making it impossible to compute v2(D) without inventing a value.\n\n**Honest answer:** given the data actually provided, the Viterbi table cannot be fully completed; **the missing transition probabilities (P(D|N), P(D|V), and all of P(*|V)) are Not available in uploaded material.** Based on grammatical structure and the given emission probabilities (P(the|D)=0.8 is the only viable \"the\" emission; P(flight|N)=0.6 exceeds P(flight|V)=0.2), the intended tag sequence is almost certainly **Book=Verb, the=Determiner, flight=Noun**, using the given P(N|D)=0.6 for the final transition — but its exact overall path probability cannot be computed without the missing values, and should not be fabricated.", "answerGuMd": "\"Book the flight\" (tags N/V/D) માટે આપેલા data વાપરીને: Step 1 સંપૂર્ણ computable: v1(N) = 0.4×0.2 = 0.08; v1(V) = 0.3×0.5 = 0.15.\n\nStep 2 (\"the\") માટે, ફક્ત P(the|D)=0.8 આપેલ હોવાથી, બીજો tag D જ હોવો જોઈએ. પણ D માં INTO transition probabilities — P(D|N) અને P(D|V) — assignment ના આપેલા data માં ક્યાંય નથી, જેથી v2(D) compute કરવું invent કર્યા વગર શક્ય નથી.\n\n**પ્રામાણિક જવાબ:** આપેલા data થી Viterbi table સંપૂર્ણ ના બની શકે; **missing transition probabilities (P(D|N), P(D|V), અને બધા P(*|V)) uploaded material માં ઉપલબ્ધ નથી.** Grammatical structure અને આપેલા emission probabilities જોતાં (P(the|D)=0.8 જ એકમાત્ર વ્યવહારુ \"the\" emission; P(flight|N)=0.6 > P(flight|V)=0.2), intended tag sequence લગભગ ચોક્કસ **Book=Verb, the=Determiner, flight=Noun** છે, છેલ્લા transition માટે આપેલ P(N|D)=0.6 વાપરીને — પણ ચોક્કસ overall path probability missing values વગર compute ના થઈ શકે, અને fabricate ના કરવી જોઈએ.", "mustWrite": ["Compute everything that IS computable from the given data (v1(N), v1(V))", "Explicitly name which exact transition probabilities are missing (P(D|N), P(D|V), all P(*|V))", "State the grammatically-expected answer (V→D→N) while being explicit that its exact probability cannot be honestly computed"], "keywords": ["Viterbi Algorithm", "Incomplete Data", "Transition Probability", "POS Tagging", "Missing Values"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "This is like being given a maze with some walls missing from the map — you can walk the first few steps confidently, but at some point the map simply doesn't show which doors exist, so the honest answer is \"here's how far I can go for certain, and here's exactly which piece of information would let me finish.\"", "examTip": "If your actual exam paper gives a similarly incomplete-looking probability table, always show every value you WERE given fully substituted and computed, and explicitly point out any specific missing transition/emission by name — examiners generally give partial/method marks generously for this kind of transparent, correct partial work.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q38", "sr": 38, "question": "Compare Hidden Markov Model (HMM), Maximum Entropy Markov Model (MEMM), and Conditional Random Fields (CRF) for sequence labeling.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Evaluate sequence labeling models)", "bloomLevel": "Evaluate", "priority": "high", "priorityLabel": "High", "priorityReason": "This is a fully dedicated supplementary document topic with a complete comparison table and worked examples for each model, directly supporting sequence-labeling/tagging questions that recur across the course's papers.", "easyMeaning": "Compare three sequence-labeling models (HMM, MEMM, CRF) on how they model probability, what features they can use, and their accuracy/training trade-offs.", "understandEnMd": "**HMM** is a **generative** model that computes the **joint probability** P(words, tags) using only limited features (mainly the current word and previous tag); it optimizes the ENTIRE sequence at once using the Viterbi algorithm, has no label bias problem, but has low training complexity and only moderate accuracy due to its limited feature set. Example: \"Dogs bark loudly\" → hidden states Noun→Verb→Adverb.\n\n**MEMM (Maximum Entropy Markov Model)** is a **discriminative** model that directly computes the **conditional probability** P(tag|word, features) using Maximum Entropy (logistic regression), allowing many rich contextual features (current word, previous word, capitalization, prefix, suffix, digits, hyphen, previous tag) — e.g. for the word \"Apple\" (capitalized, previous word=\"an\", suffix=\"le\"), MEMM predicts Noun. However, MEMM makes LOCAL decisions at each step (normalizing probabilities per-state), causing the **label bias problem** (states with fewer outgoing transitions unfairly get higher probability regardless of the actual observation).\n\n**CRF (Conditional Random Field)** is also **discriminative** but, unlike MEMM, considers the **entire sequence globally** (undirected graphical model) rather than making local per-state decisions, which **eliminates the label bias problem**. Example: \"Ram lives in Delhi.\" → Ram=Person, lives=O, in=O, Delhi=Location, jointly labeled considering neighboring labels and observations together.", "understandGuMd": "**HMM** એક **generative** model છે જે **joint probability** P(words, tags) મર્યાદિત features (મુખ્યત્વે current word અને previous tag) વાપરીને compute કરે; Viterbi algorithm થી આખા sequence ને એકસાથે optimize કરે, label bias problem નથી, પણ training complexity ઓછી અને accuracy moderate (મર્યાદિત features ને લીધે). Example: \"Dogs bark loudly\" → hidden states Noun→Verb→Adverb.\n\n**MEMM (Maximum Entropy Markov Model)** **discriminative** model છે જે Maximum Entropy (logistic regression) વાપરીને સીધો **conditional probability** P(tag|word, features) compute કરે, ઘણા rich contextual features (current word, previous word, capitalization, prefix, suffix, digits, hyphen, previous tag) allow કરે — દા.ત. \"Apple\" શબ્દ (capitalized, previous word=\"an\", suffix=\"le\") માટે MEMM Noun predict કરે. પણ MEMM દરેક step પર LOCAL decisions લે (per-state normalize), જેનાથી **label bias problem** થાય.\n\n**CRF (Conditional Random Field)** પણ **discriminative** છે પણ, MEMM થી અલગ, **આખા sequence ને globally** ધ્યાનમાં લે (undirected graphical model), local per-state decisions ને બદલે, જે **label bias problem દૂર કરે**. Example: \"Ram lives in Delhi.\" → Ram=Person, lives=O, in=O, Delhi=Location, neighboring labels/observations ધ્યાનમાં લઈને jointly label થાય.", "oneLine": "HMM=generative/joint/no label bias/moderate accuracy; MEMM=discriminative/conditional/local/label bias/high accuracy; CRF=discriminative/conditional/global/no label bias/very high accuracy.", "memoryTrick": "\"HMM joins, MEMM guesses locally (biased), CRF sees globally (unbiased).\"", "quick10": "HMM=generative,joint,no bias,moderate acc. MEMM=discriminative,conditional,local,HAS label bias,high acc. CRF=discriminative,conditional,global,no bias,very high acc.", "quick30": "HMM (generative, models joint P(words,tags), limited features, optimizes globally via Viterbi, no label bias, moderate accuracy) vs MEMM (discriminative, models conditional P(tag|features), rich features, but makes LOCAL per-state decisions causing the label bias problem, higher accuracy) vs CRF (discriminative, conditional, rich features, but optimizes the WHOLE sequence globally like HMM, eliminating label bias, highest accuracy but most expensive to train). Applications: HMM→POS/speech, MEMM→POS/chunking, CRF→NER/POS/information extraction.", "answerEnMd": "**HMM** is a generative model computing the joint probability P(words,tags) using limited features; it optimizes the entire sequence via Viterbi, avoiding label bias, but has only moderate accuracy.\n\n**MEMM** is a discriminative model computing P(tag|word,rich features) via Maximum Entropy, supporting many contextual features, but makes local per-state decisions, causing the **label bias problem** (states with fewer outgoing transitions are unfairly favored).\n\n**CRF** is also discriminative and supports rich features like MEMM, but — like HMM — optimizes over the entire sequence globally (as an undirected graphical model), which eliminates the label bias problem while retaining MEMM's feature richness, giving the highest accuracy at the cost of the highest training complexity.", "answerGuMd": "**HMM** generative model છે જે limited features વાપરીને joint probability P(words,tags) compute કરે; Viterbi થી આખા sequence ને optimize કરે, label bias નથી, પણ accuracy moderate.\n\n**MEMM** discriminative model છે જે Maximum Entropy વાપરીને P(tag|word, rich features) compute કરે, ઘણા contextual features support કરે, પણ local per-state decisions લે, જેનાથી **label bias problem** થાય.\n\n**CRF** પણ discriminative છે અને MEMM જેવા rich features support કરે, પણ — HMM ની જેમ — આખા sequence ને globally optimize કરે (undirected graphical model), જે label bias problem દૂર કરે અને MEMM ની feature richness જાળવે, સૌથી વધુ accuracy આપે પણ training complexity પણ સૌથી વધુ.", "mustWrite": ["Correctly classify each model as generative or discriminative", "Explicitly name and explain the \"label bias problem\" and which model(s) suffer from it", "Present the comparison as a table covering at least Model Type, Probability Mode, Label Bias, Accuracy"], "keywords": ["HMM", "MEMM", "CRF", "Generative Model", "Discriminative Model", "Label Bias Problem"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "(ઉપર પ્રમાણે)", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "HMM looks at the whole picture but with a small toolkit (limited features). MEMM has a big toolkit (rich features) but decides one step at a time, so it can be tricked by \"quiet\" states with few options. CRF has the big toolkit AND looks at the whole picture, so it avoids MEMM's trap — the trade-off is that CRF training takes the most computation.", "examTip": "Whenever a new comparison of these 3 models is asked, always explicitly use the term \"label bias problem\" and state which model(s) have it (MEMM: yes; HMM and CRF: no) — this specific term is a key grading checkpoint in Evaluate-level questions.\n\n## MEDIUM PRIORITY QUESTIONS", "isNumerical": false, "isDiagram": false, "isComparison": true, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q39", "sr": 39, "question": "Explain Minimum Edit Distance (Levenshtein Distance) and compute it for given word pairs.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO2", "coNote": "CO2 / CO4 (Apply string-similarity and error-correction techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "Minimum Edit Distance / Levenshtein Distance is asked in nearly every real paper sampled — the Jul-2026 mid-sem for 01AI0702 (\"Here\"→\"hear\" with explicit costs), the Sep-2025 final for 01AI0702 (\"Horse\"→\"rose\" and \"kitten\"→\"sitten\"), the Winter-2021 final (\"believe\"→\"belieev\"), plus conceptual short-answer versions in the Nov-2023 and Dec-2024 finals — making it one of the single most consistently and repeatedly examined numericals in the entire course.", "easyMeaning": "Explain how to measure the minimum number of edit operations (insert/delete/substitute) needed to turn one word into another, and compute it for the specific word pairs the exam gives.", "understandEnMd": "**Minimum Edit Distance** (also called **Levenshtein Distance**) is the minimum number of single-character operations — **Insertion**, **Deletion**, and **Substitution** — required to transform one string into another. It is computed using a **dynamic-programming table** D, where D[i][j] = edit distance between the first i characters of the source and the first j characters of the target: D[i][0]=i, D[0][j]=j, and for each cell, D[i][j] = min( D[i-1][j] + deletion_cost, D[i][j-1] + insertion_cost, D[i-1][j-1] + (0 if characters match else substitution_cost) ). Applications: spelling correction, DNA sequence alignment, plagiarism detection.\n\n**Worked Example 1 — \"Here\" → \"hear\" (costs: insertion=1, deletion=1, substitution=2, as specified by the exam):** Building the DP table gives a final distance of **2**, achieved by matching \"h\" and \"e\", then **inserting** \"a\" and **deleting** the trailing \"e\" (h-e-[+a]-r-[-e] → h,e,a,r = \"hear\"). Total cost = 1(insertion) + 1(deletion) = **2**.\n\n**Worked Example 2 — \"Horse\" → \"rose\" (standard costs, all operations = 1, as no other cost scheme is specified):** The optimal alignment is: **substitute** 'h'→'r', keep 'o', **delete** 'r', keep 's', keep 'e' (giving r,o,s,e = \"rose\"). Total cost = 1(substitution) + 1(deletion) = **2**.\n\n**Worked Example 3 — \"kitten\" → \"sitten\" (standard costs):** Only the first letter differs (k vs s); all other letters (i,t,t,e,n) already match in the same positions. This needs exactly one **substitution** ('k'→'s'). **Distance = 1.**\n\n**Worked Example 4 — \"believe\" → \"belieev\" (standard costs):** \"believe\" = b,e,l,i,e,v,e and \"belieev\" = b,e,l,i,e,e,v — the first 5 letters (b,e,l,i,e) already match; the remaining letters are \"ve\" in the source vs \"ev\" in the target — an adjacent-letter-swap pattern. Since Levenshtein distance has no special \"transposition\" operation (only insert/delete/substitute), this is resolved as: keep 'v', **substitute** the next character, and reconcile the final letter — the optimal alignment achieves this with 2 operations (e.g. substitute the 6th character 'v'→'e' and substitute the 7th character 'e'→'v'). **Distance = 2.**", "understandGuMd": "**Minimum Edit Distance** (**Levenshtein Distance**) એ એક string ને બીજામાં બદલવા જોઈતા ન્યૂનતમ single-character operations — **Insertion**, **Deletion**, **Substitution** — ની સંખ્યા છે. **Dynamic-programming table** D વાપરીને ગણાય: D[i][j] = source ના પહેલા i characters અને target ના પહેલા j characters વચ્ચેનું edit distance: D[i][0]=i, D[0][j]=j, અને દરેક cell માટે D[i][j] = min( D[i-1][j] + deletion cost, D[i][j-1] + insertion cost, D[i-1][j-1] + (0 જો characters match થાય, નહીં તો substitution cost) ). Applications: spelling correction, DNA sequence alignment, plagiarism detection.\n\n**Worked Example 1 — \"Here\" → \"hear\" (costs: insertion=1, deletion=1, substitution=2, exam એ આપેલા):** DP table final distance **2** આપે, \"h\",\"e\" match કરીને, પછી \"a\" **insert** કરીને અને છેલ્લો \"e\" **delete** કરીને. Total cost = 1(insertion) + 1(deletion) = **2**.\n\n**Worked Example 2 — \"Horse\" → \"rose\" (standard costs, બધા operations = 1):** Optimal alignment: 'h'→'r' **substitute**, 'o' રાખો, 'r' **delete**, 's' રાખો, 'e' રાખો (r,o,s,e = \"rose\" મળે). Total cost = 1(substitution) + 1(deletion) = **2**.\n\n**Worked Example 3 — \"kitten\" → \"sitten\" (standard costs):** ફક્ત પહેલો letter અલગ (k vs s); બાકીના (i,t,t,e,n) સરખા position માં જ છે. ફક્ત એક **substitution** ('k'→'s') જોઈએ. **Distance = 1.**\n\n**Worked Example 4 — \"believe\" → \"belieev\" (standard costs):** પહેલા 5 letters (b,e,l,i,e) match થાય છે; બાકીના letters source માં \"ve\" અને target માં \"ev\" — adjacent-letter-swap pattern. Levenshtein માં transposition operation નથી (ફક્ત insert/delete/substitute), એટલે 2 operations (6ठा character 'v'→'e' substitute અને 7ठा character 'e'→'v' substitute) થી ઉકેલાય. **Distance = 2.**", "oneLine": "Minimum Edit Distance = min operations (insert/delete/substitute) to transform one string into another, computed via DP table D[i][j].", "memoryTrick": "\"IDS\" — Insert, Delete, Substitute — the only 3 allowed moves in Levenshtein distance.", "quick10": "Edit distance = min insert/delete/substitute ops via DP; \"Here\"→\"hear\"=2 (ins+del, costs 1/1/2); \"Horse\"→\"rose\"=2 (sub+del); \"kitten\"→\"sitten\"=1 (sub); \"believe\"→\"belieev\"=2 (2 subs).", "quick30": "Minimum Edit Distance (Levenshtein) computes the minimum-cost sequence of insertions, deletions, and substitutions to transform a source string into a target string, using a dynamic-programming table D[i][j]=min(D[i-1][j]+del, D[i][j-1]+ins, D[i-1][j-1]+sub-if-mismatch). With costs ins=1/del=1/sub=2: \"Here\"→\"hear\"=2. With standard costs (all=1): \"Horse\"→\"rose\"=2 (substitute h→r, delete r); \"kitten\"→\"sitten\"=1 (substitute k→s); \"believe\"→\"belieev\"=2 (two substitutions to fix the ve/ev swap).", "answerEnMd": "**Minimum Edit Distance (Levenshtein Distance)** is the minimum number of insert/delete/substitute operations needed to convert a source string into a target string, computed via the recurrence: D[i][j] = min(D[i-1][j]+deletion_cost, D[i][j-1]+insertion_cost, D[i-1][j-1]+substitution_cost_if_mismatch), with base cases D[i][0]=i and D[0][j]=j.\n\n**\"Here\"→\"hear\" (ins=1, del=1, sub=2):** Optimal path: match h,e → insert 'a' → match r → delete trailing 'e'. **Distance = 1(insertion) + 1(deletion) = 2.**\n\n**\"Horse\"→\"rose\" (standard costs=1 each):** Optimal path: substitute h→r → match o → delete r → match s → match e. **Distance = 1(substitution) + 1(deletion) = 2.**\n\n**\"kitten\"→\"sitten\" (standard costs):** Only the first letter differs. **Distance = 1 (single substitution k→s).**\n\n**\"believe\"→\"belieev\" (standard costs):** First 5 letters match (b,e,l,i,e); the final \"ve\"/\"ev\" requires 2 substitutions since Levenshtein has no transpose operation. **Distance = 2.**", "answerGuMd": "**Minimum Edit Distance (Levenshtein Distance)** source string ને target string માં convert કરવા જોઈતા ન્યૂનતમ insert/delete/substitute operations, D[i][j] = min(D[i-1][j]+deletion, D[i][j-1]+insertion, D[i-1][j-1]+substitution-if-mismatch) recurrence થી ગણાય, base cases D[i][0]=i, D[0][j]=j.\n\n**\"Here\"→\"hear\" (ins=1, del=1, sub=2):** h,e match → 'a' insert → r match → છેલ્લો 'e' delete. **Distance = 1+1 = 2.**\n\n**\"Horse\"→\"rose\" (standard costs):** h→r substitute → o match → r delete → s match → e match. **Distance = 1+1 = 2.**\n\n**\"kitten\"→\"sitten\" (standard costs):** ફક્ત પહેલો letter અલગ. **Distance = 1 (એક substitution).**\n\n**\"believe\"→\"belieev\" (standard costs):** પહેલા 5 letters match; છેલ્લા \"ve\"/\"ev\" માટે 2 substitutions જોઈએ. **Distance = 2.**", "mustWrite": ["Draw the full DP table (not just the final number) for whichever pair the exam asks", "State which specific operations (insert/delete/substitute) make up the optimal alignment", "Use the EXACT cost scheme the exam specifies (default to 1/1/1 only if the exam gives no costs)"], "keywords": ["Minimum Edit Distance", "Levenshtein Distance", "Insertion", "Deletion", "Substitution", "Dynamic Programming"], "diagramMd": "A grid with the source word's letters down the left side and the target word's letters across the top, each cell showing its computed distance value, with a bolded path traced from top-left to bottom-right showing the optimal sequence of operations.", "howToDrawMd": "1. Write the target word's letters as column headers (with an empty first column). 2. Write the source word's letters as row headers (with an empty first row). 3. Fill row 0 and column 0 with 0,1,2,3... 4. Fill each remaining cell using the minimum-of-3 rule, writing small arrows to show which of the 3 options was chosen. 5. Circle the final bottom-right cell as the answer.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "**Given:** Source/target string pairs: \"Here\"/\"hear\" (costs ins=1,del=1,sub=2), \"Horse\"/\"rose\", \"kitten\"/\"sitten\", \"believe\"/\"belieev\" (standard costs=1 each).\n**Formula:** D[i][j] = min(D[i-1][j]+del_cost, D[i][j-1]+ins_cost, D[i-1][j-1]+sub_cost_if_mismatch); D[i][0]=i×del_cost; D[0][j]=j×ins_cost.\n**Step 1:** Build the table row by row, left to right, filling base-case row/column first.\n**Step 2:** Fill each interior cell using the 3-way minimum rule.\n**Step 3:** The bottom-right cell D[m][n] is the final edit distance.\n**Step 4:** Backtrack from D[m][n] to identify which specific operations formed the optimal path.\n**Final Answer:** \"Here\"→\"hear\"=2; \"Horse\"→\"rose\"=2; \"kitten\"→\"sitten\"=1; \"believe\"→\"belieev\"=2.\n**Exam Writing Format:** Draw the complete m×n grid with row/column labels as the two words' letters, fill every cell, circle the bottom-right answer, and write out the specific edit operations in words below the table.", "algorithmMd": "", "explainAgainMd": "Think of transforming one word into another as editing a document: every letter that's already correct is free, but adding a letter, removing a letter, or replacing a letter each cost something — the total minimum cost to reach the target spelling is the edit distance.", "examTip": "Always check whether the exam specifies custom costs (like \"insertion=1, deletion=1, substitution=2\") before computing — using the wrong cost scheme (e.g. assuming all costs=1 when the exam gave sub=2) is the single most common mistake, and completely changes the final answer.\n\n## HIGH PRIORITY QUESTIONS", "isNumerical": true, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "Source/target string pairs: \"Here\"/\"hear\" (costs ins=1,del=1,sub=2), \"Horse\"/\"rose\", \"kitten\"/\"sitten\", \"believe\"/\"belieev\" (standard costs=1 each).", "formulaMd": "D[i][j] = min(D[i-1][j]+del_cost, D[i][j-1]+ins_cost, D[i-1][j-1]+sub_cost_if_mismatch); D[i][0]=i×del_cost; D[0][j]=j×ins_cost.", "finalAnswerMd": "\"Here\"→\"hear\"=2; \"Horse\"→\"rose\"=2; \"kitten\"→\"sitten\"=1; \"believe\"→\"belieev\"=2.", "hasFormula": true}, {"id": "q40", "sr": 40, "question": "Explain the Bigram Probability calculation method and apply it to a given sentence and reference table.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply N-gram probability estimation)", "bloomLevel": "Apply", "priority": "med", "priorityLabel": "Medium", "priorityReason": "Bigram probability calculation (using a given reference probability table) is asked in multiple real papers (Sep-2025 for 01CE0718 \"the cat\", Dec-2024 \"i want chinese food\", Dec-2022 \"i want chinese food\" again, Winter-2021 \"p(house|the)\") — a recurring question TYPE across many papers, but the exact reference probability tables in these specific papers are embedded as images in the original PDFs and were not captured in extractable text, so this question focuses on the reusable METHOD rather than inventing specific numbers.", "easyMeaning": "Explain the general method for computing a sentence's probability using a bigram table, so the same method can be applied to whatever specific bigram table your exam paper actually shows.", "understandEnMd": "To compute a sentence's probability with a bigram language model, apply the Chain Rule under the bigram Markov Assumption: **P(w1, w2, ..., wn) ≈ P(w1|\\<s\\>) × P(w2|w1) × P(w3|w2) × ... × P(wn|wn-1)**, where `<s>` is a special sentence-start marker and each individual bigram probability P(wi|wi-1) is read directly off the exam's given reference probability table (or computed via MLE = Count(wi-1,wi)/Count(wi-1) if raw counts are given instead of pre-computed probabilities).\n\n**Method, step by step:** 1. Write out the sentence's words in order, prefixed by `<s>`. 2. For each consecutive pair of words, look up (or compute) P(second word | first word) from the given table/corpus. 3. Multiply all these individual bigram probabilities together. 4. The result is the sentence's overall bigram-model probability.\n\n**Important honesty note:** Several real exam papers in the uploaded material (the Sep-2025 \"the cat\" bigram question, and the Dec-2024/Dec-2022 \"i want chinese food\" bigram questions) reference a specific numeric bigram probability table, but that table exists only as an **embedded image** in the original PDF and was not captured as extractable text. **The exact numeric values in those specific reference tables are Not available in uploaded material.** Do NOT substitute generic/textbook bigram numbers you may recall from elsewhere for these specific questions — instead, apply the exact multiplication method shown above directly to whatever table image your actual exam paper displays.\n\n**Fully worked alternative (where the corpus IS given in full, e.g. Assignment-2 Q1):** for corpus {\"I like NLP\", \"I like AI\", \"I love NLP\"}, P(\"I like NLP\") = P(I) × P(like|I) × P(NLP|like) = 1 × 2/3 × 1/2 = **1/3 ≈ 0.333** (see Q30 for the full derivation of these counts).", "understandGuMd": "Bigram language model થી sentence ની probability compute કરવા, bigram Markov Assumption હેઠળ Chain Rule લગાવો: **P(w1, w2, ..., wn) ≈ P(w1|\\<s\\>) × P(w2|w1) × P(w3|w2) × ... × P(wn|wn-1)**, જ્યાં `<s>` sentence-start marker છે અને દરેક bigram probability P(wi|wi-1) exam ના આપેલા reference table માંથી સીધી લેવાય (અથવા raw counts આપેલા હોય તો MLE = Count(wi-1,wi)/Count(wi-1) થી compute કરાય).\n\n**Method, step by step:** 1. Sentence ના શબ્દો ક્રમમાં લખો, `<s>` સાથે prefix કરીને. 2. દરેક consecutive pair માટે, P(બીજો શબ્દ | પહેલો શબ્દ) આપેલા table/corpus માંથી લુક-અપ કરો (અથવા compute કરો). 3. બધી individual bigram probabilities ને multiply કરો. 4. Result એ sentence ની overall bigram-model probability છે.\n\n**મહત્વની પ્રામાણિકતા નોંધ:** uploaded material ના ઘણા real exam papers (Sep-2025 \"the cat\" bigram question, અને Dec-2024/Dec-2022 \"i want chinese food\" bigram questions) એક specific numeric bigram probability table reference કરે છે, પણ એ table original PDF માં ફક્ત **embedded image** તરીકે છે અને extractable text તરીકે capture નથી થયું. **એ specific reference tables ની exact numeric values uploaded material માં ઉપલબ્ધ નથી.** આ specific questions માટે બીજેથી યાદ રહેલા generic/textbook bigram numbers ના વાપરો — તેને બદલે, ઉપર બતાવેલી exact multiplication method તમારા actual exam paper ના આપેલા table image પર સીધી લગાવો.\n\n**Fully worked alternative (જ્યાં corpus પૂરો આપેલો હોય, દા.ત. Assignment-2 Q1):** corpus {\"I like NLP\", \"I like AI\", \"I love NLP\"} માટે, P(\"I like NLP\") = P(I) × P(like|I) × P(NLP|like) = 1 × 2/3 × 1/2 = **1/3 ≈ 0.333**.", "oneLine": "Bigram sentence probability = product of P(each word | previous word), read from the given table or computed via Count(pair)/Count(first word).", "memoryTrick": "\"Chain the pairs\" — multiply P(w2|w1)×P(w3|w2)×... straight down the sentence.", "quick10": "P(sentence) ≈ P(w1)×P(w2|w1)×P(w3|w2)×...; always read/compute each bigram from the EXACT table your exam gives, never from memory of a different example.", "quick30": "Bigram sentence probability = P(w1)×P(w2|w1)×...×P(wn|wn-1), with each factor read from a given reference table or computed as Count(pair)/Count(first word) via MLE. Several real papers (\"the cat\", \"i want chinese food\") reference tables that exist only as images and are not captured in text — for those, state the method clearly and apply it to whatever table the actual paper shows, rather than inventing numbers. Where the full corpus is given directly (Assignment-2 Q1), the calculation is fully solvable: P(\"I like NLP\")=1×2/3×1/2=1/3.", "answerEnMd": "The probability of a sentence under a bigram language model is: **P(w1,...,wn) ≈ P(w1) × P(w2|w1) × P(w3|w2) × ... × P(wn|wn-1)**, where each bigram probability is either read from a given reference table or computed via MLE as Count(wi-1,wi)/Count(wi-1).\n\n**Method:** 1. List the sentence's words in order. 2. For each adjacent pair, obtain P(word2|word1) from the table/corpus. 3. Multiply all factors together for the final sentence probability.\n\n*(Note: the specific bigram probability tables referenced by some real exam questions in the source material — e.g. for \"the cat\" and \"i want chinese food\" — are embedded as images in the original PDFs and their exact numeric values are Not available in uploaded material; apply the method above directly to whatever table your actual exam paper provides.)*\n\n**Fully Solvable Example (Assignment-2 Q1):** Corpus = {\"I like NLP\", \"I like AI\", \"I love NLP\"}. P(\"I like NLP\") = P(I) × P(like|I) × P(NLP|like) = 1 × (2/3) × (1/2) = **1/3 ≈ 0.333**.", "answerGuMd": "Bigram language model હેઠળ sentence ની probability: **P(w1,...,wn) ≈ P(w1) × P(w2|w1) × P(w3|w2) × ... × P(wn|wn-1)**, દરેક bigram probability આપેલા table માંથી અથવા MLE = Count(wi-1,wi)/Count(wi-1) થી.\n\n**Method:** 1. Sentence ના શબ્દો ક્રમમાં લખો. 2. દરેક adjacent pair માટે P(word2|word1) table/corpus માંથી મેળવો. 3. બધા factors multiply કરો.\n\n*(નોંધ: કેટલાક real exam questions (\"the cat\", \"i want chinese food\") ના reference tables original PDFs માં ફક્ત images તરીકે છે, exact values uploaded material માં ઉપલબ્ધ નથી; તમારા actual exam paper ના table પર ઉપરની method સીધી લગાવો.)*\n\n**Fully Solvable Example (Assignment-2 Q1):** Corpus = {\"I like NLP\", \"I like AI\", \"I love NLP\"}. P(\"I like NLP\") = 1 × 2/3 × 1/2 = **1/3 ≈ 0.333**.", "mustWrite": ["Write the general bigram chain-rule formula first", "If the table is given in the exam (even if not in this document), substitute its actual values", "If truly unavailable, explicitly say so rather than inventing numbers, and still show the correct method structure"], "keywords": ["Bigram Probability", "Chain Rule", "MLE", "N-gram Language Model"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Computing a sentence's bigram probability is like a relay race: each word only \"hands off\" a probability based on the word right before it — multiply every handoff together and you get the final score for the whole sentence.", "examTip": "Whatever specific bigram table your exam paper prints (even if it looks unfamiliar), the method is always identical: multiply P(word|previous word) all the way down the sentence — spend your time reading the given table correctly, not memorizing any particular example's numbers.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q41", "sr": 41, "question": "Explain the Vector Space Model (VSM), Document-Term Matrix, and TF-IDF as its core building blocks.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO5", "coNote": "CO5 (Apply vector-based text representation techniques)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "VSM is the single dedicated topic of the entire Unit-5 PPT (with a full worked example), directly underlies Assignment-2 Q6/Q7/Q8/Q9/Q10 (five separate VSM-related questions), and cosine-similarity/TF-IDF numericals appear across multiple sources — making this the foundational, highest-value concept of the unit.", "easyMeaning": "Explain how documents and queries get converted into number-vectors so a computer can mathematically compare how similar they are.", "understandEnMd": "The **Vector Space Model (VSM)** is a mathematical framework that represents documents and queries as **vectors** in a multi-dimensional space, where each dimension corresponds to one unique term (word) in the entire corpus (collection of documents). This allows numeric operations like similarity comparison to be applied to text.\n\n**How VSM works, step by step:**\n1. **Document-Term Matrix (DTM):** rows = documents, columns = terms (unique words across the corpus); each cell holds a numeric value for how important/frequent that term is in that document.\n2. **TF-IDF Transformation:** raw term counts are converted to TF-IDF weights (Term Frequency × Inverse Document Frequency) to highlight important/distinctive terms and downplay common ones (see Q42 for the full formula and worked numericals).\n3. **Vectorization:** each document becomes a fixed-length vector (one value per unique corpus term), so all document vectors share the same dimensionality.\n4. **Cosine Similarity:** the similarity between any two vectors (e.g. a query and a document) is measured as the cosine of the angle between them, ranging from -1 (opposite) to 1 (identical direction) — see Q43 for the full formula and worked numericals.\n\n**Worked Example (PPT) — Corpus:** Doc1: \"The quick brown fox jumps over the lazy dog.\" Doc2: \"A brown dog chased the fox.\" Doc3: \"The dog is lazy.\" Query: \"brown dog\". After building the TF-IDF-based Document-Term Matrix and vectorizing the query, the cosine similarities computed were: Doc1≈0.58, Doc2≈0.29, Doc3≈0.41 — ranking Doc1 (most relevant) > Doc3 > Doc2 (least relevant) for the query \"brown dog\".", "understandGuMd": "**Vector Space Model (VSM)** documents અને queries ને **vectors** તરીકે multi-dimensional space માં represent કરવાનું mathematical framework છે, જ્યાં દરેક dimension corpus (documents ના collection) ના એક unique term (શબ્દ) ને represent કરે. આનાથી text પર similarity comparison જેવા numeric operations લગાવી શકાય.\n\n**VSM step by step કેવી રીતે કામ કરે:**\n1. **Document-Term Matrix (DTM):** rows = documents, columns = terms; દરેક cell એ term ની document માં importance/frequency બતાવે.\n2. **TF-IDF Transformation:** raw counts ને TF-IDF weights માં convert કરાય જેથી મહત્વના/distinctive terms highlight થાય, common terms downplay થાય.\n3. **Vectorization:** દરેક document fixed-length vector બને (corpus ના દરેક unique term માટે એક value).\n4. **Cosine Similarity:** બે vectors (query અને document) વચ્ચેની similarity, તેમની વચ્ચેના angle ના cosine તરીકે measure થાય, -1 થી 1 range માં.\n\n**Worked Example (PPT) — Corpus:** Doc1: \"The quick brown fox jumps over the lazy dog.\" Doc2: \"A brown dog chased the fox.\" Doc3: \"The dog is lazy.\" Query: \"brown dog\". TF-IDF-based DTM બનાવીને, cosine similarities: Doc1≈0.58, Doc2≈0.29, Doc3≈0.41 — ranking Doc1 > Doc3 > Doc2.", "oneLine": "VSM = documents/queries as vectors; DTM holds term frequencies/TF-IDF weights; cosine similarity ranks documents by relevance to a query.", "memoryTrick": "\"DTM → TF-IDF → Vector → Cosine\" — the 4-step VSM pipeline, in order.", "quick10": "VSM represents text as vectors (1 dimension per term); build DTM → apply TF-IDF → vectorize → rank by cosine similarity to the query.", "quick30": "The Vector Space Model represents documents and queries as vectors in a space with one dimension per unique corpus term. Build a Document-Term Matrix (rows=docs, columns=terms), transform raw counts to TF-IDF weights, vectorize each document to the same length, and measure query-document relevance using cosine similarity. Example: for query \"brown dog\" against 3 documents about a fox/dog, cosine similarities were 0.58/0.29/0.41, ranking Doc1 most relevant.", "answerEnMd": "The **Vector Space Model (VSM)** is an information-retrieval and NLP framework that represents documents and queries as vectors in a multi-dimensional space, with each dimension corresponding to a unique term in the corpus.\n\n**Steps:** 1. Build a **Document-Term Matrix** (rows=documents, columns=terms, cells=frequency/weight). 2. Apply **TF-IDF** to weight terms by importance. 3. **Vectorize** each document to a common-length vector. 4. Compute **Cosine Similarity** between the query vector and each document vector to rank relevance.\n\n**Worked Example:** For documents about a \"brown fox\"/\"brown dog\"/\"lazy dog\" and query \"brown dog\", the computed cosine similarities were Doc1≈0.58, Doc2≈0.29, Doc3≈0.41, so documents are ranked **Doc1 > Doc3 > Doc2** by relevance.\n\n**Advantages:** enables mathematical comparison of text; **Limitation:** ignores word order and semantic meaning (a \"bag of words\" model).", "answerGuMd": "**Vector Space Model (VSM)** એ information-retrieval અને NLP framework છે જે documents અને queries ને multi-dimensional space માં vectors તરીકે represent કરે, દરેક dimension corpus ના unique term ને represent કરે.\n\n**Steps:** 1. **Document-Term Matrix** બનાવો. 2. **TF-IDF** લગાવો. 3. દરેક document ને **Vectorize** કરો. 4. Query vector અને document vectors વચ્ચે **Cosine Similarity** compute કરી relevance rank કરો.\n\n**Worked Example:** \"brown fox\"/\"brown dog\"/\"lazy dog\" documents અને query \"brown dog\" માટે, cosine similarities Doc1≈0.58, Doc2≈0.29, Doc3≈0.41 — ranking **Doc1 > Doc3 > Doc2**.\n\n**Advantages:** text ની mathematical comparison શક્ય બનાવે; **Limitation:** word order અને semantic meaning ignore કરે (bag-of-words model).", "mustWrite": ["Name and explain all 4 steps (DTM → TF-IDF → Vectorization → Cosine Similarity) in order", "Include at least one numeric worked example with a final ranking", "Mention the bag-of-words limitation (ignores word order/meaning)"], "keywords": ["Vector Space Model", "Document-Term Matrix", "TF-IDF", "Vectorization", "Cosine Similarity"], "diagramMd": "A simple 2D/3D axis diagram with document vectors and a query vector drawn as arrows from the origin, with the angle between the query arrow and each document arrow labeled.", "howToDrawMd": "1. Draw two axes (representing 2 example terms). 2. Draw an arrow from the origin for the query vector. 3. Draw arrows for each document vector. 4. Mark the angle between the query and each document arrow — the smallest angle = most similar document.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "VSM turns text into arrows pointing in a \"meaning space\" — documents talking about similar things point in similar directions, so measuring the angle between arrows (cosine similarity) tells you how related two pieces of text are.", "examTip": "Whatever new corpus/query the exam gives, always answer with the same 4-step structure (DTM→TF-IDF→Vectorize→Cosine Similarity→Rank) even for a partial numeric question — examiners check that you know the full pipeline, not just the final formula.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q42", "sr": 42, "question": "Explain TF-IDF (Term Frequency-Inverse Document Frequency) and compute it for given worked examples.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO5", "coNote": "CO5 (Apply term-weighting techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "TF-IDF has a full dedicated worked example in the PPT (the \"cat\" example across 3 documents), a second fully independent worked numerical in a real exam paper (the \"data\" term across a 10,000-document corpus), and Assignment-2 Q8 asks for a related weighted-document-score calculation — three independent, fully-solvable numericals.", "easyMeaning": "Explain how TF-IDF scores a word's importance in a document (frequent in this document, but rare across other documents = high score), and compute it for the given documents/corpus.", "understandEnMd": "**TF-IDF** combines two components: **Term Frequency (TF)** = how often a term appears in a specific document (TF(t,d) = count of t in d / total terms in d) — higher TF suggests the term is more relevant to that document. **Inverse Document Frequency (IDF)** = how rare the term is across the WHOLE corpus (IDF(t,D) = log(Total Documents / Documents containing t)) — reduces the weight of common words (appearing in almost every document) and increases the weight of rare, distinctive words. **TF-IDF(t,d,D) = TF(t,d) × IDF(t,D)**.\n\n**Worked Example 1 (PPT) — term \"cat\" across Doc1: \"The cat sat on the mat.\" (6 terms), Doc2: \"The dog played in the park.\" (6 terms, no \"cat\"), Doc3: \"Cats and dogs are great pets.\" (6 terms, contains \"cat\" as \"Cats\"):**\nTF(cat, Doc1) = 1/6 ≈ 0.167 (appears once out of 6 terms). TF(cat, Doc2) = 0/6 = 0 (does not appear). TF(cat, Doc3) = 1/6 ≈ 0.167.\nIDF(cat, D) = log₁₀(Total Docs / Docs containing \"cat\") = log₁₀(3/2) ≈ **0.176** (this source uses log base 10).\nTF-IDF(cat, Doc1) = 0.167 × 0.176 ≈ **0.029**. TF-IDF(cat, Doc2) = 0 × 0.176 = **0**. TF-IDF(cat, Doc3) = 0.167 × 0.176 ≈ **0.029**.\n\n**Worked Example 2 (real exam paper) — term \"data\" in a corpus of 10,000 documents, where document d5 has 250 total words, \"data\" occurs 20 times in d5, and \"data\" occurs in 2500 of the 10,000 documents:**\nTF(data, d5) = 20/250 = **0.08**.\nIDF(data, D) = log₁₀(10000/2500) = log₁₀(4) ≈ **0.602**.\nTF-IDF(data, d5) = 0.08 × 0.602 ≈ **0.0482**.\n\n**Worked Example 3 (Assignment-2 Q8, weighted document score, a related concept) — query terms \"NLP\", \"search\", \"model\" with document term frequencies 3, 2, 1 respectively, and given retrieval weights 0.5, 0.8, 0.6:** Weighted Document Score = Σ(term frequency × weight) = (3×0.5) + (2×0.8) + (1×0.6) = 1.5 + 1.6 + 0.6 = **3.7**. This score can be used to rank documents for a query — documents with a higher weighted score are considered more relevant and ranked higher in search results.", "understandGuMd": "**TF-IDF** બે components combine કરે: **Term Frequency (TF)** = term ચોક્કસ document માં કેટલી વાર આવે (TF(t,d) = t ની count in d / d ના total terms) — વધારે TF term relevant હોવાનું સૂચવે. **Inverse Document Frequency (IDF)** = આખા corpus માં term કેટલો દુર્લભ છે (IDF(t,D) = log(કુલ Documents / t ધરાવતા Documents)) — common શબ્દોનું weight ઘટાડે, દુર્લભ/distinctive શબ્દોનું વધારે. **TF-IDF(t,d,D) = TF(t,d) × IDF(t,D)**.\n\n**Worked Example 1 (PPT) — \"cat\" term, Doc1: \"The cat sat on the mat.\" (6 terms), Doc2: \"The dog played in the park.\" (6 terms, \"cat\" નથી), Doc3: \"Cats and dogs are great pets.\" (6 terms, \"Cats\" તરીકે):**\nTF(cat, Doc1) = 1/6 ≈ 0.167. TF(cat, Doc2) = 0. TF(cat, Doc3) = 1/6 ≈ 0.167.\nIDF(cat, D) = log₁₀(3/2) ≈ **0.176** (log base 10 વપરાય).\nTF-IDF(cat, Doc1) = 0.167 × 0.176 ≈ **0.029**. TF-IDF(cat, Doc2) = **0**. TF-IDF(cat, Doc3) ≈ **0.029**.\n\n**Worked Example 2 (real exam paper) — \"data\" term, 10,000 documents ના corpus માં, d5 ના 250 total words, \"data\" d5 માં 20 વખત, \"data\" 2500/10,000 documents માં:**\nTF(data, d5) = 20/250 = **0.08**.\nIDF(data, D) = log₁₀(10000/2500) = log₁₀(4) ≈ **0.602**.\nTF-IDF(data, d5) = 0.08 × 0.602 ≈ **0.0482**.\n\n**Worked Example 3 (Assignment-2 Q8, weighted document score) — query terms \"NLP\",\"search\",\"model\", frequencies 3,2,1, weights 0.5,0.8,0.6:** Score = (3×0.5)+(2×0.8)+(1×0.6) = 1.5+1.6+0.6 = **3.7**. Higher score = higher document ranking.", "oneLine": "TF-IDF = TF(count/total terms) × IDF(log(Total Docs/Docs with term)); higher for frequent-here, rare-elsewhere terms.", "memoryTrick": "\"Frequent HERE, Rare ELSEWHERE\" = high TF-IDF score.", "quick10": "TF-IDF = TF × IDF; TF=count/doc length; IDF=log(N/docs containing term); \"cat\" example: TF-IDF≈0.029; \"data\" example: TF-IDF≈0.0482.", "quick30": "TF-IDF(t,d,D)=TF(t,d)×IDF(t,D), where TF(t,d)=count(t in d)/total terms in d, and IDF(t,D)=log(Total Docs/Docs containing t). Example (\"cat\"): TF=1/6≈0.167 in Doc1/Doc3, IDF=log10(3/2)≈0.176, TF-IDF≈0.029. Example (\"data\", 10000-doc corpus): TF=20/250=0.08, IDF=log10(10000/2500)=log10(4)≈0.602, TF-IDF≈0.0482. TF-IDF highlights terms that are frequent in one document but rare across the whole corpus.", "answerEnMd": "**TF-IDF(t,d,D) = TF(t,d) × IDF(t,D)**, where **TF(t,d) = Count(t in d) / Total terms in d**, and **IDF(t,D) = log(Total Documents in D / Documents containing t)**.\n\n**Worked Numerical 1 — \"cat\" (Doc1=\"The cat sat on the mat.\", Doc2=\"The dog played in the park.\", Doc3=\"Cats and dogs are great pets.\"):**\nTF(cat,Doc1)=1/6≈0.167; TF(cat,Doc2)=0; TF(cat,Doc3)=1/6≈0.167.\nIDF(cat,D) = log₁₀(3/2) ≈ 0.176.\n**TF-IDF(cat,Doc1) ≈ 0.029; TF-IDF(cat,Doc2) = 0; TF-IDF(cat,Doc3) ≈ 0.029.**\n\n**Worked Numerical 2 — \"data\" (corpus of 10,000 docs; d5 has 250 words, \"data\" occurs 20 times in d5, \"data\" appears in 2,500 documents):**\nTF(data,d5) = 20/250 = 0.08. IDF(data,D) = log₁₀(10000/2500) = log₁₀(4) ≈ 0.602.\n**TF-IDF(data,d5) = 0.08 × 0.602 ≈ 0.0482.**\n\n**Worked Numerical 3 — Weighted Document Score (term frequencies 3,2,1; weights 0.5,0.8,0.6):** Score = (3×0.5)+(2×0.8)+(1×0.6) = **3.7** — used to rank documents (higher score = higher rank).", "answerGuMd": "**TF-IDF(t,d,D) = TF(t,d) × IDF(t,D)**, જ્યાં **TF(t,d) = Count(t in d) / d ના Total terms**, અને **IDF(t,D) = log(D ના Total Documents / t ધરાવતા Documents)**.\n\n**Worked Numerical 1 — \"cat\":** TF(cat,Doc1)=1/6≈0.167; TF(cat,Doc2)=0; TF(cat,Doc3)=1/6≈0.167. IDF(cat,D)=log₁₀(3/2)≈0.176. **TF-IDF(cat,Doc1)≈0.029; Doc2=0; Doc3≈0.029.**\n\n**Worked Numerical 2 — \"data\" (10,000-doc corpus, d5=250 words, \"data\"=20 વખત d5 માં, 2500 documents માં):** TF=20/250=0.08. IDF=log₁₀(4)≈0.602. **TF-IDF ≈ 0.0482.**\n\n**Worked Numerical 3 — Weighted Document Score:** Score = (3×0.5)+(2×0.8)+(1×0.6) = **3.7**.", "mustWrite": ["Write both TF and IDF formulas explicitly before substituting numbers", "Show the log calculation step separately (state which log base is being used)", "Compute TF-IDF for every document/term the question asks about, not just one"], "keywords": ["TF-IDF", "Term Frequency", "Inverse Document Frequency", "Document-Term Matrix"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "**Given:** \"data\" occurs 20 times in d5 (250 total words); \"data\" appears in 2500 of 10,000 documents.\n**Formula:** TF-IDF(t,d,D) = (Count(t,d)/Total terms in d) × log₁₀(Total Docs/Docs containing t).\n**Step 1:** TF(data,d5) = 20/250 = 0.08.\n**Step 2:** IDF(data,D) = log₁₀(10000/2500) = log₁₀(4) ≈ 0.602.\n**Final Answer:** TF-IDF(data,d5) = 0.08 × 0.602 ≈ 0.0482.\n**Exam Writing Format:** State TF formula → substitute → state IDF formula → substitute (showing the log argument clearly) → multiply for final TF-IDF value.", "algorithmMd": "", "explainAgainMd": "TF-IDF rewards a word for being common IN one document but uncommon ACROSS all documents — \"the\" is common everywhere so it scores low no matter what, but \"data\" appearing a lot in just one document while being rare elsewhere scores meaningfully higher.", "examTip": "Always state explicitly which log base you're using (this source's PPT worked examples use log base 10, giving IDF(cat)≈0.176 for log₁₀(1.5) and IDF(data)≈0.602 for log₁₀(4)) — using natural log instead would give a different, inconsistent-looking number, so match whatever convention the exam question implies or states.", "isNumerical": true, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "\"data\" occurs 20 times in d5 (250 total words); \"data\" appears in 2500 of 10,000 documents.", "formulaMd": "TF-IDF(t,d,D) = (Count(t,d)/Total terms in d) × log₁₀(Total Docs/Docs containing t).", "finalAnswerMd": "TF-IDF(data,d5) = 0.08 × 0.602 ≈ 0.0482.", "hasFormula": true}, {"id": "q43", "sr": 43, "question": "Explain Cosine Similarity in the Vector Space Model and compute it for given worked examples.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO5", "coNote": "CO5 (Apply vector similarity measures)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "Cosine similarity is the dedicated climax of the Unit-5 PPT's worked example, and THREE separate Assignment-2 questions (Q6, Q7) plus an older real exam paper (Winter-2021, word-vector similarity) all require fully-solvable cosine-similarity numericals — the single most numerically rich topic in Unit 5.", "easyMeaning": "Explain how cosine similarity measures how alike two text vectors are (by the angle between them), and compute it for the given document/query vectors.", "understandEnMd": "**Cosine Similarity** measures the similarity between two vectors A and B as the cosine of the angle between them: **Cosine Similarity(A,B) = (A · B) / (‖A‖ × ‖B‖)**, where A·B is the dot product (sum of element-wise products) and ‖A‖, ‖B‖ are the Euclidean norms (magnitudes) of each vector: ‖A‖ = √(Σaᵢ²). The value ranges from -1 (completely dissimilar) to 1 (identical direction/completely similar); for text (non-negative term counts), it typically ranges 0 to 1. It is **scale-invariant** — unaffected by document length — which is why it is preferred over raw distance for comparing documents of different sizes.\n\n**Worked Example 1 (Assignment-2 Q7) — D1=(2,3,1), D2=(1,1,2), Query Q=(1,2,1):**\nCosine(Q,D1): Q·D1 = (1×2)+(2×3)+(1×1) = 2+6+1 = 9. ‖Q‖=√(1+4+1)=√6≈2.449. ‖D1‖=√(4+9+1)=√14≈3.742. Cosine = 9/(2.449×3.742) = 9/9.166 ≈ **0.982**.\nCosine(Q,D2): Q·D2 = (1×1)+(2×1)+(1×2) = 1+2+2 = 5. ‖D2‖=√(1+1+4)=√6≈2.449. Cosine = 5/(2.449×2.449) = 5/6 ≈ **0.833**.\n**Since 0.982 > 0.833, Document D1 should be ranked higher for this query.**\n\n**Worked Example 2 (Assignment-2 Q6) — Documents: \"machine learning improves healthcare\" (D1), \"machine learning uses data\" (D2), \"healthcare uses artificial intelligence\" (D3); Query: \"machine learning\". Using term-presence vectors over the 8 corpus terms {machine, learning, improves, healthcare, uses, data, artificial, intelligence}:** D1=(1,1,1,1,0,0,0,0), D2=(1,1,0,0,1,1,0,0), D3=(0,0,0,1,1,0,1,1), Q=(1,1,0,0,0,0,0,0).\nCosine(Q,D1) = (1×1+1×1)/(√2 × √4) = 2/(1.414×2) = 2/2.828 ≈ **0.707**.\nCosine(Q,D2) = (1×1+1×1)/(√2 × √4) = 2/2.828 ≈ **0.707**.\nCosine(Q,D3) = 0/(...) = **0** (D3 shares neither \"machine\" nor \"learning\" with the query).\n**Result: D1 and D2 are exactly tied as the most relevant documents (both ≈0.707), and D3 is completely irrelevant to this query (cosine=0).**\n\n**Worked Example 3 (Winter-2021 paper) — w1=(0.2,0.1,0.3,0.4), w2=(0.3,0,0.2,0.5):** Dot product = (0.2×0.3)+(0.1×0)+(0.3×0.2)+(0.4×0.5) = 0.06+0+0.06+0.2 = 0.32. ‖w1‖=√(0.04+0.01+0.09+0.16)=√0.30≈0.548. ‖w2‖=√(0.09+0+0.04+0.25)=√0.38≈0.616. Cosine = 0.32/(0.548×0.616) = 0.32/0.338 ≈ **0.948**. Since this is very close to 1, **w1 and w2 are considered similar**.", "understandGuMd": "**Cosine Similarity** બે vectors A અને B વચ્ચેની similarity, તેમની વચ્ચેના angle ના cosine તરીકે measure કરે: **Cosine Similarity(A,B) = (A · B) / (‖A‖ × ‖B‖)**. Value -1 (સંપૂર્ણ dissimilar) થી 1 (identical/સંપૂર્ણ similar) સુધી; text માટે સામાન્ય રીતે 0 થી 1. તે **scale-invariant** છે — document length થી અસર નથી પામતું.\n\n**Worked Example 1 (Assignment-2 Q7) — D1=(2,3,1), D2=(1,1,2), Q=(1,2,1):**\nCosine(Q,D1) = 9/(2.449×3.742) ≈ **0.982**.\nCosine(Q,D2) = 5/(2.449×2.449) ≈ **0.833**.\n**0.982 > 0.833 હોવાથી, D1 ને higher rank મળે.**\n\n**Worked Example 2 (Assignment-2 Q6):** D1=(1,1,1,1,0,0,0,0), D2=(1,1,0,0,1,1,0,0), D3=(0,0,0,1,1,0,1,1), Q=(1,1,0,0,0,0,0,0).\nCosine(Q,D1) ≈ **0.707**. Cosine(Q,D2) ≈ **0.707**. Cosine(Q,D3) = **0**.\n**D1 અને D2 બંને equally most relevant (tie, ≈0.707), D3 સંપૂર્ણપણે irrelevant.**\n\n**Worked Example 3 (Winter-2021 paper) — w1=(0.2,0.1,0.3,0.4), w2=(0.3,0,0.2,0.5):** Dot=0.32, ‖w1‖≈0.548, ‖w2‖≈0.616, Cosine ≈ **0.948** — 1 ની ખૂબ નજીક હોવાથી **w1 અને w2 similar** ગણાય.", "oneLine": "Cosine Similarity = (A·B)/(‖A‖‖B‖); closer to 1 = more similar; unaffected by vector length.", "memoryTrick": "\"Dot on top, Lengths on bottom\" — dot product divided by the product of magnitudes.", "quick10": "Cosine = dot(A,B)/(|A||B|); range -1 to 1 (0 to 1 for text); higher = more similar; e.g. Q=(1,2,1) vs D1=(2,3,1) → cos≈0.982.", "quick30": "Cosine Similarity(A,B) = (A·B)/(‖A‖×‖B‖), measuring the angle between two vectors regardless of their length (scale-invariant). For D1=(2,3,1), D2=(1,1,2), Q=(1,2,1): cos(Q,D1)≈0.982 > cos(Q,D2)≈0.833, so D1 ranks higher. For term-presence vectors from a 3-document machine-learning corpus, the query \"machine learning\" ties D1 and D2 at cos≈0.707 while D3 scores 0. For word vectors w1=(0.2,0.1,0.3,0.4) and w2=(0.3,0,0.2,0.5), cos≈0.948, indicating high similarity.", "answerEnMd": "**Cosine Similarity(A,B) = (A · B) / (‖A‖ × ‖B‖)**, where A·B is the dot product and ‖A‖=√(Σaᵢ²) is the Euclidean norm. It is scale-invariant and ranges from -1 to 1 (0 to 1 for non-negative text vectors); higher values indicate greater similarity.\n\n**Worked Numerical (D1=(2,3,1), D2=(1,1,2), Q=(1,2,1)):**\nCosine(Q,D1) = [(1)(2)+(2)(3)+(1)(1)] / [√6 × √14] = 9/9.166 ≈ **0.982**.\nCosine(Q,D2) = [(1)(1)+(2)(1)+(1)(2)] / [√6 × √6] = 5/6 ≈ **0.833**.\n**Since 0.982 > 0.833, D1 should be ranked higher for query Q.**\n\n**Worked Numerical (w1=(0.2,0.1,0.3,0.4), w2=(0.3,0,0.2,0.5)):** dot=0.32, ‖w1‖≈0.548, ‖w2‖≈0.616. **Cosine ≈ 0.948 → w1 and w2 are similar.**", "answerGuMd": "**Cosine Similarity(A,B) = (A · B) / (‖A‖ × ‖B‖)**, જ્યાં A·B dot product અને ‖A‖=√(Σaᵢ²) Euclidean norm. Scale-invariant, -1 થી 1 range (text માટે 0 થી 1); વધારે value = વધારે similarity.\n\n**Worked Numerical (D1=(2,3,1), D2=(1,1,2), Q=(1,2,1)):**\nCosine(Q,D1) = 9/9.166 ≈ **0.982**. Cosine(Q,D2) = 5/6 ≈ **0.833**.\n**0.982 > 0.833 હોવાથી, D1 ને higher rank મળે.**\n\n**Worked Numerical (w1=(0.2,0.1,0.3,0.4), w2=(0.3,0,0.2,0.5)):** dot=0.32, ‖w1‖≈0.548, ‖w2‖≈0.616. **Cosine ≈ 0.948 → w1 અને w2 similar છે.**", "mustWrite": ["Write the cosine similarity formula before substituting values", "Show the dot product AND both magnitude calculations as separate explicit steps", "State the final comparison/ranking or similar-vs-dissimilar conclusion clearly"], "keywords": ["Cosine Similarity", "Dot Product", "Euclidean Norm", "Vector Magnitude", "Vector Space Model"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "**Given:** D1=(2,3,1), D2=(1,1,2), Q=(1,2,1).\n**Formula:** Cosine(A,B) = (A·B)/(‖A‖×‖B‖).\n**Step 1:** Q·D1 = 1×2+2×3+1×1 = 9. Q·D2 = 1×1+2×1+1×2 = 5.\n**Step 2:** ‖Q‖=√6≈2.449, ‖D1‖=√14≈3.742, ‖D2‖=√6≈2.449.\n**Step 3:** Cosine(Q,D1) = 9/(2.449×3.742) ≈ 0.982.\n**Step 4:** Cosine(Q,D2) = 5/(2.449×2.449) ≈ 0.833.\n**Final Answer:** D1 (0.982) ranks higher than D2 (0.833) for query Q.\n**Exam Writing Format:** Compute dot products first for all pairs, then all magnitudes, then divide — never interleave the arithmetic, to avoid mistakes and to make grading each component easy for the examiner.", "algorithmMd": "", "explainAgainMd": "Cosine similarity ignores \"how much text\" is in a document and only cares about \"what it's about\" — two vectors pointing in almost the same direction (even if one is much longer) are considered highly similar.", "examTip": "Whatever new vectors the exam gives, always keep the dot product, both magnitudes, and the final division as 3 clearly separate, labeled steps — partial marks are awarded for each correct component even if the final division has an arithmetic slip.\n\n## HIGH PRIORITY QUESTIONS", "isNumerical": true, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "D1=(2,3,1), D2=(1,1,2), Q=(1,2,1).", "formulaMd": "Cosine(A,B) = (A·B)/(‖A‖×‖B‖).", "finalAnswerMd": "D1 (0.982) ranks higher than D2 (0.833) for query Q.", "hasFormula": true}, {"id": "q44", "sr": 44, "question": "Explain Word Embeddings (Word2Vec, GloVe, BERT) and compare CBOW vs Skip-Gram models.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO5", "coNote": "CO5 (Understand distributed word representation techniques)", "bloomLevel": "Understand", "priority": "high", "priorityLabel": "High", "priorityReason": "Word Embeddings are a defined key-terminology PPT topic, and CBOW vs Skip-Gram is directly asked as a comparison question in the Sep-2025 final for 01AI0702, including a specific application scenario (sentiment analysis of \"This exam is very easy\").", "easyMeaning": "Explain what \"word embeddings\" are (representing words as dense number-vectors that capture meaning) and compare the two main training strategies used by Word2Vec.", "understandEnMd": "**Word Embeddings** represent words as dense, low-dimensional numeric vectors that capture semantic meaning and relationships — words with similar meanings end up with similar (close) vectors, unlike sparse one-hot/bag-of-words representations. Popular embedding methods: **Word2Vec** (learns embeddings by predicting context from a word or vice versa), **GloVe** (learns embeddings from global word co-occurrence statistics across the whole corpus), **BERT** (learns deep, context-dependent embeddings using Transformers, so the same word gets a different vector depending on its sentence context).\n\n**Word2Vec has two training architectures:**\n**CBOW (Continuous Bag of Words):** predicts a **target (center) word** FROM its surrounding **context words** — e.g. given context [\"This\", \"is\", \"very\", \"easy\"], predict the missing center word \"exam\". CBOW is generally faster to train and works well for frequent words.\n**Skip-Gram:** works in the opposite direction — predicts the surrounding **context words** FROM a given **center word** — e.g. given the center word \"exam\", predict that [\"This\", \"is\", \"very\", \"easy\"] are likely nearby. Skip-Gram tends to work better for rare words and smaller datasets, though it is slower to train than CBOW since it makes multiple context predictions per center word.\n\n**Application — Sentiment Analysis of \"This exam is very easy\":** for a sentiment-analysis task on a relatively small/specific dataset (like exam-related sentences) where capturing the nuance of rarer sentiment-bearing words (like \"easy\") matters, **Skip-Gram** would generally be preferred, since it is more effective at learning good representations for less-frequent words from limited data; CBOW would be a reasonable, faster alternative if a large training corpus is available.", "understandGuMd": "**Word Embeddings** શબ્દોને dense, low-dimensional numeric vectors તરીકે represent કરે જે semantic meaning અને relationships પકડે — સરખા meaning ધરાવતા શબ્દોના vectors એકબીજાની નજીક હોય, sparse one-hot/bag-of-words representations થી અલગ. લોકપ્રિય embedding methods: **Word2Vec** (context થી શબ્દ predict કરીને કે ઉલટું embeddings શીખે), **GloVe** (આખા corpus ના global word co-occurrence statistics થી embeddings શીખે), **BERT** (Transformers વાપરીને deep, context-dependent embeddings શીખે, એ જ શબ્દને sentence context પ્રમાણે અલગ vector મળે).\n\n**Word2Vec ના બે training architectures:**\n**CBOW (Continuous Bag of Words):** આજુબાજુના **context words** પરથી **target (center) word** predict કરે — દા.ત. context [\"This\",\"is\",\"very\",\"easy\"] આપીને, missing center word \"exam\" predict કરે. CBOW train કરવામાં ઝડપી, frequent શબ્દો માટે સારું.\n**Skip-Gram:** ઉલટી દિશામાં કામ કરે — આપેલા **center word** પરથી આજુબાજુના **context words** predict કરે. Skip-Gram દુર્લભ શબ્દો અને નાના datasets માટે વધુ સારું, પણ train કરવામાં ધીમું.\n\n**Application — \"This exam is very easy\" ના Sentiment Analysis:** નાના/specific dataset પર sentiment-analysis task માટે જ્યાં દુર્લભ sentiment-bearing શબ્દો (જેમ \"easy\") ની nuance capture કરવી મહત્વની હોય, **Skip-Gram** સામાન્ય રીતે વધુ favor થાય; મોટો training corpus હોય તો CBOW ઝડપી વિકલ્પ છે.", "oneLine": "CBOW: context→predict center word (fast, good for frequent words); Skip-Gram: center→predict context words (slower, good for rare words).", "memoryTrick": "\"CBOW Collects context to guess the Center; Skip-gram Starts from center to guess Surroundings.\"", "quick10": "Word embeddings = dense semantic vectors (Word2Vec/GloVe/BERT). CBOW: context→center word. Skip-Gram: center→context words; better for rare words.", "quick30": "Word embeddings represent words as dense vectors capturing meaning (Word2Vec, GloVe, BERT — BERT being context-dependent via Transformers). Word2Vec has two architectures: CBOW predicts the center word from surrounding context (faster, good for frequent words, large corpora); Skip-Gram predicts surrounding context words from the center word (slower, but better for rare words and small datasets). For sentiment analysis of a short/specific sentence like \"This exam is very easy\", Skip-Gram is generally preferred for better rare-word representation.", "answerEnMd": "**Word Embeddings** are dense, low-dimensional vector representations of words that capture semantic meaning, such that semantically similar words have similar vectors. Key methods: **Word2Vec** (predictive, context-based), **GloVe** (co-occurrence-statistics-based), **BERT** (deep, contextual, Transformer-based).\n\n**CBOW vs Skip-Gram (Word2Vec architectures):**\n| Feature | CBOW | Skip-Gram |\n|---|---|---|\n| Direction | Context → Center word | Center word → Context |\n| Speed | Faster | Slower |\n| Best for | Frequent words, larger corpora | Rare words, smaller datasets |\n\n**Application:** For sentiment analysis of \"This exam is very easy\" on a small/specific dataset, **Skip-Gram** is generally preferred since it better captures representations of less-frequent, sentiment-carrying words (like \"easy\") from limited training data.", "answerGuMd": "**Word Embeddings** શબ્દોના dense, low-dimensional vector representations છે જે semantic meaning પકડે, જેથી સરખા meaning ધરાવતા શબ્દોના vectors સરખા હોય. મુખ્ય methods: **Word2Vec**, **GloVe**, **BERT**.\n\n**CBOW vs Skip-Gram:**\n| Feature | CBOW | Skip-Gram |\n|---|---|---|\n| Direction | Context → Center word | Center word → Context |\n| Speed | ઝડપી | ધીમું |\n| શેના માટે સારું | Frequent શબ્દો, મોટા corpora | દુર્લભ શબ્દો, નાના datasets |\n\n**Application:** \"This exam is very easy\" ના sentiment analysis માટે નાના dataset પર, **Skip-Gram** સામાન્ય રીતે વધુ favor થાય.", "mustWrite": ["Define word embeddings and name at least the 3 key methods (Word2Vec, GloVe, BERT)", "Clearly state the DIRECTION of prediction for both CBOW and Skip-Gram (this is the most-tested distinction)", "Answer the specific application sub-question with a justified choice, not just a name"], "keywords": ["Word Embeddings", "Word2Vec", "GloVe", "BERT", "CBOW", "Skip-Gram"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "CBOW is like a fill-in-the-blank game where you see the surrounding words and guess the missing middle word; Skip-Gram is the reverse game — you see the middle word and guess what surrounds it. Skip-Gram gets more \"practice attempts\" per rare word, so it learns rare words better.", "examTip": "Whenever asked \"which model would you use for X\", always justify with the frequent-vs-rare-word and corpus-size reasoning shown above — this is the specific reasoning pattern that separates a full-marks Analyze-level answer from just naming a model.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q45", "sr": 45, "question": "Compare Word-level Tokenization and Subword (BPE) Tokenization, and explain other tokenization methods.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO5", "coNote": "CO5 (Analyze text tokenization approaches)", "bloomLevel": "Analyze", "priority": "high", "priorityLabel": "High", "priorityReason": "This exact comparison is directly asked in the Sep-2025 final for 01AI0702 (with an explicit request for an example of each), and the very recent 23-Sep-2026 paper separately asks to compare whitespace/rule-based/BPE tokenization methods and specifically how BPE relates to morphological analysis.", "easyMeaning": "Compare splitting text into whole words versus splitting into smaller sub-word pieces (like BPE), and explain the trade-offs.", "understandEnMd": "**Tokenization** is the process of splitting raw text into smaller units (tokens) for processing. **Word-level Tokenization** splits text at word boundaries (usually whitespace/punctuation) — e.g. \"unhappiness\" stays as one token, \"unhappiness\". This is simple and intuitive, but struggles with **out-of-vocabulary (OOV)** words (any word not seen during training gets no usable representation) and produces very large vocabularies for morphologically rich languages.\n\n**Subword Tokenization (e.g. Byte Pair Encoding, BPE)** splits words into smaller, frequently-occurring sub-word units — e.g. \"unhappiness\" might become [\"un\", \"happi\", \"ness\"]. BPE works by iteratively merging the most frequent adjacent pair of characters/character-sequences in a training corpus until a target vocabulary size is reached. This handles OOV words gracefully (a rare/unseen word can still be broken into known sub-pieces) and keeps vocabulary size manageable, at the cost of losing the intuitive one-token-per-word simplicity.\n\n**How BPE relates to Morphological Analysis:** BPE's learned sub-word units often naturally align with real morphemes (e.g. splitting off \"un-\", \"-ness\", \"-ing\" as separate tokens, similar to how morphological analysis identifies prefixes/roots/suffixes) — though BPE is purely statistical/frequency-driven and doesn't guarantee linguistically \"correct\" morpheme boundaries the way formal morphological analysis does; it is a data-driven approximation of morphological decomposition.\n\n**Whitespace Tokenization:** the simplest method — split on spaces only (e.g. \"don't\" stays as one token \"don't\"). **Rule-Based Tokenization:** uses hand-written linguistic rules to handle punctuation, contractions, and special cases (e.g. splitting \"don't\" into \"do\" + \"n't\"). **BPE (Subword):** as described above, data-driven and learned from a corpus.\n\n**Example of each:** Word-level: \"unhappiness\" → [\"unhappiness\"]. Subword/BPE: \"unhappiness\" → [\"un\", \"happi\", \"ness\"].", "understandGuMd": "**Tokenization** raw text ને process માટે નાના units (tokens) માં તોડવાની process છે. **Word-level Tokenization** text ને word boundaries (whitespace/punctuation) પર તોડે — દા.ત. \"unhappiness\" એક જ token રહે. સહેલું, પણ **out-of-vocabulary (OOV)** શબ્દો (training માં ના જોયેલા) સાથે તકલીફ પડે, અને morphologically rich languages માટે વિશાળ vocabulary બને.\n\n**Subword Tokenization (દા.ત.
