 Byte Pair Encoding, BPE)** શબ્દોને નાના, વારંવાર આવતા sub-word units માં તોડે — દા.ત. \"unhappiness\" → [\"un\", \"happi\", \"ness\"]. BPE training corpus માં સૌથી frequent adjacent character-pair ને iteratively merge કરીને કામ કરે, target vocabulary size સુધી. આ OOV શબ્દોને સારી રીતે handle કરે અને vocabulary size manageable રાખે.\n\n**BPE morphological Analysis સાથે કેવી રીતે સંબંધિત:** BPE ના learned sub-word units ઘણી વાર real morphemes સાથે match થાય (દા.ત. \"un-\", \"-ness\", \"-ing\" અલગ tokens તરીકે) — પણ BPE ફક્ત statistical/frequency-driven છે, formal morphological analysis જેવા linguistically \"correct\" morpheme boundaries guarantee નથી કરતું; તે data-driven approximation છે.\n\n**Whitespace Tokenization:** સૌથી સાદી method — ફક્ત spaces પર તોડે. **Rule-Based Tokenization:** hand-written linguistic rules વાપરે punctuation/contractions handle કરવા (દા.ત. \"don't\" → \"do\" + \"n't\"). **BPE (Subword):** ઉપર પ્રમાણે, corpus માંથી data-driven શીખાય.\n\n**Example:** Word-level: \"unhappiness\" → [\"unhappiness\"]. Subword/BPE: \"unhappiness\" → [\"un\", \"happi\", \"ness\"].", "oneLine": "Word-level tokenization = whole words (simple, OOV problem); Subword/BPE = frequent sub-pieces (handles OOV, aligns loosely with morphemes).", "memoryTrick": "\"BPE Breaks into Pieces Efficiently\" — handles rare/unseen words by breaking them into known smaller pieces.", "quick10": "Word-level: 1 token/word, simple, OOV problem. Subword/BPE: frequent sub-word pieces, handles OOV, loosely mirrors morphemes.", "quick30": "Word-level tokenization splits at word boundaries (simple, but fails on unseen/out-of-vocabulary words and creates huge vocabularies). Subword tokenization (BPE) iteratively merges frequent character pairs to build a vocabulary of common sub-word units, handling OOV words by breaking them into known pieces (e.g. \"unhappiness\"→\"un\"+\"happi\"+\"ness\"). BPE's sub-word splits often loosely resemble real morphemes (prefixes/suffixes) but are purely frequency-driven, not linguistically guaranteed. Whitespace tokenization (split on spaces) and rule-based tokenization (handle punctuation/contractions with rules) are simpler alternatives.", "answerEnMd": "**Word-level Tokenization** splits text at word boundaries, treating each whole word as one token (e.g. \"unhappiness\" → [\"unhappiness\"]) — simple, but suffers from the **out-of-vocabulary (OOV) problem** and large vocabulary sizes.\n\n**Subword Tokenization (BPE)** iteratively merges the most frequent adjacent character pairs in a training corpus to build a vocabulary of common sub-word units, splitting words into pieces (e.g. \"unhappiness\" → [\"un\",\"happi\",\"ness\"]) — this handles OOV words gracefully and keeps vocabulary size bounded.\n\n| Feature | Word-level | Subword (BPE) |\n|---|---|---|\n| Token granularity | Whole words | Sub-word pieces |\n| OOV handling | Poor | Good |\n| Vocabulary size | Large | Compact/bounded |\n| Example | \"unhappiness\" | \"un\"+\"happi\"+\"ness\" |\n\n**Relation to Morphological Analysis:** BPE's data-driven sub-word splits often loosely align with real morphemes (prefixes/roots/suffixes), acting as a statistical approximation of morphological decomposition, though without guaranteeing linguistic correctness the way formal morphological analysis does.\n\n**Other methods:** Whitespace tokenization (split on spaces only) and Rule-Based tokenization (hand-written rules for punctuation/contractions, e.g. \"don't\"→\"do\"+\"n't\").", "answerGuMd": "**Word-level Tokenization** text ને word boundaries પર તોડે, દરેક આખો શબ્દ એક token (દા.ત. \"unhappiness\" → [\"unhappiness\"]) — સાદું, પણ **OOV problem** અને મોટી vocabulary sizes ની તકલીફ.\n\n**Subword Tokenization (BPE)** training corpus માં સૌથી frequent adjacent character pairs ને iteratively merge કરીને common sub-word units ની vocabulary બનાવે (દા.ત. \"unhappiness\" → [\"un\",\"happi\",\"ness\"]) — OOV શબ્દો સારી રીતે handle કરે.\n\n| Feature | Word-level | Subword (BPE) |\n|---|---|---|\n| Token granularity | આખા શબ્દો | Sub-word pieces |\n| OOV handling | નબળું | સારું |\n| Vocabulary size | મોટી | Compact |\n| Example | \"unhappiness\" | \"un\"+\"happi\"+\"ness\" |\n\n**Morphological Analysis સાથે સંબંધ:** BPE ના data-driven sub-word splits ઘણી વાર real morphemes સાથે loosely align થાય, morphological decomposition નું statistical approximation બને.\n\n**બીજી methods:** Whitespace tokenization, Rule-Based tokenization (દા.ત. \"don't\"→\"do\"+\"n't\").", "mustWrite": ["Give a concrete example of each method's output for the same word", "Explicitly name the OOV (out-of-vocabulary) problem as word-level tokenization's weakness", "Address the BPE-morphology connection if asked, noting BPE is statistical not linguistically guaranteed"], "keywords": ["Tokenization", "Word-level", "Subword", "Byte Pair Encoding (BPE)", "Out-of-Vocabulary (OOV)"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "| Method | How it splits | Handles OOV? |\n|---|---|---|\n| Whitespace | Spaces only | No |\n| Rule-Based | Linguistic rules (punctuation/contractions) | Partially |\n| Word-level | Whole words | No |\n| Subword (BPE) | Frequent sub-word pieces (learned) | Yes |", "quickMemory": "\"Bigger pieces = simpler but brittle; smaller pieces = flexible but less intuitive.\"", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Word-level tokenization is like only recognizing whole LEGO models; BPE is like recognizing the individual LEGO bricks that make up any model — even a brand-new, never-seen model can be described using bricks you already know.", "examTip": "If asked to give \"an example of each\" (as the exam literally requests), always show the SAME word tokenized both ways side-by-side (e.g. \"unhappiness\" as 1 token vs. 3 sub-word pieces) — this direct contrast is exactly what earns the comparison marks.", "isNumerical": false, "isDiagram": false, "isComparison": true, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q46", "sr": 46, "question": "Compare Porter Stemmer and a Lemmatizer by applying both to given words.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO4", "coNote": "CO4 (Apply morphological normalization techniques)", "bloomLevel": "Apply", "priority": "high", "priorityLabel": "High", "priorityReason": "This is a directly and fully specified real exam question (Sep-2025 final for 01AI0702) with 5 named words and an explicit request to explain WHY stemming and lemmatization differ — a concrete, fully-answerable Apply/Analyze question.", "easyMeaning": "Apply both a stemming algorithm (Porter Stemmer, which chops off endings using rules) and a lemmatizer (which finds the real dictionary base form) to the same words, and explain why their outputs differ.", "understandEnMd": "**Stemming (Porter Stemmer)** reduces a word to its base/root form using a fixed set of suffix-stripping rules, WITHOUT necessarily checking whether the result is an actual valid dictionary word — it is fast but crude, and can produce non-words. **Lemmatization** reduces a word to its dictionary base form (the \"lemma\") using vocabulary and morphological/grammatical analysis (often requiring knowledge of the word's part of speech), always producing a real word — it is slower but more linguistically accurate.\n\n**Worked Example — applying both to 5 words:**\n| Word | Porter Stemmer Output | Lemmatizer Output | Why They Differ |\n|---|---|---|---|\n| caring | car (or \"care\" depending on rule set) | care | Stemmer mechanically strips \"-ing\" and may over-trim; lemmatizer correctly identifies \"care\" as the verb's dictionary form |\n| happily | happili | happy | Stemmer's rule-based suffix stripping produces a non-word (\"happili\"); lemmatizer correctly maps the adverb back to its adjective root \"happy\" |\n| mice | mice (stemmer typically cannot change irregular plurals) | mouse | Stemming has no knowledge of irregular plural forms; lemmatization uses a vocabulary/dictionary lookup that knows \"mice\" is the irregular plural of \"mouse\" |\n| organization | organ (over-stemmed) | organization | The stemmer aggressively strips \"-ization\", incorrectly reducing to an unrelated word \"organ\"; the lemmatizer recognizes \"organization\" is already close to its own base noun form and doesn't distort its meaning |\n| went | went (stemmer has no rule for irregular past tense) | go | Stemming only strips suffixes and cannot handle irregular verb forms; lemmatization uses grammatical knowledge to map the irregular past tense \"went\" back to its base verb \"go\" |\n\n**Why the difference occurs, in general:** Porter Stemmer is a fast, rule-based, \"chop the ending\" algorithm with no real vocabulary or grammar knowledge, so it can produce incorrect or non-existent words, especially for irregular forms (mice, went) or when its heuristic rules over-trim (organization→organ, happily→happili). Lemmatization uses an actual dictionary/vocabulary plus grammatical (POS) information to find the linguistically correct base form, always producing a valid real word, at the cost of being computationally more expensive.", "understandGuMd": "**Stemming (Porter Stemmer)** શબ્દને base/root form માં ઘટાડે, fixed suffix-stripping rules વાપરીને, result valid dictionary word છે કે નહીં એ ચેક કર્યા વગર — ઝડપી પણ crude, non-words પણ બની શકે. **Lemmatization** શબ્દને dictionary base form (\"lemma\") માં ઘટાડે, vocabulary અને morphological/grammatical analysis વાપરીને (ઘણી વાર part of speech ની જરૂર), હંમેશા real word આપે — ધીમું પણ linguistically accurate.\n\n**Worked Example — 5 શબ્દો પર બંને લગાવવા:**\n| શબ્દ | Porter Stemmer | Lemmatizer | કેમ અલગ |\n|---|---|---|---|\n| caring | car (અથવા \"care\") | care | Stemmer mechanically \"-ing\" કાઢે; lemmatizer સાચું verb form \"care\" ઓળખે |\n| happily | happili | happy | Stemmer non-word \"happili\" બનાવે; lemmatizer adverb ને adjective root \"happy\" પર પાછું લાવે |\n| mice | mice (બદલી ના શકે) | mouse | Stemming ને irregular plural forms ની ખબર નથી; lemmatization dictionary lookup વાપરે |\n| organization | organ (over-stemmed) | organization | Stemmer over-aggressive \"-ization\" કાઢે, ખોટો \"organ\" શબ્દ બને; lemmatizer meaning distort નથી કરતું |\n| went | went (rule નથી) | go | Stemming irregular past tense handle નથી કરી શકતું; lemmatization grammatical knowledge વાપરી \"go\" પર પાછું લાવે |\n\n**કેમ તફાવત આવે, સામાન્ય રીતે:** Porter Stemmer ઝડપી, rule-based, \"ending કાપી નાખો\" algorithm છે, જેને real vocabulary/grammar ની ખબર નથી, એટલે ખોટા કે non-existent શબ્દો બની શકે, ખાસ કરીને irregular forms (mice, went) અથવા over-trim (organization→organ) માટે. Lemmatization actual dictionary/vocabulary અને grammatical (POS) information વાપરીને linguistically સાચું base form શોધે, હંમેશા valid real word આપે, પણ computationally વધુ ખર્ચાળ.", "oneLine": "Stemming = crude rule-based suffix-chopping (can make non-words); Lemmatization = dictionary+grammar-based (always a real word).", "memoryTrick": "\"Stemmer chops blindly, Lemmatizer looks it up\" — stemmer=mechanical, lemmatizer=dictionary-aware.", "quick10": "Porter Stemmer: fast, rule-based, can produce non-words (happily→happili). Lemmatizer: dictionary+grammar-based, always real words (happily→happy, went→go, mice→mouse).", "quick30": "Porter Stemmer mechanically strips suffixes using fixed rules without checking real-word validity, so it can over-trim or fail on irregular forms (caring→car, happily→happili, mice→mice unchanged, organization→organ, went→went unchanged). Lemmatization uses a dictionary/vocabulary plus grammatical (POS) knowledge to find the true base form, always producing valid words (caring→care, happily→happy, mice→mouse, organization→organization, went→go). The difference arises because stemming has no real linguistic knowledge while lemmatization does.", "answerEnMd": "**Porter Stemmer** applies fixed suffix-stripping rules to reduce a word to a root form, without checking dictionary validity. **Lemmatizer** uses vocabulary and grammatical (POS) knowledge to reduce a word to its true dictionary base form (lemma), always producing a valid word.\n\n| Word | Porter Stemmer | Lemmatizer | Reason for Difference |\n|---|---|---|---|\n| caring | car/care | care | Stemmer mechanically strips \"-ing\"; lemmatizer identifies the correct verb base |\n| happily | happili | happy | Stemmer produces a non-word; lemmatizer correctly maps to the adjective root |\n| mice | mice | mouse | Stemming can't handle irregular plurals; lemmatizer uses dictionary lookup |\n| organization | organ | organization | Stemmer over-trims the suffix; lemmatizer preserves correct meaning |\n| went | went | go | Stemming can't handle irregular past tense; lemmatizer uses grammatical knowledge |\n\n**Conclusion:** Stemming is faster but can produce linguistically invalid results, especially for irregular word forms; lemmatization is slower but always linguistically correct, since it relies on actual dictionary and grammar knowledge rather than blind rule-based suffix removal.", "answerGuMd": "**Porter Stemmer** fixed suffix-stripping rules વાપરીને શબ્દને root form માં ઘટાડે, dictionary validity ચેક કર્યા વગર. **Lemmatizer** vocabulary અને grammatical (POS) knowledge વાપરીને શબ્દને સાચા dictionary base form (lemma) માં ઘટાડે, હંમેશા valid word આપે.\n\n| શબ્દ | Porter Stemmer | Lemmatizer | તફાવત નું કારણ |\n|---|---|---|---|\n| caring | car/care | care | Stemmer mechanically \"-ing\" કાઢે; lemmatizer સાચો verb base ઓળખે |\n| happily | happili | happy | Stemmer non-word બનાવે; lemmatizer adjective root પર લાવે |\n| mice | mice | mouse | Stemming irregular plurals handle ના કરી શકે; lemmatizer dictionary lookup વાપરે |\n| organization | organ | organization | Stemmer over-trim કરે; lemmatizer meaning જાળવે |\n| went | went | go | Stemming irregular past tense handle ના કરી શકે; lemmatizer grammatical knowledge વાપરે |\n\n**Conclusion:** Stemming ઝડપી પણ linguistically invalid results આપી શકે, ખાસ કરીને irregular forms માટે; lemmatization ધીમું પણ હંમેશા linguistically સાચું, કારણ કે તે actual dictionary અને grammar knowledge વાપરે, blind rule-based suffix removal ને બદલે.", "mustWrite": ["Present the answer as a table with all 5 given words, both outputs, and a reason column", "Explicitly explain WHY they differ in general (rule-based vs dictionary-based), not just list outputs", "Point out at least one case where stemming produces a non-word (happily→happili) as concrete evidence"], "keywords": ["Porter Stemmer", "Lemmatization", "Lemma", "Morphological Normalization", "Irregular Forms"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Stemming is like using scissors to chop off the end of a word based on a fixed pattern, without checking if what's left makes sense. Lemmatization is like looking the word up in a dictionary and grammar guide to find its real, proper base form — slower, but never produces gibberish.", "examTip": "Whatever new words the exam gives, always include at least one likely irregular form (a plural, a past-tense verb) in your analysis if present — irregular forms are exactly where the Porter Stemmer visibly fails and the lemmatizer visibly succeeds, which is the core point examiners want demonstrated.\n\n## MEDIUM PRIORITY QUESTIONS", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q47", "sr": 47, "question": "Explain the BM25 algorithm for document similarity/ranking (concept-level).", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO5", "coNote": "CO5 (Understand advanced IR ranking functions)", "bloomLevel": "Understand", "priority": "low", "priorityLabel": "Low", "priorityReason": "BM25 appears only in the Winter-2021 paper, which is explicitly flagged as reflecting an older/different syllabus emphasis not closely matching the current PPT content — included only as a concept-level entry for completeness, with no numeric worked example available since the source question asked for explanation only, not calculation.", "easyMeaning": "Briefly explain what the BM25 algorithm is and how it improves on simple TF-IDF-based document ranking.", "understandEnMd": "**BM25 (Best Matching 25)** is a probabilistic ranking function used in information retrieval to score how relevant a document is to a query, and is considered a more advanced/refined alternative to simple TF-IDF-based cosine similarity ranking. It improves on plain TF-IDF by incorporating: **term frequency saturation** (a term appearing 10 times isn't necessarily 10× as important as appearing once — BM25 uses a saturating function so additional occurrences give diminishing returns), and **document length normalization** (BM25 adjusts scores based on how a document's length compares to the average document length in the corpus, preventing longer documents from scoring higher purely because they contain more words). BM25 is widely used in modern search engines as a strong baseline ranking function.", "understandGuMd": "**BM25 (Best Matching 25)** એ information retrieval માં document ને query ને કેટલો relevant છે તે score કરવાનું probabilistic ranking function છે, સાદા TF-IDF-based cosine similarity ranking કરતાં વધુ advanced/refined વિકલ્પ ગણાય. તે plain TF-IDF કરતાં આ રીતે સુધારે: **term frequency saturation** (term 10 વખત આવે એટલે 1 વખત કરતાં 10 ગણું મહત્વનું ના હોય — BM25 saturating function વાપરે જેથી વધારાના occurrences નું value ઘટતું જાય), અને **document length normalization** (document ની length corpus ના average length સાથે કેવી compare થાય તેના આધારે score adjust કરે, જેથી ફક્ત વધારે શબ્દો ધરાવવાથી લાંબા documents વધારે score ના મેળવે). BM25 modern search engines માં widely વપરાય, strong baseline ranking function તરીકે.", "oneLine": "BM25 = improved TF-IDF-style ranking with term-frequency saturation + document-length normalization.", "memoryTrick": "\"BM25 caps the count, corrects for length\" — two key improvements over plain TF-IDF.", "quick10": "BM25 = probabilistic ranking function; improves on TF-IDF via term-frequency saturation (diminishing returns) and document-length normalization.", "quick30": "BM25 (Best Matching 25) is a probabilistic document-ranking function used in modern search engines, improving on simple TF-IDF/cosine-similarity approaches through two mechanisms: term frequency saturation (repeated term occurrences contribute diminishing additional relevance rather than scaling linearly) and document length normalization (adjusts for documents being longer or shorter than the corpus average, so length alone doesn't bias the ranking).", "answerEnMd": "**BM25 (Best Matching 25)** is a probabilistic ranking function for information retrieval that scores document relevance to a query, improving upon basic TF-IDF/cosine-similarity ranking through two key mechanisms: **(1) Term Frequency Saturation** — the contribution of additional occurrences of a query term in a document diminishes (saturates) rather than growing linearly, avoiding over-rewarding term repetition. **(2) Document Length Normalization** — scores are adjusted relative to the average document length in the corpus, so longer documents don't gain an unfair advantage simply by containing more words. BM25 is widely used as a strong baseline ranking algorithm in modern search engines.", "answerGuMd": "**BM25 (Best Matching 25)** information retrieval માટે probabilistic ranking function છે જે document ની query ને relevance score કરે, basic TF-IDF/cosine-similarity ranking કરતાં બે મુખ્ય mechanisms થી સુધારે: **(1) Term Frequency Saturation** — query term ના વધારાના occurrences નું contribution linearly વધવાને બદલે diminish (saturate) થાય. **(2) Document Length Normalization** — scores ને corpus ના average document length ની સાપેક્ષે adjust કરાય, જેથી લાંબા documents ફક્ત વધારે શબ્દો હોવાથી અન્યાયી ફાયદો ના મેળવે. BM25 modern search engines માં strong baseline ranking algorithm તરીકે widely વપરાય.", "mustWrite": ["Name BM25 as a probabilistic ranking function and state it improves on TF-IDF", "Explain both term-frequency saturation and document-length normalization", "Mention it's used in modern/real-world search engines"], "keywords": ["BM25", "Term Frequency Saturation", "Document Length Normalization", "Probabilistic Ranking"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "BM25 is TF-IDF with two smart corrections: it stops giving extra credit once a word has repeated \"enough\" times, and it doesn't let a document win just because it's long and therefore contains more words overall.", "examTip": "Since this source's own coverage of BM25 is conceptual only (explain, not calculate), focus your answer on clearly naming and explaining its two key improvements over TF-IDF — that is what this specific exam question is actually asking for.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q48", "sr": 48, "question": "Analyze reasons for poor Information Retrieval results and evaluate the Vector Space Model as an IR technique.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO5", "coNote": "CO5 (Analyze and evaluate information retrieval techniques)", "bloomLevel": "Analyze", "priority": "med", "priorityLabel": "Medium", "priorityReason": "This combines Assignment-2 Q9 (poor retrieval reasons/query formulation) and Q10 (evaluate VSM as an IR technique) — both directly assigned questions, though narrower in scope than the core VSM/cosine-similarity/TF-IDF numericals.", "easyMeaning": "Explain why a search engine might return poor/irrelevant results for a query, how better query formulation helps, and evaluate the strengths/weaknesses of the Vector Space Model as a search technique.", "understandEnMd": "**Reasons for poor retrieval results** (e.g. a search for \"natural language processing applications\" returning documents with only one matching term): (1) the query terms may be too generic/ambiguous, matching documents on a single common word rather than the full intended meaning; (2) **synonymy** — relevant documents may use different words for the same concept (e.g. \"NLP\" instead of \"natural language processing\"), so exact term-matching misses them; (3) **polysemy** — a query term might match documents where the word is used in an unrelated sense; (4) the Vector Space Model treats all query terms independently (bag-of-words), so a document matching just one rare query term can still score non-trivially even if it's irrelevant to the query as a whole.\n\n**How query formulation can help:** using more specific/multi-word phrases, adding synonyms or related terms (query expansion), applying TF-IDF weighting so rare/distinctive terms matter more than common ones, and using relevance feedback (letting the user mark good/bad results to refine the query).\n\n**Evaluating VSM as an IR technique:**\n**Advantages:** simple and intuitive mathematical foundation; supports partial matching (documents don't need to match a query exactly, just approximately, unlike basic boolean retrieval which needs exact term presence/absence); enables ranking documents by degree of relevance (via cosine similarity) rather than a strict yes/no match; computationally efficient for large collections when combined with TF-IDF weighting.\n**Limitations:** treats text as a \"bag of words\" — ignores word order, grammar, and semantic relationships between terms; cannot capture synonymy (misses relevant documents using different words) or polysemy (a term's multiple meanings aren't distinguished); assumes term independence, which is often false in real language; performance/dimensionality challenges with very large vocabularies.\n**Compared to basic (Boolean) retrieval:** VSM is a significant improvement because it supports ranked, \"how relevant\" results using similarity scores instead of a strict all-or-nothing match, making it much better suited to real-world search where documents are rarely a perfect or complete match to a query.", "understandGuMd": "**Poor retrieval results ના કારણો** (દા.ત. \"natural language processing applications\" search માટે ફક્ત એક matching term ધરાવતા documents મળે): (1) query terms વધુ પડતા generic/ambiguous હોઈ શકે; (2) **Synonymy** — relevant documents એ જ concept માટે અલગ શબ્દો વાપરી શકે (દા.ત. \"NLP\" ને બદલે \"natural language processing\"), exact matching ચૂકી જાય; (3) **Polysemy** — query term ના અલગ meaning વાળા documents પણ match થઈ શકે; (4) VSM બધા query terms ને independent ગણે (bag-of-words), એટલે ફક્ત એક દુર્લભ term match કરતું irrelevant document પણ non-trivial score મેળવી શકે.\n\n**Query formulation કેવી રીતે મદદ કરે:** વધુ specific/multi-word phrases વાપરવા, synonyms/related terms ઉમેરવા (query expansion), TF-IDF weighting લગાવવું, relevance feedback વાપરવું.\n\n**VSM ને IR technique તરીકે evaluate કરવું:**\n**Advantages:** સાદો, intuitive mathematical foundation; partial matching support કરે; cosine similarity થી ranked relevance આપે; TF-IDF સાથે large collections માટે efficient.\n**Limitations:** bag-of-words (word order/grammar/semantic relationships ignore કરે); synonymy/polysemy capture નથી કરી શકતું; term independence ધારે (ઘણી વાર ખોટું); મોટી vocabularies માટે dimensionality challenges.\n**Basic (Boolean) retrieval સાથે સરખામણી:** VSM મોટો સુધારો છે કારણ કે strict all-or-nothing match ને બદલે ranked, \"કેટલું relevant\" results આપે.", "oneLine": "Poor retrieval causes: synonymy, polysemy, term-independence assumption; VSM advantage=ranked partial matching, limitation=bag-of-words ignores meaning/order.", "memoryTrick": "\"Same word, different meaning (polysemy); different word, same meaning (synonymy)\" — VSM struggles with both.", "quick10": "Poor retrieval: synonymy/polysemy/term-independence issues. VSM pros: ranked partial matching, better than Boolean. VSM cons: bag-of-words, no word order/semantics.", "quick30": "Poor IR results often stem from synonymy (relevant docs use different words), polysemy (query term has multiple meanings), overly generic queries, and VSM's term-independence assumption. Query formulation improvements: specific multi-word phrases, query expansion with synonyms, TF-IDF weighting, relevance feedback. VSM advantages over basic Boolean retrieval: ranked/partial-match results via cosine similarity rather than strict all-or-nothing matching, simple and efficient. VSM limitations: bag-of-words model ignores word order and semantics, can't handle synonymy/polysemy, assumes term independence.", "answerEnMd": "**Reasons for poor retrieval:** (1) Synonymy — relevant documents use different terms for the same concept, missed by exact matching. (2) Polysemy — a query term's other senses match irrelevant documents. (3) Overly generic/single-term matches scoring non-trivially despite overall irrelevance, due to VSM's term-independence (bag-of-words) assumption. **Improving via query formulation:** use specific multi-word phrases, apply query expansion (synonyms/related terms), weight terms via TF-IDF, and incorporate relevance feedback.\n\n**Evaluating VSM as an IR technique:** **Advantages** — enables ranked, partial-match retrieval (documents scored by degree of relevance via cosine similarity) rather than the strict exact-match requirement of basic Boolean retrieval; mathematically simple and computationally efficient with TF-IDF weighting. **Limitations** — the bag-of-words assumption ignores word order and grammar; cannot capture synonymy or polysemy; assumes term independence, which doesn't reflect real language; can face dimensionality/scalability issues with very large vocabularies. Overall, VSM is a substantial improvement over basic Boolean retrieval for handling document similarity and ranking, though modern systems often extend it (e.g. with word embeddings) to address its semantic limitations.", "answerGuMd": "**Poor retrieval ના કારણો:** (1) Synonymy — relevant documents એ જ concept માટે અલગ શબ્દો વાપરે. (2) Polysemy — query term ના બીજા senses irrelevant documents ને match કરે. (3) VSM ના term-independence (bag-of-words) assumption ને લીધે ફક્ત એક generic term match irrelevant document ને પણ score આપે. **Query formulation થી સુધારો:** specific multi-word phrases, query expansion, TF-IDF weighting, relevance feedback.\n\n**VSM ને IR technique તરીકે evaluate:** **Advantages** — ranked, partial-match retrieval (cosine similarity થી), basic Boolean retrieval ના strict exact-match કરતાં વધુ સારું; mathematically સાદું, TF-IDF સાથે efficient. **Limitations** — bag-of-words word order/grammar ignore કરે; synonymy/polysemy capture ના કરી શકે; term independence ધારે; મોટી vocabularies માટે dimensionality challenges. એકંદરે, VSM basic Boolean retrieval કરતાં નોંધપાત્ર સુધારો છે, જોકે modern systems ઘણી વાર તેને (word embeddings સાથે) extend કરે.", "mustWrite": ["Name synonymy and polysemy explicitly as causes of poor retrieval", "List at least 2 concrete query-formulation improvements", "Give a balanced Advantages AND Limitations evaluation of VSM, explicitly compared to basic/Boolean retrieval"], "keywords": ["Information Retrieval", "Synonymy", "Polysemy", "Query Expansion", "Relevance Feedback", "Bag-of-Words"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A search engine is like a librarian who only recognizes exact words you say — if you ask for \"car\" but the best book uses \"automobile,\" the librarian misses it (synonymy); if you ask about a \"bank\" and mean a river, but get books about money (polysemy), the search failed for a different reason. VSM is a big upgrade over \"match or no match\" librarians, but it still doesn't truly understand meaning.", "examTip": "When asked to \"evaluate\" VSM, always structure the answer as explicit Advantages vs Limitations vs Comparison-to-Boolean-retrieval — a one-sided answer (only listing advantages) loses marks at the Evaluate Bloom's level, which specifically expects balanced judgment.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q49", "sr": 49, "question": "Explain the Hamming Distance metric and compute the normalized Hamming Distance for given words.", "questionPreamble": "", "unit": 5, "unitTitle": "Vector Space Model, Word Embeddings & Text Processing", "co": "CO4", "coNote": "CO4 (Apply string-distance metrics)", "bloomLevel": "Apply", "priority": "low", "priorityLabel": "Low", "priorityReason": "Hamming Distance appears in only one real paper sampled (the Winter-2021 final for 01AI0702), which is itself flagged as reflecting an older/different syllabus emphasis (heavy on deep-learning topics not matching the current PPT content) — included for completeness since it is a real, fully-solvable exam question, but with lower confidence of repetition than the Minimum Edit Distance questions.", "easyMeaning": "Explain how Hamming Distance counts mismatched positions between two equal-length strings, and compute it (plus its normalized version) for the given word pair.", "understandEnMd": "**Hamming Distance** between two strings of EQUAL LENGTH is the number of positions at which the corresponding characters differ. Formula: HammingDistance(u,v) = Σᵢ [uᵢ ≠ vᵢ] (count positions where characters don't match), only defined when |u|=|v|. **Normalized Hamming Distance** = HammingDistance(u,v) / length(u) — expressing the mismatch as a fraction/percentage rather than a raw count, useful for comparing strings of different overall lengths.\n\n**Worked Example — \"Banana\" vs \"Boxing\" (both 6 letters):**\nPosition 1: B vs B → match. Position 2: a vs o → mismatch. Position 3: n vs x → mismatch. Position 4: a vs i → mismatch. Position 5: n vs n → match. Position 6: a vs g → mismatch.\nMismatched positions = 4 (positions 2, 3, 4, 6). **Hamming Distance = 4.**\n**Normalized Hamming Distance = 4/6 ≈ 0.667** (about 66.7% of the characters differ).", "understandGuMd": "**Hamming Distance** સરખી LENGTH ધરાવતા બે strings વચ્ચે, જે positions પર characters અલગ હોય તેની સંખ્યા છે. Formula: HammingDistance(u,v) = Σᵢ [uᵢ ≠ vᵢ], ફક્ત |u|=|v| હોય ત્યારે જ define થાય. **Normalized Hamming Distance** = HammingDistance(u,v) / length(u) — mismatch ને fraction/percentage તરીકે બતાવે.\n\n**Worked Example — \"Banana\" vs \"Boxing\" (બંને 6 letters):**\nPosition 1: B vs B → match. Position 2: a vs o → mismatch. Position 3: n vs x → mismatch. Position 4: a vs i → mismatch. Position 5: n vs n → match. Position 6: a vs g → mismatch.\nMismatched positions = 4. **Hamming Distance = 4.**\n**Normalized Hamming Distance = 4/6 ≈ 0.667.**", "oneLine": "Hamming Distance = count of mismatched positions (equal-length strings only); Normalized = Hamming Distance / length.", "memoryTrick": "\"Hamming = Head-on comparison\" — compare position 1 to position 1, position 2 to position 2, etc., no shifting allowed (unlike edit distance).", "quick10": "Hamming Distance = mismatched-position count for equal-length strings; \"Banana\" vs \"Boxing\" = 4 mismatches out of 6 → normalized ≈0.667.", "quick30": "Hamming Distance counts differing character positions between two equal-length strings (unlike edit distance, it allows no insertions/deletions — only direct position-by-position comparison). Normalized Hamming Distance divides this count by the string length. For \"Banana\" (B-a-n-a-n-a) vs \"Boxing\" (B-o-x-i-n-g): positions 1 and 5 match (B,n); positions 2,3,4,6 mismatch (a≠o, n≠x, a≠i, a≠g) → Hamming Distance=4, Normalized=4/6≈0.667.", "answerEnMd": "**Hamming Distance** between two equal-length strings u and v is the count of positions where corresponding characters differ: **HammingDistance(u,v) = Σᵢ [uᵢ ≠ vᵢ]**. **Normalized Hamming Distance = HammingDistance(u,v) / length**.\n\n**Worked Numerical — \"Banana\" vs \"Boxing\":**\n| Position | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| Banana | B | a | n | a | n | a |\n| Boxing | B | o | x | i | n | g |\n| Match? | ✓ | ✗ | ✗ | ✗ | ✓ | ✗ |\n\nMismatches = 4 (positions 2,3,4,6). **Hamming Distance = 4.** **Normalized Hamming Distance = 4/6 ≈ 0.667.**", "answerGuMd": "**Hamming Distance** સરખી length ધરાવતા બે strings u અને v વચ્ચે, જે positions પર characters અલગ હોય તેની ગણતરી: **HammingDistance(u,v) = Σᵢ [uᵢ ≠ vᵢ]**. **Normalized Hamming Distance = HammingDistance(u,v) / length**.\n\n**Worked Numerical — \"Banana\" vs \"Boxing\":**\n| Position | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| Banana | B | a | n | a | n | a |\n| Boxing | B | o | x | i | n | g |\n| Match? | ✓ | ✗ | ✗ | ✗ | ✓ | ✗ |\n\nMismatches = 4. **Hamming Distance = 4. Normalized = 4/6 ≈ 0.667.**", "mustWrite": ["State clearly that Hamming Distance requires EQUAL-length strings", "Show the position-by-position comparison table, not just the final count", "Compute both the raw Hamming Distance AND the normalized version if asked"], "keywords": ["Hamming Distance", "Normalized Hamming Distance", "Equal-Length Strings", "Position-wise Comparison"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Hamming distance is like overlaying two words letter-by-letter and counting how many letters don't line up — no sliding or skipping allowed, just a direct position-by-position check.", "examTip": "Double-check both words are the same length before starting — Hamming Distance is undefined for different-length strings (unlike edit distance, which handles that case using insertions/deletions).", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}]};

<script type="text/babel" data-presets="react">
/* ============================================================
   NLP Final Exam Master — 49 Questions (Natural Language
   Processing, 01CE0718 / 01AI0702). Single-file React app
   (React 18 UMD + Babel Standalone). All content lives in
   window.NLP_DATA and is rendered through Markdown() — this
   file only adds presentation, navigation, search, filters,
   the 3-tier Quick/Revision/Exam toggle, 1-Hour Mode, Last
   Moment Revision, Last-5-Minutes Mode, I Forgot Everything
   story mode, and local persistence. Reuses the Compiler
   Design / DWDM design system (same component patterns /
   class names) — only the subject-specific content changes.
   ============================================================ */

const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

function parseMd(md) {
  if (!md) return '';
  try {
    return window.marked.parse ? window.marked.parse(md, { gfm: true }) : window.marked(md);
  } catch (e) {
    return '<p>' + String(md) + '</p>';
  }
}

function Markdown({ md, className, gu = false }) {
  const ref = useRef(null);
  const html = useMemo(() => parseMd(md), [md]);
  useEffect(() => {
    const root = ref.current;
    if (!root) return;
    root.querySelectorAll('table').forEach((table) => {
      if (table.parentElement.classList.contains('table-wrap')) return;
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
    root.querySelectorAll('pre').forEach((pre) => {
      if (pre.parentElement.classList.contains('code-block-wrap')) return;
      const code = pre.querySelector('code');
      const wrap = document.createElement('div');
      wrap.className = 'code-block-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'code-copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        const text = code ? code.textContent : pre.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {});
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
      });
      wrap.appendChild(btn);
    });
  }, [html]);
  if (!md) return null;
  return <div ref={ref} className={'md-content' + (gu ? ' gu-text' : '') + (className ? ' ' + className : '')} dangerouslySetInnerHTML={{ __html: html }} />;
}

/* ------------------------------------------------------------
   Persistence
   ------------------------------------------------------------ */
function loadIdSet(key) {
  try { const raw = localStorage.getItem(key); if (!raw) return new Set(); return new Set(JSON.parse(raw)); }
  catch (e) { return new Set(); }
}
function saveIdSet(key, set) {
  try { localStorage.setItem(key, JSON.stringify(Array.from(set))); } catch (e) {}
}

const AppCtx = createContext(null);
function useApp() { return useContext(AppCtx); }

/* ------------------------------------------------------------
   Priority meta
   ------------------------------------------------------------ */
const PRIORITY_META = {
  vh: { label: 'Very High', dot: '🔴', cls: 'priority-veryhigh' },
  high: { label: 'High', dot: '🟠', cls: 'priority-high' },
  med: { label: 'Medium', dot: '🟡', cls: 'priority-medium' },
  low: { label: 'Low', dot: '🟢', cls: 'priority-low' },
};
const PRIORITY_ORDER = ['vh', 'high', 'med', 'low'];

function PriorityChip({ priority }) {
  const m = PRIORITY_META[priority] || PRIORITY_META.low;
  return (
    <span className={'priority-chip ' + m.cls + ' inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold whitespace-nowrap'}>
      <span>{m.dot}</span><span>{m.label} Priority</span>
    </span>
  );
}
function UnitChip({ unit }) {
  if (!unit) return null;
  return <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200 dark:bg-slate-700/50 dark:text-slate-300 dark:border-slate-600 whitespace-nowrap">Unit {unit}</span>;
}
function KeywordPills({ keywords, small }) {
  if (!keywords || !keywords.length) return null;
  return (
    <div className="flex flex-wrap gap-2">
      {keywords.map((k, i) => <span key={i} className={'kw-pill anim-pop' + (small ? ' text-[0.72rem] py-1' : '')} style={{ animationDelay: (i * 0.02) + 's' }}>{k}</span>)}
    </div>
  );
}
function MustWriteBox({ items }) {
  if (!items || !items.length) return null;
  return (
    <div className="mustwrite-box">
      <div className="font-extrabold text-emerald-800 dark:text-emerald-300 text-sm uppercase tracking-wide mb-2 flex items-center gap-2"><span>⭐</span> Must Write for Full Marks</div>
      {items.map((it, i) => <div className="mustwrite-item" key={i}><span className="mustwrite-check">✓</span><span>{it}</span></div>)}
    </div>
  );
}
function DiagramBlock({ diagramMd, howToDrawMd }) {
  if (!diagramMd) return null;
  return (
    <div className="diagram-box anim-fade-in">
      <div className="diagram-box-header">📐 Exam Diagram</div>
      <div className="p-4 space-y-3">
        <Markdown md={diagramMd} />

      setOpen(true);

      setTimeout(() => { if (cardRef.current) cardRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 80);

/* ------------------------------------------------------------
   Filters
   ------------------------------------------------------------ */
const FULL_FILTERS = [
  { id: 'all', label: 'All 49' },
  { id: 'vh', label: '🔴 Very High' },
  { id: 'high', label: '🟠 High' },
  { id: 'med', label: '🟡 Medium' },
  { id: 'low', label: '🟢 Low' },
  { id: 'unit1', label: 'Unit 1' }, { id: 'unit2', label: 'Unit 2' }, { id: 'unit3', label: 'Unit 3' }, { id: 'unit4', label: 'Unit 4' }, { id: 'unit5', label: 'Unit 5' },
  { id: 'numerical', label: '🧮 Numerical' },
  { id: 'algorithm', label: '⚙️ Algorithm' },
  { id: 'diagram', label: '📐 Diagram' },
  { id: 'theory', label: '📖 Theory' },
  { id: 'prepared', label: '✅ Prepared' },
  { id: 'notprepared', label: '☐ Not Prepared' },
];
function matchesFilterNlp(q, filter, preparedSet) {
  switch (filter) {
    case 'all': return true;
    case 'vh': case 'high': case 'med': case 'low': return q.priority === filter;
    case 'unit1': case 'unit2': case 'unit3': case 'unit4': case 'unit5': return q.unit === Number(filter.slice(4));
    case 'numerical': return q.isNumerical;
    case 'algorithm': return q.isAlgorithm;
    case 'diagram': return q.isDiagram;
    case 'theory': return !q.isNumerical;
    case 'prepared': return preparedSet.has(q.id);
    case 'notprepared': return !preparedSet.has(q.id);
    default: return true;
  }
}
function FilterBar({ active, onChange, filters = FULL_FILTERS }) {
  return (
    <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 -mx-1 px-1">
      {filters.map((f) => (
        <button key={f.id} onClick={() => onChange(f.id)}
          className={'flex-none px-3.5 py-1.5 rounded-full text-sm font-semibold border transition-all ' +
            (active === f.id ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-indigo-300 dark:hover:border-indigo-500')}>
          {f.label}
        </button>
      ))}
    </div>
  );
}

const UNIT_ICON = { 1: '🔤', 2: '🧩', 3: '🧠', 4: '📊', 5: '📐' };
function computeOneHourPlan(data) {
  const groups = data.meta.unitGroups;
  const weights = groups.map((g) => Math.max(1, g.veryHighCount + g.highCount));
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  let minutes = weights.map((w) => Math.round((w / totalWeight) * 60));
  let diff = 60 - minutes.reduce((a, b) => a + b, 0);
  if (diff !== 0) {
    const maxIdx = weights.indexOf(Math.max(...weights));
    minutes[maxIdx] += diff;
  }
  let cursor = 0;
  return groups.map((g, i) => {
    const start = cursor; cursor += minutes[i];
    return { unit: g.unit, title: g.title, minutes: minutes[i], start, end: cursor, group: g };
  });
}

/* ------------------------------------------------------------
   "I Forgot Everything" story mode — hand-authored narrative,
   bilingual toggle, built from the real course concepts
   ------------------------------------------------------------ */
const FORGOT_STORY_EN = `
### 😵 Forgot everything? Here's the whole subject as one story.

Imagine you say a sentence to a computer: **"Book the flight to Delhi."** Follow what the computer must do, step by step, and you have re-learned the entire subject.

**1. Text → Tokens (Word-Level Analysis).** First, the computer breaks your sentence into pieces: "Book", "the", "flight", "to", "Delhi". This is **Tokenization**. It also strips words to their roots (Stemming/Lemmatization) and studies word-building blocks like prefixes and suffixes (**Morphological Analysis**) — regex patterns help spot structured pieces like dates or emails along the way.

**2. Tokens → Structure (Syntactic Analysis).** Next, the computer checks whether the words fit together grammatically, using a **Context-Free Grammar (CFG)** and building a **Parse Tree** — "Book" as a Verb, "the flight" as a Noun Phrase. Algorithms like **CYK** and taggers using **HMM + Viterbi** figure out the correct grammatical role (POS tag) of every word, even when a word could be more than one part of speech.

**3. Structure → Meaning (Semantic Analysis).** Now the computer asks: what does this actually MEAN? It uses **Frames** (slots for Flight: Source, Destination, Date), **Conceptual Dependency** (the primitive action here is PTRANS — a transfer of location), and **Word Sense Disambiguation** to make sure "flight" means an airplane journey, not a flight of stairs. **Vector Space Models** and **word embeddings** help it compare this sentence's meaning to others mathematically.

**4. Meaning → Context (Discourse Integration).** If you then say "It leaves at 6 PM", the computer must realize "It" refers back to the flight you just booked — this is **Anaphora/Coreference Resolution**, connecting meaning ACROSS sentences, not just within one.

**5. Context → Intention (Pragmatic Analysis).** Finally, the computer understands your real-world intention: you don't just want information about a flight, you want it BOOKED. This is where language meets action.

**6. All Together → NLP Applications.** Chain all five phases together and you get real systems: chatbots, machine translation, sentiment analysis, spelling correction, search engines, and voice assistants — every one of them is just this same Text → Tokens → Structure → Meaning → Context → Intention pipeline, applied to a real problem.

**The whole subject in one line:** Text → Tokenize → Parse (Syntax) → Understand (Semantics) → Connect sentences (Discourse) → Understand intent (Pragmatics) → Build an Application.
`;

**3. Structure → Meaning (Semantic Analysis).** હવે computer પૂછે: આનો ખરેખર અર્થ શું છે? તે **Frames** વાપરે (Flight માટે slots: Source, Destination, Date), **Conceptual Dependency** (અહીં primitive action PTRANS છે — location નું transfer), અને **Word Sense Disambiguation** વાપરે એ સુનિશ્ચિત કરવા કે "flight" નો અર્થ airplane journey છે, સીડીઓની flight નહીં. **Vector Space Models** અને **word embeddings** આ sentence ના meaning ને બીજા sentences સાથે mathematically compare કરવામાં મદદ કરે.

**4. Meaning → Context (Discourse Integration).** જો તમે પછી કહો "It leaves at 6 PM", તો computer એ સમજવું જોઈએ કે "It" તમે હમણાં book કરેલી flight ને refer કરે છે — આ **Anaphora/Coreference Resolution** છે, sentences ની વચ્ચે meaning જોડે છે, ફક્ત એકની અંદર નહીં.

**5. Context → Intention (Pragmatic Analysis).** છેલ્લે, computer તમારો real-world ઈરાદો સમજે: તમારે ફક્ત flight વિશે માહિતી નથી જોઈતી, તમારે તે BOOK કરાવવી છે. અહીં ભાષા action સાથે મળે છે.

**6. બધું ભેગું → NLP Applications.** પાંચેય phases ને સાંકળો અને તમને real systems મળે: chatbots, machine translation, sentiment analysis, spelling correction, search engines, અને voice assistants — તે દરેક આ જ Text → Tokens → Structure → Meaning → Context → Intention pipeline છે, એક real problem પર લગાવેલી.

**આખો subject એક લીટીમાં:** Text → Tokenize → Parse (Syntax) → સમજો (Semantics) → Sentences જોડો (Discourse) → Intent સમજો (Pragmatics) → Application બનાવો.
`;

function SearchView({ query, allQuestions }) {
  const q = query.trim().toLowerCase();
  const results = useMemo(() => {
    if (!q) return [];
    return allQuestions.filter((item) => {
      const hay = [
        item.question, item.easyMeaning, item.understandEnMd, item.understandGuMd, item.answerEnMd, item.answerGuMd,
        item.quick10, item.quick30, item.oneLine, (item.keywords || []).join(' '), (item.mustWrite || []).join(' '),
        item.priorityLabel, 'unit' + item.unit, item.examTip, item.diagramMd, item.algorithmMd,
      ].join(' \n ').toLowerCase();
      return hay.includes(q);
    });
  }, [q, allQuestions]);
  return (
    <div className="space-y-5">
      <div className="rounded-2xl p-6 sm:p-7 bg-gradient-to-br from-slate-700 to-slate-900 text-white anim-fade-in">
        <h1 className="text-xl sm:text-2xl font-extrabold">🔎 Search Results for "{query}"</h1>
        <p className="text-slate-300 mt-1 text-sm">{results.length} question{results.length === 1 ? '' : 's'} found across all 49</p>

      {results.length === 0 ? (
        <div className="text-center py-16 text-slate-400 dark:text-slate-500 font-medium">No matches. Try "Viterbi", "CYK", "Frames", "TF-IDF", "Regex"…</div>
      ) : (
        <div className="space-y-5">{results.map((item) => <QuestionCard key={item.id} q={item} defaultOpen />)}</div>
      )}
    </div>
  );
}

function App() {
  const data = window.NLP_DATA;
  const allQuestions = useMemo(() => data.questions.slice().sort((a, b) => a.sr - b.sr), [data]);
  const byUnitGroup = useMemo(() => Object.fromEntries(data.meta.unitGroups.map((g) => [g.unit, g])), [data]);

  const [route, setRoute] = useState((location.hash || '#dashboard').slice(1));
  const [mobileOpen, setMobileOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const [prepared, setPrepared] = useState(() => loadIdSet('nlp_prepared'));
  const [bookmarks, setBookmarks] = useState(() => loadIdSet('nlp_bookmarks'));
  const [checklist, setChecklist] = useState(() => {
    try { const raw = localStorage.getItem('nlp_checklist'); if (raw) return new Set(JSON.parse(raw)); } catch (e) {}
    return new Set();
  });
  const [focusId, setFocusId] = useState(null);
  const [dark, setDark] = useState(() => {
    try { const saved = localStorage.getItem('nlp_theme'); if (saved) return saved === 'dark'; } catch (e) {}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  });

  useEffect(() => {
    const onHash = () => setRoute((location.hash || '#dashboard').slice(1));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('nlp_theme', dark ? 'dark' : 'light'); } catch (e) {}
  }, [dark]);
  useEffect(() => { if (!focusId) window.scrollTo({ top: 0 }); }, [route]);

  const togglePrepared = useCallback((id) => {
    setPrepared((prev) => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); saveIdSet('nlp_prepared', next); return next; });
  }, []);
  const toggleBookmark = useCallback((id) => {
    setBookmarks((prev) => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); saveIdSet('nlp_bookmarks', next); return next; });
  }, []);
  const toggleChecklist = useCallback((i) => {
    setChecklist((prev) => { const next = new Set(prev); if (next.has(i)) next.delete(i); else next.add(i); try { localStorage.setItem('nlp_checklist', JSON.stringify(Array.from(next))); } catch (e) {} return next; });
  }, []);

  const goTo = (id) => { location.hash = id; setRoute(id); };
  const goToQuestion = useCallback((id) => { setFocusId(id); location.hash = 'all-questions'; setRoute('all-questions'); }, []);
  const clearFocus = useCallback(() => setFocusId(null), []);

  const ctxValue = { prepared, togglePrepared, bookmarks, toggleBookmark, checklist, toggleChecklist, preparedCount: prepared.size, total: allQuestions.length, focusId, clearFocus, goToQuestion, goTo };

  let content;
  if (searchQuery.trim()) {
    content = <SearchView query={searchQuery} allQuestions={allQuestions} />;
  } else if (route === 'dashboard') {
    content = <Dashboard data={data} goTo={goTo} />;
  } else if (route === 'top10') {
    content = <TopTenPage data={data} allQuestions={allQuestions} />;
  } else if (route === 'all-questions') {
    content = <AllQuestionsPage allQuestions={allQuestions} />;
  } else if (route === 'p-vh') {
    content = <QuestionListPage title="Very High Priority" icon="🔴" gradient="from-red-600 to-rose-700" questions={allQuestions.filter((q) => q.priority === 'vh')} />;
  } else if (route === 'p-high') {
    content = <QuestionListPage title="High Priority" icon="🟠" gradient="from-orange-500 to-amber-600" questions={allQuestions.filter((q) => q.priority === 'high')} />;
  } else if (route === 'p-med') {
    content = <QuestionListPage title="Medium Priority" icon="🟡" gradient="from-amber-400 to-yellow-500" questions={allQuestions.filter((q) => q.priority === 'med')} />;
  } else if (route === 'p-low') {
    content = <QuestionListPage title="Low Priority" icon="🟢" gradient="from-emerald-500 to-teal-600" questions={allQuestions.filter((q) => q.priority === 'low')} />;
  } else if (route === 'units') {
    content = <UnitsHubPage data={data} goTo={goTo} />;
  } else if (route.startsWith('unit-')) {
    const unit = Number(route.split('-')[1]);
    content = <UnitPage unit={unit} unitGroup={byUnitGroup[unit]} allQuestions={allQuestions} />;
  } else if (route === 'paper-analysis') {
    content = <PaperAnalysisPage data={data} />;
  } else if (route === 'assignments') {
    content = <AssignmentQuestionsPage data={data} />;
  } else if (route === 'numericals') {
    content = <NumericalsGlancePage data={data} />;
  } else if (route === 'diagrams') {
    content = <DiagramsGlancePage data={data} />;
  } else if (route === 'algorithms') {
    content = <AlgorithmsGlancePage data={data} />;
  } else if (route === 'differences') {
    content = <DifferencesGlancePage data={data} />;
  } else if (route === 'formulas') {
    content = <FormulasGlancePage data={data} />;
  } else if (route === 'bookmarks') {
    content = <BookmarksView allQuestions={allQuestions} />;
  } else if (route === 'prepared') {
    content = <PreparedView allQuestions={allQuestions} />;
  } else if (route === 'lastmoment') {
    content = <LastMomentRevisionPage data={data} allQuestions={allQuestions} />;
  } else if (route === 'onehour') {
    content = <OneHourModePage data={data} allQuestions={allQuestions} />;
  } else if (route === 'last5') {
    content = <Last5MinutesPage data={data} allQuestions={allQuestions} />;
  } else if (route === 'forgot') {
    content = <IForgotEverythingPage />;
  } else if (route === 'progress') {
    content = <ProgressPage data={data} allQuestions={allQuestions} />;
  } else {
    content = <Dashboard data={data} goTo={goTo} />;
  }

  return (
    <AppCtx.Provider value={ctxValue}>
      <div className="min-h-screen flex bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
        <Sidebar route={searchQuery.trim() ? '' : route} goTo={goTo} mobileOpen={mobileOpen} closeMobile={() => setMobileOpen(false)} />
        <div className="flex-1 min-w-0 flex flex-col">
          <TopBar onMenu={() => setMobileOpen(true)} searchQuery={searchQuery} setSearchQuery={setSearchQuery} dark={dark} setDark={setDark} />
          <main className="flex-1 px-4 sm:px-6 lg:px-8 py-6 max-w-6xl w-full mx-auto">{content}</main>
          <footer className="text-center text-xs text-slate-400 dark:text-slate-600 py-6">Built for exam prep, not for browsing. બેસ્ટ ઓફ લક! 🎓</footer>
        </div>
      </div>
    </AppCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

</html>
