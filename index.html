 "Unification/feature structures", "Dependency Grammar", "HMM+Viterbi numerical (\"the cat is cute\")", "Accuracy calculation (160/200 correctly tagged)", "Unsmoothed N-gram challenges", "Transformation-based tagging", "WSD challenges", "Bootstrapping methods", "Discourse segmentation", "Hobbs algorithm for anaphora resolution", "Applications of NLP", "Transformational grammar", "Word Similarity (Thesaurus vs Distributional)", "FOL vs Description Logics", "Levels in NLP", "Shallow/top-down/bottom-up parsing", "Unification", "Treebanks"]}, {"title": "Final Exam — Dec 2022 (01AI0702)", "date": "Dec 2022", "totalMarks": 100, "examType": "Final (MCQ+Short+Long)", "moduleWeightage": [], "coWeightage": [], "bloomWeightage": [], "topics": ["MCQs: bigram count, HMM for speech recognition, duck noun/verb tagging", "NLP pipeline building", "Bigram probability \"i want chinese food\"", "History of NLP evaluation", "Edit distance importance", "WSD methods", "NLP applications essay", "Unigram perplexity", "N-gram probability derivation", "Smoothing methods", "Syntactic analysis essay", "Discourse/pronoun resolution", "Semantic analysis tasks", "WSD challenges", "Description logic", "Shallow parsing", "Grammar types essay", "Semantic system basic units", "POS tagging with HMM + Viterbi comments"]}, {"title": "Final Exam — Winter 2021 (01AI0702)", "date": "Winter 2021", "totalMarks": 100, "examType": "Final (older/different syllabus emphasis)", "moduleWeightage": [], "coWeightage": [], "bloomWeightage": [], "topics": ["Flagged as reflecting an older/different syllabus (heavy LSTM/GRU/RNN/Word2Vec/vanishing-gradient MCQs, SVD, one-hot encoding)", "Bigram probability (p(house|the))", "Cosine similarity (w1=(0.2,0.1,0.3,0.4), w2=(0.3,0,0.2,0.5))", "Hamming distance (Banana/Boxing)", "TF-IDF (10,000-doc corpus, \"data\" term)", "Levenshtein: \"believe\"→\"belieev\"", "BM25 for document similarity", "Dependency-grammar-tree drawing", "Doc2Vec/CBOW pseudocode", "K-means/agglomerative cl  "q8"}, {"no": 8, "text": "CFG derivation for \"Rahul submitted the assignment.\"", "mappedId": "q10"}, {"no": 9, "text": "\"I saw the man with a telescope\" structural ambiguity (two parse trees)", "mappedId": "q3"}, {"no": 10, "text": "FOPL conversion — 5 statements about students/researchers", "mappedId": "q24"}, {"no": 11, "text": "Semantic Network: Bird/Sparrow/Penguin inheritance", "mappedId": "q19"}, {"no": 12, "text": "Frames: Student/Faculty/Course", "mappedId": "q17"}, {"no": 13, "text": "Conceptual Dependency: \"Riya gave Rahul a laptop.\"", "mappedId": "q18"}, {"no": 14, "text": "Forward Chaining: Fever/Cough/Flu/Pneumonia/Hospitalize", "mappedId": "q20"}, {"no": 15, "text": "Case Grammar: \"The doctor examined the patient with a stethoscope in the hospital.\"", "mappedId": "q21"}, {"no": 16, "text": "Conceptual Graph: \"The professor teaches NLP to final-year students using smart boards.\"", "mappedId": "q22"}, {"no": 17, "text": "Relationship Extraction: \"Google acquired DeepMind in 2014...\"", "mappedId": "q23"}]}, {"title": "Assignment 2", "subtitle": "CO4–CO5, Issued 19 Aug 2026", "questions": [{"no": 1, "text": "Bigram probability of \"I like NLP\" from corpus \"I like NLP\"/\"I like AI\"/\"I love NLP\"", "mappedId": "q30"}, {"no": 2, "text": "Laplace smoothing: vocab=10, bigram count=2, first-word count=20", "mappedId": "q31"}, {"no": 3, "text": "Compare Laplace/backoff/deleted-interpolation for a sparse corpus", "mappedId": "q32"}, {"no": 4, "text": "Viterbi for \"Book the flight\" (N/V/D tags) — data incomplete in source", "mappedId": "q37"}, {"no": 5, "text": "Viterbi for \"The dog barks\" (N/V tags) — fully specified", "mappedId": "q36"}, {"no": 6, "text": "Cosine similarity: 3 machine-learning/healthcare documents, query \"machine learning\"", "mappedId": "q43"}, {"no": 7, "text": "Cosine similarity: D1=(2,3,1), D2=(1,1,2), Q=(1,2,1)", "mappedId": "q43"}, {"no": 8, "text": "Weighted document score: NLP/search/model, freq 3/2/1, weights 0.5/0.8/0.6", "mappedId": "q42"}, {"no": 9, "text": "Poor retrieval results / query formulation", "mappedId": "q48"}, {"no": 10, "text": "Evaluate the Vector Space Model as an IR technique", "mappedId": "q48"}]}, {"title": "PAC Student Subject Task", "subtitle": "Average Student Task (Mid-1 marks >12 and ≤18)", "questions": [{"no": 1, "text": "Frames: Student/Faculty/Course", "mappedId": "q17"}, {"no": 2, "text": "Conceptual Dependency: \"Amit sent Priya an email.\"", "mappedId": "q18"}, {"no": 3, "text": "Forward Chaining: Student Eligibility System (Attendance=82%, FeesPaid) — matches PPT practice slide exactly", "mappedId": "q20"}, {"no": 4, "text": "Pragmatic Analysis importance/context example", "mappedId": "q25"}, {"no": 5, "text": "FOPL: programmer/Python/project statements", "mappedId": "q24"}]}], "warnings": []}, "questions": [{"id": "q1", "sr": 1, "question": "Explain the five phases (levels) of Natural Language Processing with a suitable example sentence.", "questionPreamble": "", "unit": 1, "unitTitle": "Introduction to NLP", "co": "CO1", "coNote": "CO1 (Understand NLP concepts, phases and applications)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is the single most repeated question in the entire uploaded material. It is Assignment-1 Q1 and Q4 (applied to two different sentences), it is the core topic of the Unit-1 PPT (with a dedicated slide per phase), and a version of it (\"Explain the phases of NLP\", \"Illustrate with suitable example the different levels in NLP\", \"Discuss the origins and challenges of NLP\") appears in the Jul-2026 mid-sem, the Dec-2024 final, the Nov-2023 final and the Dec-2022 final papers.", "easyMeaning": "NLP understands a sentence in 5 steps, going deeper each time — from breaking words apart, to grammar, to meaning, to connecting sentences, to real-world intent. You must show what each step does using one example sentence.", "understandEnMd": "NLP does not understand a sentence in one shot. It passes the sentence through 5 phases, one after another, each one going deeper than the last.\n\nPhase 1, Morphological/Lexical Analysis, looks at individual words and breaks them into their smallest meaningful pieces (tokens, root + prefix/suffix). Phase 2, Syntactic Analysis, checks the grammar — it arranges the words into a tree that shows subject, verb, object using the rules of the language. Phase 3, Semantic Analysis, works out the literal meaning of the sentence — mapping words to real objects/actions and combining their meanings. Phase 4, Discourse Integration, looks beyond one sentence — it connects a sentence to the sentences before and after it (for example, deciding who \"he\" refers to). Phase 5, Pragmatic Analysis, works out the real intended meaning using context and common sense — for example, \"Can you pass the salt?\" is a request, not a question about ability.\n\nExample: \"The smart assistant automatically summarizes research papers.\"\nMorphological: smart, assistant, automatic+ally, summarize+s, research, paper+s are separated into root + suffix pieces.\nSyntactic: a parse tree is built — NP(\"The smart assistant\") + VP(\"automatically summarizes research papers\"), confirming the sentence is grammatically well formed.\nSemantic: the system maps \"summarizes\" to the action of condensing text, \"research papers\" to the object being condensed, giving the literal meaning \"the assistant produces a summary of research papers\".\nDiscourse: if the next sentence said \"It saves researchers a lot of time,\" discourse integration resolves \"It\" to mean the summarization action just described.\nPragmatic: in context, this sentence is understood as a statement describing a system capability (not a command or a question).", "understandGuMd": "NLP કોઈ પણ sentence ને એક જ step માં નથી સમજતું — 5 phases માંથી પસાર કરે છે, દરેક step પહેલા કરતાં ઊંડું જાય છે.\n\nPhase 1: Morphological/Lexical Analysis — શબ્દોને નાના meaningful ભાગો (root + prefix/suffix) માં તોડે છે. Phase 2: Syntactic Analysis — grammar check કરે છે, sentence ને tree structure (subject-verb-object) માં ગોઠવે છે. Phase 3: Semantic Analysis — શબ્દોનો literal અર્થ કાઢે છે, દરેક શબ્દને real-world object/action સાથે જોડે છે. Phase 4: Discourse Integration — એક sentence ને પહેલા/પછીના sentences સાથે જોડે છે (દા.ત. \"he\" કોને refer કરે છે તે નક્કી કરવું). Phase 5: Pragmatic Analysis — context અને common-sense વાપરીને real intention સમજે છે (દા.ત. \"Can you pass the salt?\" એ ability વિશે નથી, request છે).\n\nExample sentence \"The smart assistant automatically summarizes research papers\" પર: Morphological માં words ના root+suffix છૂટા પડે (summarize+s), Syntactic માં NP+VP parse tree બને, Semantic માં \"assistant papers ને summarize કરે છે\" એવો literal meaning નીકળે, Discourse માં આગળના sentence ના pronoun (\"It\") ને આ action સાથે જોડે, Pragmatic માં આખું sentence એક statement/capability તરીકે સમજાય, command તરીકે નહીં.", "oneLine": "5 phases = Morphological (words) → Syntactic (grammar) → Semantic (literal meaning) → Discourse (link sentences) → Pragmatic (real intent).", "memoryTrick": "\"My Silly Sister Drinks Pepsi\" → Morphological, Syntactic, Semantic, Discourse, Pragmatic (deeper understanding each step).", "quick10": "NLP has 5 phases: Morphological → Syntactic → Semantic → Discourse Integration → Pragmatic — each phase understands the sentence more deeply than the last.", "quick30": "NLP processes a sentence through 5 phases: (1) Morphological/Lexical — break into words/root+suffix, (2) Syntactic — check grammar, build parse tree, (3) Semantic — find literal meaning, (4) Discourse Integration — connect with surrounding sentences (pronouns, references), (5) Pragmatic — find the real intended meaning using context. Example: \"The smart assistant automatically summarizes research papers\" gets tokenized, parsed into NP+VP, mapped to the meaning \"produces a summary\", linked to later pronouns, and finally understood as a capability statement.", "answerEnMd": "Natural Language Processing understands a sentence through five sequential phases, each building on the output of the one before it.\n\n**1. Morphological Analysis (word structure):** This phase studies the structure of individual words — dividing text into paragraphs, sentences, and words (tokens), and identifying root words, prefixes and suffixes. For \"The smart assistant automatically summarizes research papers\", it identifies tokens (The, smart, assistant, automatically, summarizes, research, papers) and breaks \"automatically\" into automatic+ly and \"summarizes\" into summarize+s.\n\n**2. Syntactic Analysis (grammar structure):** This phase uses the grammar rules of the language (e.g., a Context-Free Grammar) to check whether the word sequence is well formed, and builds a parse tree showing Noun Phrase and Verb Phrase structure. Here: [NP The smart assistant] [VP automatically summarizes [NP research papers]].\n\n**3. Semantic Analysis (literal meaning):** This phase maps the words to real objects/actions in a knowledge base and combines their meanings, ignoring context outside the sentence. It determines that \"the assistant\" performs the action \"summarize\" on the object \"research papers\", giving the literal meaning of the sentence.\n\n**4. Discourse Integration (meaning across sentences):** This phase looks beyond a single sentence to connect it with the sentences before and after it — for example resolving a pronoun like \"It\" in a following sentence back to \"the smart assistant\" or \"the summarization action\" (anaphora resolution).\n\n**5. Pragmatic Analysis (real-world intent):** This is the final phase — it uses real-world knowledge and context to decide the actual intended effect of the sentence (statement, command, question, request), so the system responds appropriately rather than just parsing words.\n\nAll five phases run one after another, and each depends on the correct output of the previous one — this is why NLP is described as a five-level pipeline.", "answerGuMd": "NLP કોઈ પણ sentence ને 5 phases દ્વારા sequentially સમજે છે, દરેક phase પાછલા phase ના output પર આધારિત છે.\n\n**1. Morphological Analysis (શબ્દ રચના):** આ phase વ્યક્તિગત શબ્દોની structure નો અભ્યાસ કરે છે — text ને paragraphs, sentences, words (tokens) માં વહેંચે છે, અને root word + prefix/suffix ઓળખે છે. \"The smart assistant automatically summarizes research papers\" માટે tokens અલગ પડે અને \"automatically\" = automatic+ly, \"summarizes\" = summarize+s તરીકે તૂટે.\n\n**2. Syntactic Analysis (grammar structure):** આ phase ભાષાના grammar rules (દા.ત. Context-Free Grammar) વાપરીને check કરે કે word sequence grammatically સાચી છે કે નહીં, અને parse tree બનાવે (Noun Phrase + Verb Phrase). અહીં: [NP The smart assistant] [VP automatically summarizes [NP research papers]].\n\n**3. Semantic Analysis (literal meaning):** આ phase શબ્દોને real objects/actions સાથે map કરે અને એમના meanings combine કરે. \"assistant\" એ actor છે, \"summarize\" એ action છે, \"research papers\" એ object છે — આ રીતે literal meaning નીકળે.\n\n**4. Discourse Integration (sentences વચ્ચે meaning):** આ phase એક sentence ને પહેલા/પછીના sentences સાથે જોડે છે — દા.ત. પછીના sentence માં \"It\" pronoun ને \"the smart assistant\" સાથે resolve કરવું (anaphora resolution).\n\n**5. Pragmatic Analysis (real intent):** આ છેલ્લું phase real-world knowledge અને context વાપરીને sentence નો ખરો ઉદ્દેશ નક્કી કરે (statement, command, request) જેથી system યોગ્ય રીતે respond કરે.\n\nપાંચેય phases એક પછી એક ચાલે છે અને દરેક phase પાછલા phase ના સાચા output પર આધાર રાખે છે — એટલે જ NLP ને \"5-level pipeline\" કહેવાય છે.", "mustWrite": ["Name all 5 phases in the correct order (Morphological → Syntactic → Semantic → Discourse → Pragmatic)", "Give the definition of each phase in one line", "Apply every phase to your own given example sentence, not a generic one", "Mention that each phase builds on the output of the previous phase"], "keywords": ["Morphological Analysis", "Syntactic Analysis", "Semantic Analysis", "Discourse Integration", "Pragmatic Analysis", "Parse Tree", "Anaphora"], "diagramMd": "A simple top-to-bottom pipeline: [Sentence] → [Morphological Analysis] → [Syntactic Analysis] → [Semantic Analysis] → [Discourse Integration] → [Pragmatic Analysis] → [Understood Meaning].", "howToDrawMd": "1. Draw 5 rectangular boxes stacked vertically. 2. Label them Morphological, Syntactic, Semantic, Discourse Integration, Pragmatic (top to bottom). 3. Connect each box to the next with a downward arrow. 4. Write \"Input Sentence\" above the first box and \"Final Understood Meaning\" below the last box. 5. Add one keyword under each box (tokens / parse tree / literal meaning / cross-sentence links / real intent).", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Think of reading a sentence like peeling an onion. First you just see the words (Morphological). Then you check if it's grammatically a proper sentence (Syntactic). Then you understand what it literally says (Semantic). Then you connect it to the story around it (Discourse). Finally you understand why it was said (Pragmatic). Every NLP question about \"phases\" just wants you to walk through these 5 layers on whatever sentence is given.", "examTip": "Always apply every phase to the EXACT sentence given in the question — examiners specifically check whether you adapted your standard explanation to their sentence instead of writing a generic answer.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q2", "sr": 2, "question": "What are Natural Language Understanding (NLU) and Natural Language Generation (NLG)? Explain the two components of NLP.", "questionPreamble": "", "unit": 1, "unitTitle": "Introduction to NLP", "co": "CO1", "coNote": "CO1 (Understand NLP concepts and phases)", "bloomLevel": "Understand", "priority": "high", "priorityLabel": "High", "priorityReason": "Explicitly listed as the two components of NLP in the Unit-1 PPT (\"There are the following two components of NLP\") and is commonly asked as a short/definition question (Dec-2022 paper: \"What is NLU and NLG?\").", "easyMeaning": "NLP has two halves — one that understands language (NLU) and one that produces language (NLG). Explain what each one does.", "understandEnMd": "NLP's job can be split into two directions: understanding language coming in, and generating language going out.\n\n**Natural Language Understanding (NLU)** helps a machine understand and analyse human language by extracting meaning-carrying information — concepts, entities, keywords, emotion, relations and semantic roles — from text or speech. It is mainly used in business applications to understand a customer's problem, whether typed or spoken.\n\n**Natural Language Generation (NLG)** works in the opposite direction — it acts like a translator that converts computerised/structured data into natural human language. It mainly involves three steps: text planning (deciding what content to include), sentence planning (deciding how to phrase it), and text realization (producing the final grammatical sentence).\n\nExample: when you ask a voice assistant \"What's the weather today?\", NLU understands your question (extracts intent = weather query), and NLG turns the raw weather data (temperature=32°C, condition=sunny) into a natural sentence: \"It's a sunny day, 32 degrees Celsius.\"", "understandGuMd": "NLP નું કામ બે ભાગમાં વહેંચાય છે — આવતી ભાષા સમજવી, અને ભાષા generate કરવી.\n\n**Natural Language Understanding (NLU)** machine ને human language સમજવા અને analyze કરવામાં મદદ કરે છે — text/speech માંથી meaning ધરાવતી information (concepts, entities, keywords, emotion, relations, semantic roles) કાઢે છે. Business applications માં customer ની spoken કે written problem સમજવા મુખ્યત્વે વપરાય.\n\n**Natural Language Generation (NLG)** ઊલટી દિશામાં કામ કરે છે — computerized/structured data ને natural human language માં convert કરે (translator જેવું). એમાં મુખ્યત્વે 3 steps: text planning (કયું content લેવું નક્કી કરવું), sentence planning (કેવી રીતે phrase કરવું), અને text realization (final grammatical sentence બનાવવું).\n\nExample: voice assistant ને \"What's the weather today?\" પૂછો ત્યારે, NLU તમારો પ્રશ્ન સમજે (intent = weather query), અને NLG raw weather data (temperature=32°C, condition=sunny) ને natural sentence માં ફેરવે: \"It's a sunny day, 32 degrees Celsius.\"", "oneLine": "NLU = understand language IN; NLG = generate language OUT (via text planning → sentence planning → text realization).", "memoryTrick": "NLU = \"Listens & Understands\"; NLG = \"Generates & Gives back\".", "quick10": "NLU extracts meaning from human language (understanding); NLG converts structured data into natural language (generation).", "quick30": "NLP has two components. NLU (Natural Language Understanding) helps a machine understand human language by extracting concepts, entities, keywords, emotion, relations and semantic roles from text/speech — mainly used to understand customer problems. NLG (Natural Language Generation) does the reverse, converting computerised data into natural language text through text planning, sentence planning, and text realization. A voice assistant uses NLU to understand your question and NLG to speak back a natural answer.", "answerEnMd": "NLP is made up of two complementary components:\n\n**1. Natural Language Understanding (NLU):** NLU helps a machine understand and analyse human language by extracting meta-data/meaning from content — concepts, entities, keywords, emotion, relations, and semantic roles. It is mainly used in business applications to understand a customer's problem in both spoken and written language (e.g., understanding a support ticket or a voice command).\n\n**2. Natural Language Generation (NLG):** NLG acts as a translator that converts computerised/structured data into a natural-language representation. It mainly involves three steps: Text Planning (deciding what information to communicate), Sentence Planning (deciding how to structure and phrase that information), and Text Realization (producing the final, grammatically correct sentence).\n\nTogether, NLU lets a system read/listen and understand human input, while NLG lets the system write/speak a natural response — most conversational AI systems (chatbots, voice assistants) need both working together.", "answerGuMd": "NLP બે complementary components નું બનેલું છે:\n\n**1. Natural Language Understanding (NLU):** NLU machine ને human language સમજવા અને analyze કરવામાં મદદ કરે છે, content માંથી meaning-ધરાવતી information — concepts, entities, keywords, emotion, relations, semantic roles — કાઢીને. Business applications માં customer ની spoken કે written problem સમજવા મુખ્યત્વે વપરાય (દા.ત. support ticket કે voice command સમજવો).\n\n**2. Natural Language Generation (NLG):** NLG એક translator જેવું કામ કરે છે, જે computerized/structured data ને natural-language representation માં ફેરવે. એમાં મુખ્યત્વે 3 steps: Text Planning (કયું information આપવું નક્કી કરવું), Sentence Planning (એ information ને કેવી રીતે ગોઠવવું/phrase કરવું), અને Text Realization (final, grammatically correct sentence બનાવવું).\n\nઆ રીતે NLU system ને human input વાંચવા/સાંભળવા અને સમજવા દે છે, જ્યારે NLG system ને natural response લખવા/બોલવા દે છે — મોટા ભાગની conversational AI systems (chatbots, voice assistants) ને બંને સાથે જોઈએ.", "mustWrite": ["Define NLU and NLG separately with their direction (input vs output)", "Mention NLG's three sub-steps: text planning, sentence planning, text realization", "Give one real example showing both working together"], "keywords": ["NLU", "NLG", "Text Planning", "Sentence Planning", "Text Realization", "Understanding", "Generation"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "NLU is like your ears + brain (listening and understanding), NLG is like your mouth (forming and speaking a reply). A voice assistant needs both: NLU to get what you asked, NLG to say something back that makes sense.", "examTip": "Don't just define NLU/NLG in one line each — examiners specifically reward mentioning NLG's 3 internal steps (text planning/sentence planning/text realization), since that detail is often skipped.\n\n## MEDIUM PRIORITY QUESTIONS", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q3", "sr": 3, "question": "What is ambiguity in Natural Language Processing? Explain lexical ambiguity with an example, and explain which phase resolves it.", "questionPreamble": "", "unit": 1, "unitTitle": "Introduction to NLP", "co": "CO1", "coNote": "CO1 (Understand NLP concepts and phases)", "bloomLevel": "Analyze", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is Assignment-1 Q3 in full (\"bank\" sentence) and directly tested as an MCQ in the Dec-2024 final (\"How many ambiguities exist in the following sentence: 'I know little Italian'?\"). Ambiguity is also the reason the PPT dedicates multiple slides to the topic, and it connects directly to Word Sense Disambiguation (Q26), a heavily-tested recent topic.", "easyMeaning": "Some words or sentences can mean more than one thing. You must explain why this happens with the word \"bank\" and say which NLP phase fixes the confusion.", "understandEnMd": "Ambiguity means a word, phrase, or sentence can be understood in more than one way. Natural language is full of it because the same word or structure can map to different meanings depending on context — this is one of the hardest challenges in NLP.\n\nLexical ambiguity happens when a single word has more than one possible meaning. Example: \"I went to the bank to deposit money, and later we sat on the river bank.\" Here \"bank\" means a financial institution the first time, and the sloping land beside a river the second time. A machine reading just the word \"bank\" alone cannot tell which meaning is intended.\n\nThis is resolved mainly by Semantic Analysis, using the surrounding context words: \"deposit money\" strongly suggests the financial-institution sense, while \"sat on the river\" strongly suggests the riverbank sense. The specific NLP technique used to pick the right sense is called Word Sense Disambiguation (WSD) — it looks at nearby context words (like \"river\" or \"money\") to choose the correct meaning.", "understandGuMd": "Ambiguity એટલે એક શબ્દ, phrase અથવા sentence નો એક કરતાં વધારે meaning નીકળી શકે. Natural language માં આ બહુ common છે કારણ કે same શબ્દ context પ્રમાણે અલગ અલગ meaning આપી શકે.\n\nLexical ambiguity ત્યારે થાય જ્યારે એક જ શબ્દ ના multiple meanings હોય. Example: \"I went to the bank to deposit money, and later we sat on the river bank.\" અહીં \"bank\" પહેલી વાર financial institution (bank/pedhi) નો meaning આપે છે, બીજી વાર નદી કિનારો (river bank) નો meaning આપે છે. Machine ફક્ત \"bank\" શબ્દ જોઈને decide ના કરી શકે કે કયો meaning સાચો છે.\n\nઆ ambiguity Semantic Analysis phase દ્વારા ઉકેલાય છે, context ના આજુબાજુના શબ્દો વાપરીને: \"deposit money\" financial meaning તરફ ઈશારો કરે, \"sat on the river\" river-bank meaning તરફ ઈશારો કરે. આ કામ માટે ખાસ technique છે Word Sense Disambiguation (WSD) — તે context words (દા.ત. \"river\" કે \"money\") જોઈને સાચો meaning પસંદ કરે.", "oneLine": "Lexical ambiguity = one word, many meanings; Semantic Analysis + WSD use context words to pick the correct one.", "memoryTrick": "\"Bank\" without context is like a word standing at a crossroads — the sentence around it (money vs. river) points which road (meaning) to take.", "quick10": "Ambiguity = more than one possible meaning; lexical ambiguity is one word with multiple meanings (e.g. \"bank\"); Semantic Analysis + Word Sense Disambiguation resolve it using context.", "quick30": "Ambiguity in NLP means a word/sentence can have more than one interpretation. Lexical ambiguity is when a single word has multiple meanings — \"bank\" (financial institution vs. river bank) is the classic example. It occurs because words are stored with multiple senses in the lexicon and the sentence alone (without context) does not tell the machine which sense is meant. Semantic Analysis, specifically the technique of Word Sense Disambiguation (WSD), resolves it by examining nearby context words (\"deposit money\" vs \"sat on the river\") to choose the correct sense.", "answerEnMd": "Ambiguity in NLP means that a word, phrase, or sentence allows more than one valid interpretation. It is one of the biggest challenges in NLP because human language is naturally imprecise, while machines need one definite meaning to act on.\n\n**Lexical ambiguity** occurs when a single word has more than one possible meaning (sense), and the correct one depends entirely on context. Example: \"I went to the bank to deposit money, and later we sat on the river bank.\" The word \"bank\" is lexically ambiguous — sense 1 is \"a financial institution,\" sense 2 is \"the land alongside a river.\" Both are valid dictionary meanings of the same word, so a system cannot know which is meant just by looking at the word in isolation.\n\n**Why it occurs:** Words are stored in the lexicon with multiple senses attached; ambiguity is only removed once the surrounding words (context) are examined.\n\n**How it is resolved:** The **Semantic Analysis** phase is responsible for resolving lexical ambiguity, because it is the phase that maps words to real-world meaning using context. It applies **Word Sense Disambiguation (WSD)** — a technique that looks at the neighbouring context words to select the intended sense. Here, the context word \"money\"/\"deposit\" strongly co-occurs with the financial-institution sense of \"bank,\" while \"river\"/\"sat\" strongly co-occurs with the riverbank sense, allowing the correct sense to be picked for each occurrence.\n\n**Suggested technique:** A supervised Naive Bayes WSD classifier (or a knowledge-based method like Lesk's Algorithm) can be trained/applied to choose the sense of \"bank\" with the highest probability given its context words.", "answerGuMd": "Ambiguity એટલે એક શબ્દ, phrase કે sentence નો એક કરતાં વધારે valid meaning નીકળવો. Human language naturally imprecise હોવાથી NLP માટે આ મોટો પડકાર છે, કારણ કે machine ને action લેવા માટે એક ચોક્કસ meaning જોઈએ.\n\n**Lexical ambiguity** ત્યારે થાય જ્યારે એક જ શબ્દ ના multiple meanings (senses) હોય, અને સાચો meaning context પર આધાર રાખે. Example: \"I went to the bank to deposit money, and later we sat on the river bank.\" અહીં \"bank\" lexically ambiguous છે — sense 1: \"financial institution,\" sense 2: \"નદી કિનારાની જમીન.\" બંને valid dictionary meanings છે, એટલે એકલો શબ્દ જોઈને machine નક્કી ના કરી શકે.\n\n**કેમ થાય છે:** Lexicon માં દરેક શબ્દ સાથે multiple senses store થાય છે; આજુબાજુના context words જોયા વગર ambiguity દૂર ના થાય.\n\n**કેવી રીતે ઉકેલાય:** **Semantic Analysis** phase આ ambiguity ઉકેલવા માટે જવાબદાર છે, કારણ કે તે phase context વાપરીને શબ્દોને real-world meaning સાથે map કરે છે. તે **Word Sense Disambiguation (WSD)** technique વાપરે છે — જે આજુબાજુના context words જોઈને સાચો sense પસંદ કરે. અહીં \"money\"/\"deposit\" financial sense તરફ ઈશારો કરે, \"river\"/\"sat\" river-bank sense તરફ ઈશારો કરે.\n\n**Suggested technique:** Supervised Naive Bayes WSD classifier (અથવા Lesk's Algorithm જેવી knowledge-based method) વાપરીને context words ના આધારે સૌથી વધારે probability વાળો sense પસંદ કરી શકાય.", "mustWrite": ["Define ambiguity and lexical ambiguity separately", "Use the exact \"bank\" example with both meanings spelled out", "Name Semantic Analysis as the resolving phase", "Name Word Sense Disambiguation (WSD) as the specific technique"], "keywords": ["Ambiguity", "Lexical Ambiguity", "Word Sense Disambiguation", "Semantic Analysis", "Context", "Polysemy"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A word like \"bank\" is like a costume that fits two different characters (a financial institution and a riverbank). Just seeing the costume (the word) doesn't tell you which character (meaning) is on stage — you need to look at the rest of the scene (the sentence's other words) to know for sure. That \"looking at the rest of the scene\" is exactly what Semantic Analysis + WSD do.", "examTip": "If the question gives you a specific ambiguous word, always show BOTH meanings clearly and point to the exact context word in the sentence that favours each meaning — don't just say \"context resolves it\" without naming which words.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q4", "sr": 4, "question": "Explain the applications of Natural Language Processing.", "questionPreamble": "", "unit": 1, "unitTitle": "Introduction to NLP", "co": "CO1", "coNote": "CO1 (Understand NLP concepts, phases and applications)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This exact question (in various wordings — \"Explain the applications of NLP\", \"Write an essay on the applications of NLP\", \"Application of Natural Language Processing?\" as an MCQ) appears in at least four different real papers (Nov-2023, Dec-2022, Dec-2024, Jul-2026 mid-sem) plus Assignment-1 Q2, making it one of the most reliably repeated questions across every year sampled.", "easyMeaning": "List and explain the real-world uses of NLP — things like chatbots, translation, spam filters — with a short explanation of how NLP is involved in each.", "understandEnMd": "NLP is not just theory — it powers many everyday tools. Each application uses one or more of the 5 phases (mostly semantic and pragmatic) to do something useful with human language.\n\nKey applications: **Sentiment Analysis** (also called opinion mining) reads text to decide if the writer's attitude is positive, negative or neutral — used to analyse product reviews or social media posts. **Text Classification** automatically sorts text into predefined categories — e.g. spam detection sorts emails into spam/not-spam. **Chatbots & Virtual Assistants** (like Google Assistant, Siri) use speech recognition + NLU + NLG to understand a spoken/typed command and reply naturally. **Information Extraction** pulls specific structured facts (names, dates, amounts) out of unstructured documents. **Machine Translation** converts text from one language to another while preserving meaning (e.g. Google Translate). **Text Summarization** condenses a long document into a short version while keeping the key information. **Auto-Correct / Grammar Checking** (e.g. Grammarly, MS Word) detects and fixes spelling/grammar mistakes. **Speech Recognition** converts spoken audio into text so voice assistants and smart devices can respond to commands.", "understandGuMd": "NLP માત્ર theory નથી — ઘણા daily-use tools તેના પર ચાલે છે. દરેક application 5 phases માંથી (મુખ્યત્વે semantic અને pragmatic) એક અથવા વધારે phase વાપરે છે.\n\nમુખ્ય applications: **Sentiment Analysis** (opinion mining) — text વાંચીને writer નું attitude positive/negative/neutral છે તે નક્કી કરે, product reviews કે social media posts analyze કરવા વપરાય. **Text Classification** — text ને predefined categories માં automatically sort કરે, દા.ત. spam detection emails ને spam/not-spam માં વહેંચે. **Chatbots & Virtual Assistants** (Google Assistant, Siri) — speech recognition + NLU + NLG વાપરીને spoken/typed command સમજે અને naturally reply આપે. **Information Extraction** — unstructured documents માંથી specific structured facts (names, dates, amounts) કાઢે. **Machine Translation** — meaning જાળવી રાખીને એક ભાષામાંથી બીજી ભાષામાં text convert કરે (દા.ત. Google Translate). **Text Summarization** — લાંબા document ને key information જાળવીને ટૂંકું બનાવે. **Auto-Correct/Grammar Checking** (Grammarly, MS Word) — spelling/grammar ની ભૂલો શોધીને સુધારે. **Speech Recognition** — બોલાયેલા અવાજ ને text માં convert કરે જેથી voice assistants command સમજી શકે.", "oneLine": "NLP applications = Sentiment Analysis, Text Classification, Chatbots, Information Extraction, Machine Translation, Summarization, Auto-Correct, Speech Recognition.", "memoryTrick": "\"Sentiment Texts Chat, Information Machines Summarize And Speak\" → Sentiment analysis, Text classification, Chatbots, Information extraction, Machine translation, Summarization, Auto-correct, Speech recognition.", "quick10": "NLP powers sentiment analysis, chatbots, machine translation, summarization, spam/text classification, auto-correct, information extraction, and speech recognition.", "quick30": "NLP applications include: Sentiment Analysis (reads opinion/emotion in text), Text Classification (auto-sorts text, e.g. spam detection), Chatbots & Virtual Assistants (Siri, Google Assistant — understand and respond in natural language), Information Extraction (pulls structured facts from text), Machine Translation (Google Translate), Text Summarization (shortens long text), Auto-Correct/Grammar Checking (Grammarly, MS Word), and Speech Recognition (voice-to-text for smart devices). Each uses NLP's phases, mainly semantic and pragmatic analysis, to turn raw human language into a useful action.", "answerEnMd": "Natural Language Processing is applied across many real-world tools that need to understand or generate human language:\n\n1. **Sentiment Analysis (Opinion Mining):** Analyses text to identify whether the attitude/emotion expressed is positive, negative or neutral — widely used on product reviews and social media to gauge public opinion.\n2. **Text Classification:** Automatically assigns predefined categories/tags to text based on its content — e.g., Spam Detection classifies incoming emails as spam or not spam.\n3. **Chatbots & Virtual Assistants:** Software such as Siri, Google Assistant, and customer-service chatbots use speech recognition, NLU and NLG together to understand a user's spoken or typed request and generate an appropriate natural-language response.\n4. **Information Extraction:** Extracts essential structured information (names, dates, amounts, relationships) from unstructured or semi-structured documents.\n5. **Machine Translation:** Automatically translates text/speech from one natural language into another while preserving meaning, e.g. Google Translate.\n6. **Text Summarization:** Produces a shorter version of a document while preserving its key information — used in news summarization, headline generation, and legal-document summarization.\n7. **Auto-Correct / Grammar Checking:** Tools like MS Word and Grammarly detect spelling and grammar mistakes and suggest corrections.\n8. **Speech Recognition:** Converts spoken audio into text, enabling voice assistants, smart-home devices and dictation software to respond to voice commands.\n\nTogether these applications show that NLP bridges the gap between unstructured human language and structured actions a computer can perform.", "answerGuMd": "Natural Language Processing ઘણા real-world tools માં વપરાય છે જેને human language સમજવાની અથવા generate કરવાની જરૂર પડે:\n\n1. **Sentiment Analysis (Opinion Mining):** Text માં attitude/emotion positive, negative કે neutral છે તે ઓળખે — product reviews અને social media પર public opinion જાણવા વપરાય.\n2. **Text Classification:** Text ને content પ્રમાણે predefined categories/tags automatically આપે — દા.ત. Spam Detection emails ને spam/not-spam તરીકે classify કરે.\n3. **Chatbots & Virtual Assistants:** Siri, Google Assistant જેવા software speech recognition + NLU + NLG સાથે વાપરીને user ના command ને સમજે અને યોગ્ય natural-language response આપે.\n4. **Information Extraction:** Unstructured documents માંથી essential structured information (names, dates, amounts, relationships) કાઢે.\n5. **Machine Translation:** Meaning જાળવીને એક ભાષામાંથી બીજી ભાષામાં text/speech automatically translate કરે, દા.ત. Google Translate.\n6. **Text Summarization:** Document ની key information જાળવીને ટૂંકું version બનાવે — news summarization, headline generation માં વપરાય.\n7. **Auto-Correct/Grammar Checking:** MS Word, Grammarly જેવા tools spelling/grammar ભૂલો શોધીને સુધારા suggest કરે.\n8. **Speech Recognition:** બોલાયેલા અવાજ ને text માં convert કરે, જેથી voice assistants voice commands સમજી શકે.\n\nઆ બધી applications બતાવે છે કે NLP unstructured human language અને computer ની structured actions વચ્ચે પુલ (bridge) નું કામ કરે છે.", "mustWrite": ["List at least 6 applications with one line each", "Give a real product/example name for each (Siri, Grammarly, Google Translate, etc.)", "Mention which phase(s) of NLP the application mainly relies on"], "keywords": ["Sentiment Analysis", "Text Classification", "Chatbots", "Information Extraction", "Machine Translation", "Text Summarization", "Auto-Correct", "Speech Recognition"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Look at your own phone — autocorrect fixing your typing, Google Translate converting a menu, Siri answering a question, your spam folder filtering junk mail — every one of those is an NLP application. The exam just wants you to name and briefly describe 6-8 of these.", "examTip": "If marks are high (6-8), briefly explain each application in one sentence rather than only listing names — bare lists lose marks even if the names are correct.\n\n## HIGH PRIORITY QUESTIONS", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q5", "sr": 5, "question": "Explain spell checking in NLP — types of spelling errors and error detection techniques.", "questionPreamble": "", "unit": 1, "unitTitle": "Introduction to NLP", "co": "CO1", "coNote": "CO1 (Understand NLP concepts and phases)", "bloomLevel": "Understand", "priority": "med", "priorityLabel": "Medium", "priorityReason": "This is a dedicated section of the Unit-1 PPT with its own slides on error types and detection techniques, and connects directly to the heavily-tested Minimum Edit Distance topic (Q38), but it has not itself appeared as a standalone question in the sampled papers, so it is rated Medium rather than High.", "easyMeaning": "Explain what a spell checker does, the different kinds of spelling mistakes people make, and how a computer finds them.", "understandEnMd": "Spell Checking is the process of detecting, and sometimes suggesting corrections for, incorrectly spelled words in a text. A basic spell checker scans the text, extracts each word, and compares it against a dictionary of correctly spelled words; an additional language-dependent step handles morphology (word forms).\n\nSpelling errors fall into four types: **Non-word errors** — the resulting word does not exist in the dictionary at all (most common type, caused by missed/extra keystrokes). **Real-word errors** — the mistake accidentally creates a different real word (e.g. typing \"flower\" when you meant \"flour\"); these are harder to catch because the word itself is valid. **Cognitive errors** — caused by not knowing the correct spelling, often between homophones that sound the same (e.g. \"piece\" and \"peace\"). **Short forms/Slang/Lingo** — not really errors, but informal shortenings used to fit text into a limited space (like an SMS or tweet).\n\nThe basic detection technique is the **Dictionary Lookup Technique**: every word of the input text is checked for its presence in a dictionary; if found, it is correct, otherwise it is added to a list of error words for correction/suggestion.", "understandGuMd": "Spell Checking એટલે text માં ખોટી રીતે spell થયેલા શબ્દો શોધવા, અને ક્યારેક તેમના માટે સાચા suggestions આપવા. એક basic spell checker text scan કરે, દરેક શબ્દ કાઢે, અને એને correctly-spelled શબ્દોની dictionary સાથે compare કરે.\n\nSpelling errors ના 4 પ્રકાર: **Non-word errors** — પરિણામી શબ્દ dictionary માં જ ના હોય (સૌથી common, keystroke ભૂલોથી થાય). **Real-word errors** — ભૂલ accidentally બીજો valid શબ્દ બનાવે (દા.ત. \"flour\" ને બદલે \"flower\" લખવું) — પકડવા મુશ્કેલ કારણ કે શબ્દ પોતે valid છે. **Cognitive errors** — સાચી spelling ખબર ના હોવાથી થાય, ઘણીવાર homophones (સરખું ઉચ્ચારણ) વચ્ચે (દા.ત. \"piece\" અને \"peace\"). **Short forms/Slang/Lingo** — ખરેખર ભૂલ નથી, પણ SMS/tweet જેવી limited space માં fit કરવા વપરાતા informal ટૂંકાણ.\n\nBasic detection technique છે **Dictionary Lookup Technique**: input text ના દરેક શબ્દ ને dictionary માં હાજરી માટે check કરાય; મળે તો સાચો, ના મળે તો error list માં ઉમેરાય.", "oneLine": "Spell checking = dictionary lookup on each word; errors are Non-word, Real-word, Cognitive, or Slang.", "memoryTrick": "\"Never Read Complex Slang\" → Non-word, Real-word, Cognitive, Slang errors.", "quick10": "Spell checking scans words and compares to a dictionary; errors are non-word, real-word, cognitive, or slang/short-form.", "quick30": "A spell checker scans text, extracts words, and compares each against a dictionary (Dictionary Lookup Technique) plus a morphology step. Spelling errors are of 4 types: Non-word errors (word doesn't exist at all), Real-word errors (accidentally forms a different valid word, e.g. flower/flour), Cognitive errors (not knowing correct spelling, often homophones like piece/peace), and Short forms/Slang (informal shortenings, not true errors). Detecting non-word errors is easy via dictionary lookup; real-word errors need context (semantic analysis) since the word itself is valid.", "answerEnMd": "Spell Checking is the process of detecting, and often correcting, incorrectly spelled words in a document. A basic spell checker scans the input text, extracts its words, compares each one against a dictionary of correctly spelled words, and applies a language-dependent morphological step to handle word forms.\n\n**Types of spelling errors:**\n1. **Non-word errors** — the most common type; missed or extra keystrokes create a word that does not exist in any dictionary, so it is easy to flag but harder to suggest a correction for.\n2. **Real-word errors** — a typo accidentally produces a different, valid word (e.g., typing \"flower\" instead of \"flour\"); these cannot be caught by dictionary lookup alone since the resulting word is itself correct — they need contextual/semantic checking.\n3. **Cognitive errors** — arise not from a slip of the finger but from not knowing the correct spelling, frequently confusing homophones (words that sound alike, e.g. \"piece\"/\"peace\").\n4. **Short forms/Slang/Lingo** — informal shortenings used to fit text into a constrained space such as an SMS or tweet; not genuine spelling errors.\n\n**Error Detection Technique — Dictionary Lookup:** Every word in the input text is checked for presence in a reference dictionary. If the word is found, it is treated as correctly spelled; if not, it is added to the list of error words for correction/suggestion. More advanced systems add edit-distance-based suggestion generation (see Minimum Edit Distance) to propose the closest correctly-spelled word.", "answerGuMd": "Spell Checking એટલે document માં ખોટી રીતે spell થયેલા શબ્દો શોધવા અને ઘણી વાર સુધારવા. Basic spell checker input text scan કરે, શબ્દો કાઢે, દરેકને correctly-spelled dictionary સાથે compare કરે, અને word forms માટે language-dependent morphological step apply કરે.\n\n**Spelling errors ના પ્રકાર:**\n1. **Non-word errors** — સૌથી common; keystroke ભૂલોથી એવો શબ્દ બને જે કોઈ dictionary માં જ ના હોય — શોધવો સહેલો પણ સુધારો suggest કરવો અઘરો.\n2. **Real-word errors** — typo accidentally બીજો valid શબ્દ બનાવે (દા.ત. \"flour\" ને બદલે \"flower\") — dictionary lookup થી ના પકડાય કારણ કે પરિણામી શબ્દ પોતે સાચો છે — context/semantic checking જોઈએ.\n3. **Cognitive errors** — finger ની ભૂલથી નહીં, પણ સાચી spelling ખબર ના હોવાથી થાય, ઘણી વાર homophones (સરખું ઉચ્ચારણ, દા.ત. \"piece\"/\"peace\") વચ્ચે confusion.\n4. **Short forms/Slang/Lingo** — SMS/tweet જેવી limited space માટે informal ટૂંકાણ; ખરી spelling ભૂલ નથી.\n\n**Error Detection Technique — Dictionary Lookup:** Input text ના દરેક શબ્દ ને reference dictionary માં હાજરી માટે check કરાય. મળે તો સાચો, ના મળે તો error list માં ઉમેરાય, સુધારા માટે. વધુ advanced systems edit-distance-based suggestion (જુઓ Minimum Edit Distance) વાપરીને નજીકનો સાચો શબ્દ suggest કરે.", "mustWrite": ["Name and explain all 4 error types with one example each", "Explain the Dictionary Lookup detection technique", "Mention that real-word errors need context/semantic checking, not just dictionary lookup"], "keywords": ["Spell Checking", "Non-word Error", "Real-word Error", "Cognitive Error", "Dictionary Lookup", "Homophones"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Non-word error = you typed gibberish. Real-word error = you typed a real word, just the wrong one. Cognitive error = you genuinely didn't know the spelling. Slang = you did it on purpose to save space. A dictionary lookup only catches the first kind reliably.", "examTip": "Always give a distinct example word for each error type — reusing the same example for two types loses clarity marks.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q6", "sr": 6, "question": "How is an NLP pipeline built? Explain the phases involved in processing text from raw input to output.", "questionPreamble": "", "unit": 1, "unitTitle": "Introduction to NLP", "co": "CO1", "coNote": "CO1 (Understand NLP concepts and phases)", "bloomLevel": "Understand", "priority": "med", "priorityLabel": "Medium", "priorityReason": "Directly asked in the Dec-2022 final (\"How an NLP pipeline is built? Describe what is done at every step\") and closely related to the tokenization/normalization-order question in the most recent Sep-2026 paper (Que.2), which asks specifically about the correct order of sentence segmenting, word tokenizing, and normalizing.", "easyMeaning": "Explain, step by step, how raw text is converted into something an NLP system can work with, and in what order the steps must happen.", "understandEnMd": "Before any deep NLP analysis (parsing, semantics) can happen, raw text must be cleaned and structured through a preprocessing pipeline. The standard order matters because each step depends on the previous one's output.\n\nThe typical order is: **(1) Sentence Segmentation** — split the raw text block into individual sentences (using punctuation like \".\", \"!\", \"?\"). **(2) Word Tokenization** — split each sentence into individual words/tokens. **(3) Normalization** — bring word formats to a standard form: lower-casing, removing punctuation/stop-words, and stemming/lemmatization (reducing words to root form).\n\nRunning these out of order causes errors. For example, if you tokenize into words before segmenting sentences, a period inside an abbreviation like \"Dr.\" or a decimal number like \"3.14\" can be wrongly treated as a sentence boundary, splitting a sentence in the wrong place. After preprocessing, the cleaned tokens feed into the rest of the NLP pipeline: Morphological Analysis, Syntactic Analysis, Semantic Analysis, Discourse Integration, and Pragmatic Analysis.", "understandGuMd": "કોઈ પણ ઊંડું NLP analysis (parsing, semantics) થાય એ પહેલાં, raw text ને preprocessing pipeline દ્વારા સાફ અને structured કરવું પડે. આ steps નો order મહત્વનો છે કારણ કે દરેક step પાછલા step ના output પર આધાર રાખે છે.\n\nસામાન્ય order: **(1) Sentence Segmentation** — raw text block ને individual sentences માં વહેંચવું (\".\", \"!\", \"?\" જેવા punctuation વાપરીને). **(2) Word Tokenization** — દરેક sentence ને individual words/tokens માં વહેંચવું. **(3) Normalization** — word formats ને standard form માં લાવવું: lower-casing, punctuation/stop-words દૂર કરવા, અને stemming/lemmatization (શબ્દોને root form માં લાવવા).\n\nઆ steps ને ખોટા order માં ચલાવવાથી ભૂલો થાય. દા.ત. sentence segment કર્યા પહેલાં word tokenize કરો તો \"Dr.\" જેવા abbreviation નું period અથવા \"3.14\" જેવા decimal number નું period ખોટી રીતે sentence boundary તરીકે લેવાઈ જાય, sentence ખોટી જગ્યાએ તૂટે. Preprocessing પછી, સાફ tokens બાકીના NLP pipeline માં જાય: Morphological, Syntactic, Semantic, Discourse Integration, Pragmatic Analysis.", "oneLine": "NLP pipeline order = Sentence Segmentation → Word Tokenization → Normalization (lowercase, stopwords, stemming/lemmatization) → deeper phases.", "memoryTrick": "\"Sentences Split, Then Words, Then Normal\" → Segment sentences, Tokenize words, Normalize.", "quick10": "Text preprocessing order = Sentence Segmentation → Word Tokenization → Normalization; wrong order causes boundary errors (e.g. \"Dr.\" split wrongly).", "quick30": "An NLP pipeline starts with preprocessing in a strict order: Sentence Segmentation (split text into sentences), Word Tokenization (split sentences into words/tokens), and Normalization (lowercasing, stop-word removal, stemming/lemmatization). Running them out of order causes pipeline errors — e.g., tokenizing before segmenting can wrongly treat a period in \"Dr.\" or \"3.14\" as a sentence end. After preprocessing, cleaned tokens flow into Morphological, Syntactic, Semantic, Discourse and Pragmatic analysis.", "answerEnMd": "An NLP pipeline is built by first preprocessing raw text through three ordered steps before any linguistic analysis begins:\n\n**1. Sentence Segmentation:** The raw text is split into individual sentences using boundary cues such as \".\", \"!\", \"?\". This must happen first because tokenization and later phases operate one sentence at a time.\n\n**2. Word Tokenization:** Each segmented sentence is split into individual tokens (words, punctuation marks, numbers). This step assumes sentence boundaries are already correct.\n\n**3. Normalizing Word Formats:** Tokens are converted to a standard format — converting to lowercase, removing stop-words/punctuation where appropriate, and applying stemming or lemmatization to reduce words to their root form.\n\n**Why order matters:** Running these steps out of sequence causes pipeline errors. For example, if word tokenization is done before sentence segmentation, a period inside an abbreviation (\"Dr.\") or a decimal number (\"3.14\") may be misinterpreted as marking a sentence boundary, incorrectly splitting a single sentence into two, which then corrupts every later stage (parsing, semantic analysis) that assumes correct sentence boundaries.\n\nOnce preprocessing is complete, the cleaned token stream is passed into the deeper NLP phases: Morphological Analysis, Syntactic Analysis, Semantic Analysis, Discourse Integration, and Pragmatic Analysis, each of which depends on receiving correctly segmented and normalized input from the step before it.", "answerGuMd": "NLP pipeline બનાવવા માટે પહેલા raw text ને 3 ordered steps દ્વારા preprocess કરાય, કોઈ પણ linguistic analysis શરૂ થાય એ પહેલાં:\n\n**1. Sentence Segmentation:** Raw text ને \".\", \"!\", \"?\" જેવા boundary cues વાપરીને individual sentences માં વહેંચાય. આ પહેલા થવું જોઈએ કારણ કે tokenization અને પછીના phases એક-એક sentence પર કામ કરે છે.\n\n**2. Word Tokenization:** દરેક segmented sentence ને individual tokens (words, punctuation, numbers) માં વહેંચાય. આ step ધારે છે કે sentence boundaries પહેલેથી સાચા છે.\n\n**3. Normalizing Word Formats:** Tokens ને standard format માં convert કરાય — lowercase કરવું, જરૂર પ્રમાણે stop-words/punctuation દૂર કરવા, અને stemming કે lemmatization વાપરીને શબ્દોને root form માં લાવવા.\n\n**Order કેમ મહત્વનો છે:** આ steps ને ખોટા order માં ચલાવવાથી pipeline errors થાય. દા.ત., sentence segmentation પહેલા word tokenization કરો તો \"Dr.\" જેવા abbreviation નું period અથવા \"3.14\" જેવા decimal નું period ખોટી રીતે sentence boundary તરીકે લેવાઈ જાય, એક sentence ખોટી રીતે બે માં તૂટે, જે પછીના દરેક stage (parsing, semantic analysis) ને બગાડે.\n\nPreprocessing પૂરું થયા પછી, સાફ token stream ઊંડા NLP phases માં જાય: Morphological, Syntactic, Semantic, Discourse Integration, અને Pragmatic Analysis — દરેક phase પાછલા step માંથી સાચું segmented અને normalized input મળવા પર આધાર રાખે છે.", "mustWrite": ["State the 3 preprocessing steps in the correct order", "Give a concrete example of what goes wrong if the order is broken (e.g. \"Dr.\" or \"3.14\")", "Connect preprocessing to the 5 deeper NLP phases that follow it"], "keywords": ["NLP Pipeline", "Sentence Segmentation", "Tokenization", "Normalization", "Stemming", "Lemmatization", "Stop-words"], "diagramMd": "[Raw Text] → [Sentence Segmentation] → [Word Tokenization] → [Normalization: lowercase + stopword removal + stemming/lemmatization] → [Morphological → Syntactic → Semantic → Discourse → Pragmatic Analysis]", "howToDrawMd": "1. Draw \"Raw Text\" as the first box on the left. 2. Draw 3 boxes in a row: Sentence Segmentation, Word Tokenization, Normalization, connected by arrows. 3. From Normalization, draw an arrow into a stack of the 5 NLP phase boxes (from Q1). 4. Under the arrow between Segmentation and Tokenization, write \"must happen in this order\" to emphasize the sequencing.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "You can't tokenize words correctly until you know where sentences end, and you can't normalize a token until you know it IS a token — so the pipeline has to go in this fixed order: sentences first, then words, then cleanup.", "examTip": "If the question gives a specific messy example string (like a tweet with hashtags/mentions), explicitly walk through what each of the 3 steps does to THAT string rather than describing the steps abstractly.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q7", "sr": 7, "question": "Design regular expressions for detecting common NLP text patterns (email, mobile number, URL, date, hashtag, etc.).", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply word-level analysis techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is a full dedicated PPT document (\"Regular Expression questions\") with 20 solved patterns, is Assignment-1 Q5 verbatim (mobile numbers, email, URLs, dates, Aadhaar, vehicle registration), and a regex-design question (product codes, name patterns) is Que.3(A-Or) of the most recent Sep-2025/Sep-2026 exam papers — regex is tested in nearly every paper sampled.", "easyMeaning": "Write regex patterns that can automatically find things like email addresses, phone numbers, or dates inside a block of text, and explain how each symbol works.", "understandEnMd": "A regular expression (regex) is a compact pattern made of special symbols that matches a family of strings — instead of searching for one exact word, you search for a *shape* (e.g., \"any 10-digit number starting with 6-9\"). In NLP, regex is used heavily for pattern-based preprocessing, especially before deeper analysis, because emails, phone numbers, hashtags, and dates all follow a strict, describable shape.\n\nKey building blocks: `[A-Za-z0-9]` means any letter or digit; `+` means \"one or more of the previous thing\"; `\\d` means any digit; `{n}` means \"exactly n times\"; `?` makes the previous part optional; `\\b` marks a word boundary; `^` inside `[...]` means \"NOT these characters\".\n\nExample patterns: Email → `[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}` (username, then @, then domain, then a 2+ letter extension). Indian mobile number → `[6-9][0-9]{9}` (starts with 6/7/8/9, followed by exactly 9 more digits = 10 digits total). URL → `https?://[A-Za-z0-9.-]+\\.[A-Za-z]{2,}`. Date (DD/MM/YYYY) → `\\d{2}/\\d{2}/\\d{4}`. Hashtag → `#\\w+`.", "understandGuMd": "Regular expression (regex) એ special symbols થી બનેલો compact pattern છે જે strings ના આખા family ને match કરે — એક ચોક્કસ શબ્દ ને બદલે તમે એક *shape* શોધો છો (દા.ત., \"6-9 થી શરૂ થતો કોઈ પણ 10-digit number\"). NLP માં regex preprocessing માટે ખૂબ વપરાય, ખાસ કરીને ઊંડા analysis પહેલા, કારણ કે email, phone number, hashtag, date બધાનું ચોક્કસ describable shape હોય છે.\n\nમુખ્ય building blocks: `[A-Za-z0-9]` એટલે કોઈ પણ letter કે digit; `+` એટલે \"પાછલી વસ્તુ એક કે વધારે વાર\"; `\\d` એટલે કોઈ પણ digit; `{n}` એટલે \"બરાબર n વાર\"; `?` પાછલા ભાગ ને optional બનાવે; `\\b` word boundary બતાવે; `[...]` અંદર `^` એટલે \"આ characters સિવાય\".\n\nExample patterns: Email → `[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}` (username, પછી @, પછી domain, પછી 2+ letter extension). Indian mobile number → `[6-9][0-9]{9}` (6/7/8/9 થી શરૂ, પછી બરાબર 9 વધુ digits = કુલ 10 digits). URL → `https?://[A-Za-z0-9.-]+\\.[A-Za-z]{2,}`. Date (DD/MM/YYYY) → `\\d{2}/\\d{2}/\\d{4}`. Hashtag → `#\\w+`.", "oneLine": "Regex matches a \"shape\" of text using symbols like `[..]`, `+`, `\\d`, `{n}`, `?`, `\\b` — build the shape piece by piece.", "memoryTrick": "Read a regex left to right like reading the pattern's own \"recipe\" out loud: \"6 to 9, then 9 digits\" for mobile numbers.", "quick10": "Regex = pattern matching using symbols (`[..]`, `+`, `\\d`, `{n}`, `?`); e.g. Indian mobile = `[6-9][0-9]{9}`, email = `[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}`.", "quick30": "A regular expression describes the SHAPE of text to match rather than one exact string, using symbols like `[A-Za-z0-9]` (character class), `+` (one or more), `\\d` (digit), `{n}` (exact count), `?` (optional), and `\\b` (word boundary). Common NLP patterns: Email `[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}`, Indian mobile `[6-9][0-9]{9}`, URL `https?://[A-Za-z0-9.-]+\\.[A-Za-z]{2,}`, Date `\\d{2}/\\d{2}/\\d{4}`, Hashtag `#\\w+`. Always test with 2 valid and 2 invalid examples to prove correctness.", "answerEnMd": "Regular expressions describe a *pattern/shape* of text rather than one literal string, making them ideal for detecting structured entities inside free text during NLP preprocessing.\n\n**1. Indian Mobile Number:** `[6-9][0-9]{9}` — `[6-9]` matches the compulsory first digit (6, 7, 8 or 9), `[0-9]{9}` matches exactly 9 more digits, giving a 10-digit number. Valid: 9876543210, 7001234567. Invalid: 5123456789 (starts with 5), 98765432 (only 8 digits).\n\n**2. Email ID:** `[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}` — the username part allows letters/digits/`._%+-`, `@` is mandatory, the domain allows letters/digits/`.`/`-`, and `\\.[A-Za-z]{2,}` requires a dot followed by a 2+ letter extension (.com, .in, .org). Valid: student@marwadi.edu.in, test.123@gmail.com. Invalid: student@.com (no domain name), plainaddress (no @).\n\n**3. URL:** `https?://[A-Za-z0-9.-]+\\.[A-Za-z]{2,}` — `https?` matches \"http\" or \"https\" (the `?` makes the \"s\" optional), `://` is the literal separator, followed by the domain and extension pattern. Valid: https://marwadi.edu, http://example.com. Invalid: ftp://file.com (wrong protocol), www.example (no valid extension length).\n\n**4. Date (DD/MM/YYYY):** `\\d{2}/\\d{2}/\\d{4}` — two digits, a slash, two digits, a slash, four digits. Valid: 21/07/2026, 01/01/2000. Invalid: 2026/07/21 (wrong order), 21-07-2026 (wrong separator).\n\n**5. Aadhaar Number (12 digits):** `\\d{4}\\s?\\d{4}\\s?\\d{4}` — three groups of 4 digits, optionally separated by a space, matching how Aadhaar numbers are usually printed. Valid: 1234 5678 9012, 123456789012. Invalid: 12345678901 (11 digits), 1234-5678-9012 (wrong separator).\n\n**6. Vehicle Registration Number (e.g. GJ05AB1234):** `[A-Z]{2}\\d{2}[A-Z]{1,2}\\d{4}` — 2 letters (state code), 2 digits (RTO code), 1-2 letters (series), 4 digits (unique number). Valid: GJ05AB1234, MH12CD5678. Invalid: GJ5AB1234 (only 1 RTO digit), gj05ab1234 (lowercase, if case-sensitive matching is required).", "answerGuMd": "Regular expression text ના literal string ને બદલે તેની *pattern/shape* describe કરે, જે NLP preprocessing માં free text માંથી structured entities શોધવા માટે ideal છે.\n\n**1. Indian Mobile Number:** `[6-9][0-9]{9}` — `[6-9]` compulsory પહેલો digit (6,7,8,9) match કરે, `[0-9]{9}` બરાબર 9 વધુ digits match કરે, કુલ 10 digits. Valid: 9876543210. Invalid: 5123456789 (5 થી શરૂ).\n\n**2. Email ID:** `[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}` — username ભાગ letters/digits/`._%+-` allow કરે, `@` compulsory, domain ભાગ letters/digits/`.`/`-` allow કરે, `\\.[A-Za-z]{2,}` dot પછી 2+ letter extension જોઈએ. Valid: student@marwadi.edu.in. Invalid: plainaddress (@ નથી).\n\n**3. URL:** `https?://[A-Za-z0-9.-]+\\.[A-Za-z]{2,}` — `https?` \"http\" કે \"https\" match કરે, `://` literal separator, પછી domain+extension pattern. Valid: https://marwadi.edu. Invalid: ftp://file.com (ખોટો protocol).\n\n**4. Date (DD/MM/YYYY):** `\\d{2}/\\d{2}/\\d{4}` — બે digits, slash, બે digits, slash, ચાર digits. Valid: 21/07/2026. Invalid: 2026/07/21 (ખોટો order).\n\n**5. Aadhaar Number (12 digits):** `\\d{4}\\s?\\d{4}\\s?\\d{4}` — 4-4-4 digits ના ત્રણ groups, વચ્ચે optional space સાથે. Valid: 1234 5678 9012. Invalid: 12345678901 (11 digits).\n\n**6. Vehicle Registration Number:** `[A-Z]{2}\\d{2}[A-Z]{1,2}\\d{4}` — 2 letters (state code), 2 digits (RTO code), 1-2 letters (series), 4 digits. Valid: GJ05AB1234. Invalid: GJ5AB1234 (RTO digit 1 જ છે).", "mustWrite": ["Write the regex itself, not just a description", "Break the regex into pieces and explain each symbol", "Give 2 valid AND 2 invalid test examples for every pattern asked"], "keywords": ["Regular Expression", "Character Class", "Quantifier", "Word Boundary", "Pattern Matching"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A regex is like a fill-in-the-blanks template: `[6-9][0-9]{9}` literally reads \"first blank must be 6,7,8, or 9; then exactly 9 more blanks, each any digit.\" Build every pattern by describing its shape piece by piece exactly like that.", "examTip": "Whatever new pattern the exam invents (product codes, names starting with a letter), build it the same way — identify the fixed literal parts first (hyphens, @ signs), then fill the variable parts with the right character class and quantifier.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q8", "sr": 8, "question": "Perform morphological analysis of given words by identifying root word, prefix, suffix, and inflectional vs derivational morphemes.", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply word-level analysis techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This exact task (with different word lists) is Assignment-1 Q6 and Q7, and reappears with a fresh word list in the Jul-2026 mid-sem paper (\"reusable\", \"Unsuccessful, Modernization, Preview, Carelessness\") and again for \"misunderstanding\" in the same paper's OR option — a template question guaranteed to reappear with new words.", "easyMeaning": "Break given words into their root + prefix/suffix pieces and say whether each added piece changes grammar only (inflectional) or changes meaning/word class (derivational).", "understandEnMd": "Morphological analysis breaks a word into morphemes — the smallest meaning-carrying units. A morpheme can be a free morpheme (a root that can stand alone as a word, e.g. \"believe\") or a bound morpheme (a prefix/suffix that must attach to a root, e.g. \"un-\", \"-able\").\n\n**Inflectional morphemes** change only the grammatical form of a word (tense, number, comparison) without changing its word class or core meaning — e.g. \"-s\" (plural), \"-ed\" (past tense), \"-ing\" (progressive). **Derivational morphemes** change the meaning and often the word class (part of speech) of the root — e.g. \"un-\" + \"believable\" = \"unbelievable\" (adjective → negated adjective), \"-ness\" turns an adjective into a noun (\"happy\" → \"happiness\"), \"-ize\" can turn a noun/adjective into a verb.\n\nWorked example — \"Unbelievable\": prefix = \"un-\" (derivational, negation, added to an adjective), root = \"believe\", suffix = \"-able\" (derivational, turns a verb into an adjective). So \"Unbelievable\" = un- (derivational prefix) + believe (root) + -able (derivational suffix) → adjective meaning \"cannot be believed\".\n\nWorked example — \"Rewriting\": prefix = \"re-\" (derivational, meaning \"again\"), root = \"write\", suffix = \"-ing\" (inflectional, progressive aspect, does not change word class). So \"Rewriting\" = re- (derivational prefix) + write (root) + -ing (inflectional suffix).", "understandGuMd": "Morphological analysis શબ્દને morphemes માં તોડે છે — meaning ધરાવતા સૌથી નાના units. Morpheme બે પ્રકારના: free morpheme (root જે એકલો શબ્દ તરીકે ઊભો રહી શકે, દા.ત. \"believe\") અથવા bound morpheme (prefix/suffix જે root સાથે જ જોડાય, દા.ત. \"un-\", \"-able\").\n\n**Inflectional morphemes** શબ્દ ના grammatical form (tense, number, comparison) બદલે, પણ word class કે core meaning બદલતા નથી — દા.ત. \"-s\" (plural), \"-ed\" (past tense), \"-ing\" (progressive). **Derivational morphemes** root નું meaning અને ઘણી વાર word class (part of speech) બદલે — દા.ત. \"un-\" + \"believable\" = \"unbelievable\" (adjective → negated adjective), \"-ness\" adjective ને noun બનાવે (\"happy\"→\"happiness\"), \"-ize\" noun/adjective ને verb બનાવે.\n\nWorked example — \"Unbelievable\": prefix = \"un-\" (derivational, negation, adjective પર લાગે), root = \"believe\", suffix = \"-able\" (derivational, verb ને adjective બનાવે). એટલે \"Unbelievable\" = un- (derivational prefix) + believe (root) + -able (derivational suffix) → meaning \"believe ના કરી શકાય એવું\".\n\nWorked example — \"Rewriting\": prefix = \"re-\" (derivational, \"ફરીથી\" meaning), root = \"write\", suffix = \"-ing\" (inflectional, progressive aspect, word class બદલતું નથી). એટલે \"Rewriting\" = re- (derivational prefix) + write (root) + -ing (inflectional suffix).", "oneLine": "Inflectional = grammar only, same word class (e.g. -s, -ed, -ing); Derivational = changes meaning/word class (e.g. un-, -ness, -ize).", "memoryTrick": "\"Inflection Is For Grammar\" vs \"Derivation makes a Different word\" — I=Inflection=grammar, D=Derivation=Different meaning/class.", "quick10": "Root = base word; prefix/suffix are bound morphemes; inflectional = grammar-only change (e.g. -ed, -s); derivational = meaning/word-class change (e.g. un-, -ness).", "quick30": "Morphological analysis identifies a word's root and its attached prefix/suffix morphemes. Inflectional morphemes (like -s, -ed, -ing, -er comparative) only change grammatical form — tense, number, degree — without changing the word's part of speech. Derivational morphemes (like un-, re-, -ness, -ize, -able) change the meaning and often the part of speech of the root. Example: \"Unbelievable\" = un-(derivational) + believe(root) + -able(derivational); \"Rewriting\" = re-(derivational) + write(root) + -ing(inflectional).", "answerEnMd": "Morphological analysis breaks a word into its smallest meaning-carrying units (morphemes): the root (free morpheme) and any attached prefixes/suffixes (bound morphemes), then classifies each affix as inflectional (grammar-only) or derivational (changes meaning/word class).\n\n| Word | Prefix | Root | Suffix | Inflectional Morpheme | Derivational Morpheme |\n|---|---|---|---|---|---|\n| Unbelievable | un- (negation) | believe | -able | — | un- , -able (verb→adjective, then negated) |\n| Rewriting | re- (again) | write | -ing | -ing (progressive, no class change) | re- |\n| Nationalization | — | nation | -al, -ize, -ation | — | -al (noun→adj), -ize (adj→verb), -ation (verb→noun) |\n| Miscommunication | mis- (wrongly) | communicate | -ion | — | mis- , -ion (verb→noun) |\n| Friendliness | — | friend | -ly, -ness | — | -ly (noun→adjective), -ness (adjective→noun) |\n\n**Explanation of the method:** For each word, first strip recognisable prefixes and suffixes from the outside in, leaving the smallest recognisable root. Then check each affix: if removing it only changes tense/number/degree and the word stays the same part of speech, it is inflectional; if removing it changes the word's meaning or its part of speech, it is derivational. Most English words with multiple layers of derivation (like \"Nationalization\") are built by successively applying several derivational suffixes to the same root, one part-of-speech change at a time (noun → adjective → verb → noun again).", "answerGuMd": "Morphological analysis શબ્દને તેના સૌથી નાના meaning-ધરાવતા units (morphemes) માં તોડે છે: root (free morpheme) અને જોડાયેલા prefixes/suffixes (bound morphemes), પછી દરેક affix ને inflectional (ફક્ત grammar) કે derivational (meaning/word class બદલે) તરીકે classify કરે છે.\n\n| Word | Prefix | Root | Suffix | Inflectional | Derivational |\n|---|---|---|---|---|---|\n| Unbelievable | un- (negation) | believe | -able | — | un-, -able |\n| Rewriting | re- (ફરીથી) | write | -ing | -ing | re- |\n| Nationalization | — | nation | -al, -ize, -ation | — | -al, -ize, -ation |\n| Miscommunication | mis- (ખોટી રીતે) | communicate | -ion | — | mis-, -ion |\n| Friendliness | — | friend | -ly, -ness | — | -ly, -ness |\n\n**Method સમજૂતી:** દરેક શબ્દ માટે, પહેલા ઓળખાય એવા prefix/suffix બહારથી અંદર તરફ કાઢો, જેથી સૌથી નાનો root બચે. પછી દરેક affix check કરો: જો કાઢવાથી ફક્ત tense/number/degree બદલાય અને word class એ જ રહે, તો inflectional; જો meaning કે word class બદલાય, તો derivational. \"Nationalization\" જેવા multi-layer શબ્દો એક પછી એક derivational suffix (noun → adjective → verb → noun) લગાવીને બને છે.", "mustWrite": ["Present the answer in a clear table (Word | Prefix | Root | Suffix | Inflectional | Derivational)", "Explain the difference rule: inflectional = same word class, derivational = changed meaning/class", "Show the reasoning for at least one multi-layer word (Nationalization)"], "keywords": ["Morpheme", "Free Morpheme", "Bound Morpheme", "Root", "Prefix", "Suffix", "Inflectional", "Derivational"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Peel a word like an onion: outer layers are prefixes/suffixes, the core is the root. If peeling a layer only changes \"when/how many\" (grammar), it's inflectional. If peeling it changes \"what kind of word/what it means\", it's derivational.", "examTip": "Whatever new words the exam gives, always present the answer as a table — it's faster to grade and to write than long sentences, and matches exactly what \"tabular format\" instructions ask for.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q9", "sr": 9, "question": "Explain Context-Free Grammar (CFG) with its formal definition and a derivation example.", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply word-level analysis and syntactic techniques)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "CFG is the single biggest topic of the Unit-2 PPT (14+ dedicated slides), is directly tested in the recent Sep-2026 paper (\"Analyze the operational role of Context-Free Grammars... define what a CFG is\") and the Nov-2023 paper (\"Explain the concept of CFGs\"), and underlies both the derivation/parse-tree question (Q10) and the CYK question (Q11).", "easyMeaning": "Explain what a CFG is, its 4 formal parts, and show how it can build (\"derive\") a valid sentence step by step.", "understandEnMd": "A Context-Free Grammar (CFG) is a set of rules (productions) that describes how symbols of a language can be combined and ordered to form valid sentences — like an instruction manual for building grammatically correct sentences. It is called \"context-free\" because a rule can replace a symbol regardless of what surrounds it.\n\nFormally, a CFG is a 4-tuple **G = (N, Σ, R, S)**: **N** is a finite set of non-terminals (syntactic categories like NP, VP, written in uppercase — each represents a whole set of possible strings); **Σ** is a finite set of terminals (the actual words that appear in the final sentence, written in lowercase); **R** is the set of production rules (the grammar's rewriting rules); **S** is the start symbol (where every derivation begins). The left side of every rule must be a single non-terminal; the right side can be any mix of terminals and non-terminals.\n\nExample grammar: S → NP VP, NP → Det N, VP → V NP, Det → the | a, N → dog | cat | boy, V → chased | hugged. A **derivation** is the sequence of rule applications used to generate a specific string, e.g. for \"the dog chased the cat\": S ⇒ NP VP ⇒ Det N VP ⇒ the N VP ⇒ the dog VP ⇒ the dog V NP ⇒ the dog chased NP ⇒ the dog chased Det N ⇒ the dog chased the N ⇒ the dog chased the cat. This derivation is usually drawn as a parse tree, with S at the root and the words as leaves.", "understandGuMd": "Context-Free Grammar (CFG) એ rules (productions) નો સમૂહ છે જે બતાવે કે ભાષાના symbols કેવી રીતે જોડાઈને valid sentences બનાવે — grammatically સાચા sentences બનાવવાની instruction manual જેવું. તેને \"context-free\" કહેવાય કારણ કે એક rule ને, તેની આજુબાજુ ગમે તે હોય, symbol replace કરવા વાપરી શકાય.\n\nFormally, CFG એક 4-tuple **G = (N, Σ, R, S)** છે: **N** = non-terminals નો finite set (NP, VP જેવી syntactic categories, uppercase માં — દરેક strings ના આખા set ને represent કરે); **Σ** = terminals નો finite set (final sentence માં દેખાતા actual શબ્દો, lowercase માં); **R** = production rules નો set (grammar ના rewriting rules); **S** = start symbol (દરેક derivation જ્યાંથી શરૂ થાય). દરેક rule ની left side માત્ર એક non-terminal હોવો જોઈએ; right side માં terminals અને non-terminals નું કોઈ પણ મિશ્રણ હોઈ શકે.\n\nExample grammar: S → NP VP, NP → Det N, VP → V NP, Det → the | a, N → dog | cat | boy, V → chased | hugged. **Derivation** એટલે એક specific string generate કરવા વપરાયેલા rule applications નો sequence, દા.ત. \"the dog chased the cat\" માટે: S ⇒ NP VP ⇒ Det N VP ⇒ the N VP ⇒ the dog VP ⇒ the dog V NP ⇒ the dog chased NP ⇒ the dog chased Det N ⇒ the dog chased the N ⇒ the dog chased the cat. આ derivation ને સામાન્ય રીતે parse tree તરીકે દોરાય, S root પર અને શબ્દો leaves પર.", "oneLine": "CFG = G(N, Σ, R, S) — non-terminals, terminals, production rules, start symbol — used to derive valid sentences step by step.", "memoryTrick": "\"Nice Sentences Really Start\" → N(on-terminals), Σ(terminals), R(ules), S(tart symbol).", "quick10": "CFG = (N, Σ, R, S): non-terminals, terminals, production rules, start symbol; a derivation applies rules step by step to generate a sentence.", "quick30": "A Context-Free Grammar is a 4-tuple G=(N, Σ, R, S) where N=non-terminals (syntactic categories, uppercase), Σ=terminals (actual words, lowercase), R=production rules, S=start symbol. The left side of each rule is always a single non-terminal. A derivation is the sequence of rule replacements starting from S that produces a target string — e.g. S ⇒ NP VP ⇒ Det N VP ⇒ the N VP ⇒ ... ⇒ the dog chased the cat, using rules like S→NP VP, NP→Det N, VP→V NP, Det→the|a, N→dog|cat, V→chased. This is usually drawn as a parse tree.", "answerEnMd": "A Context-Free Grammar (CFG), also called a phrase-structure grammar, is a widely used formal system for modelling the constituent structure of natural language — a set of rules describing how symbols can be grouped and ordered to form valid strings, together with a lexicon of words.\n\n**Formal definition:** A CFG is defined by four parameters, G = (N, Σ, R, S):\n- **N (Non-terminals):** a finite set of syntactic category variables (e.g. S, NP, VP, Det, N, V), each representing a set of possible strings; written in uppercase.\n- **Σ (Terminals):** a finite set of the actual words/symbols that appear in the generated sentences; written in lowercase, and cannot be expanded further.\n- **R (Production Rules):** the set of rewriting rules, each with a single non-terminal on the left and a mix of terminals/non-terminals on the right (e.g. NP → Det N).\n- **S (Start Symbol):** the designated non-terminal from which every derivation begins.\n\n**Example grammar:** S → NP VP; NP → Det N; VP → V NP; Det → the | a; N → dog | cat | boy; V → chased | hugged. Here N = {S, NP, VP, Det, N, V}, Σ = {the, a, dog, cat, boy, chased, hugged}.\n\n**Derivation for \"the dog chased the cat\":** S ⇒ NP VP (using S→NP VP) ⇒ Det N VP (NP→Det N) ⇒ the N VP (Det→the) ⇒ the dog VP (N→dog) ⇒ the dog V NP (VP→V NP) ⇒ the dog chased NP (V→chased) ⇒ the dog chased Det N (NP→Det N) ⇒ the dog chased the N (Det→the) ⇒ the dog chased the cat (N→cat).\n\nThis sequence of rule expansions is the derivation of the string; it is commonly represented as a **parse tree** with S at the root, internal nodes for each non-terminal, and the words of the sentence as leaves, read left to right.", "answerGuMd": "Context-Free Grammar (CFG), જેને phrase-structure grammar પણ કહેવાય, natural language ના constituent structure ને model કરવા માટે વ્યાપક રીતે વપરાતી formal system છે — rules નો સમૂહ જે બતાવે કે symbols કેવી રીતે group અને order થઈને valid strings બનાવે, સાથે શબ્દોનું lexicon.\n\n**Formal Definition:** CFG ને ચાર parameters થી define કરાય, G = (N, Σ, R, S):\n- **N (Non-terminals):** syntactic category variables નો finite set (દા.ત. S, NP, VP, Det, N, V), દરેક strings ના set ને represent કરે; uppercase
