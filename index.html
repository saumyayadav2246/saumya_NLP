), versus being just a random collection of unrelated sentences.\n\n**Worked example — Passage A vs Passage B (23-Sep-2026 paper):** Passage A contains 3 unrelated sentences (about the stock market, a color, and rainfall) — these sentences share no common topic, entity, or logical connector, so Passage A is **incoherent**. Passage B contains 3 causally connected sentences (about the stock market, inflation, and bank forecasts) — each sentence's topic logically leads into the next (stock market → what affects it, inflation → banks react to it), so Passage B is **coherent**.\n\n**TextTiling** is an algorithm (Hearst) that automatically detects **topic boundaries** in a long text by measuring how much vocabulary (content words) is shared between adjacent blocks of text: it slides a window across the text, computes the lexical (vocabulary) similarity/overlap between the block just before and the block just after each candidate boundary point, and marks a **topic shift (tile boundary)** wherever this overlap score drops sharply (a \"valley\" in the similarity curve).\n\n**Worked Numerical — Block A vs Block B (23-Sep-2026 paper):** Block A content words: {network, engineer, firewall, access, control, lists}. Block B content words: {server, CPU, usage, database, queries, timing, out}.\nShared content words between Block A and Block B = **0 words** (zero overlap).\n**Conclusion:** Since vocabulary overlap = 0, TextTiling would detect a **strong topic boundary** between Block A and Block B — they are about completely different topics (network security vs. database performance).", "understandGuMd": "**Textual Coherence** એ છે કે passage ના sentences એકબીજા સાથે logically અને meaningfully જોડાયેલા છે (shared topic, cause-effect, pronoun reference વગેરે દ્વારા) કે પછી ફક્ત unrelated sentences નો random સમૂહ છે.\n\n**Worked example — Passage A vs Passage B (23-Sep-2026 paper):** Passage A ના 3 unrelated sentences (stock market, color, rainfall વિશે) — કોઈ common topic/entity/logical connector share નથી કરતા, એટલે Passage A **incoherent** છે. Passage B ના 3 causally connected sentences (stock market, inflation, bank forecasts વિશે) — દરેક sentence નો topic logically આગળના માં જાય, એટલે Passage B **coherent** છે.\n\n**TextTiling** (Hearst) એ algorithm છે જે લાંબા text માં **topic boundaries** automatically શોધે, adjacent blocks વચ્ચે vocabulary (content words) કેટલું share થાય છે તે measure કરીને: text પર window slide કરે, દરેક candidate boundary point પહેલાના અને પછીના block વચ્ચે lexical overlap score compute કરે, અને જ્યાં આ score ઝડપથી ઘટે (similarity curve માં \"valley\") ત્યાં **topic shift (tile boundary)** mark કરે.\n\n**Worked Numerical — Block A vs Block B (23-Sep-2026 paper):** Block A content words: {network, engineer, firewall, access, control, lists}. Block B content words: {server, CPU, usage, database, queries, timing, out}.\nBlock A અને Block B વચ્ચે shared content words = **0** (zero overlap).\n**Conclusion:** Vocabulary overlap = 0 હોવાથી, TextTiling Block A અને Block B વચ્ચે **મજબૂત topic boundary** detect કરશે — તેઓ સંપૂર્ણપણે અલગ topics વિશે છે (network security vs database performance).", "oneLine": "Coherence = sentences logically connected; TextTiling detects topic boundaries where vocabulary overlap between adjacent blocks drops to near-zero.", "memoryTrick": "\"Zero overlap = big topic gap\" — TextTiling boundary = valley in the shared-vocabulary curve.", "quick10": "Coherent text = logically connected sentences (shared topic/cause-effect); TextTiling finds topic boundaries by measuring vocabulary overlap between adjacent blocks — low overlap = boundary.", "quick30": "Textual coherence means sentences connect logically (shared entities, cause-effect chains); an incoherent passage has unrelated sentences with no shared topic. TextTiling (Hearst) automatically finds topic boundaries in a text by computing lexical overlap between adjacent text blocks using a sliding window; a sharp drop (valley) in overlap signals a topic shift. Example: Block A={network,engineer,firewall,...} vs Block B={server,CPU,database,...} share 0 content words → strong topic boundary detected.", "answerEnMd": "**Textual Coherence** is the property of a passage where sentences are logically and semantically connected (via shared entities, topic continuity, or cause-effect relations); a passage lacking such connections is incoherent, even if each sentence is individually grammatical.\n\n**Example:** Passage A (stock market / color / rainfall — three unrelated topics) is incoherent since no sentence relates to another. Passage B (stock market → inflation → bank forecasts) is coherent since each sentence's topic causally leads to the next.\n\n**TextTiling Algorithm (Hearst):** detects topic boundaries in a text by measuring the lexical (content-word) overlap between adjacent blocks of text using a sliding window; wherever this overlap score drops sharply, a topic (tile) boundary is marked.\n\n**Worked Numerical — Block A vs Block B:** Block A = {network, engineer, firewall, access, control, lists}. Block B = {server, CPU, usage, database, queries, timing, out}. **Shared words = 0.** Since the overlap is zero, TextTiling detects a **strong topic boundary** between the two blocks — confirming they belong to different topics (network security vs. database performance).", "answerGuMd": "**Textual Coherence** એ passage ની property છે જ્યાં sentences logically અને semantically જોડાયેલા હોય (shared entities, topic continuity, cause-effect relations દ્વારા); આવા સંબંધો વગરનું passage incoherent હોય, ભલે દરેક sentence વ્યાકરણ રીતે સાચું હોય.\n\n**Example:** Passage A (stock market/color/rainfall — ત્રણ unrelated topics) incoherent છે. Passage B (stock market → inflation → bank forecasts) coherent છે કારણ કે દરેક sentence નો topic logically આગળના sentence તરફ જાય છે.\n\n**TextTiling Algorithm (Hearst):** sliding window વાપરીને adjacent text blocks વચ્ચે lexical (content-word) overlap measure કરીને topic boundaries શોધે; જ્યાં overlap score ઝડપથી ઘટે ત્યાં topic (tile) boundary mark કરાય.\n\n**Worked Numerical — Block A vs Block B:** Block A = {network, engineer, firewall, access, control, lists}. Block B = {server, CPU, usage, database, queries, timing, out}. **Shared words = 0.** Overlap zero હોવાથી, TextTiling બંને blocks વચ્ચે **મજબૂત topic boundary** detect કરે — network security vs database performance અલગ topics છે એ confirm થાય.", "mustWrite": ["Define coherence and give a concrete reason why a passage is/isn't coherent (name the shared topic or point out the lack of one)", "Explain TextTiling's sliding-window + overlap-measurement mechanism", "Show the actual word-overlap count for any given blocks"], "keywords": ["Textual Coherence", "TextTiling", "Lexical Overlap", "Topic Boundary", "Topic Segmentation"], "diagramMd": "A horizontal line of text blocks (B1,B2,B3,B4) with a similarity-score curve drawn below/above; a dip (\"valley\") in the curve between B2 and B3 marked with a vertical dashed line labeled \"topic boundary\".", "howToDrawMd": "1. Draw a row of 4-5 boxes representing consecutive text blocks. 2. Below them, draw a simple line graph showing overlap score between each adjacent pair. 3. Mark the lowest point of the graph with a dashed vertical line and label it \"Topic Boundary Detected\".", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Coherence-checking is asking \"do these sentences feel like they belong to the same story?\" TextTiling automates that feeling by literally counting how many of the same important words appear in one chunk of text versus the next chunk — few shared words means a new topic just started.", "examTip": "When comparing two passages/blocks for coherence or TextTiling, always explicitly list the content words of each side before comparing — writing out the actual overlap (or lack of it) is what earns marks, not just the final verdict.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q28", "sr": 28, "question": "Explain Thematic Roles, Selectional Restrictions, and Semantic Role Labeling (SRL) with worked examples.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply semantic role analysis techniques)", "bloomLevel": "Apply", "priority": "high", "priorityLabel": "High", "priorityReason": "Semantic Role Labeling is a dedicated PPT topic with a full worked example (\"John hit the ball with a stick\"), is separately tested in the Sep-2025 final (\"Ram sold the book to Shyam\"), and the very recent 23-Sep-2026 paper adds a fresh thematic-roles/selectional-restriction-violation numerical (backup script/database logs) — confirming this is tested across multiple independent sources including the newest one.", "easyMeaning": "Explain how NLP labels each part of a sentence with its semantic role (who did it, what was affected, what tool was used), and how \"selectional restrictions\" catch sentences that are grammatically fine but semantically odd.", "understandEnMd": "**Semantic Role Labeling (SRL)** is the task of identifying, for each verb (predicate) in a sentence, the semantic role played by each associated noun phrase — such as **Agent** (the doer), **Patient/Theme** (the entity affected or undergoing the action), **Instrument** (the tool used), **Recipient/Goal** (who receives something), **Location**, and **Time**.\n\n**Worked example — \"John hit the ball with a stick\" (PPT):** Agent = John (the one performing the hitting), Patient = the ball (the entity being hit), Instrument = \"with a stick\" (the tool used to perform the action).\n\n**Worked example — \"Ram sold the book to Shyam\":** Agent = Ram, Theme = the book, Recipient = Shyam.\n\n**Selectional Restrictions** are semantic constraints a verb places on the *type* of noun phrase that can fill each of its roles — e.g. the verb \"eat\" requires its Agent to be animate and its Patient/Theme to be something edible. A sentence can be perfectly grammatical (syntactically valid) yet still violate a selectional restriction, making it semantically anomalous/odd.\n\n**Worked example — \"The system backup script deleted old database logs.\" vs \"The database logs deleted the system backup script.\" (23-Sep-2026 paper):** In the first sentence, Agent = \"the system backup script\" (a program, capable of performing a delete action) and Theme = \"old database logs\" (data, a plausible thing to be deleted) — this fits normal expectations (though note that \"script\" is not literally animate, in a technical/computing context a script is an acceptable causer of a delete action). In the second, REVERSED sentence, \"the database logs\" (passive data, not capable of performing actions) is placed in the Agent role and \"the system backup script\" becomes the Theme — this is **syntactically valid but semantically anomalous**, because it violates the natural expectation that only an active, executable entity (like a script or process) can be the Agent of \"delete\", while logs (mere data) cannot; this exact contrast is what a selectional-restriction analysis is expected to identify.", "understandGuMd": "**Semantic Role Labeling (SRL)** એ sentence ના દરેક verb (predicate) માટે, તેની સાથે જોડાયેલા દરેક noun phrase નો semantic role ઓળખવાનું task છે — જેમ કે **Agent** (કરનાર), **Patient/Theme** (જેના પર અસર થાય), **Instrument** (વપરાયેલું સાધન), **Recipient/Goal** (કોણ મેળવે છે), **Location**, અને **Time**.\n\n**Worked example — \"John hit the ball with a stick\" (PPT):** Agent = John, Patient = the ball, Instrument = \"with a stick\".\n\n**Worked example — \"Ram sold the book to Shyam\":** Agent = Ram, Theme = the book, Recipient = Shyam.\n\n**Selectional Restrictions** એ semantic constraints છે જે verb પોતાના દરેક role ને ભરતા noun phrase ના *type* પર મૂકે છે — દા.ત. \"eat\" verb ના Agent એ animate હોવું જોઈએ અને Patient/Theme ખાવા લાયક વસ્તુ હોવી જોઈએ. Sentence વ્યાકરણ રીતે (syntactically) સંપૂર્ણ સાચું હોવા છતાં selectional restriction violate કરી શકે, જે તેને semantically anomalous/odd બનાવે.\n\n**Worked example — \"The system backup script deleted old database logs.\" vs \"The database logs deleted the system backup script.\" (23-Sep-2026 paper):** પહેલા sentence માં, Agent = \"the system backup script\" (program, delete action કરી શકે) અને Theme = \"old database logs\" (data, delete થવા લાયક) — સામાન્ય expectation ને બંધબેસે. બીજા, REVERSED sentence માં, \"the database logs\" (passive data, action ના કરી શકે) Agent role માં આવે અને \"the system backup script\" Theme બને — આ **syntactically સાચું પણ semantically anomalous** છે, કારણ કે એ expectation violate કરે કે \"delete\" નો Agent ફક્ત active, executable entity (script/process) જ હોઈ શકે, logs (ફક્ત data) નહીં.", "oneLine": "SRL labels Agent/Patient/Instrument/Recipient per verb; Selectional Restrictions flag sentences that are grammatical but semantically odd (wrong \"type\" filling a role).", "memoryTrick": "\"Who-What-With\" — Agent(Who), Patient/Theme(What), Instrument(With what) — the 3 core SRL roles to find first.", "quick10": "SRL: label each noun phrase's role (Agent/Patient/Instrument/Recipient) per verb; Selectional restrictions: verb expects certain \"types\" for each role — violating them = grammatical but semantically odd.", "quick30": "Semantic Role Labeling assigns roles like Agent (doer), Patient/Theme (affected entity), Instrument (tool), and Recipient (receiver) to each noun phrase relative to a verb — e.g. \"John hit the ball with a stick\" → Agent=John, Patient=ball, Instrument=stick. Selectional restrictions are the semantic \"type constraints\" a verb places on its roles (e.g. Agent of \"delete\" should be an active/executable entity); a sentence like \"The database logs deleted the system backup script\" is syntactically valid but violates this restriction, making it semantically anomalous even though it parses fine.", "answerEnMd": "**Semantic Role Labeling (SRL)** identifies the semantic role each noun phrase plays relative to the main verb of a sentence: **Agent** (performer of the action), **Patient/Theme** (entity affected/acted upon), **Instrument** (tool/means used), **Recipient** (receiver), **Location**, **Time**.\n\n**Worked Example — \"John hit the ball with a stick\":** Agent = John; Patient = the ball; Instrument = with a stick.\n\n**Worked Example — \"Ram sold the book to Shyam\":** Agent = Ram; Theme = the book; Recipient = Shyam.\n\n**Selectional Restrictions** are semantic constraints that a verb imposes on the permissible \"type\" of filler for each of its roles (e.g. the Agent of \"delete\" should be capable of performing actions).\n\n**Worked Example — \"The system backup script deleted old database logs.\" vs \"The database logs deleted the system backup script.\":** The first sentence assigns Agent to \"the system backup script\" (an active/executable entity — a valid Agent for \"delete\") and Theme to \"old database logs\" (passive data — a valid Theme). The reversed second sentence assigns Agent to \"the database logs\" (passive data, unable to perform a delete action) and Theme to \"the system backup script\" — this is **syntactically well-formed but semantically anomalous**, because it violates the selectional restriction that \"delete\" requires an active/executable Agent, illustrating that grammatical correctness does not guarantee semantic sensibility.", "answerGuMd": "**Semantic Role Labeling (SRL)** sentence ના મુખ્ય verb ને relative દરેક noun phrase નો semantic role ઓળખે: **Agent** (action કરનાર), **Patient/Theme** (અસર પામતું entity), **Instrument** (સાધન), **Recipient** (મેળવનાર), **Location**, **Time**.\n\n**Worked Example — \"John hit the ball with a stick\":** Agent = John; Patient = the ball; Instrument = with a stick.\n\n**Worked Example — \"Ram sold the book to Shyam\":** Agent = Ram; Theme = the book; Recipient = Shyam.\n\n**Selectional Restrictions** verb પોતાના દરેક role ના filler ના permissible \"type\" પર semantic constraints મૂકે (દા.ત. \"delete\" નો Agent action કરી શકે એવો હોવો જોઈએ).\n\n**Worked Example — \"The system backup script deleted old database logs.\" vs \"The database logs deleted the system backup script.\":** પહેલા sentence માં Agent = \"the system backup script\" (active/executable entity, valid Agent) અને Theme = \"old database logs\" (passive data, valid Theme). Reversed બીજા sentence માં Agent = \"the database logs\" (passive data, delete કરી ના શકે) અને Theme = \"the system backup script\" — આ **syntactically સાચું પણ semantically anomalous** છે, કારણ કે \"delete\" ના Agent એ active/executable હોવો જોઈએ એ restriction violate થાય છે.", "mustWrite": ["Label every major noun phrase's role, not just the subject", "Explicitly define \"selectional restriction\" as a semantic type-constraint on a role", "Point out clearly WHY the swapped/reversed sentence is anomalous (which restriction it breaks)"], "keywords": ["Semantic Role Labeling", "Agent", "Patient", "Theme", "Instrument", "Selectional Restriction"], "diagramMd": "A sentence with each noun phrase bracketed and labeled below: [John]_Agent [hit] [the ball]_Patient [with a stick]_Instrument.", "howToDrawMd": "1. Write the sentence on one line. 2. Draw a bracket under each noun phrase. 3. Label each bracket with its role name (Agent/Patient/Instrument/Recipient) directly underneath. 4. For a selectional-restriction question, draw the same bracket-and-label diagram for BOTH the normal and the anomalous sentence side by side, and mark the anomalous role with an \"✗\" or \"!\".", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "SRL is like labeling a school play's cast list under the sentence: who's the hero doing the action (Agent), who/what gets acted upon (Patient), what prop is used (Instrument). Selectional restrictions just check \"does this role make logical sense for this verb?\" — a pair of logs can't physically press \"delete\", so putting logs in the Agent slot of \"delete\" just feels wrong even though the sentence is grammatically fine.", "examTip": "If the exam gives a \"reversed\" or \"swapped\" sentence pair, always explicitly name which selectional restriction is broken (e.g. \"delete's Agent must be an active/executable entity, but here it is passive data\") — this exact justification is what separates a full-marks answer from a partial one.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q29", "sr": 29, "question": "Explain Conditional Probability and Bayes' Theorem with a fully worked numerical example.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply probability theory for language modelling)", "bloomLevel": "Apply", "priority": "high", "priorityLabel": "High", "priorityReason": "This is a full dedicated PPT section (with its own contingency-table examples for marginal/joint/conditional probability plus a complete Bayes' Theorem worked numerical) that directly underlies the Naive-Bayes WSD question (Unit 3, Q26) and the MLE/Laplace smoothing questions in this unit — foundational probability content likely to appear as a short-answer or as part of a larger question.", "easyMeaning": "Explain marginal, joint, and conditional probability, then use Bayes' Theorem to reverse a conditional probability (e.g. going from P(test positive|has disease) to P(has disease|tested positive)).", "understandEnMd": "**Marginal Probability** is the probability of a single event ignoring all others, e.g. P(cancer) = (total with cancer)/(total). **Joint Probability** is the probability of two events happening together, e.g. P(cancer AND no family history). **Conditional Probability** is the probability of one event GIVEN that another has already happened: P(A|B) = P(A and B)/P(B).\n\n**Bayes' Theorem** lets us \"reverse\" a conditional probability: if we know P(B|A), we can find P(A|B) using: **P(A|B) = P(B|A) × P(A) / P(B)**, where P(B) is expanded using the law of total probability: P(B) = P(B|A)×P(A) + P(B|A')×P(A').\n\n**Worked Example (PPT) — Prostate Cancer / PSA Test:** Given: 60% of men have some form of prostate cancer → P(C)=0.60, P(C')=0.40. The PSA test shows positive 80% of the time for men who have cancer → P(T|C)=0.80. It shows positive 5% of the time for healthy men → P(T|C')=0.05. **Find: P(C|T)** — the probability a man actually has cancer, given he tested positive.\n\nStep 1 — compute P(T) using total probability: P(T) = P(T|C)×P(C) + P(T|C')×P(C') = 0.80×0.60 + 0.05×0.40 = 0.48 + 0.02 = **0.50**.\nStep 2 — apply Bayes' Theorem: P(C|T) = P(T|C)×P(C) / P(T) = (0.80×0.60)/0.50 = 0.48/0.50 = **0.96**.\n\n**Conclusion: a man who tests positive has a 96% chance of actually having prostate cancer**, even though the test itself is imperfect (5% false-positive rate on healthy men) — this large jump from the test's own 80%/5% figures to a 96% final answer happens because prostate cancer is very common in this population (60% prevalence).", "understandGuMd": "**Marginal Probability** એક event ની probability છે, બીજા બધાને ignore કરીને, દા.ત. P(cancer) = (cancer ધરાવતા કુલ)/(કુલ). **Joint Probability** બે events સાથે થવાની probability, દા.ત. P(cancer AND no family history). **Conditional Probability** એક event ની probability, બીજો event પહેલેથી થયો છે એમ ધારીને: P(A|B) = P(A and B)/P(B).\n\n**Bayes' Theorem** conditional probability ને \"reverse\" કરવા દે: જો P(B|A) ખબર હોય, તો P(A|B) આ રીતે શોધાય: **P(A|B) = P(B|A) × P(A) / P(B)**, જ્યાં P(B) = P(B|A)×P(A) + P(B|A')×P(A') (total probability law).\n\n**Worked Example (PPT) — Prostate Cancer / PSA Test:** Given: 60% પુરુષોમાં prostate cancer → P(C)=0.60, P(C')=0.40. PSA test cancer ધરાવતા પુરુષોમાં 80% વખત positive → P(T|C)=0.80. તંદુરસ્ત પુરુષોમાં 5% વખત positive → P(T|C')=0.05. **શોધો: P(C|T)**.\n\nStep 1 — P(T) = P(T|C)×P(C) + P(T|C')×P(C') = 0.80×0.60 + 0.05×0.40 = 0.48+0.02 = **0.50**.\nStep 2 — P(C|T) = P(T|C)×P(C)/P(T) = 0.48/0.50 = **0.96**.\n\n**Conclusion: positive test આવે તો actual cancer હોવાની probability 96% છે**, ભલે test પોતે imperfect હોય (5% false-positive), કારણ કે cancer ની prevalence (60%) જ ખૂબ વધારે છે.", "oneLine": "Bayes: P(A|B) = P(B|A)×P(A)/P(B), where P(B)=P(B|A)P(A)+P(B|A')P(A'); prostate example: P(C|T)=0.96.", "memoryTrick": "\"Bayes flips the condition\" — turns a known P(evidence|cause) into the wanted P(cause|evidence).", "quick10": "Bayes' Theorem: P(A|B)=P(B|A)P(A)/P(B); worked example gives P(Cancer|Positive Test)=0.96 from P(C)=0.6,P(T|C)=0.8,P(T|C')=0.05.", "quick30": "Conditional probability P(A|B)=P(A∩B)/P(B). Bayes' Theorem reverses this: P(A|B)=P(B|A)×P(A)/P(B), with P(B) computed via total probability P(B)=P(B|A)P(A)+P(B|A')P(A'). Worked example: P(C)=0.6, P(T|C)=0.8, P(T|C')=0.05 → P(T)=0.8×0.6+0.05×0.4=0.5 → P(C|T)=0.8×0.6/0.5=0.96, meaning a positive-testing man has 96% chance of actually having the condition.", "answerEnMd": "**Conditional Probability:** P(A|B) = P(A∩B)/P(B) — the probability of A given B has occurred.\n\n**Bayes' Theorem:** P(A|B) = P(B|A) × P(A) / P(B), used to reverse a known conditional probability, where P(B) is found via the law of total probability: P(B) = P(B|A)×P(A) + P(B|A')×P(A').\n\n**Worked Numerical:** Given P(C)=0.60 (60% of men have prostate cancer), P(C')=0.40, P(T|C)=0.80 (test positive rate for cancer patients), P(T|C')=0.05 (false-positive rate for healthy men). Find P(C|T).\n\nStep 1: P(T) = P(T|C)P(C) + P(T|C')P(C') = (0.80)(0.60) + (0.05)(0.40) = 0.48 + 0.02 = 0.50.\nStep 2: P(C|T) = P(T|C)P(C)/P(T) = 0.48/0.50 = **0.96**.\n\n**A man who tests positive has a 96% probability of actually having prostate cancer.**", "answerGuMd": "**Conditional Probability:** P(A|B) = P(A∩B)/P(B).\n\n**Bayes' Theorem:** P(A|B) = P(B|A) × P(A) / P(B), જ્યાં P(B) = P(B|A)×P(A) + P(B|A')×P(A') (total probability law).\n\n**Worked Numerical:** P(C)=0.60, P(C')=0.40, P(T|C)=0.80, P(T|C')=0.05. P(C|T) શોધો.\n\nStep 1: P(T) = 0.80×0.60 + 0.05×0.40 = 0.48+0.02 = 0.50.\nStep 2: P(C|T) = 0.48/0.50 = **0.96**.\n\n**Positive test આવેલા પુરુષને actual prostate cancer હોવાની probability 96% છે.**", "mustWrite": ["Write the Bayes' Theorem formula before substituting numbers", "Compute P(B)/P(T) as an explicit intermediate step (do not skip to the final answer)", "State the final answer as a clear probability/percentage sentence"], "keywords": ["Conditional Probability", "Bayes' Theorem", "Marginal Probability", "Joint Probability", "Total Probability"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "**Given:** P(C)=0.60, P(C')=0.40, P(T|C)=0.80, P(T|C')=0.05.\n**Formula:** P(C|T) = P(T|C)×P(C) / [P(T|C)×P(C) + P(T|C')×P(C')].\n**Step 1:** Numerator = P(T|C)×P(C) = 0.80×0.60 = 0.48.\n**Step 2:** P(T) = 0.48 + (0.05×0.40) = 0.48+0.02 = 0.50.\n**Final Answer:** P(C|T) = 0.48/0.50 = 0.96 (96%).\n**Exam Writing Format:** State given values, write full Bayes formula, show numerator and denominator separately, then divide for the final answer.", "algorithmMd": "", "explainAgainMd": "Bayes' Theorem answers \"given the clue (positive test), how likely is the suspect (has cancer)?\" — it combines how common the condition already is (60%) with how reliable the clue is (80% catches it, only 5% false-alarms), and heavily common conditions end up with surprisingly high final probabilities even from an imperfect test.", "examTip": "Whatever new scenario/numbers the exam gives (a different disease, a different test), follow the same 2-step template: first compute the total/marginal probability of the evidence (P(B)) using both branches, then divide the relevant numerator by it — this template never changes.", "isNumerical": true, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "P(C)=0.60, P(C')=0.40, P(T|C)=0.80, P(T|C')=0.05.", "formulaMd": "P(C|T) = P(T|C)×P(C) / [P(T|C)×P(C) + P(T|C')×P(C')].", "finalAnswerMd": "P(C|T) = 0.48/0.50 = 0.96 (96%).", "hasFormula": true}, {"id": "q30", "sr": 30, "question": "Explain Language Models, N-grams, the Markov Assumption, and the Chain Rule of Probability.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply probabilistic language modelling techniques)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is the foundational, most heavily covered topic of the dedicated 80-slide Unit-4 PPT, underlies every single smoothing/POS-tagging/Viterbi question in this unit, and N-gram concepts are tested in nearly every real paper sampled (Jul-2026, Sep-2025, Dec-2024, Winter-2021).", "easyMeaning": "Explain what a \"Language Model\" is (something that predicts how likely a sentence/word sequence is), how N-grams simplify this using the Markov Assumption, and how the Chain Rule connects them.", "understandEnMd": "A **Language Model (LM)** computes the probability of a sequence of words, P(W) = P(w1, w2, ..., wn), or the probability of the next word given previous words, P(wn | w1, ..., wn-1). This is useful for speech recognition, machine translation, auto-complete, and spelling correction — the LM tells you which word sequence is more \"natural\"/likely.\n\n**Chain Rule of Probability:** the joint probability of a sequence can always be exactly decomposed as P(w1,w2,...,wn) = P(w1) × P(w2|w1) × P(w3|w1,w2) × ... × P(wn|w1,...,wn-1) — each word's probability conditioned on ALL previous words. The problem: for long sentences this needs impossibly large amounts of data (we would never see enough examples of every exact long history).\n\n**Markov Assumption (the fix):** instead of conditioning on the entire history, assume the probability of the next word depends only on a small fixed number of previous words. This gives rise to **N-gram models**: a **unigram** model assumes each word is independent, P(wn)≈P(wn) alone; a **bigram** model assumes P(wn|w1...wn-1) ≈ P(wn|wn-1) (depends only on the 1 previous word); a **trigram** model assumes P(wn|wn-1,wn-2) (depends on the 2 previous words).\n\n**Estimating N-gram probabilities (Maximum Likelihood Estimation, MLE):** P(wn|wn-1) = Count(wn-1, wn) / Count(wn-1) — simply count how often the bigram occurs, divided by how often the first word occurs alone.\n\n**Worked Example — bigram probability of \"I like NLP\" from a tiny corpus {\"I like NLP\", \"I like AI\", \"I love NLP\"} (Assignment-2 Q1), given P(I)=3/3=1:** Using the Chain Rule with the bigram Markov Assumption: P(\"I like NLP\") = P(I) × P(like|I) × P(NLP|like). Count(I, like)=2 (sentences 1,2), Count(I, *)=3 (all 3 sentences start with I) → P(like|I) = 2/3. Count(like, NLP)=1 (sentence 1), Count(like, *)=2 (sentences 1,2 both have \"like\") → P(NLP|like) = 1/2. **P(\"I like NLP\") = 1 × 2/3 × 1/2 = 2/6 = 1/3 ≈ 0.333.**", "understandGuMd": "**Language Model (LM)** શબ્દોના sequence ની probability compute કરે, P(W) = P(w1, w2, ..., wn), અથવા આગલા શબ્દની probability પાછલા શબ્દો આધારે, P(wn | w1, ..., wn-1). આ speech recognition, machine translation, auto-complete, spelling correction માટે ઉપયોગી છે.\n\n**Chain Rule of Probability:** sequence ની joint probability હંમેશા આ રીતે decompose કરી શકાય: P(w1,w2,...,wn) = P(w1) × P(w2|w1) × P(w3|w1,w2) × ... × P(wn|w1,...,wn-1). સમસ્યા: લાંબા sentences માટે આટલો બધો data ક્યારેય મળે નહીં.\n\n**Markov Assumption (ઉકેલ):** આખા history ને બદલે, ધારો કે આગલા શબ્દની probability ફક્ત નાના fixed number ના પાછલા શબ્દો પર આધાર રાખે. આનાથી **N-gram models** બને: **unigram** (દરેક શબ્દ independent), **bigram** (P(wn|wn-1), ફક્ત 1 પાછલા શબ્દ પર આધાર), **trigram** (P(wn|wn-1,wn-2), 2 પાછલા શબ્દો પર આધાર).\n\n**N-gram probability estimate (MLE):** P(wn|wn-1) = Count(wn-1, wn) / Count(wn-1).\n\n**Worked Example — \"I like NLP\" ની bigram probability, corpus {\"I like NLP\", \"I like AI\", \"I love NLP\"} (Assignment-2 Q1), P(I)=3/3=1 આપેલ:** P(\"I like NLP\") = P(I) × P(like|I) × P(NLP|like). Count(I,like)=2, Count(I,*)=3 → P(like|I)=2/3. Count(like,NLP)=1, Count(like,*)=2 → P(NLP|like)=1/2. **P(\"I like NLP\") = 1 × 2/3 × 1/2 = 1/3 ≈ 0.333.**", "oneLine": "LM = P(word sequence); Chain Rule decomposes it exactly; Markov Assumption approximates it using only the last N-1 words (N-gram); MLE estimates probabilities by counting.", "memoryTrick": "\"N-gram only remembers N-1 steps back\" — bigram remembers 1 word back, trigram remembers 2 words back.", "quick10": "LM computes P(word sequence); Chain Rule = exact decomposition; Markov Assumption + N-grams = approximate using only last N-1 words; MLE: P(w2|w1)=Count(w1,w2)/Count(w1).", "quick30": "A Language Model estimates P(W)=P(w1,...,wn) or the next-word probability. The Chain Rule gives the exact decomposition P(w1)×P(w2|w1)×...×P(wn|w1..wn-1), but this needs infeasible amounts of data for long histories. The Markov Assumption fixes this by assuming each word depends only on the previous N-1 words, giving N-gram models (bigram=1 word back, trigram=2 words back). Probabilities are estimated via MLE: Count(context,word)/Count(context). Example: P(\"I like NLP\")=P(I)×P(like|I)×P(NLP|like)=1×(2/3)×(1/2)=1/3, using bigram counts from a 3-sentence corpus.", "answerEnMd": "A **Language Model** assigns a probability to a sequence of words, P(W) = P(w1,w2,...,wn), enabling systems to judge which word sequences are more likely/natural — used in speech recognition, machine translation, auto-complete, and spelling correction.\n\n**Chain Rule of Probability** gives the exact decomposition: P(w1,w2,...,wn) = P(w1) × P(w2|w1) × P(w3|w1,w2) × ... × P(wn|w1,...,wn-1). This is infeasible in practice because we would need to have observed every possible long history in training data.\n\n**Markov Assumption:** approximates the Chain Rule by assuming the next word's probability depends only on a limited number of preceding words, giving rise to **N-gram Models**: Unigram — P(wn) alone; Bigram — P(wn|wn-1); Trigram — P(wn|wn-1,wn-2).\n\n**MLE Estimation:** P(wn|wn-1) = Count(wn-1, wn) / Count(wn-1).\n\n**Worked Numerical (Assignment-2 Q1):** Corpus = {\"I like NLP\", \"I like AI\", \"I love NLP\"}, find P(\"I like NLP\") using a bigram model, given P(I)=1.\n- P(like|I) = Count(I,like)/Count(I,*) = 2/3.\n- P(NLP|like) = Count(like,NLP)/Count(like,*) = 1/2.\n- **P(\"I like NLP\") = P(I) × P(like|I) × P(NLP|like) = 1 × 2/3 × 1/2 = 1/3 ≈ 0.333.**", "answerGuMd": "**Language Model** શબ્દોના sequence ને probability આપે, P(W) = P(w1,w2,...,wn), જેથી system કઈ sequence વધુ likely/natural છે એ નક્કી કરી શકે — speech recognition, machine translation, auto-complete, spelling correction માં વપરાય.\n\n**Chain Rule of Probability** exact decomposition આપે: P(w1,w2,...,wn) = P(w1) × P(w2|w1) × ... × P(wn|w1,...,wn-1). વ્યવહારમાં આ અશક્ય છે કારણ કે દરેક લાંબી history training data માં જોવા મળવી અશક્ય છે.\n\n**Markov Assumption:** આગલા શબ્દની probability ફક્ત મર્યાદિત પાછલા શબ્દો પર આધારિત ધારીને Chain Rule ને approximate કરે, જેનાથી **N-gram Models** બને: Unigram, Bigram (P(wn|wn-1)), Trigram (P(wn|wn-1,wn-2)).\n\n**MLE Estimation:** P(wn|wn-1) = Count(wn-1, wn) / Count(wn-1).\n\n**Worked Numerical (Assignment-2 Q1):** Corpus = {\"I like NLP\", \"I like AI\", \"I love NLP\"}, P(\"I like NLP\") શોધો, P(I)=1 આપેલ.\n- P(like|I) = 2/3. P(NLP|like) = 1/2.\n- **P(\"I like NLP\") = 1 × 2/3 × 1/2 = 1/3 ≈ 0.333.**", "mustWrite": ["Write the Chain Rule formula first, then explain the Markov simplification", "Show the MLE counting formula explicitly: Count(context,word)/Count(context)", "Substitute actual counts from the given corpus and show the final multiplication"], "keywords": ["Language Model", "N-gram", "Markov Assumption", "Chain Rule", "MLE", "Bigram"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A language model is a \"word-sequence likelihood checker.\" Since checking against the FULL sentence history is impossible (too much data needed), N-gram models cheat smartly: they only look back 1 or 2 words, which is usually good enough to sound natural.", "examTip": "Whatever new corpus and target sentence the exam gives, always compute each bigram probability from actual counts in the given corpus — never use outside/textbook example numbers, since the exam expects you to count directly from ITS corpus.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q31", "sr": 31, "question": "Explain Laplace (Add-One) Smoothing with worked numericals, including why it becomes problematic for large vocabularies.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply smoothing techniques for language models)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "Laplace smoothing is a dedicated PPT topic, is Assignment-2 Q2 (fully solvable), and the very recent 23-Sep-2026 paper contains a full 4-part MLE-vs-Laplace-smoothing numerical (deep/deep learning) that explicitly asks WHY Add-1 is problematic for large vocabularies — making this the most current and heavily tested smoothing question.", "easyMeaning": "Explain why raw N-gram probability estimates give \"0\" for unseen word pairs, and how adding 1 to every count (Laplace/Add-1 smoothing) fixes this, using the given numbers.", "understandEnMd": "With plain MLE, if a bigram never appeared in training data, its estimated probability is exactly 0 — this is unrealistic, since an unseen phrase might still be perfectly valid language, just not covered by a small training corpus (the \"zero-frequency problem\"). **Laplace (Add-One) Smoothing** fixes this by pretending every possible bigram was seen **1 extra time**: P_Laplace(wn|wn-1) = (Count(wn-1,wn) + 1) / (Count(wn-1) + V), where **V** is the total vocabulary size — the +V in the denominator keeps all adjusted probabilities summing to 1.\n\n**Worked Example — Assignment-2 Q2 (vocabulary=10, bigram count=2, first word count=20):** P_Laplace = (2+1)/(20+10) = 3/30 = **0.1**.\n\n**Worked Example — MLE vs Laplace, \"deep learning\" (23-Sep-2026 paper, vocabulary V=10,000, word \"deep\" occurs 500 times, bigram \"deep learning\" occurs 0 times):**\n(a) **MLE concept:** P(learning|deep) = Count(deep,learning)/Count(deep).\n(b) **Unsmoothed MLE:** P(learning|deep) = 0/500 = **0** — this is the zero-frequency problem: the model claims \"learning\" can NEVER follow \"deep\", which is clearly wrong.\n(c) **Laplace Add-1 Smoothing:** P(learning|deep) = (0+1)/(500+10000) = 1/10500 ≈ **0.0000952**.\n(d) **Why Add-1 is problematic for large vocabularies:** because V=10,000 is very large compared to the actual bigram counts, the \"+1\" in the numerator is completely swamped by the \"+V=+10000\" in the denominator — EVERY unseen bigram gets an almost identical, extremely tiny probability (≈1/10500), so Laplace smoothing ends up taking away too much probability mass from the seen events and spreading it too thinly and too uniformly across the huge number of unseen events, making the model's probability estimates for genuinely common vs rare unseen bigrams nearly indistinguishable.", "understandGuMd": "સાદા MLE માં, જો bigram training data માં ક્યારેય ના આવ્યો હોય, તો તેની estimated probability બરાબર 0 થાય — આ unrealistic છે, કારણ કે ના જોયેલો phrase પણ સાચી ભાષા હોઈ શકે, ફક્ત નાના training corpus માં ના આવ્યો હોય (\"zero-frequency problem\"). **Laplace (Add-One) Smoothing** આને ઠીક કરે, દરેક શક્ય bigram **1 વધારાનો વખત** જોયો હોય એમ ધારીને: P_Laplace(wn|wn-1) = (Count(wn-1,wn) + 1) / (Count(wn-1) + V), જ્યાં **V** = કુલ vocabulary size.\n\n**Worked Example — Assignment-2 Q2 (vocabulary=10, bigram count=2, first word count=20):** P_Laplace = (2+1)/(20+10) = 3/30 = **0.1**.\n\n**Worked Example — MLE vs Laplace, \"deep learning\" (23-Sep-2026 paper, V=10,000, \"deep\"=500 વખત, \"deep learning\" bigram=0 વખત):**\n(a) **MLE concept:** P(learning|deep) = Count(deep,learning)/Count(deep).\n(b) **Unsmoothed MLE:** P(learning|deep) = 0/500 = **0**.\n(c) **Laplace Add-1 Smoothing:** P(learning|deep) = (0+1)/(500+10000) = 1/10500 ≈ **0.0000952**.\n(d) **મોટા vocabulary માટે Add-1 કેમ problematic:** V=10,000 counts કરતાં ઘણું મોટું હોવાથી, numerator નું \"+1\" denominator ના \"+10000\" સામે ડૂબી જાય — દરેક unseen bigram ને લગભગ સરખી, ખૂબ નાની probability (≈1/10500) મળે, જેથી model સામાન્ય vs દુર્લભ unseen bigrams વચ્ચે ભેદ પાડી નથી શકતું.", "oneLine": "Laplace smoothing: P=(count+1)/(context count+V); fixes zero probability but over-smooths when V is huge, making all unseen bigrams look equally (tiny) likely.", "memoryTrick": "\"Add 1 everywhere, Add V below\" — the +1 goes on top (numerator), +V goes on the bottom (denominator).", "quick10": "Laplace/Add-1: P=(count+1)/(context_count+V); fixes zero-probability for unseen bigrams, but with large V it makes all unseen bigrams nearly equally (very) unlikely.", "quick30": "Laplace (Add-One) Smoothing solves the zero-frequency problem of MLE by adding 1 to every count: P=(Count(bigram)+1)/(Count(first word)+V). Example: vocab=10, bigram count=2, first-word count=20 → P=(2+1)/(20+10)=0.1. For \"deep learning\" with V=10,000, \"deep\" count=500, bigram count=0: unsmoothed MLE=0/500=0; Laplace=(0+1)/(500+10000)=1/10500≈0.0000952. Problem: with large V, the +V denominator swamps the +1 numerator, so all unseen bigrams get nearly the same tiny probability, over-flattening the distribution.", "answerEnMd": "Laplace (Add-One) Smoothing solves MLE's zero-frequency problem — where unseen bigrams get probability exactly 0 — by adding 1 to every bigram count and V (vocabulary size) to every context count: **P_Laplace(wn|wn-1) = (Count(wn-1,wn) + 1) / (Count(wn-1) + V)**.\n\n**Worked Numerical 1 (Assignment-2 Q2):** Given vocabulary size V=10, bigram count=2, first-word count=20: P_Laplace = (2+1)/(20+10) = 3/30 = **0.1**.\n\n**Worked Numerical 2 (MLE vs Laplace for \"deep learning\", V=10,000, Count(deep)=500, Count(deep,learning)=0):**\n(a) MLE formula: P(learning|deep) = Count(deep,learning)/Count(deep).\n(b) Unsmoothed MLE = 0/500 = **0**.\n(c) Laplace Smoothed = (0+1)/(500+10000) = 1/10500 ≈ **0.0000952**.\n(d) **Why problematic for large vocabularies:** the fixed \"+1\" per unseen bigram becomes negligible next to a very large \"+V\" in the denominator, so ALL unseen bigrams receive almost the same tiny probability regardless of how plausible they actually are — the smoothing over-corrects and takes disproportionately large probability mass away from seen events, especially damaging when V is in the thousands/tens-of-thousands as with real vocabularies.", "answerGuMd": "Laplace (Add-One) Smoothing MLE ની zero-frequency problem (unseen bigrams ને probability બરાબર 0 મળવી) ને, દરેક bigram count માં 1 અને દરેક context count માં V (vocabulary size) ઉમેરીને ઠીક કરે: **P_Laplace(wn|wn-1) = (Count(wn-1,wn) + 1) / (Count(wn-1) + V)**.\n\n**Worked Numerical 1 (Assignment-2 Q2):** V=10, bigram count=2, first-word count=20: P_Laplace = (2+1)/(20+10) = 3/30 = **0.1**.\n\n**Worked Numerical 2 (\"deep learning\", V=10,000, Count(deep)=500, Count(deep,learning)=0):**\n(a) MLE formula: P(learning|deep) = Count(deep,learning)/Count(deep).\n(b) Unsmoothed MLE = 0/500 = **0**.\n(c) Laplace Smoothed = (0+1)/(500+10000) = 1/10500 ≈ **0.0000952**.\n(d) **મોટા vocabularies માટે કેમ problematic:** ફિક્સ \"+1\" મોટા \"+V\" સામે નગણ્ય બની જાય, એટલે બધા unseen bigrams ને લગભગ સરખી નાની probability મળે, ભલે તેમની actual likelihood અલગ હોય — આ over-correction seen events પાસેથી ઘણી બધી probability mass લઈ લે છે.", "mustWrite": ["Write the full Laplace formula with V explicitly labeled as vocabulary size", "Show both the unsmoothed (MLE=0) and smoothed calculation side by side when both are asked", "Explicitly explain the \"+V swamps +1\" reasoning for why large vocabularies are problematic"], "keywords": ["Laplace Smoothing", "Add-One Smoothing", "Zero-Frequency Problem", "Vocabulary Size", "MLE"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "**Given:** Vocabulary V=10,000; Count(\"deep\")=500; Count(\"deep learning\")=0.\n**Formula:** P_Laplace(w2|w1) = (Count(w1,w2)+1)/(Count(w1)+V).\n**Step 1:** Unsmoothed MLE = 0/500 = 0.\n**Step 2:** Laplace numerator = 0+1 = 1.\n**Step 3:** Laplace denominator = 500+10000 = 10500.\n**Final Answer:** P_Laplace(learning|deep) = 1/10500 ≈ 0.0000952.\n**Exam Writing Format:** State the zero-frequency problem first, write the Laplace formula, substitute the given numbers step by step, then explicitly answer any \"why is this problematic\" sub-part in words.", "algorithmMd": "", "explainAgainMd": "Laplace smoothing is like giving every possible word-pair \"1 free imaginary sighting\" so nothing is ever truly impossible — but if there are 10,000 possible words, giving everyone just 1 free sighting barely moves the needle, so every rare pair ends up looking almost equally (very) unlikely.", "examTip": "Whenever asked to critique Add-1 smoothing, always mention the specific mechanism: \"the +V denominator term dominates the +1 numerator term when V is large\" — this precise phrase is what distinguishes a full-marks Evaluate-level answer from a shallow one.", "isNumerical": true, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "Vocabulary V=10,000; Count(\"deep\")=500; Count(\"deep learning\")=0.", "formulaMd": "P_Laplace(w2|w1) = (Count(w1,w2)+1)/(Count(w1)+V).", "finalAnswerMd": "P_Laplace(learning|deep) = 1/10500 ≈ 0.0000952.", "hasFormula": true}, {"id": "q32", "sr": 32, "question": "Explain Backoff and Deleted Interpolation smoothing techniques with worked examples and comparison.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply and evaluate smoothing techniques)", "bloomLevel": "Apply", "priority": "high", "priorityLabel": "High", "priorityReason": "Both techniques are dedicated topics in a supplementary Unit-4 document with worked examples and a comparison table, and Assignment-2 Q3 directly asks to evaluate Laplace vs Backoff vs Deleted Interpolation and recommend the best method for a sparse corpus.", "easyMeaning": "Explain two smoothing techniques that are alternatives to Laplace smoothing — Backoff (fall back to a shorter N-gram when the longer one is unseen) and Deleted Interpolation (blend probabilities from all N-gram levels together).", "understandEnMd": "**Backoff** is a smoothing technique where, if a higher-order N-gram (like a trigram) has zero frequency, the model \"backs off\" to use a lower-order N-gram (bigram, then unigram) instead of assigning zero probability. Rule: if the trigram exists, use its probability; otherwise fall back to the bigram probability; otherwise fall back to the unigram probability.\n\n**Worked Example (given real counts):** For the phrase \"natural language processing\" — the full trigram \"natural language processing\" has Count=0 in training data, so plain MLE would give probability 0. Backoff instead checks the bigram \"language processing\", which has Count=35 (non-zero) — so it uses the bigram's probability instead of the invalid 0.\n\n**Deleted Interpolation** is a smoothing technique that, instead of picking ONE level (like Backoff does), combines the probabilities from ALL N-gram levels (trigram, bigram, unigram) as a **weighted average**: P_interpolated = λ1×P(trigram) + λ2×P(bigram) + λ3×P(unigram), where the λ (lambda) weights are non-negative and sum to 1 (λ1+λ2+λ3=1). It is called \"deleted\" because a portion of the training data is deliberately held out (\"deleted\") specifically to estimate the optimal λ weights that generalize best to new data.\n\n**Worked Example (given probabilities, note: the specific λ weight values themselves are not given in the extracted source — only these three component probabilities are provided):** Trigram probability = 0.60, Bigram probability = 0.30, Unigram probability = 0.10. The final interpolated probability would be computed as λ1×0.60 + λ2×0.30 + λ3×0.10 once the λ weights are known/estimated.\n\n**Comparison — Backoff vs Deleted Interpolation:**\n| Feature | Backoff | Deleted Interpolation |\n|---|---|---|\n| Uses trigram? | Yes, if available | Always (weighted) |\n| Uses bigram? | Only if needed | Always (weighted) |\n| Uses unigram? | Only if needed | Always (weighted) |\n| Probability source | Single source (whichever level is non-zero) | Weighted combination of all levels |\n| Accuracy | Moderate | Generally higher |\n\n**For a corpus with significant data sparsity (Assignment-2 Q3):** Deleted Interpolation is generally the more suitable/recommended method, because it always incorporates information from every N-gram level (including reliable lower-order estimates) rather than committing entirely to just one level as Backoff does — this produces smoother, more robust probability estimates when many higher-order N-grams are unseen due to sparse data, though it requires the extra step of estimating good λ weights.", "understandGuMd": "**Backoff** એ smoothing technique છે જ્યાં, જો higher-order N-gram (trigram) ની frequency 0 હોય, તો model lower-order N-gram (bigram, પછી unigram) પર \"back off\" કરે, 0 probability આપવાને બદલે. Rule: trigram હોય તો તેની probability વાપરો; નહીં તો bigram; નહીં તો unigram.\n\n**Worked Example (real counts આપેલા):** \"natural language processing\" trigram ની Count=0 training data માં, એટલે MLE 0 આપશે. Backoff bigram \"language processing\" ચેક કરે, જેની Count=35 (non-zero) — એટલે bigram ની probability વાપરે.\n\n**Deleted Interpolation** એક level પસંદ કરવાને બદલે (Backoff જેમ), બધા N-gram levels (trigram, bigram, unigram) ની probabilities ને **weighted average** તરીકે combine કરે: P_interpolated = λ1×P(trigram) + λ2×P(bigram) + λ3×P(unigram), જ્યાં λ weights non-negative અને સરવાળો 1 (λ1+λ2+λ3=1). \"Deleted\" કહેવાય કારણ કે training data નો ભાગ ઈરાદાપૂર્વક કાઢી (\"delete\" કરી) best λ weights estimate કરવા વપરાય.\n\n**Worked Example (આપેલી probabilities, નોંધ: ચોક્કસ λ weight values extraction માં નથી મળ્યા — ફક્ત આ ત્રણ component probabilities આપેલા છે):** Trigram probability = 0.60, Bigram probability = 0.30, Unigram probability = 0.10. Final interpolated probability = λ1×0.60 + λ2×0.30 + λ3×0.10, λ weights ખબર પડ્યા પછી.\n\n**Comparison — Backoff vs Deleted Interpolation:** (ઉપર ના table પ્રમાણે)\n\n**Data sparsity વાળા corpus માટે (Assignment-2 Q3):** Deleted Interpolation સામાન્ય રીતે વધુ યોગ્ય/recommended છે, કારણ કે તે હંમેશા દરેક N-gram level ની information વાપરે (reliable lower-order estimates સહિત), Backoff જેમ ફક્ત એક level પર સંપૂર્ણ આધાર રાખવાને બદલે — આ ઓછા data હોય ત્યારે વધુ robust estimates આપે, જોકે સારા λ weights estimate કરવાનું extra કામ જોઈએ.", "oneLine": "Backoff = use trigram if available, else fall back to bigram/unigram (pick ONE level); Deleted Interpolation = weighted average of ALL levels (λ1+λ2+λ3=1).", "memoryTrick": "\"Backoff picks ONE ladder step, Interpolation blends ALL ladder steps.\"", "quick10": "Backoff: use highest available N-gram, fall back if zero. Deleted Interpolation: weighted combination of trigram+bigram+unigram probabilities (λ's sum to 1). Interpolation generally more accurate but more complex.", "quick30": "Backoff handles zero-count N-grams by falling back to a lower order (trigram→bigram→unigram), using only ONE level's probability at a time — e.g. \"natural language processing\" trigram count=0, backs off to bigram \"language processing\" (count=35). Deleted Interpolation instead blends ALL levels using weights: P=λ1·P(trigram)+λ2·P(bigram)+λ3·P(unigram), λ's summing to 1, with a held-out (\"deleted\") portion of data used to tune the λ's. Interpolation is generally more accurate but more complex; for a highly sparse corpus, Deleted Interpolation is usually recommended since it never discards lower-order evidence.", "answerEnMd": "**Backoff** resolves the zero-frequency problem by falling back to a lower-order N-gram when a higher-order one is unseen: use the trigram probability if the trigram was seen; otherwise use the bigram probability; otherwise the unigram probability. Example: trigram \"natural language processing\" has count 0, but its bigram \"language processing\" has count 35, so Backoff uses the bigram estimate instead of 0.\n\n**Deleted Interpolation** instead always combines probabilities from every N-gram order as a weighted sum: **P = λ1·P(trigram) + λ2·P(bigram) + λ3·P(unigram)**, with λ1+λ2+λ3=1; the weights are estimated by holding out (\"deleting\") part of the training data. Given component probabilities Trigram=0.60, Bigram=0.30, Unigram=0.10, the final probability is their λ-weighted sum (specific λ values are Not available in uploaded material).", "answerGuMd": "**Backoff** higher-order N-gram unseen હોય ત્યારે lower-order પર fall back કરીને zero-frequency problem ઉકેલે: trigram seen હોય તો તેની probability, નહીં તો bigram, નહીં તો unigram. Example: trigram \"natural language processing\" count=0, પણ bigram \"language processing\" count=35, એટલે Backoff bigram estimate વાપરે.\n\n**Deleted Interpolation** હંમેશા દરેક N-gram order ની probability ને weighted sum તરીકે combine કરે: **P = λ1·P(trigram) + λ2·P(bigram) + λ3·P(unigram)**, λ1+λ2+λ3=1; weights training data નો ભાગ \"delete\" કરીને estimate થાય. Trigram=0.60, Bigram=0.30, Unigram=0.10 આપેલા, final probability તેમનો λ-weighted sum (ચોક્કસ λ values uploaded material માં ઉપલબ્ધ નથી).", "mustWrite": ["Explain Backoff's \"fall back only if zero\" rule with the given real-count example", "Write Deleted Interpolation's weighted-sum formula with λ1+λ2+λ3=1 explicitly stated", "Give a comparison table AND a final justified recommendation for sparse data"], "keywords": ["Backoff", "Deleted Interpolation", "Smoothing", "Lambda Weights", "N-gram"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "(ઉપર પ્રમાણે)\n\n**ખૂબ sparse corpus માટે ભલામણ:** Deleted Interpolation સામાન્ય રીતે વધુ સારું, કારણ કે તે હંમેશા lower-order estimates ભેગા રાખે, Backoff ની જેમ ફક્ત એક level પર આધાર નથી રાખતું.", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Backoff is \"try the best plan, and only if it totally fails, switch entirely to plan B\" — an all-or-nothing choice. Deleted Interpolation is \"always listen to plan A, B, and C at once, just trust plan A a little more\" — a blend, not a switch.", "examTip": "If the exam gives specific probability numbers for trigram/bigram/unigram but not the λ weights, explicitly write \"Not available in uploaded material: exact λ weight values\" rather than inventing numbers — showing the correct formula structure with the given component probabilities substituted in symbolically still earns most of the marks.", "isNumerical": false, "isDiagram": false, "isComparison": true, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q33", "sr": 33, "question": "Explain Perplexity and Entropy as evaluation metrics for Language Models.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Evaluate language model performance)", "bloomLevel": "Understand", "priority": "med", "priorityLabel": "Medium", "priorityReason": "Perplexity is explicitly asked to be explained in multiple papers (Nov-2023, Dec-2024, Winter-2021), and Entropy is a dedicated supplementary-document topic with a stated worked answer (≈1.49 bits), but the exact numeric inputs behind that entropy example are not captured in the extracted text (image-based), limiting this to a concept-level MEDIUM priority rather than a fully worked numerical.", "easyMeaning": "Explain what \"perplexity\" means as a way to judge how good a language model is, and what \"entropy\" measures about the unpredictability of language.", "understandEnMd": "**Entropy** (Claude Shannon) measures the uncertainty or randomness in a probability distribution over possible next words — higher entropy means the next word is harder to predict (many roughly-equally-likely options), lower entropy means it's easier to predict (one option is dominant). Formula: H = -Σ P(x) log₂ P(x), summed over all possible outcomes x. Example: \"The sun rises in the ___\" has LOW entropy (almost everyone predicts \"east\"); \"I bought a ___\" has HIGH entropy (many different words are plausible).\n\n**Perplexity** is a standard way to evaluate how well a language model predicts a text, derived directly from entropy: **Perplexity = 2^H** (2 raised to the power of the entropy/cross-entropy of the model on the test data). **Lower perplexity is better** — it means the model was, on average, \"less surprised\" by (less perplexed by) the actual text, i.e. it assigned higher probability to what actually appeared. A model that perfectly predicts every next word would have a perplexity of 1; a model that's essentially guessing randomly among a large vocabulary would have very high perplexity.\n\n**Note on specific worked numbers:** the source document states a specific worked entropy example concluding **\"≈ 1.49 bits\"**, but the exact word-probability values used as input to that specific calculation are captured only as an image in the original file and are **Not available in uploaded material** in extractable text form — the formula and final stated result (1.49 bits) are given, but the intermediate substituted numbers are not.", "understandGuMd": "**Entropy** (Claude Shannon) probability distribution માં આગલા શબ્દ વિશે uncertainty/randomness measure કરે — વધારે entropy એટલે આગલો શબ્દ predict કરવો અઘરો (ઘણા લગભગ સરખા-likely options), ઓછી entropy એટલે predict કરવો સહેલો (એક option dominant). Formula: H = -Σ P(x) log₂ P(x). Example: \"The sun rises in the ___\" LOW entropy (લગભગ બધા \"east\" predict કરે); \"I bought a ___\" HIGH entropy (ઘણા શબ્દો શક્ય).\n\n**Perplexity** language model કેટલું સારું predict કરે તે measure કરવાની standard રીત, entropy માંથી સીધી derive થાય: **Perplexity = 2^H**. **ઓછી perplexity સારી** — model actual text થી ઓછું \"surprised\" થયું, એટલે જે ખરેખર આવ્યું તેને વધારે probability આપી. Perfect model ની perplexity 1 હોય; random guessing model ની perplexity ખૂબ વધારે હોય.\n\n**ચોક્કસ numbers વિશે નોંધ:** source document એ specific worked entropy example નું conclusion **\"≈ 1.49 bits\"** આપે છે, પણ એ ચોક્કસ calculation માટે વપરાયેલી શબ્દ-probability values ફક્ત image તરીકે original file માં છે અને extractable text માં **uploaded material માં ઉપલબ્ધ નથી** — formula અને final result (1.49 bits) આપેલા છે, પણ વચ્ચેની substituted numbers નથી.", "oneLine": "Entropy = uncertainty of next word (H=-ΣP log₂P); Perplexity=2^H, lower perplexity = better language model.", "memoryTrick": "\"Perplexed model = surprised model\" — high perplexity means the model keeps getting surprised by the actual text.", "quick10": "Entropy measures unpredictability (H=-ΣP log₂P); Perplexity=2^H evaluates LMs — lower is better (less surprised by real text).", "quick30": "Entropy (Shannon) quantifies uncertainty in predicting the next word: H=-Σ P(x)log₂P(x); low entropy = predictable (\"The sun rises in the east\"), high entropy = unpredictable (\"I bought a ___\"). Perplexity=2^H is the standard LM evaluation metric derived from entropy/cross-entropy on test data; lower perplexity means the model assigns higher probability to the actual text, i.e. is a better model. A perfect model has perplexity 1.", "answerEnMd": "**Entropy** (H) measures the uncertainty in predicting the next word from a probability distribution: **H = -Σ P(x) log₂ P(x)**. Low entropy = highly predictable context (e.g. \"The sun rises in the ___\" → east); high entropy = many plausible next words (e.g. \"I bought a ___\").\n\n**Perplexity**, the standard metric for evaluating a language model, is defined as **Perplexity = 2^H**, where H is the entropy (or cross-entropy) of the model's predictions on test data. A lower perplexity indicates a better language model, since it means the model assigned higher probability to the words that actually occurred (it was \"less perplexed\"/surprised by the real text); a perfect model achieves perplexity = 1.\n\n**Applications of entropy/perplexity:** language model comparison and selection, text compression, speech recognition, machine translation quality evaluation.\n\n*(Note: the specific numeric inputs behind the source's own \"≈1.49 bits\" worked entropy example are given only as an image in the original material and are not available in extractable text form — apply the same H=-ΣP log₂P formula to whatever specific word-probability distribution your exam question provides.)*", "answerGuMd": "**Entropy** (H) probability distribution માંથી આગલો શબ્દ predict કરવાની uncertainty measure કરે: **H = -Σ P(x) log₂ P(x)**. ઓછી entropy = predictable context; વધારે entropy = ઘણા શબ્દો શક્ય.\n\n**Perplexity**, language model evaluate કરવાનું standard metric, **Perplexity = 2^H** તરીકે define થાય, H = model ના predictions ની entropy/cross-entropy. ઓછી perplexity સારો model બતાવે (actual text ને વધારે probability આપી); perfect model ની perplexity = 1.\n\n**Applications:** language model comparison, text compression, speech recognition, machine translation quality evaluation.\n\n*(નોંધ: source ના પોતાના \"≈1.49 bits\" worked example ના ચોક્કસ numeric inputs ફક્ત image તરીકે છે, extractable text માં ઉપલબ્ધ નથી — તમારા exam question ના આપેલા probability distribution પર એ જ H=-ΣP log₂P formula લગાવો.)*", "mustWrite": ["Write the entropy formula H=-ΣP log₂P and the perplexity formula 2^H", "Give one low-entropy and one high-entropy example sentence", "State clearly that lower perplexity = better language model, and why"], "keywords": ["Entropy", "Perplexity", "Shannon", "Uncertainty", "Language Model Evaluation"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Entropy asks \"how many roughly-equal guesses would I need?\" — few guesses needed = low entropy = predictable. Perplexity turns that into a language-model report card: a model that's rarely surprised by real text gets a low (good) perplexity score.", "examTip": "If the exam gives its own specific probability numbers for an entropy/perplexity calculation, always substitute those exact given numbers into H=-ΣP log₂P step by step — never reuse a memorized textbook example's numbers, since the formula is the reusable part, not any specific number.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q34", "sr": 34, "question": "Explain approaches to POS Tagging: Rule-Based, Stochastic, and HMM-based methods.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Understand and apply POS tagging approaches)", "bloomLevel": "Understand", "priority": "high", "priorityLabel": "High", "priorityReason": "POS tagging approaches are a dedicated PPT topic (leading directly into the HMM/Viterbi numericals), and POS-tagging method comparisons/evaluations are asked in multiple papers (Sep-2025 \"PoS-tagging ambiguity errors\", Dec-2024 \"PoS tagging methods\").", "easyMeaning": "Explain the three main strategies computers use to assign a grammatical tag (Noun, Verb, etc.) to each word, from hand-written rules to full statistical models.", "understandEnMd": "**POS (Part-of-Speech) Tagging** assigns a grammatical category (Noun, Verb, Adjective, etc.) to each word in a sentence. Three main approaches:\n\n**1. Rule-Based Tagging (e.g. Brill's Tagger):** starts by assigning each word its most frequent tag (from a dictionary), then applies a set of hand-crafted or automatically-learned transformation rules to fix errors based on context (e.g. \"change tag from Noun to Verb if the previous tag is a Modal\"). Brill's tagger specifically is called a \"transformation-based\" tagger because it learns these correction rules automatically by comparing its initial (wrong) tags against a correctly-tagged training corpus.\n\n**2. Stochastic/N-gram Approach:** uses probability, choosing the tag sequence that is statistically most likely based on how often tag sequences appeared in a training corpus — this can be as simple as always picking a word's single most frequent tag, or as sophisticated as an N-gram model over tag sequences.\n\n**3. HMM-Based Tagging:** treats POS tagging as finding the hidden tag sequence most likely to have produced the observed word sequence, using Emission probabilities P(word|tag) and Transition probabilities P(tag|previous tag), solved efficiently with the Viterbi algorithm (see Q35/Q36 for full worked examples).\n\n**Common challenge across all approaches — ambiguity:** many words can take multiple tags depending on context (e.g. \"duck\" can be a Noun or a Verb) — good tagging methods resolve this using surrounding context (transition probabilities or transformation rules), not just the word in isolation.", "understandGuMd": "**POS (Part-of-Speech) Tagging** sentence ના દરેક શબ્દને grammatical category (Noun, Verb, Adjective વગેરે) આપે. ત્રણ મુખ્ય approaches:\n\n**1. Rule-Based Tagging (દા.ત. Brill's Tagger):** પહેલા દરેક શબ્દને તેનો સૌથી frequent tag આપે (dictionary માંથી), પછી context આધારે errors ઠીક કરવા hand-crafted કે automatically-learned transformation rules લગાવે. Brill's tagger \"transformation-based\" કહેવાય કારણ કે તે પોતાના શરૂઆતના (ખોટા) tags ને correctly-tagged training corpus સાથે compare કરીને correction rules automatically શીખે.\n\n**2. Stochastic/N-gram Approach:** probability વાપરે, training corpus માં tag sequences કેટલી વાર આવ્યા તેના આધારે statistically સૌથી likely tag sequence પસંદ કરે.\n\n**3. HMM-Based Tagging:** POS tagging ને hidden tag sequence શોધવાનું task ગણે જે observed word sequence produce કરવાની શક્યતા સૌથી વધુ હોય, Emission probabilities P(word|tag) અને Transition probabilities P(tag|previous tag) વાપરીને, Viterbi algorithm થી efficiently solve થાય.\n\n**બધા approaches ની common challenge — ambiguity:** ઘણા શબ્દો context પ્રમાણે અલગ-અલગ tags લઈ શકે (દા.ત. \"duck\" Noun કે Verb) — સારી tagging methods આ context (transition probabilities કે transformation rules) વાપરીને ઉકેલે, ફક્ત એકલો શબ્દ જોઈને નહીં.", "oneLine": "POS tagging: Rule-Based (Brill's, fix errors with context rules), Stochastic (most-likely tag by frequency/probability), HMM (Emission×Transition, solved via Viterbi).", "memoryTrick": "\"Rules fix, Stats guess, HMM computes\" — 3 words for the 3 approaches.", "quick10": "POS tagging approaches: Rule-Based (Brill's transformation rules), Stochastic (frequency/probability-based), HMM (Emission+Transition probabilities via Viterbi).", "quick30": "POS tagging assigns grammatical tags to words. Rule-Based/Transformation-Based (Brill's tagger) starts with the most frequent tag then applies learned correction rules based on context. Stochastic tagging picks the statistically most likely tag/tag-sequence from corpus frequencies. HMM-based tagging models tags as hidden states and words as observations, using Emission P(word|tag) and Transition P(tag|prevtag) probabilities, solved efficiently by the Viterbi algorithm. All approaches must resolve tag ambiguity (e.g. \"duck\" as Noun vs Verb) using context.", "answerEnMd": "POS Tagging assigns a grammatical category to every word in a sentence, using three broad approaches:\n\n**1. Rule-Based Tagging (e.g. Brill's Tagger):** Assign each word its most frequent tag first, then apply a sequence of transformation rules (hand-written or automatically learned by comparing against correctly-tagged training data) to correct tags based on surrounding context.\n\n**2. Stochastic/N-gram Tagging:** Uses statistical frequency of tags/tag-sequences in a training corpus to choose the most probable tag for each word/context.\n\n**3. HMM-Based Tagging:** Models tags as hidden states and words as observed outputs, using Emission probabilities P(word|tag) and Transition probabilities P(tag|previous tag); the Viterbi algorithm efficiently finds the overall most probable tag sequence.\n\nAll three approaches must handle **ambiguous words** (a word with multiple possible tags, e.g. \"duck\" as Noun or Verb) by relying on surrounding context rather than the word alone.", "answerGuMd": "POS Tagging sentence ના દરેક શબ્દને grammatical category આપે, ત્રણ broad approaches વાપરીને:\n\n**1. Rule-Based Tagging (દા.ત. Brill's Tagger):** પહેલા દરેક શબ્દને સૌથી frequent tag આપો, પછી context આધારે tags ઠીક કરવા transformation rules (hand-written કે automatically learned) લગાવો.\n\n**2. Stochastic/N-gram Tagging:** Training corpus માં tags/tag-sequences ની statistical frequency વાપરીને સૌથી probable tag પસંદ કરે.\n\n**3. HMM-Based Tagging:** Tags ને hidden states અને શબ્દોને observed outputs તરીકે model કરે, Emission P(word|tag) અને Transition P(tag|previous tag) વાપરીને; Viterbi algorithm overall સૌથી probable tag sequence efficiently શોધે.\n\nત્રણેય approaches એ **ambiguous words** (એક કરતાં વધારે tag શક્ય, દા.ત. \"duck\" Noun કે Verb) ને context વાપરીને ઉકેલવા જોઈએ.", "mustWrite": ["Name and briefly describe all 3 approaches (Rule-Based, Stochastic, HMM)", "Explicitly name Brill's Tagger for the rule-based approach", "Mention ambiguity resolution as a shared challenge across approaches"], "keywords": ["POS Tagging", "Rule-Based Tagging", "Brill's Tagger", "Stochastic Tagging", "HMM Tagging"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "| Approach | Method | Example/Tool |\n|---|---|---|\n| Rule-Based | Default tag + correction rules | Brill's Tagger |\n| Stochastic | Frequency/probability-based choice | N-gram tag frequency |\n| HMM-Based | Emission × Transition, solved via Viterbi | Mary/Jane/Will/Spot example |", "quickMemory": "\"Rule fixes, Stat counts, HMM computes the path.\"", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Rule-based tagging is like a spell-checker with a list of fix-it rules; stochastic tagging is like always betting on the most common past outcome; HMM tagging is like solving a puzzle using both \"what word is this usually\" (emission) and \"what tag usually follows this tag\" (transition) together.", "examTip": "If asked to \"compare\" POS tagging approaches, always structure the answer as a 3-row table (Rule-Based / Stochastic / HMM) — this format directly matches how these questions are graded.", "isNumerical": false, "isDiagram": false, "isComparison": true, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q35", "sr": 35, "question": "Explain Hidden Markov Models (HMM) for POS tagging and solve the full Mary/Jane/Will/Spot Viterbi numerical.", "questionPreamble": "", "unit": 4, "unitTitle": "Language Models, Smoothing & POS Tagging (HMM)", "co": "CO4", "coNote": "CO4 (Apply HMM-based sequence tagging techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This exact worked example (with the identical emission/transition tables) appears in BOTH the dedicated Unit-4 PPT AND the Dec-2024 final exam paper (\"what is the probability that Will is a model, Spot is a verb...\"), making it a confirmed cross-source repeated numerical of the highest value.", "easyMeaning": "Given a set of tagged example sentences, build the emission and transition probability tables, then use them to find the probability of a specific tag sequence.", "understandEnMd": "A **Hidden Markov Model (HMM)** for POS tagging treats the **tags as hidden states** and the **words as observations**. It needs two probability tables: **Emission probabilities** P(word|tag) — how likely a tag is to produce a specific word — and **Transition probabilities** P(tag_i|tag_{i-1}) — how likely one tag is to follow another, using special `<S>` (start) and `<E>` (end) markers.\n\n**Given training sentences:** \"Mary Jane can see Will\", \"Spot will see Mary\", \"Will Jane spot Mary?\", \"Mary will pat Spot\" (Mary, Jane, Will, Spot are all names).\n\n**Emission Count Table (word vs tag):** Mary: N=4; Jane: N=2; Will: N=1, M=3; Spot: N=2, V=1; Can: M=1; See: V=2; pat: V=1.\n\n**Emission Probabilities (divide each column by the tag's total count — Noun total=9, Model total=4, Verb total=4):**\n| Word | Noun | Model | Verb |\n|---|---|---|---|\n| Mary | 4/9 | 0 | 0 |\n| Jane | 2/9 | 0 | 0 |\n| Will | 1/9 | 3/4 | 0 |\n| Spot | 2/9 | 0 | 1/4 |\n| Can | 0 | 1/4 | 0 |\n| See | 0 | 0 | 2/4 |\n| pat | 0 | 0 | 1/4 |\n\n**Transition Co-occurrence Counts (row=current tag, column=next tag, including `<S>` and `<E>`):**\n| | N | M | V | \\<E\\> |\n|---|---|---|---|---|\n| \\<S\\> | 3 | 1 | 0 | 0 |\n| N | 1 | 3 | 1 | 4 |\n| M | 1 | 0 | 3 | 0 |\n| V | 4 | 0 | 0 | 0 |\n\n**Transition Probabilities (divide each row by its total):**\n| | N | M | V | \\<E\\> |\n|---|---|---|---|---|\n| \\<S\\> | 3/4 | 1/4 | 0 | 0 |\n| N | 1/9 | 3/9 | 1/9 | 4/9 |\n| M | 1/4 | 0 | 3/4 | 0 |\n| V | 4/4 | 0 | 0 | 0 |\n\n**Checking a WRONG tagging — \"Will can spot Mary\" tagged as Model, Verb, Noun, Noun:** probability = P(M|\\<S\\>)×P(Will|M) × P(V|M)×P(can|V) × P(N|V)×P(spot|N) × P(N|N)×P(Mary|N) = 1/4 × 3/4 × 3/4 × 0 × ... = **0** (because P(can|V)=0, since \"can\" was only ever seen as a Model in training) — confirming this tagging is impossible under the trained model.\n\n**Checking the CORRECT tagging path — `<S>→N→M→N→N→<E>`:** probability = 3/4 × 1/9 × 3/9 × 1/4 × 1/4 × 2/9 × 1/9 × 4/9 × 4/9 = **0.00000846754**.\n\n**Checking the CORRECT tagging path — `<S>→N→M→N→V→<E>`:** probability = 3/4 × 1/9 × 3/9 × 1/4 × 3/4 × 1/4 × 1 × 4/9 × 4/9 = **0.00025720164**.\n\nComparing the two valid paths, **0.00025720164 > 0.00000846754**, so the HMM tags the sentence according to the second path, `<S>→N→M→N→V→<E>` — this is far more efficient than checking all 81 possible 4-tag combinations for a 3-tag-set, 4-word sentence, and the **Viterbi Algorithm** is the dynamic-programming method that finds this best path without explicitly enumerating all 81 combinations (it prunes lower-probability partial paths at every step, keeping only the single best path into each state at each position, then backtracks from the end).", "understandGuMd": "POS tagging માટે **Hidden Markov Model (HMM)** tags ને **hidden states** અને શબ્દોને **observations** તરીકે treat કરે. તેને બે probability tables જોઈએ: **Emission probabilities** P(word|tag) — tag એ ચોક્કસ શબ્દ produce કરવાની શક્યતા — અને **Transition probabilities** P(tag_i|tag_{i-1}) — એક tag પછી બીજો tag આવવાની શક્યતા, `<S>` (start) અને `<E>` (end) markers સાથે.\n\n**Training sentences:** \"Mary Jane can see Will\", \"Spot will see Mary\", \"Will Jane spot Mary?\", \"Mary will pat Spot\".\n\n**Emission Probabilities (Noun total=9, Model total=4, Verb total=4):**\n| Word | Noun | Model | Verb |\n|---|---|---|---|\n| Mary | 4/9 | 0 | 0 |\n| Jane | 2/9 | 0 | 0 |\n| Will | 1/9 | 3/4 | 0 |\n| Spot | 2/9 | 0 | 1/4 |\n| Can | 0 | 1/4 | 0 |\n| See | 0 | 0 | 2/4 |\n| pat | 0 | 0 | 1/4 |\n\n**Transition Probabilities:**\n| | N | M | V | \\<E\\> |\n|---|---|---|---|---|\n| \\<S\\> | 3/4 | 1/4 | 0 | 0 |\n| N | 1/9 | 3/9 | 1/9 | 4/9 |\n| M | 1/4 | 0 | 3/4 | 0 |\n| V | 4/4 | 0 | 0 | 0 |\n\n**ખોટી tagging ચેક — \"Will can spot Mary\" = Model,Verb,Noun,Noun:** probability = ...×P(can|V)×... = 0 (કારણ કે P(can|V)=0, \"can\" training માં ફક્ત Model તરીકે જ જોવાયો).\n\n**સાચી path `<S>→N→M→N→N→<E>`:** probability = 3/4×1/9×3/9×1/4×1/4×2/9×1/9×4/9×4/9 = **0.00000846754**.\n\n**સાચી path `<S>→N→M→N→V→<E>`:** probability = 3/4×1/9×3/9×1/4×3/4×1/4×1×4/9×4/9 = **0.00025720164**.\n\nબીજી path ની probability વધારે હોવાથી, HMM sentence ને એ પ્રમાણે tag કરે. **Viterbi Algorithm** dynamic-programming method છે જે આ best path ને બધા 81 combinations check કર્યા વગર શોધે (દરેક step પર ઓછી-probability partial paths કાઢી નાખે, ફક્ત best path રાખે, પછી end થી backtrack કરે).", "oneLine": "HMM POS tagging = Emission P(word|tag) × Transition P(tag|prev tag), multiplied along the path; Viterbi finds the max-probability path efficiently via DP.", "memoryTrick": "\"Emit the word, Transit the tag\" — emission connects word↔tag, transition connects tag↔tag.", "quick10": "HMM tagging: build emission P(word|tag) and transition P(tag|prevtag) tables from training data, multiply along a tag-path to score it, Viterbi finds the best path efficiently.", "quick30": "HMM POS tagging uses hidden states (tags) and observed words. From tagged training sentences, build Emission probabilities (P(word|tag) = count/tag total) and Transition probabilities (P(tag|prevtag) = count/row total, using <S>/<E>). To score a candidate tag sequence, multiply the transition and emission probabilities along the path. Example: for \"Mary Jane can see Will\" style sentences, the path <S>→N→M→N→V→<E> scores 0.00025720164, higher than <S>→N→M→N→N→<E>'s 0.00000846754, so the first is chosen. The Viterbi Algorithm finds this best path via dynamic programming instead of checking all 81 raw combinations.", "answerEnMd": "An HMM POS tagger treats tags as hidden states and words as observations, requiring **Emission probabilities** P(word|tag) and **Transition probabilities** P(tag_i|tag_{i-1}).\n\n**Emission Table** (from training sentences \"Mary Jane can see Will\" / \"Spot will see Mary\" / \"Will Jane spot Mary?\" / \"Mary will pat Spot\"):\n| Word | Noun | Model | Verb |\n|---|---|---|---|\n| Mary | 4/9 | 0 | 0 |\n| Jane | 2/9 | 0 | 0 |\n| Will | 1/9 | 3/4 | 0 |\n| Spot | 2/9 | 0 | 1/4 |\n| Can | 0 | 1/4 | 0 |\n| See | 0 | 0 | 2/4 |\n| pat | 0 | 0 | 1/4 |\n\n**Transition Table:**\n| | N | M | V | \\<E\\> |\n|---|---|---|---|---|\n| \\<S\\> | 3/4 | 1/4 | 0 | 0 |\n| N | 1/9 | 3/9 | 1/9 | 4/9 |\n| M | 1/4 | 0 | 3/4 | 0 |\n| V | 4/4 | 0 | 0 | 0 |\n\n**Scoring two candidate paths:**\n- `<S>→N→M→N→N→<E>`: 3/4 × 1/9 × 3/9 × 1/4 × 1/4 × 2/9 × 1/9 × 4/9 × 4/9 = **0.00000846754**.\n- `<S>→N→M→N→V→<E>`: 3/4 × 1/9 × 3/9 × 1/4 × 3/4 × 1/4 × 1 × 4/9 × 4/9 = **0.00025720164**.\n\n**Conclusion:** since 0.00025720164 > 0.00000846754, the second path is the correct/most-likely tag sequence. The **Viterbi Algorithm** computes this efficiently via dynamic programming — at each position it keeps only the single highest-probability path leading into each state, avoiding the need to enumerate all 81 possible tag combinations, then backtracks from `<E>` to recover the optimal sequence.", "answerGuMd": "HMM POS tagger tags ને hidden states અને શબ્દોને observations તરીકે treat કરે, **Emission probabilities** P(word|tag) અને **Transition probabilities** P(tag_i|tag_{i-1}) જોઈએ.\n\n**Emission Table:** (ઉપર પ્રમાણે)\n**Transition Table:** (ઉપર પ્રમાણે)\n\n**બે candidate paths score કરવા:**\n- `<S>→N→M→N→N→<E>`: = **0.00000846754**.\n- `<S>→N→M→N→V→<E>`: = **0.00025720164**.\n\n**Conclusion:** 0.00025720164 > 0.00000846754 હોવાથી, બીજી path સાચી/most-likely tag sequence છે. **Viterbi Algorithm** dynamic programming થી આ efficiently કરે — દરેક position પર ફક્ત સૌથી વધુ probability વાળી path રાખે, બધા 81 combinations check નથી કરવા પડતા, પછી `<E>` થી backtrack કરીને optimal sequence મેળવે.", "mustWrite": ["Build and show BOTH the emission and transition probability tables from the raw counts", "Multiply out at least one full path's probability with every factor shown", "State the final comparison and conclusion explicitly"], "keywords": ["Hidden Markov Model", "Emission Probability", "Transition Probability", "Viterbi Algorithm", "POS Tagging"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "**Name:** Viterbi Algorithm. **Input:** A sequence of words (observations), a set of possible tags (hidden states), emission probabilities P(word|tag), transition probabilities P(tag|prevtag), and start/end markers. **Steps:** 1. Initialize: for each tag, compute the probability of starting with that tag and emitting the first word (P(tag|\\<S\\>) × P(word1|tag)). 2. For each subsequent word, for each tag, compute the max over all previous tags of (previous best probability × transition to this tag × emission of this word), keeping only the best incoming path (store a backpointer). 3. Repeat until the last word, then multiply by the transition to \\<E\\>. 4. Backtrack from the highest final probability using the stored backpointers to recover the full best tag sequence. **Output:** The single most probable tag sequence and its probability. **Simple Example:** shown above, reducing 81 raw combinations down to comparing just 2 surviving paths, picking `<S>→N→M→N→V→<E>` with probability 0.00025720164. **Exam Writing Format:** Draw a small trellis (grid of tags × word positions), fill in the best-path probability at each cell with its backpointer arrow, and box the final highest-probability path at the end.", "explainAgainMd": "Think of tagging like a maze with many possible routes (81 in this case) — instead of walking every route to the end and comparing all of them, Viterbi only keeps the best route reaching each junction so far, throwing away any provably-worse partial route immediately, so you reach the end having only ever compared a tiny number of surviving paths.", "examTip": "If the exam only asks to compute the probability of ONE given tag sequence (not to find the overall best one), you don't need the full Viterbi table — just multiply the relevant transition
