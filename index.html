માં.\n- **Σ (Terminals):** generated sentences માં દેખાતા actual શબ્દો/symbols નો finite set; lowercase માં, વધુ expand ના થાય.\n- **R (Production Rules):** rewriting rules નો set, દરેકની left side એક non-terminal, right side terminals/non-terminals નું મિશ્રણ (દા.ત. NP → Det N).\n- **S (Start Symbol):** designated non-terminal જ્યાંથી દરેક derivation શરૂ થાય.\n\n**Example grammar:** S → NP VP; NP → Det N; VP → V NP; Det → the | a; N → dog | cat | boy; V → chased | hugged. અહીં N = {S, NP, VP, Det, N, V}, Σ = {the, a, dog, cat, boy, chased, hugged}.\n\n**\"the dog chased the cat\" માટે Derivation:** S ⇒ NP VP ⇒ Det N VP ⇒ the N VP ⇒ the dog VP ⇒ the dog V NP ⇒ the dog chased NP ⇒ the dog chased Det N ⇒ the dog chased the N ⇒ the dog chased the cat.\n\nઆ rule expansions ના sequence ને **parse tree** તરીકે represent કરાય, S root પર, internal nodes દરેક non-terminal માટે, અને sentence ના શબ્દો leaves તરીકે, ડાબેથી જમણે વંચાય.", "mustWrite": ["Write the formal 4-tuple definition G=(N,Σ,R,S) with each part explained", "Give a concrete grammar with at least 5 rules", "Show a full step-by-step derivation, not just the final parse tree"], "keywords": ["Context-Free Grammar", "Non-terminal", "Terminal", "Production Rule", "Start Symbol", "Derivation"], "diagramMd": "A parse tree for \"the dog chased the cat\": S branches into NP and VP; NP branches into Det(\"the\") and N(\"dog\"); VP branches into V(\"chased\") and NP; that NP branches into Det(\"the\") and N(\"cat\").", "howToDrawMd": "1. Draw S at the top. 2. Draw two branches down to NP and VP. 3. Under the first NP, draw Det and N, and write \"the\"/\"dog\" below them. 4. Under VP, draw V and another NP; write \"chased\" below V. 5. Repeat step 3 under the second NP for \"the\"/\"cat\". 6. Label every internal node with its non-terminal name.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A CFG is a rulebook: \"a sentence is a noun-phrase plus a verb-phrase,\" \"a noun-phrase is a determiner plus a noun,\" and so on, all the way down to actual words. A derivation is just following the rulebook one line at a time until only real words are left.", "examTip": "When asked to \"generate\" a sentence from a grammar, always number or bracket which rule you used at each step (e.g., \"using NP→Det N\") — examiners specifically check this rule-by-rule traceability.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q10", "sr": 10, "question": "Given a CFG, generate the leftmost derivation, rightmost derivation, and parse tree for a given sentence.", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply word-level analysis and syntactic techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is a repeated template question with a new sentence every time: Assignment-1 Q8 (\"Rahul submitted the assignment\"), the Jul-2026 mid-sem Q3(A) (\"Riya read the book\") and Q3(A-Or) (\"Rahul admired the intelligent professor\") — the same skill is tested with a fresh sentence/grammar in nearly every assessment, making the underlying method extremely high value.", "easyMeaning": "Given a CFG and a target sentence, show the derivation done leftmost-first, then rightmost-first, and draw the final parse tree.", "understandEnMd": "A derivation needs a rule for deciding WHICH non-terminal to expand next when more than one is present in the current string — this is what \"leftmost\" vs \"rightmost\" derivation means.\n\n**Leftmost derivation:** at every step, expand the leftmost non-terminal in the current sentential form first. **Rightmost derivation:** at every step, expand the rightmost non-terminal first. Both derivations use the exact same production rules and produce the exact same final string and the exact same parse tree — only the ORDER in which the rules are applied differs.\n\nWorked example — Grammar: S → NP VP, NP → Det N | PN, VP → V NP, Det → the, N → book, V → read, PN → Riya. Target: \"Riya read the book.\"\n\n**Leftmost derivation:** S ⇒ NP VP (expand S) ⇒ PN VP (expand leftmost NP using NP→PN) ⇒ Riya VP (expand PN) ⇒ Riya V NP (expand leftmost remaining non-terminal, VP) ⇒ Riya read NP (expand V) ⇒ Riya read Det N (expand NP) ⇒ Riya read the N (expand Det) ⇒ Riya read the book (expand N).\n\n**Rightmost derivation:** S ⇒ NP VP ⇒ NP V NP (expand rightmost non-terminal VP first, using VP→V NP) ⇒ NP V Det N (expand rightmost NP using NP→Det N) ⇒ NP V Det book (expand N) ⇒ NP V the book (expand Det) ⇒ NP read the book (expand V) ⇒ PN read the book (expand remaining NP using NP→PN) ⇒ Riya read the book (expand PN).\n\nBoth end at the same string \"Riya read the book\" and the same parse tree: S branches into NP(→PN→\"Riya\") and VP(→V(\"read\") and NP(→Det(\"the\") N(\"book\"))).", "understandGuMd": "Derivation માટે એક rule જોઈએ છે કે current string માં એક કરતાં વધારે non-terminal હોય ત્યારે કયો પહેલા expand કરવો — આ જ \"leftmost\" vs \"rightmost\" derivation નો અર્થ છે.\n\n**Leftmost derivation:** દરેક step પર, current sentential form ના સૌથી ડાબા (leftmost) non-terminal ને પહેલા expand કરાય. **Rightmost derivation:** દરેક step પર, સૌથી જમણા (rightmost) non-terminal ને પહેલા expand કરાય. બંને derivation એ જ production rules વાપરે અને એ જ final string અને એ જ parse tree આપે — ફક્ત rules apply કરવાનો ORDER અલગ હોય.\n\nWorked example — Grammar: S → NP VP, NP → Det N | PN, VP → V NP, Det → the, N → book, V → read, PN → Riya. Target: \"Riya read the book.\"\n\n**Leftmost derivation:** S ⇒ NP VP ⇒ PN VP (leftમાં NP ને PN વાપરીને expand) ⇒ Riya VP ⇒ Riya V NP (બાકીના leftmost non-terminal VP ને expand) ⇒ Riya read NP ⇒ Riya read Det N ⇒ Riya read the N ⇒ Riya read the book.\n\n**Rightmost derivation:** S ⇒ NP VP ⇒ NP V NP (rightmost non-terminal VP ને પહેલા expand) ⇒ NP V Det N ⇒ NP V Det book ⇒ NP V the book ⇒ NP read the book ⇒ PN read the book ⇒ Riya read the book.\n\nબંને એ જ string \"Riya read the book\" અને એ જ parse tree પર પહોંચે: S એ NP(→PN→\"Riya\") અને VP(→V(\"read\") અને NP(→Det(\"the\") N(\"book\"))) માં branch થાય.", "oneLine": "Leftmost derivation expands the left non-terminal first, rightmost expands the right one first — same rules, same tree, different order.", "memoryTrick": "\"Leftmost = Left to Right reading order\"; \"Rightmost = Right side gets fixed first\".", "quick10": "Leftmost derivation always expands the leftmost non-terminal; rightmost always expands the rightmost; both give the same parse tree.", "quick30": "Given a CFG and a sentence, a derivation is the sequence of rule applications from S to the sentence. In a leftmost derivation, the leftmost non-terminal in the current string is expanded at every step; in a rightmost derivation, the rightmost one is expanded first. Both derivations use identical rules and reach the same final parse tree — they differ only in the order rules are applied. The parse tree is drawn with S at the root, branching down through NP/VP to the terminal words at the leaves.", "answerEnMd": "For grammar S → NP VP, NP → Det N | PN, VP → V NP, Det → the, N → book, V → read, PN → Riya, and target sentence \"Riya read the book.\":\n\n**Leftmost Derivation** (always expand the leftmost non-terminal):\nS ⇒ NP VP ⇒ PN VP ⇒ Riya VP ⇒ Riya V NP ⇒ Riya read NP ⇒ Riya read Det N ⇒ Riya read the N ⇒ Riya read the book.\n\n**Rightmost Derivation** (always expand the rightmost non-terminal):\nS ⇒ NP VP ⇒ NP V NP ⇒ NP V Det N ⇒ NP V Det book ⇒ NP V the book ⇒ NP read the book ⇒ PN read the book ⇒ Riya read the book.\n\n**Parse Tree:** S has two children, NP and VP. The first NP expands via NP→PN→\"Riya\". VP expands via VP→V NP, where V→\"read\" and the second NP expands via NP→Det N, with Det→\"the\" and N→\"book\". Reading the leaves left to right gives exactly \"Riya read the book.\"\n\nBoth derivations are equally valid proofs that the grammar generates the sentence; the parse tree is identical either way because a parse tree only records WHICH rules were used, not the order.", "answerGuMd": "Grammar S → NP VP, NP → Det N | PN, VP → V NP, Det → the, N → book, V → read, PN → Riya, અને target sentence \"Riya read the book.\" માટે:\n\n**Leftmost Derivation** (દરેક વખતે leftmost non-terminal expand કરો):\nS ⇒ NP VP ⇒ PN VP ⇒ Riya VP ⇒ Riya V NP ⇒ Riya read NP ⇒ Riya read Det N ⇒ Riya read the N ⇒ Riya read the book.\n\n**Rightmost Derivation** (દરેક વખતે rightmost non-terminal expand કરો):\nS ⇒ NP VP ⇒ NP V NP ⇒ NP V Det N ⇒ NP V Det book ⇒ NP V the book ⇒ NP read the book ⇒ PN read the book ⇒ Riya read the book.\n\n**Parse Tree:** S ના બે children છે, NP અને VP. પહેલો NP → PN → \"Riya\" દ્વારા expand થાય. VP → V NP દ્વારા expand થાય, જ્યાં V → \"read\" અને બીજો NP → Det N દ્વારા expand થાય, Det → \"the\" અને N → \"book\". Leaves ડાબેથી જમણે વાંચતા બરાબર \"Riya read the book\" મળે.\n\nબંને derivation grammar sentence generate કરે છે એ સાબિત કરવા equally valid છે; parse tree બંનેમાં સરખું જ છે કારણ કે parse tree ફક્ત કયા rules વપરાયા એ record કરે, order નહીં.", "mustWrite": ["Show every single intermediate step of both derivations, not just the final string", "Name which rule was applied at each arrow (⇒)", "Draw the parse tree separately and clearly, even though it matches both derivations"], "keywords": ["Leftmost Derivation", "Rightmost Derivation", "Parse Tree", "Sentential Form", "Production Rule"], "diagramMd": "S → NP, VP; NP → PN (\"Riya\"); VP → V (\"read\"), NP; that NP → Det (\"the\"), N (\"book\").", "howToDrawMd": "1. Draw S at top with two children NP and VP. 2. Under the first NP, draw a single child PN, and \"Riya\" below it. 3. Under VP, draw V and NP as children; write \"read\" under V. 4. Under the second NP, draw Det and N; write \"the\" and \"book\" below them. 5. Draw the tree only once — it represents both derivations.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Both derivations are just two different \"orders of doing homework\" that end with the identical finished homework (the parse tree). Leftmost = always do the leftmost open item first; rightmost = always do the rightmost open item first.", "examTip": "Whatever new grammar/sentence is given, follow this exact template — write leftmost derivation fully, then rightmost derivation fully, then the tree — examiners award marks separately for each of the 3 parts.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q11", "sr": 11, "question": "Explain the CYK algorithm and use it to check whether a given string belongs to a given Context-Free Grammar.", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 / CO3 (Apply syntactic parsing algorithms)", "bloomLevel": "Evaluate", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "The CYK algorithm is a fully worked, multi-slide PPT topic, and the exact grammar S→AB|BC, A→BA|a, B→CC|b, C→AB|a is tested twice in real papers with two different strings: the Sep-2025 final asks to evaluate \"baab\" (Que.3A), and this same grammar's PPT worked example evaluates \"baaba\" — giving a rich, cross-checked, fully-solvable numerical.", "easyMeaning": "Given a grammar in Chomsky Normal Form and a string, use the CYK table method to check whether the grammar can produce that exact string.", "understandEnMd": "The CYK (Cocke-Younger-Kasami) algorithm checks whether a string belongs to the language of a CFG, but it only works if the grammar is first converted to Chomsky Normal Form (CNF) — every rule must be either A→BC (two non-terminals) or A→a (one terminal).\n\nIt is a **bottom-up, dynamic programming** algorithm: it builds a triangular table where cell T[i,j] holds the set of non-terminals that can generate the substring of length j starting at position i. It starts by filling in single-letter spans directly from A→a rules, then combines shorter spans into longer ones using A→BC rules, working up until the whole string is covered. If the start symbol S appears in the cell covering the entire string, the string belongs to the grammar's language; otherwise it does not.", "understandGuMd": "CYK (Cocke-Younger-Kasami) algorithm ચેક કરે કે કોઈ string CFG ની language માં છે કે નહીં, પણ એ ફક્ત ત્યારે જ કામ કરે જ્યારે grammar પહેલા Chomsky Normal Form (CNF) માં convert થયેલી હોય — દરેક rule કાં તો A→BC (બે non-terminals) અથવા A→a (એક terminal) જ હોવો જોઈએ.\n\nઆ એક **bottom-up, dynamic programming** algorithm છે: તે triangular table બનાવે જ્યાં cell T[i,j] માં position i થી શરૂ થતા length j ના substring ને generate કરી શકતા non-terminals નો set હોય. પહેલા A→a rules વાપરીને single-letter spans ભરાય, પછી A→BC rules વાપરીને ટૂંકા spans ને લાંબા spans માં combine કરાય, જ્યાં સુધી આખું string cover ના થાય. જો start symbol S આખા string ને cover કરતા cell માં હોય, તો string grammar ની language માં છે; નહીં તો નથી.", "oneLine": "CYK = bottom-up DP table; combine short spans into long spans using A→BC rules; string is valid if S appears in the full-span cell.", "memoryTrick": "\"Climb Your Ktable\" — build the table bottom (letters) to top (whole string), climbing upward.", "quick10": "CYK checks CFG membership using a triangular DP table on a CNF grammar — string is valid if S ends up in the cell spanning the whole string.", "quick30": "CYK is a bottom-up dynamic-programming membership algorithm that requires the CFG to be in Chomsky Normal Form (rules A→BC or A→a). It builds a triangular table where T[i][j] holds all non-terminals that can derive the substring starting at position i with length j: cells of length 1 are filled directly from unit rules (A→a), and longer spans are filled by trying every split point and combining pairs of non-terminals from shorter spans via A→BC rules. The string is in the language if and only if S is in the cell covering the entire string.", "answerEnMd": "The CYK algorithm builds a table T[i][j] (i = start position, j = span length) bottom-up: length-1 cells come directly from unit rules (A→a), and each longer cell T[i][j] is the union, over every split point k, of all X such that X→YZ is a rule with Y∈T[i][k] and Z∈T[i+k][j-k]. Applying this to grammar S→AB|BC, A→BA|a, B→CC|b, C→AB|a:\n\nFor the string **\"baaba\"** (length 5), working the table up from single letters through length-2, length-3, and length-4 spans to the final length-5 cell gives **T[1][5] = {A, S, C}**, which **contains the start symbol S** — therefore **\"baaba\" belongs to L(G)**, exactly matching the PPT's own stated conclusion.\n\nFor the string **\"baab\"** (length 4) — tested independently for the real Sep-2025 exam question — the corresponding cell **T[1][4] is empty** (no non-terminal, and in particular no S, can be derived for this exact 4-letter span) — therefore **\"baab\" does NOT belong to L(G)**.", "answerGuMd": "CYK algorithm T[i][j] (i = start position, j = span length) table bottom-up બનાવે: length-1 cells સીધા unit rules (A→a) માંથી, અને દરેક લાંબા cell T[i][j] દરેક split point k પર, X→YZ rule હોય અને Y∈T[i][k], Z∈T[i+k][j-k] હોય એવા બધા X નું union હોય. Grammar S→AB|BC, A→BA|a, B→CC|b, C→AB|a લગાવતા:\n\n**\"baaba\"** (length 5) string માટે, table ને single letters થી length-2, length-3, length-4 spans થઈને final length-5 cell સુધી બનાવતા **T[1][5] = {A, S, C}** મળે, જેમાં **start symbol S છે** — એટલે **\"baaba\" એ L(G) માં છે**, PPT ના પોતાના conclusion સાથે બરાબર મેળ ખાય.\n\n**\"baab\"** (length 4) string માટે — real Sep-2025 exam question માટે અલગથી ચેક કરતાં — સંબંધિત cell **T[1][4] ખાલી છે** (કોઈ non-terminal, ખાસ કરીને S, આ 4-letter span માટે derive નથી થતું) — એટલે **\"baab\" L(G) માં નથી**.", "mustWrite": ["Confirm/derive that the grammar is in CNF before starting", "Draw the complete triangular table with every reachable cell filled", "State the final yes/no conclusion by explicitly checking whether S is in the top-level cell"], "keywords": ["CYK Algorithm", "Chomsky Normal Form", "Dynamic Programming", "Bottom-Up Parsing", "Membership Algorithm"], "diagramMd": "A triangular table with 5 rows (for \"baaba\"): bottom row = single letters (b,a,a,b,a) each labeled with their non-terminals; each row above combines two cells from the row(s) below via valid A→BC rules; the single top cell represents the whole string.", "howToDrawMd": "1. Write the input string's letters along the bottom, one per column. 2. Draw a triangular grid above them with one row per span length (bottom=length1, top=length n). 3. Fill the bottom row directly from unit rules. 4. For each cell above, draw small arrows down to the two cells whose split combination filled it. 5. Circle the top-most cell and write \"S found → accepted\" or \"S not found → rejected\".", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "**Given:** Grammar S → AB | BC, A → BA | a, B → CC | b, C → AB | a (already in CNF). Evaluate string \"baaba\" (from the PPT) and, separately, string \"baab\" (from the Sep-2025 real exam paper). Notation: T[i][j] = start position i, span length j.\n**Formula:** T[i][j] = { X : X → YZ is a rule, and for some split k (1 ≤ k < j), Y ∈ T[i][k] and Z ∈ T[i+k][j-k] }, with base case T[i][1] = { X : X → (the i-th letter) is a rule }.\n**Step 1 (length 1, letters b-a-a-b-a):** T[1][1]={B}, T[2][1]={A,C}, T[3][1]={A,C}, T[4][1]={B}, T[5][1]={A,C}.\n**Step 2 (length 2):** T[1][2] (\"ba\") = combine T[1][1]×T[2][1]: pair(B,A)→A via A→BA, pair(B,C)→S via S→BC ⟹ {A,S}. T[2][2] (\"aa\") = combine T[2][1]×T[3][1]: pair(C,C)→B via B→CC ⟹ {B}. T[3][2] (\"ab\") = combine T[3][1]×T[4][1]: pair(A,B)→S via S→AB and →C via C→AB ⟹ {S,C}. T[4][2] (\"ba\") = combine T[4][1]×T[5][1]: pair(B,A)→A, pair(B,C)→S ⟹ {A,S}.\n**Step 3 (length 3):** T[1][3] (\"baa\") = (T[1][1]×T[2][2]: pair(B,B), no rule) ∪ (T[1][2]×T[3][1]: pairs A-A,A-C,S-A,S-C, no rule) ⟹ **{} empty**. T[2][3] (\"aab\") = (T[2][1]×T[3][2]: pair(C,C)→B) ∪ (T[2][2]×T[4][1]: pair(B,B), no rule) ⟹ {B}. T[3][3] (\"aba\") = (T[3][1]×T[4][2]: no matching pairs) ∪ (T[3][2]×T[5][1]: pair(C,C)→B) ⟹ {B}.\n**Step 4 (length 4):** T[1][4] (\"baab\") = (T[1][1]×T[2][3]: pair(B,B), no rule) ∪ (T[1][2]×T[3][2]: pairs A-S,A-C,S-S,S-C, no rule) ∪ (T[1][3]×T[4][1]: T[1][3] is empty) ⟹ **{} empty**. T[2][4] (\"aaba\") = (T[2][1]×T[3][3]: pair(A,B)→S,C) ∪ (T[2][2]×T[4][2]: pair(B,A)→A) ∪ (T[2][3]×T[5][1]: pair(B,A)→A, pair(B,C)→S) ⟹ {S,A,C}.\n**Step 5 (length 5, full string \"baaba\"):** T[1][5] = (T[1][1]×T[2][4]: pair(B,A)→A, pair(B,C)→S) ∪ (T[1][2]×T[3][3]: pair(A,B)→S,C) ∪ (T[1][3]×T[4][2]: empty) ∪ (T[1][4]×T[5][1]: empty) ⟹ **{A, S, C}**.\n**Final Answer:** T[1][5] = {A,S,C} contains **S** → **\"baaba\" belongs to L(G)** ✓ (matches the PPT's own stated conclusion). Separately, T[1][4] = {} (empty, computed in Step 4) does NOT contain S → **\"baab\" does NOT belong to L(G)** — the correct answer for the real Sep-2025 exam question.\n**Exam Writing Format:** Draw the full triangular table with rows for span-length 1 to n and columns for start position, fill every cell you can compute showing which rule justified each entry, and explicitly circle/state whether S appears in the top (full-span) cell — that single fact is the actual \"yes/no\" answer the examiner is grading.", "algorithmMd": "**Name:** CYK (Cocke-Younger-Kasami) Algorithm. **Input:** A CNF grammar G=(N,Σ,R,S) and a string w of length n. **Steps:** 1. If the grammar is not already in CNF, convert it to CNF first. 2. Create an n×n triangular table T. 3. Fill the diagonal: for each position i, put in T[i,1] every non-terminal X such that X→wi is a rule. 4. For span lengths j=2 to n: for each start position i, and for each split point k, compute T[i,j] as the set of X such that X→YZ is a rule, Y∈T[i,k] and Z∈T[i+k,j-k]. 5. Repeat until T[1,n] is computed. **Output:** \"Yes, w ∈ L(G)\" if S ∈ T[1,n], otherwise \"No\". **Simple Example:** shown above for \"baaba\" (accepted) and \"baab\" (rejected) using the same grammar. **Exam Writing Format:** Always state the CNF check first (\"this grammar is already in CNF since every rule is A→BC or A→a\"), then draw the table, then conclude with the membership statement referencing T[1,n].", "explainAgainMd": "CYK is like a puzzle built from the bottom up: first figure out which \"piece labels\" fit each single letter, then check every way of gluing two smaller pieces together to make a bigger piece, and keep going up until you've covered the whole string — if the final giant piece can be labelled \"S\", the string is valid.", "examTip": "If the exam asks about \"baab\" specifically, do NOT assume it behaves like the PPT's \"baaba\" example — they are different strings with different lengths, and (as shown above) they have different accept/reject answers, so always build the table fresh for whatever exact string is given.\n\n## HIGH PRIORITY QUESTIONS", "isNumerical": true, "isDiagram": true, "isComparison": false, "isAlgorithm": true, "givenMd": "Grammar S → AB | BC, A → BA | a, B → CC | b, C → AB | a (already in CNF). Evaluate string \"baaba\" (from the PPT) and, separately, string \"baab\" (from the Sep-2025 real exam paper). Notation: T[i][j] = start position i, span length j.", "formulaMd": "T[i][j] = { X : X → YZ is a rule, and for some split k (1 ≤ k < j), Y ∈ T[i][k] and Z ∈ T[i+k][j-k] }, with base case T[i][1] = { X : X → (the i-th letter) is a rule }.", "finalAnswerMd": "T[1][5] = {A,S,C} contains **S** → **\"baaba\" belongs to L(G)** ✓ (matches the PPT's own stated conclusion). Separately, T[1][4] = {} (empty, computed in Step 4) does NOT contain S → **\"baab\" does NOT belong to L(G)** — the correct answer for the real Sep-2025 exam question.", "hasFormula": true}, {"id": "q12", "sr": 12, "question": "What is Chomsky Normal Form (CNF)? How do you evaluate whether a given grammar is in CNF?", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply word-level and syntactic techniques)", "bloomLevel": "Evaluate", "priority": "high", "priorityLabel": "High", "priorityReason": "Directly asked twice in the same Sep-2025 final paper (Que.3B \"evaluate whether the CFG follows CNF, with a reason\" and Que.4B, a second CNF-evaluation question with a different grammar), and it is a prerequisite concept for the CYK algorithm (Q11).", "easyMeaning": "Explain the special restricted form a CFG must be in before CYK can be used, and show how to check if a given grammar already satisfies it.", "understandEnMd": "Chomsky Normal Form (CNF) restricts every production rule in a CFG to one of exactly two shapes: **Rule 1:** a non-terminal produces exactly two other non-terminals (A → BC), or **Rule 2:** a non-terminal produces exactly one terminal (A → a). No rule may mix terminals and non-terminals on the right side, and no rule may have more than 2 symbols (except the special case of the empty string for the start symbol, which is usually ignored in exam-level grammars).\n\nThis restriction makes it simple to analyse and parse the grammar — every rule application either splits a string into exactly two independently-parseable halves, or terminates in a single word, which is exactly the structure the CYK algorithm's triangular table relies on.\n\n**How to evaluate a grammar:** check every single rule one at a time. If a rule's right-hand side has exactly 2 non-terminals (and nothing else), it is fine. If a rule's right-hand side has exactly 1 terminal (and nothing else), it is fine. If ANY rule violates this — e.g. 3 or more symbols on the right (like S → N NP VP), a mix of terminal and non-terminal (like NP → the N), or a right side with just one non-terminal (like A → B) — the grammar is NOT in CNF, and that specific violating rule must be named as the reason.", "understandGuMd": "Chomsky Normal Form (CNF) CFG ના દરેક production rule ને બરાબર બે shapes માંથી એક પર restrict કરે: **Rule 1:** એક non-terminal બરાબર બે બીજા non-terminals produce કરે (A → BC), અથવા **Rule 2:** એક non-terminal બરાબર એક terminal produce કરે (A → a). Right side માં terminal અને non-terminal નું mix ના હોવું જોઈએ, અને 2 થી વધારે symbols ના હોવા જોઈએ.\n\nઆ restriction grammar ને analyze અને parse કરવાનું સહેલું બનાવે — દરેક rule application string ને બરાબર બે independently-parseable ભાગોમાં તોડે, અથવા એક શબ્દ પર પૂરું થાય, જે બરાબર CYK algorithm ના triangular table ને જોઈતી structure છે.\n\n**Grammar evaluate કરવાની રીત:** દરેક rule એક પછી એક check કરો. Right-hand side માં બરાબર 2 non-terminals હોય (બીજું કંઈ નહીં), તો બરાબર છે. Right-hand side માં બરાબર 1 terminal હોય, તો બરાબર છે. જો કોઈ પણ rule આ violate કરે — દા.ત. 3 કે વધારે symbols (S → N NP VP જેવું), terminal-nonterminal નું mix (NP → the N જેવું), અથવા ફક્ત એક non-terminal (A → B જેવું) — તો grammar CNF માં નથી, અને એ ચોક્કસ rule ને reason તરીકે નામ આપવું જોઈએ.", "oneLine": "CNF rules are only A→BC (2 non-terminals) or A→a (1 terminal); any other shape breaks CNF.", "memoryTrick": "\"Two or One, nothing else\" — a CNF rule's right side is either 2 non-terminals or 1 terminal, never a mix, never more.", "quick10": "CNF = every rule is A→BC or A→a; check each rule's right side against these two shapes only.", "quick30": "Chomsky Normal Form restricts CFG rules to exactly two forms: A→BC (two non-terminals) or A→a (one terminal). To evaluate whether a grammar is in CNF, check every rule's right-hand side one by one — it must be exactly 2 non-terminals or exactly 1 terminal; anything else (3+ symbols, mixed terminal/non-terminal, or a single non-terminal) violates CNF, and that rule should be quoted as the reason. CNF matters because algorithms like CYK depend on every rule splitting into exactly two parts or terminating.", "answerEnMd": "Chomsky Normal Form (CNF) is a restricted form of a Context-Free Grammar in which every production rule takes one of exactly two shapes: **Rule 1 — A → BC**, where a non-terminal produces exactly two other non-terminals; **Rule 2 — A → a**, where a non-terminal produces exactly one terminal symbol. This restriction simplifies grammar analysis, because every derivation step either cleanly splits the remaining string into two independently-analysable halves, or immediately produces a terminal word — this is exactly the structural assumption used by the CYK parsing algorithm.\n\n**Evaluating whether a grammar is in CNF:** examine each rule's right-hand side individually:\n- If it has exactly two symbols and both are non-terminals → satisfies Rule 1, OK.\n- If it has exactly one symbol and it is a terminal → satisfies Rule 2, OK.\n- If it has 3 or more symbols (e.g. S → N NP VP), or mixes a terminal with a non-terminal (e.g. NP → the N), or is a single non-terminal (e.g. A → B), the grammar is **NOT in CNF**, and the specific offending rule must be identified as the justification.\n\nExample: the grammar S → N NP VP; NP → NP Det N; VP → V NP; Det → the | a; N → girl | boy; V → chased | helped is NOT in CNF, because S → N NP VP has three symbols on the right (violates the \"exactly two non-terminals\" rule) and NP → NP Det N also has three symbols — both rules must be converted (e.g., by introducing intermediate non-terminals) before CYK-style parsing can be applied.", "answerGuMd": "Chomsky Normal Form (CNF) એ CFG નું restricted form છે જેમાં દરેક production rule બરાબર બે shape માંથી એક હોય: **Rule 1 — A → BC**, જ્યાં non-terminal બરાબર બે બીજા non-terminals produce કરે; **Rule 2 — A → a**, જ્યાં non-terminal બરાબર એક terminal symbol produce કરે. આ restriction grammar analysis ને સહેલું બનાવે, કારણ કે દરેક derivation step બાકીના string ને બે independently-analysable ભાગોમાં તોડે, અથવા સીધો terminal શબ્દ આપે — આ જ structural assumption CYK parsing algorithm વાપરે છે.\n\n**Grammar CNF માં છે કે નહીં તે evaluate કરવું:** દરેક rule ની right-hand side individually check કરો:\n- બરાબર બે symbols હોય અને બંને non-terminal હોય → Rule 1 satisfy કરે, OK.\n- બરાબર એક symbol હોય અને એ terminal હોય → Rule 2 satisfy કરે, OK.\n- 3 કે વધારે symbols હોય (દા.ત. S → N NP VP), અથવા terminal-nonterminal નું mix હોય (દા.ત. NP → the N), અથવા ફક્ત એક non-terminal હોય (દા.ત. A → B) — તો grammar **CNF માં નથી**, અને એ ચોક્કસ rule ને justification તરીકે identify કરવો.\n\nExample: grammar S → N NP VP; NP → NP Det N; VP → V NP; Det → the | a; N → girl | boy; V → chased | helped CNF માં **નથી**, કારણ કે S → N NP VP ની right side માં 3 symbols છે (\"exactly બે non-terminals\" rule violate કરે) અને NP → NP Det N માં પણ 3 symbols છે — CYK-style parsing પહેલા બંને rules ને convert કરવા પડે (દા.ત. વચ્ચે intermediate non-terminals ઉમેરીને).", "mustWrite": ["State both CNF rule shapes exactly (A→BC and A→a)", "Check EVERY rule of the given grammar individually, not just say \"yes/no\" overall", "Name the specific violating rule(s) with the reason (too many symbols / mixed types)"], "keywords": ["Chomsky Normal Form", "CNF", "Production Rule", "Non-terminal", "Terminal"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "CNF is like a strict recipe rule: every step of the recipe must either split into exactly 2 sub-steps, or directly produce one finished ingredient — no step is allowed to do three things at once or mix a finished ingredient with an unfinished one.", "examTip": "Always check ALL rules of the grammar, not just the first one — many CNF-evaluation questions include one obviously-bad rule and one subtly-bad rule (like a unit rule A→B), and partial checking loses marks.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q13", "sr": 13, "question": "Explain the different types of parsers used in NLP (Recursive Descent, Shift-Reduce, Chart, and Regexp parsers).", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply syntactic analysis techniques)", "bloomLevel": "Understand", "priority": "high", "priorityLabel": "High", "priorityReason": "This is a dedicated section of the Unit-2 PPT with one slide per parser type, and closely relates to the frequently-tested \"top-down vs bottom-up parsing\" question that appears in the Nov-2023 paper (\"Explain Top down parsing and bottom up parsing with an example\").", "easyMeaning": "Explain the four common kinds of parsers and how each one goes about building a parse tree.", "understandEnMd": "A parser is a software component that takes input text and produces a structural representation (parse tree) after verifying its syntax against a grammar; it can also report syntax errors and build a symbol table used later for semantic interpretation.\n\n**Recursive Descent Parser** — the simplest form; it is **top-down**, scanning the input left to right and trying to match terminals using the grammar's rules, essentially trying each rule as a recursive function call. **Shift-Reduce Parser** — a simple **bottom-up** process; it looks for a sequence of words/phrases matching the right-hand side of a production and replaces (\"reduces\") them with the left-hand side, repeating until the whole sentence reduces to the start symbol. **Chart Parser** — useful especially for ambiguous grammars (like natural languages); it applies **dynamic programming**, storing partial parse results in a structure called a \"chart\" so they can be reused instead of recomputed. **Regexp Parser** — one of the most commonly used; it applies regular-expression-style grammar rules on top of a POS-tagged string to produce a (typically shallow) parse tree.", "understandGuMd": "Parser એ software component છે જે input text લઈને, grammar સામે syntax verify કરીને, structural representation (parse tree) આપે છે; તે syntax errors પણ report કરી શકે અને પછીના semantic interpretation માટે વપરાતું symbol table બનાવે.\n\n**Recursive Descent Parser** — સૌથી સાદું form; **top-down** છે, input ને ડાબેથી જમણે scan કરે અને grammar ના rules વાપરીને terminals match કરવાનો પ્રયત્ન કરે, દરેક rule ને recursive function call તરીકે try કરે. **Shift-Reduce Parser** — સાદું **bottom-up** process; production ની right-hand side ને match કરતો words/phrases નો sequence શોધે અને એને left-hand side થી replace (\"reduce\") કરે, જ્યાં સુધી આખું sentence start symbol પર reduce ના થાય ત્યાં સુધી. **Chart Parser** — ખાસ કરીને ambiguous grammars (natural languages જેવી) માટે useful; **dynamic programming** વાપરે, partial parse results ને \"chart\" નામની structure માં store કરે જેથી ફરીથી compute કરવાની જરૂર ના પડે. **Regexp Parser** — સૌથી વધારે વપરાતું; POS-tagged string પર regular-expression-style grammar rules apply કરીને (સામાન્ય રીતે shallow) parse tree બનાવે.", "oneLine": "Recursive Descent = top-down; Shift-Reduce = bottom-up; Chart = dynamic programming (reuses partial results); Regexp = regex rules on POS tags.", "memoryTrick": "\"Really Simple Charts Repeat\" → Recursive Descent, Shift-reduce, Chart, Regexp.", "quick10": "4 parser types: Recursive Descent (top-down), Shift-Reduce (bottom-up), Chart (dynamic programming, reuses results), Regexp (regex on POS tags).", "quick30": "A parser converts input text into a structural (parse-tree) representation after checking it against a grammar. Recursive Descent Parser is a simple top-down parser that scans left to right matching terminals. Shift-Reduce Parser is a simple bottom-up parser that repeatedly reduces matched right-hand sides to their left-hand-side non-terminal until reaching the start symbol. Chart Parser uses dynamic programming and a reusable \"chart\" structure, making it well suited to ambiguous natural-language grammars. Regexp Parser applies regular-expression-style rules over POS-tagged text and is one of the most commonly used in practice.", "answerEnMd": "A parser is the software component that takes tokenized/POS-tagged input text and, using a formal grammar, verifies its syntax and produces a structural representation (a parse tree or abstract syntax tree); it can also flag syntax errors and build a symbol table for later semantic use. There are four widely discussed parser types:\n\n1. **Recursive Descent Parser:** The simplest parsing strategy. It is a **top-down** process that scans the input left to right and checks whether the input matches the grammar by trying rules recursively, starting from the start symbol and working down to the terminals.\n\n2. **Shift-Reduce Parser:** A simple **bottom-up** process. It looks for a sequence of words/phrases in the input that matches the right-hand side of some grammar production and replaces (\"reduces\") that sequence with the corresponding left-hand-side non-terminal; this shift-and-reduce cycle repeats until the entire input has been reduced to the start symbol.\n\n3. **Chart Parser:** Especially useful for ambiguous grammars, including those of natural languages. It applies the dynamic-programming principle, storing partially built (\"hypothesized\") parse results in a data structure called a **chart**, which can be reused across different parts of the parse instead of being recomputed — improving efficiency on ambiguous inputs.\n\n4. **Regexp Parser:** One of the most commonly used parsers in practice. It defines grammar rules in the form of regular expressions applied on top of a POS-tagged string, and uses these regular expressions to parse the sentence and directly produce a (typically shallow) parse tree.\n\nEach of these represents a different trade-off between simplicity (Recursive Descent), correctness guarantees on real grammars (Shift-Reduce), efficiency on ambiguity (Chart), and practical ease of use (Regexp).", "answerGuMd": "Parser એ software component છે જે tokenized/POS-tagged input text લઈને, formal grammar વાપરીને, તેનું syntax verify કરે અને structural representation (parse tree અથવા abstract syntax tree) આપે; તે syntax errors પણ flag કરી શકે અને પછીના semantic ઉપયોગ માટે symbol table બનાવે. ચાર widely discussed parser types છે:\n\n1. **Recursive Descent Parser:** સૌથી સાદી parsing strategy. **top-down** process છે જે input ને ડાબેથી જમણે scan કરે અને start symbol થી શરૂ કરીને terminals સુધી rules ને recursively try કરીને check કરે કે input grammar સાથે match થાય છે કે નહીં.\n\n2. **Shift-Reduce Parser:** સાદું **bottom-up** process. Input માં એવો words/phrases નો sequence શોધે જે કોઈ grammar production ની right-hand side સાથે match થાય, અને એ sequence ને corresponding left-hand-side non-terminal થી replace (\"reduce\") કરે; આ shift-and-reduce cycle ત્યાં સુધી ચાલે જ્યાં સુધી આખું input start symbol પર reduce ના થાય.\n\n3. **Chart Parser:** ખાસ કરીને ambiguous grammars (natural languages સહિત) માટે useful. Dynamic-programming principle apply કરે, partial (\"hypothesized\") parse results ને **chart** નામની data structure માં store કરે, જે ફરીથી use થઈ શકે — ambiguous input પર efficiency સુધારે.\n\n4. **Regexp Parser:** Practice માં સૌથી વધારે વપરાતું parser. POS-tagged string પર regular-expression-style grammar rules define કરે, અને એ regular expressions વાપરીને sentence parse કરે અને સીધો (સામાન્ય રીતે shallow) parse tree બનાવે.\n\nઆ દરેક simplicity (Recursive Descent), real grammars પર correctness (Shift-Reduce), ambiguity પર efficiency (Chart), અને practical ease of use (Regexp) વચ્ચે અલગ trade-off represent કરે છે.", "mustWrite": ["Name all 4 parser types", "Correctly label each as top-down or bottom-up where applicable", "Give the one key distinguishing feature of each (recursive matching / reduce-to-start / chart reuse / regex-on-POS-tags)"], "keywords": ["Recursive Descent Parser", "Shift-Reduce Parser", "Chart Parser", "Regexp Parser", "Top-Down", "Bottom-Up"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "| Parser | Direction | Key Idea |\n|---|---|---|\n| Recursive Descent | Top-down | Recursively tries grammar rules starting from S |\n| Shift-Reduce | Bottom-up | Repeatedly reduces matched RHS to LHS until reaching S |\n| Chart | Either (DP-based) | Reuses stored partial parses via a \"chart\" — good for ambiguity |\n| Regexp | Shallow/pattern-based | Applies regex rules over POS-tagged text |", "quickMemory": "Top-down starts from S and works down; bottom-up starts from words and works up to S; Chart remembers work already done; Regexp is just pattern matching on tags.", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Recursive Descent guesses rules from the top and checks if they fit; Shift-Reduce builds up from the words and merges them upward; Chart is like taking notes so you never redo the same sub-problem twice; Regexp just pattern-matches tags the same way you'd pattern-match text.", "examTip": "If asked to also \"compare\" these (as some papers do), explicitly state top-down vs bottom-up for the first two, since that single distinction is the most commonly graded point.\n\n## MEDIUM PRIORITY QUESTIONS", "isNumerical": false, "isDiagram": false, "isComparison": true, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q14", "sr": 14, "question": "What are Treebanks and Probabilistic Context-Free Grammar (PCFG)?", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply word-level and syntactic techniques)", "bloomLevel": "Understand", "priority": "med", "priorityLabel": "Medium", "priorityReason": "Both are explicit PPT topics (a dedicated Treebank section with the Penn Treebank example, and a PCFG section on resolving parse ambiguity), and the Dec-2024 paper asks to \"Analyze the importance of probabilistic context-free grammar (PCFG) in syntactic parsing,\" while the most recent Sep-2026 paper asks to \"analyze the concept of a Treebank.\"", "easyMeaning": "Explain what a Treebank is and how giving grammar rules probabilities (PCFG) helps pick the best parse when a sentence is ambiguous.", "understandEnMd": "A **Treebank** is a text corpus in which sentences are annotated with their syntactic structure (as hierarchical trees) showing the relationships between words and phrases. Treebanks are essential for building and evaluating NLP syntax parsers and for linguistic research, because they provide large amounts of \"ground truth\" parse trees to learn from. There are two kinds: **Constituency Treebanks** (focus on phrase structure/hierarchy, e.g. the **Penn Treebank**, a foundational hand-annotated English corpus with POS tags and syntax trees) and **Dependency Treebanks** (focus on word-to-word dependency relationships, e.g. the Prague Dependency Treebank).\n\nA **Probabilistic Context-Free Grammar (PCFG)** extends an ordinary CFG by attaching a probability to every production rule, representing how likely that rule is to be used in a derivation. PCFGs are crucial for resolving syntactic ambiguity — when a sentence has more than one valid parse tree, the PCFG lets the system compute a probability for each candidate tree (by multiplying the probabilities of the rules used) and select the single most probable parse instead of an arbitrary one.", "understandGuMd": "**Treebank** એક text corpus છે જેમાં sentences ને તેમના syntactic structure (hierarchical trees તરીકે) સાથે annotate કરેલા હોય, જે શબ્દો અને phrases વચ્ચેના relationships બતાવે. NLP syntax parsers બનાવવા/evaluate કરવા અને linguistic research માટે Treebanks જરૂરી છે, કારણ કે તે શીખવા માટે મોટી માત્રામાં \"ground truth\" parse trees આપે છે. બે પ્રકાર છે: **Constituency Treebanks** (phrase structure/hierarchy પર focus, દા.ત. **Penn Treebank**, POS tags અને syntax trees સાથેનું foundational hand-annotated English corpus) અને **Dependency Treebanks** (word-to-word dependency relationships પર focus, દા.ત. Prague Dependency Treebank).\n\n**Probabilistic Context-Free Grammar (PCFG)** સામાન્ય CFG ને extend કરે છે, દરેક production rule ને probability આપીને, જે બતાવે કે derivation માં એ rule વપરાવાની કેટલી શક્યતા છે. Syntactic ambiguity ઉકેલવા માટે PCFG મહત્વનું છે — જ્યારે sentence નું એક કરતાં વધારે valid parse tree હોય, ત્યારે PCFG દરેક candidate tree માટે probability compute કરવા દે છે (વપરાયેલા rules ની probabilities ને multiply કરીને) અને arbitrary tree ને બદલે સૌથી વધારે probable parse પસંદ કરે છે.", "oneLine": "Treebank = corpus with annotated parse trees (e.g. Penn Treebank); PCFG = CFG + rule probabilities, used to pick the most likely parse when ambiguous.", "memoryTrick": "\"Tree Bank stores Trees\"; \"Probabilistic CFG Picks the most Probable\".", "quick10": "Treebank = corpus of annotated parse trees (Penn Treebank = constituency, Prague = dependency); PCFG = CFG with rule probabilities to resolve ambiguity.", "quick30": "A Treebank is a corpus of sentences annotated with syntactic trees, used to train/evaluate parsers — Constituency Treebanks (e.g. Penn Treebank) show phrase structure, Dependency Treebanks (e.g. Prague Dependency Treebank) show word-to-word dependencies. A PCFG attaches a probability to every CFG production rule; when a sentence has multiple valid parse trees (structural ambiguity), the PCFG computes each tree's overall probability by multiplying its rules' probabilities, and the parser selects the highest-probability tree as the most likely correct parse.", "answerEnMd": "A **Treebank** is a text corpus in which every sentence is annotated with its syntactic structure, represented as a hierarchical tree that shows relationships between words and phrases; treebanks are essential for developing NLP syntax parsers and for linguistic research into grammatical patterns. There are two main kinds: **Constituency Treebanks**, which group words into hierarchical phrases (noun phrases, verb phrases) — the **Penn Treebank** is the classic example, a hand-annotated English corpus including POS tags and full syntactic trees — and **Dependency Treebanks**, which instead record word-to-word head-dependent relationships, such as the Prague Dependency Treebank.\n\nA **Probabilistic Context-Free Grammar (PCFG)** is an extension of an ordinary CFG in which every production rule is assigned a probability representing how likely it is to be chosen during a derivation. PCFGs are important because natural language sentences are frequently syntactically ambiguous (more than one parse tree is grammatically valid); a PCFG resolves this by computing the overall probability of each candidate parse tree as the product of the probabilities of every rule used to build it, and then selecting the parse tree with the highest overall probability as the system's single best-guess interpretation — turning an otherwise arbitrary choice among valid parses into a principled, data-driven one.", "answerGuMd": "**Treebank** એક text corpus છે જેમાં દરેક sentence ને તેની syntactic structure સાથે annotate કરેલું હોય, hierarchical tree તરીકે જે શબ્દો અને phrases વચ્ચેના relationships બતાવે; NLP syntax parsers develop કરવા અને grammatical patterns પરના linguistic research માટે treebanks જરૂરી છે. બે મુખ્ય પ્રકાર: **Constituency Treebanks**, જે શબ્દોને hierarchical phrases (noun phrases, verb phrases) માં group કરે — **Penn Treebank** classic example છે, POS tags અને full syntactic trees સાથેનું hand-annotated English corpus — અને **Dependency Treebanks**, જે word-to-word head-dependent relationships record કરે, જેમ કે Prague Dependency Treebank.\n\n**Probabilistic Context-Free Grammar (PCFG)** સામાન્ય CFG નું extension છે જેમાં દરેક production rule ને probability આપેલી હોય, જે બતાવે કે derivation માં એ rule પસંદ થવાની કેટલી શક્યતા છે. PCFGs મહત્વના છે કારણ કે natural language sentences ઘણી વાર syntactically ambiguous હોય છે (એક કરતાં વધારે parse tree grammatically valid હોય); PCFG આ ઉકેલે છે દરેક candidate parse tree ની overall probability, એને બનાવવા વપરાયેલા બધા rules ની probabilities ને multiply કરીને, compute કરીને, અને પછી સૌથી વધારે overall probability વાળા parse tree ને system ના best-guess interpretation તરીકે પસંદ કરીને — valid parses વચ્ચેની arbitrary પસંદગી ને એક principled, data-driven પસંદગી માં ફેરવે છે.", "mustWrite": ["Define Treebank and name both types with one example each (Penn, Prague)", "Define PCFG as \"CFG + rule probabilities\"", "Explain exactly how PCFG resolves ambiguity (multiply rule probabilities, pick highest)"], "keywords": ["Treebank", "Penn Treebank", "Constituency Treebank", "Dependency Treebank", "PCFG", "Syntactic Ambiguity"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A Treebank is a giant answer-key of correctly parsed sentences that parsers learn from. A PCFG is a CFG where every rule also has a \"how likely is this\" score, so when a sentence could be parsed two different ways, the system just picks whichever full parse has the higher combined likelihood score.", "examTip": "If asked to \"analyze the importance\" of PCFG, explicitly connect it to ambiguity resolution — that connection (not just the definition) is what separates a full-marks answer from a bare definition.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q15", "sr": 15, "question": "Explain tokenization methods (whitespace, rule-based, Byte-Pair Encoding) and the challenges they face.", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO1", "coNote": "CO1/CO2 (Apply word-level analysis techniques)", "bloomLevel": "Apply", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "This is Que.2(A) of the most recent paper in the uploaded material (23-Sep-2026, dated only one day before this material was analysed), which explicitly asks to compare whitespace, rule-based, and Byte-Pair Encoding tokenization, and connects BPE to morphological analysis — the freshest and one of the most detailed available pieces of exam evidence.", "easyMeaning": "Explain three ways to split text into tokens (by spaces, by rules, or by BPE) and why simple space-based splitting struggles with things like hashtags or contractions.", "understandEnMd": "Tokenization is the first concrete step of turning raw text into units a model can use, and different methods handle messy real text differently.\n\n**Whitespace tokenization** simply splits text wherever there is a space; it is fast but fails on punctuation attached to words (\"update...\") and does not separate hashtags, mentions, or contractions correctly. **Rule-based tokenization** uses hand-written rules/regular expressions to separate punctuation, split contractions (\"don't\" → \"do\" + \"n't\"), and handle special tokens like URLs, hashtags (#ChatGPT5) and mentions (@user123) as single units — much better on social-media-style text, but the rules must be maintained by hand and can miss new patterns. **Byte-Pair Encoding (BPE)** is a subword tokenization algorithm: it starts with individual characters and repeatedly merges the most frequent adjacent pair of symbols into a new symbol, building up a vocabulary of common subword units. This means rare or unseen words can still be represented as a sequence of familiar subword pieces instead of becoming an \"unknown\" token, and it naturally tends to split words along morpheme-like boundaries (e.g., \"unhappiness\" might become \"un\" + \"happi\" + \"ness\"), which is why BPE is related to morphological analysis — both are trying to find meaningful sub-word units, but BPE finds them statistically from data rather than from linguistic rules.\n\nFor a string like \"@user123 just tried the new #ChatGPT5 update... mind-blowing!!\", naive whitespace tokenization creates at least three problems: (1) the mention \"@user123\" and hashtag \"#ChatGPT5\" get treated as ordinary words instead of special social-media tokens, (2) the trailing punctuation (\"update...\", \"blowing!!\") stays glued to the word instead of being separated, and (3) the hyphenated word \"mind-blowing\" may or may not need splitting depending on the task.", "understandGuMd": "Tokenization raw text ને model વાપરી શકે એવા units માં ફેરવવાનું પહેલું concrete step છે, અને messy real text ને અલગ methods અલગ રીતે handle કરે.\n\n**Whitespace tokenization** text ને જ્યાં space હોય ત્યાં જ તોડે; ઝડપી છે પણ શબ્દ સાથે જોડાયેલા punctuation (\"update...\") પર fail થાય અને hashtags, mentions, contractions ને સાચી રીતે અલગ ના પાડે. **Rule-based tokenization** hand-written rules/regular expressions વાપરે, punctuation અલગ પાડવા, contractions તોડવા (\"don't\" → \"do\" + \"n't\"), અને URLs, hashtags (#ChatGPT5), mentions (@user123) જેવા special tokens ને એક unit તરીકે handle કરવા — social-media-style text પર ઘણું સારું, પણ rules હાથે maintain કરવા પડે અને નવા patterns ચૂકી શકે. **Byte-Pair Encoding (BPE)** subword tokenization algorithm છે: individual characters થી શરૂ કરે અને વારંવાર સૌથી frequent adjacent pair ને નવા symbol માં merge કરે, common subword units નું vocabulary બનાવે. આનાથી rare કે unseen શબ્દો પણ \"unknown\" token બનવાને બદલે જાણીતા subword pieces ના sequence તરીકે represent થઈ શકે, અને એ naturally morpheme જેવી boundaries પર શબ્દોને તોડે (દા.ત., \"unhappiness\" \"un\" + \"happi\" + \"ness\" બની શકે) — એટલે જ BPE morphological analysis સાથે related છે, બંને meaningful sub-word units શોધવાનો પ્રયત્ન કરે છે, પણ BPE એ data માંથી statistically શોધે, linguistic rules થી નહીં.\n\n\"@user123 just tried the new #ChatGPT5 update... mind-blowing!!\" જેવા string માટે, naive whitespace tokenization ઓછામાં ઓછી ત્રણ સમસ્યા બનાવે: (1) mention \"@user123\" અને hashtag \"#ChatGPT5\" ને special social-media tokens ને બદલે સામાન્ય શબ્દો તરીકે treat કરાય, (2) trailing punctuation (\"update...\", \"blowing!!\") શબ્દ સાથે ચોંટેલું રહે, અલગ ના પડે, (3) hyphenated શબ્દ \"mind-blowing\" ને task પ્રમાણે તોડવો પડે કે નહીં તે અસ્પષ્ટ રહે.", "oneLine": "Whitespace tokenization splits on spaces only; rule-based uses hand-written patterns; BPE merges frequent character pairs into subwords, handling rare/unknown words gracefully.", "memoryTrick": "\"Whitespace is Weak, Rules are Rigid, BPE Builds from pieces.\"", "quick10": "Whitespace tokenization = split on spaces (fails on punctuation/hashtags); rule-based = regex rules for special cases; BPE = merge frequent character pairs into subword units, handling unknown words.", "quick30": "Tokenization methods differ in how they handle messy text. Whitespace tokenization just splits on spaces, so it wrongly glues punctuation to words and fails on hashtags/mentions. Rule-based tokenization uses hand-written regex rules to correctly separate punctuation, contractions, hashtags and mentions, but needs manual maintenance. Byte-Pair Encoding (BPE) is a subword method that starts from characters and iteratively merges the most frequent adjacent symbol pair, building a vocabulary of frequent subwords; this lets rare/unknown words be represented as familiar sub-pieces and often aligns with morpheme boundaries, connecting BPE to morphological analysis.", "answerEnMd": "Tokenization splits raw text into processing units (tokens), and different tokenization strategies cope with real, messy text to different degrees.\n\n**1. Whitespace Tokenization:** splits text purely on space characters. It is very fast but naive — punctuation stays attached to adjacent words, and structured tokens like hashtags, @mentions or contractions are not recognised as special units.\n\n**2. Rule-based Tokenization:** uses hand-crafted rules/regular expressions to separate punctuation from words, split contractions (e.g. \"don't\" → \"do\" + \"n't\"), and treat domain-specific patterns (URLs, hashtags, @mentions, emoji) as single tokens. This handles social-media text far better than whitespace splitting, at the cost of needing rules to be written and updated by hand for every new pattern.\n\n**3. Byte-Pair Encoding (BPE):** a data-driven **subword** tokenization algorithm. It starts with a vocabulary of individual characters and repeatedly merges the most frequent adjacent pair of symbols in the training corpus into a new symbol, continuing for a fixed number of merges. The final vocabulary is a mix of whole common words and frequent subword fragments. Because rare or previously unseen words can be broken into familiar subword pieces instead of becoming a single \"unknown\" token, BPE handles out-of-vocabulary words gracefully. BPE also tends to split words at points that resemble true morpheme boundaries (e.g., \"unhappiness\" → \"un\" + \"happi\" + \"ness\"), which is why BPE is connected to morphological analysis — both aim to find meaningful sub-word units, but BPE learns them statistically from data rather than from a linguist's rules.\n\n**Applied to \"@user123 just tried the new #ChatGPT5 update... mind-blowing!!\":** naive whitespace tokenization creates three critical boundary challenges: (1) \"@user123\" and \"#ChatGPT5\" are treated as ordinary word-like tokens rather than being recognised as a mention and a hashtag, (2) trailing punctuation such as \"update...\" and \"blowing!!\" is not separated from the word it is attached to, and (3) the hyphenated compound \"mind-blowing\" needs a deliberate decision on whether to keep it as one token or split it — whitespace tokenization has no way to make that decision correctly. A rule-based or subword (BPE) tokenizer, implemented in a framework such as spaCy or NLTK's TweetTokenizer, is needed to correctly handle all three cases.", "answerGuMd": "Tokenization raw text ને processing units (tokens) માં તોડે છે, અને messy real text ને અલગ tokenization strategies અલગ level સુધી સંભાળે છે.\n\n**1. Whitespace Tokenization:** ફક્ત space characters પર text તોડે. ખૂબ ઝડપી પણ naive છે — punctuation બાજુના શબ્દ સાથે ચોંટેલું રહે, અને hashtags, @mentions, contractions જેવા structured tokens ને special unit તરીકે ઓળખાતા નથી.\n\n**2. Rule-based Tokenization:** hand-crafted rules/regular expressions વાપરે, punctuation ને શબ્દોથી અલગ પાડવા, contractions તોડવા (દા.ત. \"don't\" → \"do\" + \"n't\"), અને URLs, hashtags, @mentions, emoji જેવા domain-specific patterns ને એક token તરીકે treat કરવા. Social-media text માટે whitespace splitting કરતાં ઘણું સારું, પણ દરેક નવા pattern માટે rules હાથે લખવા/update કરવા પડે.\n\n**3. Byte-Pair Encoding (BPE):** data-driven **subword** tokenization algorithm. Individual characters ના vocabulary થી શરૂ કરે અને training corpus માં સૌથી frequent adjacent symbol pair ને વારંવાર નવા symbol માં merge કરે, fixed સંખ્યાના merges સુધી. Final vocabulary સામાન્ય આખા શબ્દો અને frequent subword fragments નું મિશ્રણ હોય. Rare કે પહેલા ના જોયેલા શબ્દો \"unknown\" token બનવાને બદલે જાણીતા subword pieces માં તૂટી શકે, એટલે BPE out-of-vocabulary શબ્દોને gracefully સંભાળે. BPE શબ્દોને ઘણી વાર true morpheme boundaries જેવા points પર તોડે (દા.ત., \"unhappiness\" → \"un\" + \"happi\" + \"ness\") — એટલે જ BPE morphological analysis સાથે related છે, બંને meaningful sub-word units શોધવાનો પ્રયત્ન કરે છે, પણ BPE એ statistically data માંથી શીખે.\n\n**\"@user123 just tried the new #ChatGPT5 update... mind-blowing!!\" પર apply કરતાં:** naive whitespace tokenization ત્રણ critical boundary challenges બનાવે: (1) \"@user123\" અને \"#ChatGPT5\" ને mention/hashtag તરીકે ઓળખવાને બદલે સામાન્ય word-like tokens તરીકે treat કરાય, (2) \"update...\" અને \"blowing!!\" જેવું trailing punctuation શબ્દથી અલગ ના પડે, (3) hyphenated \"mind-blowing\" ને એક token રાખવો કે તોડવો એ decision whitespace tokenization લઈ ના શકે. spaCy કે NLTK ના TweetTokenizer જેવા framework માં implement થયેલ rule-based અથવા subword (BPE) tokenizer આ ત્રણેય case સાચી રીતે સંભાળવા જરૂરી છે.", "mustWrite": ["Explain all 3 methods (whitespace, rule-based, BPE) with their core mechanism", "Explicitly state BPE's merge procedure (start from characters, merge most frequent pair repeatedly)", "Apply to the given messy string and name at least 3 specific boundary problems"], "keywords": ["Tokenization", "Whitespace Tokenization", "Rule-Based Tokenization", "Byte-Pair Encoding", "Subword", "Out-of-Vocabulary"], "diagramMd": "", "howToDrawMd": "", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Whitespace tokenizing is like cutting a sentence only at the blank gaps — clumsy for hashtags/punctuation. Rule-based is like using a checklist of special cases. BPE is like gluing letters together into common chunks by watching what letter-pairs show up together most often in a big pile of text, so it can handle words it's never seen before.", "examTip": "When a specific messy string is given, don't describe tokenization abstractly — walk through what a plain whitespace tokenizer would incorrectly produce for THAT exact string, then show how rule-based/BPE fixes it.", "isNumerical": false, "isDiagram": false, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q16", "sr": 16, "question": "Compare Constituency Parsing and Dependency Parsing.", "questionPreamble": "", "unit": 2, "unitTitle": "Word-Level & Syntactic Analysis", "co": "CO2", "coNote": "CO2 (Apply syntactic analysis techniques)", "bloomLevel": "Understand", "priority": "med", "priorityLabel": "Medium", "priorityReason": "Explicitly introduced as the two representation approaches to syntactic parsing in the Unit-2 PPT (\"By Representation, Syntactic parsing can be...\"), and dependency grammar trees are directly tested (NLP(7) paper: \"Draw the dependency grammar tree for the sentence 'Heavy rain was forecast by the weatherman.'\").", "easyMeaning": "Explain the two ways to represent a sentence's grammar structure — as nested phrases (constituency) or as word-to-word arrows (dependency) — and how they differ.", "understandEnMd": "Syntactic parsing can represent a sentence's structure in two different ways.\n\n**Constituency Parsing** breaks a sentence down into its constituent phrases, building a hierarchical tree where nodes are labelled phrases (Noun Phrase, Verb Phrase, Prepositional Phrase) and their nesting relationship is shown by the tree structure — this is exactly the kind of tree produced by a CFG (see Q9/Q10).\n\n**Dependency Parsing** instead focuses directly on the grammatical relationships (dependencies) between individual words, showing which words modify or depend on which other words. Rather than a phrase-structure tree, it produces a directed graph (or tree) where words are nodes and labelled arcs point from a \"head\" word to its \"dependent\" word — there are no phrase nodes at all, only words and their relations.\n\nExample: for \"Heavy rain was forecast by the weatherman,\" a dependency parse would draw \"forecast\" as the root, with an arc to \"rain\" (as the subject being forecast, modified by \"Heavy\"), and an arc to \"weatherman\" (as the agent, via \"by\"), showing direct word-to-word relationships instead of nested phrase boxes.", "understandGuMd": "Syntactic parsing sentence ના structure ને બે અલગ રીતે represent કરી શકે.\n\n**Constituency Parsing** sentence ને તેના constituent phrases માં તોડે, hierarchical tree બનાવે જ્યાં nodes labelled phrases (Noun Phrase, Verb Phrase, Prepositional Phrase) હોય અને તેમનું nesting relationship tree structure થી બતાવાય — આ બરાબર એ જ પ્રકારનું tree છે જે CFG બનાવે (જુઓ Q9/Q10).\n\n**Dependency Parsing** તેને બદલે સીધા વ્યક્તિગત શબ્દો વચ્ચેના grammatical relationships (dependencies) પર focus કરે, બતાવે કે કયો શબ્દ કયા બીજા શબ્દ ને modify/depend કરે છે. Phrase-structure tree ને બદલે, તે directed graph (કે tree) બનાવે જ્યાં શબ્દો nodes હોય અને labelled arcs \"head\" શબ્દ થી તેના \"dependent\" શબ્દ તરફ point કરે — કોઈ phrase nodes ના હોય, ફક્ત શબ્દો અને તેમના relations.\n\nExample: \"Heavy rain was forecast by the weatherman\" માટે, dependency parse \"forecast\" ને root તરીકે દોરે, \"rain\" તરફ arc (subject, \"Heavy\" થી modified), અને \"weatherman\" તરફ arc (\"by\" દ્વારા agent) — nested phrase boxes ને બદલે સીધા word-to-word relationships બતાવે.", "oneLine": "Constituency parsing = nested phrase tree (NP, VP); Dependency parsing = direct word-to-word arcs, no phrase nodes.", "memoryTrick": "\"Constituency = Contains phrases (boxes within boxes)\"; \"Dependency = Direct word arrows\".", "quick10": "Constituency parsing builds a phrase-structure tree (NP/VP); dependency parsing builds a graph of direct word-to-word relations, with no phrase nodes.", "quick30": "Constituency Parsing represents a sentence as a hierarchical tree of nested phrases (NP, VP, PP), exactly like a CFG parse tree. Dependency Parsing instead represents the sentence as a graph of direct word-to-word relationships, with arcs from a head word to each of its dependents and no phrase-level nodes at all. Constituency trees are better for showing phrase boundaries; dependency trees are often more compact and directly show grammatical roles like subject/object.", "answerEnMd": "Syntactic parsing can produce two different kinds of structural representation, depending on the parsing approach used:\n\n**Constituency Parsing** analyses the grammatical structure of a sentence by breaking it down into hierarchical constituents/phrases. These constituents — Noun Phrases (NP), Verb Phrases (VP), Prepositional Phrases (PP), etc. — are organised into a tree-like structure called a parse tree, with the sentence (S) at the root and words as leaves. This is the representation produced directly by a Context-Free Grammar.\n\n**Dependency Parsing** instead analyses the sentence by identifying direct relationships (dependencies) between individual words — which words modify or depend on which others. It represents the sentence as a dependency tree or graph, where the words themselves are the nodes, and the relationships between them are shown as labelled, directed arcs from a \"head\" to its \"dependent,\" with no separate phrase nodes.\n\n**Comparison and example:** for \"Heavy rain was forecast by the weatherman,\" a constituency tree would show [S [NP Heavy rain] [VP was forecast [PP by [NP the weatherman]]]], with explicit phrase-category boxes. A dependency tree instead makes \"forecast\" the root, with a direct arc labelled nsubj:pass to \"rain\" (further modified by \"Heavy\"), and an arc labelled agent/obl to \"weatherman\" via \"by\" — showing grammatical roles directly on the words rather than through nested boxes. Constituency parsing is well suited to identifying phrase boundaries, while dependency parsing is generally more compact and directly exposes subject/object/modifier relationships, which is useful for tasks like relationship extraction.", "answerGuMd": "Syntactic parsing, વપરાયેલા approach પ્રમાણે, બે અલગ પ્રકારનું structural representation આપી શકે:\n\n**Constituency Parsing** sentence ના grammatical structure ને hierarchical constituents/phrases માં તોડીને analyze કરે. આ constituents — Noun Phrases (NP), Verb Phrases (VP), Prepositional Phrases (PP) વગેરે — parse tree નામના tree-like structure માં ગોઠવાય, S root પર અને શબ્દો leaves તરીકે. આ જ representation Context-Free Grammar સીધું આપે છે.\n\n**Dependency Parsing** તેને બદલે વ્યક્તિગત શબ્દો વચ્ચેના direct relationships (dependencies) ઓળખીને sentence ને analyze કરે — કયો શબ્દ કયા બીજા શબ્દ ને modify/depend કરે છે. તે sentence ને dependency tree કે graph તરીકે represent કરે, જ્યાં શબ્દો પોતે nodes હોય, અને relationships ને labelled, directed arcs તરીકે \"head\" થી \"dependent\" તરફ બતાવાય, કોઈ અલગ phrase nodes વગર.\n\n**Comparison અને example:** \"Heavy rain was forecast by the weatherman\" માટે, constituency tree [S [NP Heavy rain] [VP was forecast [PP by [NP the weatherman]]]] બતાવે, explicit phrase-category boxes સાથે. Dependency tree તેને બદલે \"forecast\" ને root બનાવે, \"rain\" તરફ nsubj:pass arc (\"Heavy\" થી modified), અને \"by\" દ્વારા \"weatherman\" તરફ agent/obl arc — nested boxes ને બદલે શબ્દો પર સીધા grammatical roles બતાવે. Constituency parsing phrase boundaries ઓળખવા માટે સારું છે, dependency parsing સામાન્ય રીતે વધુ compact છે અને subject/object/modifier relationships સીધા બતાવે, જે relationship extraction જેવા tasks માટે useful છે.", "mustWrite": ["Define both parsing types clearly with their structural output (tree of phrases vs graph of word relations)", "Draw both representations for the same example sentence", "State one practical difference/use-case for each"], "keywords": ["Constituency Parsing", "Dependency Parsing", "Parse Tree", "Dependency Tree", "Head", "Dependent"], "diagramMd": "Constituency: S → [NP \"Heavy rain\"] [VP \"was forecast\" [PP \"by\" [NP \"the weatherman\"]]]. Dependency: forecast(root) ← rain(nsubj, modified by \"Heavy\") ; forecast → weatherman(agent, via \"by\").", "howToDrawMd": "For constituency: draw nested boxes/tree exactly like a CFG parse tree (Q9). For dependency: write the words in a row, then draw curved arrows above the row from each head word to its dependent word, labelling each arrow with its grammatical relation (subject, agent, modifier).", "comparisonTableMd": "| Point | Constituency Parsing | Dependency Parsing |\n|---|---|---|\n| Representation | Hierarchical tree of phrases (NP, VP, PP) | Graph/tree of direct word-to-word arcs |\n| Nodes | Phrase categories + words at leaves | Only words |\n| Produced by | Context-Free Grammar | Dependency Grammar |\n| Shows | Phrase boundaries/nesting | Head-dependent grammatical roles directly |", "quickMemory": "Constituency = boxes inside boxes (phrases); Dependency = arrows between words (roles).", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "Constituency parsing groups words into boxes-within-boxes (like Russian dolls of phrases). Dependency parsing skips the boxes and just draws an arrow from every word to the word it's grammatically attached to.", "examTip": "If a specific sentence is given, draw BOTH trees side by side if time allows — visually showing the contrast is worth more than describing it in prose.", "isNumerical": false, "isDiagram": true, "isComparison": true, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q17", "sr": 17, "question": "Explain Frame representation in NLP with its structure (slots, fillers, default values) and a worked example.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply semantic knowledge-representation techniques)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "Frames are a full dedicated topic in the Unit-3 PPT (structure, hierarchy, applications, advantages/limitations), and the exact same \"Student/Faculty/Course\" frame question appears twice in the uploaded material — Assignment-1 Q12 AND the PAC Average-Student-Task Q1 — confirming genuine repetition across independent assessments.", "easyMeaning": "Explain what a \"Frame\" is (a data structure for storing stereotyped knowledge about an object/situation using named slots) and fill one in for a real example.", "understandEnMd": "A Frame is a knowledge-representation structure used to store stereotyped knowledge about a situation, object, or concept using **slots** (attribute names) and **fillers** (the values that go in those slots). Frames were proposed by Marvin Minsky to represent common-sense/real-world knowledge in a structured way, similar to how a form has labelled boxes to fill in.\n\n**Structure of a Frame:**\n- **Frame Name:** the concept being represented (e.g. \"Student\", \"Restaurant\").\n- **Slots:** the attributes/properties of that concept (e.g. Name, Age, Course for a Student frame).\n- **Fillers:** the actual values placed in each slot for a specific instance.\n- **Default Values:** a slot can have a sensible default filler used when no specific value is known (e.g. a \"Restaurant\" frame might default \"Seating\" to \"Available\" unless told otherwise).\n- **Procedural Attachments:** small procedures attached to a slot that run automatically when the slot is filled or read (e.g. automatically computing \"Age\" from \"Date of Birth\").\n\n**Frame Hierarchy / Inheritance:** Frames can be linked in a hierarchy so a specific frame inherits slots from a more general parent frame — e.g. a \"Graduate Student\" frame inherits all slots of the general \"Student\" frame and adds its own (like \"Thesis Topic\").\n\n**Worked Example — Student Frame:** Frame Name: Student; Slots → Name: Amit, Roll No: 21, Course: B.Tech CE, Semester: 7, CGPA: 8.5.\n\n**Worked Example — Restaurant Frame:** Frame Name: Restaurant; Slots → Name: Spice Garden, Cuisine: Gujarati, Seating Capacity: 40 (default), Price Range: Moderate, Location: Rajkot.\n\n**Worked Example — Flight-Booking Frame:** Frame Name: Flight Booking; Slots → Passenger Name, Source, Destination, Date, Seat Class, Fare (fare can use a procedural attachment to auto-calculate from class + distance).\n\n**Applications:** representing structured real-world knowledge for chatbots, expert systems, and question-answering systems. **Advantages:** organizes knowledge clearly, supports inheritance (reuse), easy to fill/update. **Limitations:** rigid structure (hard to represent knowledge that doesn't fit neat slots), does not handle uncertainty or exceptions well.", "understandGuMd": "Frame એ knowledge-representation structure છે જે slots (attribute names) અને fillers (તે slots માં ભરાતી values) વાપરીને situation/object/concept વિશે stereotyped knowledge store કરે. Frame ની idea Marvin Minsky એ આપી, common-sense knowledge ને structured રીતે represent કરવા — જેમ form માં label કરેલા boxes ભરવાના હોય તેમ.\n\n**Frame ની Structure:** Frame Name (દા.ત. \"Student\"), Slots (attributes, દા.ત. Name, Age, Course), Fillers (specific instance ની actual values), Default Values (કોઈ specific value ના ખબર હોય ત્યારે વપરાતી sensible default filler), Procedural Attachments (slot ભરાય/વંચાય ત્યારે automatically ચાલતી નાની procedures).\n\n**Frame Hierarchy / Inheritance:** Frames ને hierarchy માં જોડી શકાય જેથી specific frame વધુ general parent frame ના slots inherit કરે — દા.ત. \"Graduate Student\" frame \"Student\" frame ના બધા slots inherit કરે અને પોતાના નવા (જેમ કે \"Thesis Topic\") ઉમેરે.\n\n**Worked Example — Student Frame:** Frame Name: Student; Slots → Name: Amit, Roll No: 21, Course: B.Tech CE, Semester: 7, CGPA: 8.5.\n\n**Worked Example — Restaurant Frame:** Frame Name: Restaurant; Slots → Name: Spice Garden, Cuisine: Gujarati, Seating Capacity: 40 (default), Price Range: Moderate, Location: Rajkot.\n\n**Applications:** chatbots, expert systems, question-answering systems માટે structured real-world knowledge represent કરવા. **Advantages:** knowledge સ્પષ્ટ રીતે organize કરે, inheritance (reuse) support કરે, ભરવું/update કરવું સહેલું. **Limitations:** rigid structure (neat slots માં ના બેસતું knowledge represent કરવું અઘરું), uncertainty/exceptions સારી રીતે handle નથી કરતું.", "oneLine": "Frame = Slots (attributes) + Fillers (values) + optional Default Values/Procedural Attachments, organized with inheritance.", "memoryTrick": "Think of a Frame like an \"admission form\" — printed labels are slots, what you write in the blanks are fillers.", "quick10": "Frame = knowledge structure with slots (attributes) and fillers (values); supports defaults, procedures, and inheritance.", "quick30": "A Frame (Minsky) represents stereotyped knowledge using a Frame Name, Slots (attributes), and Fillers (values); slots may carry Default Values or Procedural Attachments, and frames can inherit slots from parent frames in a hierarchy. Example: Student frame → Name, Roll No, Course, Semester, CGPA. Used in chatbots/expert systems/QA; advantage = organized + reusable, limitation = rigid, poor with exceptions.", "answerEnMd": "A Frame is a knowledge-representation structure (Minsky) that stores stereotyped knowledge about an object or situation as a set of named **slots** (attributes) filled with **fillers** (values), optionally carrying **default values** and **procedural attachments**, and organized hierarchically so specific frames **inherit** slots from general parent frames.\n\n**Structure:** Frame Name → Slot1: Filler1, Slot2: Filler2, ... with defaults/procedures where useful.\n\n**Student Frame Example:** Frame Name: Student; Name: Amit; Roll No: 21; Course: B.Tech Computer Engineering; Semester: 7; CGPA: 8.5.\n\n**Faculty Frame Example:** Frame Name: Faculty; Name: Dr. Mehta; Department: CE; Designation: Associate Professor; Subject Taught: NLP.\n\n**Course Frame Example:** Frame Name: Course; Course Name: Natural Language Processing; Code: 01CE0718; Credits: 4; Semester: 7.\n\n**Advantages:** structured, reusable via inheritance, easy to query. **Limitations:** rigid (poor fit for irregular/uncertain knowledge), no built-in reasoning about exceptions.", "answerGuMd": "Frame (Minsky) એ knowledge-representation structure છે જે object/situation વિશે stereotyped knowledge ને named **slots** (attributes) અને તેમાં ભરાયેલા **fillers** (values) તરીકે store કરે, જરૂર પડે **default values** અને **procedural attachments** સાથે, અને hierarchy માં organize થાય જેથી specific frames general parent frames પાસેથી slots **inherit** કરે.\n\n**Structure:** Frame Name → Slot1: Filler1, Slot2: Filler2, ...\n\n**Student Frame Example:** Frame Name: Student; Name: Amit; Roll No: 21; Course: B.Tech Computer Engineering; Semester: 7; CGPA: 8.5.\n\n**Faculty Frame Example:** Frame Name: Faculty; Name: Dr. Mehta; Department: CE; Designation: Associate Professor; Subject Taught: NLP.\n\n**Course Frame Example:** Frame Name: Course; Course Name: Natural Language Processing; Code: 01CE0718; Credits: 4; Semester: 7.\n\n**Advantages:** structured, inheritance થી reusable, query કરવું સહેલું. **Limitations:** rigid, uncertain/exception knowledge સારી રીતે handle નથી કરતું.", "mustWrite": ["Define Frame + list its parts: Slots, Fillers, Default Values, Procedural Attachments", "Draw/fill at least one complete frame example with real slot-filler pairs", "Mention inheritance/frame hierarchy briefly"], "keywords": ["Frame", "Slot", "Filler", "Default Value", "Procedural Attachment", "Inheritance"], "diagramMd": "A box labeled \"Frame: Student\" containing rows: Slot | Filler → Name | Amit, Roll No | 21, Course | B.Tech CE, Semester | 7, CGPA | 8.5.", "howToDrawMd": "1. Draw a rectangle and write the Frame Name at the top. 2. Draw a 2-column table inside: left column = Slot names, right column = Filler values. 3. Fill 4-5 rows with realistic slot-filler pairs. 4. Optionally draw an arrow above to a \"Parent Frame\" box to show inheritance.", "comparisonTableMd": "", "quickMemory": "", "numericalStepsMd": "", "algorithmMd": "", "explainAgainMd": "A Frame is exactly like a printed form: the form's blank labels (\"Name:\", \"Age:\") are slots, and whatever you write in the blank is the filler. If a blank is left empty, sometimes a default gets used instead (e.g. \"Nationality: Indian\" pre-filled).", "examTip": "Whatever object the exam names (Student/Faculty/Course/Restaurant/Flight), always answer with the same 3-part template: define Frame → draw the slot-filler table → mention inheritance/defaults in one line.", "isNumerical": false, "isDiagram": true, "isComparison": false, "isAlgorithm": false, "givenMd": "", "formulaMd": "", "finalAnswerMd": "", "hasFormula": false}, {"id": "q18", "sr": 18, "question": "Explain Conceptual Dependency (CD) theory with its primitive actions and worked examples.", "questionPreamble": "", "unit": 3, "unitTitle": "Semantic Analysis & Discourse", "co": "CO3", "coNote": "CO3 (Apply semantic knowledge-representation techniques)", "bloomLevel": "Understand", "priority": "vh", "priorityLabel": "Very High", "priorityReason": "CD is a full dedicated PPT topic (with ACTOR/ACTION/OBJECT/DIRECTION slots and Schank & Abelson's 11 primitive actions), is Assignment-1 Q13 (\"Riya gave Rahul a laptop\"), and reappears with a fresh sentence in the PAC task Q2 (\"Amit sent Priya an email\") — genuine repetition of the same skill with different sentences.", "easyMeaning": "Explain Conceptual Dependency (a way to represent the MEANING of a sentence using a small fixed set of primitive actions, independent of the exact words used) and apply it to a given sentence.", "understandEnMd": "Conceptual Dependency (CD), developed by Roger Schank, represents the meaning of a sentence in a language-independent way using a small set of **primitive actions** (e.g. PTRANS = physical transfer of location, ATRANS = abstract transfer of possession/ownership, MTRANS = mental transfer of information, PROPEL, INGEST, SPEAK, etc.) instead of the surface words. The idea is that two sentences with different wording but the same meaning (e.g. \"Riya gave Rahul a laptop\" and \"Rahul received a laptop from Riya\") should map to the *same* CD structure.\n\n**Main slots in a CD structure:** **ACTOR** (who performs the action), **ACTION** (the primitive action, from Schank's fixed list), **OBJECT** (what is acted upon), **DIRECTION** (source → destination, for transfer actions).\n\n**Schank & Abelson's key primitive actions:** ATRANS (transfer of possession/ownership, e.g. give), PTRANS (transfer of physical location, e.g. go), PROPEL (applying physical force, e.g. push), MOVE (moving a body part), INGEST (taking something in, e.g. eat), EXPEL (expelling from the body), MTRANS (transfer of mental information, e.g. tell), MBUILD (building new information from old, e.g. decide), SPEAK (producing a sound), ATTEND (directing attention/a sense organ), GRASP (physically grasping an object).\n\n**Worked example — \"Riya gave Rahul a laptop\":** ACTOR = Riya, ACTION = ATRANS (transfer of possession), OBJECT = laptop, DIRECTION = source: Riya → destination: Rahul.\n\n**Worked example — \"Kenrick went to New York\":** ACTOR = Kenrick, ACTION = PTRANS (transfe
